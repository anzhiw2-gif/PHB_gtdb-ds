              - generic [ref=e614]:
                - heading "Expression, purification, and functional analysis of BdhA." [level=3] [ref=e615]
                - paragraph [ref=e616]:
                  - text: Interestingly, the bdhA gene located in the bdhA-phaZh1 (HFX_6463 to _6464) gene cluster encodes a putative 3HB dehydrogenase. It is well known that the 3HB monomer can be converted to acetoacetate by NAD
                  - superscript [ref=e617]: +
                  - text: "-dependent 3HB dehydrogenase, generating NADH that can be easily monitored ("
                  - link "13" [ref=e618] [cursor=pointer]:
                    - /url: "#core-collateral-B13"
                  - text: ","
                  - link "40" [ref=e619] [cursor=pointer]:
                    - /url: "#core-collateral-B40"
                  - text: ","
                  - link "42" [ref=e620] [cursor=pointer]:
                    - /url: "#core-collateral-B42"
                  - text: ). To test the function of the BdhA of H. mediterranei, we expressed the BdhA with an N-terminal His
                  - subscript [ref=e621]: "6"
                  - text: tag in H. volcanii H1424 and purified it with Ni-agarose columns (
                  - link "Fig. 5C" [ref=e622] [cursor=pointer]:
                    - /url: "#F5"
                  - text: ). Notably, when the purified His
                  - subscript [ref=e623]: "6"
                  - text: "-tagged BdhA was added to the solution containing sodium 3-hydroxybutyrate and NAD"
                  - superscript [ref=e624]: +
                  - text: in a hypersaline buffer, the absorption at 340 nm (for detection of NADH production) increased rapidly. Because the final solution of the nPHA granule hydrolysis by PhaZh1 contains 3HB and the pH is about 5.0 to 6.0, it was adjusted to pH 7.0 before being used to replace the sodium 3-hydroxybutyrate for the BdhA activity assay. The results clearly indicated that BdhA is a 3HB dehydrogenase in haloarchaea (
                  - link "Fig. 5D" [ref=e625] [cursor=pointer]:
                    - /url: "#F5"
                  - text: ). Interestingly, when the molarity of the acetoacetate added to the solution increased, the NADH produced in the enzymatic reaction gradually decreased (
                  - link "Fig. 5D" [ref=e626] [cursor=pointer]:
                    - /url: "#F5"
                  - text: ). The addition of 2 mM acetoacetate to the solution strongly inhibited the enzyme activity of BdhA within 0.5 min, indicating that the reaction product acetoacetate clearly inhibited the enzyme activity of BdhA. These results implied that BdhA could participate in nPHA granule hydrolysis, and PhaZh1 and BdhA may constitute the first part of a PHA degradation pathway in vivo.
