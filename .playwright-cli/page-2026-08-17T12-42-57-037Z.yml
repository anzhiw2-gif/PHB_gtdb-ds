          - generic [ref=e189]:
            - generic [ref=e191]:
              - heading "Introduction" [level=2] [ref=e192]
              - generic [ref=e193]:
                - paragraph [ref=e194]:
                  - text: Polyhydroxyalkanoates (PHAs) are intracellular biopolymers that are accumulated by a wide range of microorganisms (eubacteria and archaea) as carbon and energy reserves when environmental conditions are not optimal for cell growth (Luengo et al.
                  - link "Reference 2003" [ref=e195] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR34
                    - text: "2003"
                  - text: ; Madison and Huisman
                  - link "Reference 1999" [ref=e196] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR38
                    - text: "1999"
                  - text: ). PHAs are biodegradable, renewable biopolymers that represent an interesting alternative to conventional plastics as well as biofuels (Gao et al.
                  - link "Reference 2011" [ref=e197] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR19
                    - text: "2011"
                  - text: ). Therefore, substantial effort is underway in developing improved production of these bioplastics (Prieto et al.
                  - link "Reference 2014" [ref=e198] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR45
                    - text: "2014"
                  - text: ). According to the number of carbon atoms of the side chain of the monomers, PHAs are classified as short-chain-length PHAs (scl-PHA) (1 to 2 carbon atoms) and medium-chain-length PHAs (mcl-PHA) (3 to 11 carbon atoms) (Madison and Huisman
                  - link "Reference 1999" [ref=e199] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR38
                    - text: "1999"
                  - text: ). Other criteria have been used to classify PHAs such as their functional substituents in the side chains and the structure of the polymer (Tortajada et al.
                  - link "Reference 2013" [ref=e200] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR52
                    - text: "2013"
                  - text: ). In this sense, introduction of thioester linkages in the polymer backbone has led to different scl-PHAs, referred to as polythioesters (PTEs), with novel physical properties (solubility, crystallinity, and thermal stability) (Lütke-Eversloh et al.
                  - link "Reference 2001" [ref=e201] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR35
                    - text: "2001"
                  - text: ","
                  - link "Reference 2002" [ref=e202] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR36
                    - text: "2002"
                  - text: ; Lütke-Eversloh and Steinbüchel
                  - link "Reference 2003" [ref=e203] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR37
                    - text: "2003"
                  - text: ; Kawada et al.
                  - link "Reference 2003" [ref=e204] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR29
                    - text: "2003"
                  - text: ). Furthermore, it has been recently described a new second-generation polymer containing thioester groups in the side chain (PHACOS) showing tunable thermal and antimicrobial properties (Escapa et al.
                  - link "Reference 2011" [ref=e205] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR16
                    - text: "2011"
                  - text: ; Dinjaski et al.
                  - link "Reference 2014" [ref=e206] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR13
                    - text: "2014"
                  - text: ). Since PHAs are composed of enantiopure hydroxyalkanoic acids (RHAs), they are a source of valuable synthons for the chemical and pharmaceutical industries (Ren et al.
                  - link "Reference 2010" [ref=e207] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR47
                    - text: "2010"
                  - text: ; Chen
                  - link "Reference 2011" [ref=e208] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR10
                    - text: "2011"
                  - text: ; Gao et al.
                  - link "Reference 2011" [ref=e209] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR19
                    - text: "2011"
                  - text: ). Regarding that, PHAs can be catabolized by many microorganisms through extracellular or intracellular depolymerases, depending on the PHA location (Jendrossek and Handrick
                  - link "Reference 2002" [ref=e210] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR28
                    - text: "2002"
                  - text: ). The ability to degrade extracellular PHA in the environment and to use the released oligomers and monomers as a source of carbon and energy depends on the secretion of specific extracellular PHA depolymerases. At present, many extracellular scl-PHA depolymerases have been purified and well characterized (Behrends et al
                  - link "Reference 1996" [ref=e211] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR3
                    - text: "1996"
                  - text: ; Abe and Doi
                  - link "Reference 1999" [ref=e212] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR1
                    - text: "1999"
                  - text: ; Handrick et al.
                  - link "Reference 2001" [ref=e213] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR23
                    - text: "2001"
                  - text: ","
                  - link "Reference 2004" [ref=e214] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR24
                    - text: "2004"
                  - text: ; Jendrossek and Handrick
                  - link "Reference 2002" [ref=e215] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR28
                    - text: "2002"
                  - text: ; Braaz et al.
                  - link "Reference 2003" [ref=e216] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR7
                    - text: "2003"
                  - text: ; Numata et al.
                  - link "Reference 2006" [ref=e217] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR42
                    - text: "2006"
                  - text: ; García-Hidalgo et al.
                  - link "Reference 2012" [ref=e218] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR20
                    - text: "2012"
                  - text: ","
                  - link "Reference 2013" [ref=e219] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR21
                    - text: "2013"
                  - text: ) in contrast to the limited knowledge of mcl-PHA depolymerases. Indeed, mcl-PHA degrading microorganisms are less frequently found in the environment and few mcl-PHA depolymerases have been described so far. Most of these mcl-PHA depolymerases belong to Gram-negative bacteria, predominantly Pseudomonas species (Schirmer and Jendrossek
                  - link "Reference 1994" [ref=e220] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR50
                    - text: "1994"
                  - text: ; Gangoiti et al.
                  - link "Reference 2010" [ref=e221] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR17
                    - text: "2010"
                  - text: ; Jendrossek and Handrick
                  - link "Reference 2002" [ref=e222] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR28
                    - text: "2002"
                  - text: ), although an extracellular-like mcl-PHA depolymerase has been characterized in the obligated predator Bdellovibrio bacteriovorus HD100 (Martínez et al.
                  - link "Reference 2012" [ref=e223] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR39
                    - text: "2012"
                  - text: ). Interestingly, a novel subgroup of mcl-PHA depolymerases has been recently identified in Actinobacteria, as those from Streptomyces roseolus SL3 (Gangoiti et al.
                  - link "Reference 2012" [ref=e224] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR18
                    - text: "2012"
                  - text: ) and Streptomyces venezuelae SO1 (Santos et al.
                  - link "Reference 2013" [ref=e225] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR49
                    - text: "2013"
                  - text: ). Nowadays, PHA depolymerases described so far are specific for oxoester bonds, but are not able to hydrolyze functionalized PHAs, such as PTEs, whose biodegradation is another relevant aspect of these novel biopolymers (Elbanna et al.
                  - link "Reference 2004" [ref=e226] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR15
                    - text: "2004"
                  - text: ; Wübbeler and Steinbüchel
                  - link "Reference 2014" [ref=e227] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR53
                    - text: "2014"
                  - text: ).
                - paragraph [ref=e228]:
                  - text: Streptomyces species represent an important source of antibiotics, novel bioactive compounds, and numerous enzymes with biotechnological applications (Nett et al.
                  - link "Reference 2009" [ref=e229] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR41
                    - text: "2009"
                  - text: ). Among them, Streptomyces exfoliatus K10 has been identified as a PHA-degrading strain with scl- and mcl-PHA depolymerases, being one of the few Gram-positive bacteria that display both activities (Jendrossek et al.
                  - link "Reference 1996" [ref=e230] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR27
                    - text: "1996"
                  - text: ; Klingbeil et al.
                  - link "Reference 1996" [ref=e231] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR32
                    - text: "1996"
                  - text: ; García-Hidalgo et al.
                  - link "Reference 2012" [ref=e232] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR20
                    - text: "2012"
                  - text: ; Martínez et al.
                  - link "Reference 2014" [ref=e233] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR40
                    - text: "2014"
                  - text: ). Indeed, a putative mcl-PHA depolymerase-coding sequence has been identified by inspection of the recently published genome sequence of S. exfoliatus DSMZ 41693 (Martínez et al.
                  - link "Reference 2014" [ref=e234] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR40
                    - text: "2014"
                  - text: ). In this study, a novel mcl-PHA depolymerase from S. exfoliatus K10 DSMZ 41693 has been purified and biochemically well characterized after its overexpression in the heterologous host Rhodococcus. In addition, this study highlights on the potentiality of S. exfoliatus as a microbial source for obtaining novel biocatalysts with potential application in the production of chiral RHAs as well as in degradation of bioplastics or biomaterials.
            - generic [ref=e236]:
              - heading "Materials and methods" [level=2] [ref=e237]
              - generic [ref=e238]:
                - heading "Chemicals" [level=3] [ref=e239]
                - paragraph [ref=e240]:
                  - text: Polyhydroxyoctanoate-co -hexanoate [P(HO-co -HH) also named mcl-PHA] was kindly supplied by Biopolis S.L. (Valencia, Spain), and PHACOS [P(OH-Alk-co-OH-6ATH-OH4ATB)] was obtained as previously described (Escapa et al.
                  - link "Reference 2011" [ref=e241] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR16
                    - text: "2011"
                  - text: ). Chromatography media were obtained from GE-Healthcare (Uppsala, Sweden). Most chemicals were obtained from Sigma-Aldrich (St. Louis, MO) and Merck (Darmstadt, Germany).
                - heading "Bacterial strains, media, and growth conditions" [level=3] [ref=e242]
                - paragraph [ref=e243]:
                  - text: S. exfoliatus K10 DSMZ 41693 was used as chromosomal DNA source. Wild-type Rhodococcus sp. T104 KACC 21099 strain was used as host for gene expression (Hernández et al.
                  - link "Reference 1997" [ref=e244] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR26
                    - text: "1997"
                  - text: ; García-Hidalgo et al.
                  - link "Reference 2012" [ref=e245] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR20
                    - text: "2012"
                  - text: ). For DNA purification, S. exfoliatus DSMZ 41693 cells were sporulated in solid SFM (Soya Flour Mannitol) medium and cultured aerobically under submerged conditions in S-YEME liquid medium (yeast extract/malt extract/0.5 % glycine to allow dispersed growth) at 30 °C and 250 rpm (Kieser et al.
                  - link "Reference 2000" [ref=e246] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR31
                    - text: "2000"
                  - text: ). Rhodococcus sp. T104 cells were grown in 2 × YTG (yeast extract/bactotriptone/NaCl) medium supplemented with glucose (5 g L
                  - superscript [ref=e247]: –1
                  - text: ) (Kieser et al.
                  - link "Reference 2000" [ref=e248] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR31
                    - text: "2000"
                  - text: ). The appropriate selection antibiotic, ampicillin (100 μg mL
                  - superscript [ref=e249]: –1
                  - text: ) or kanamycin (100 μg mL
                  - superscript [ref=e250]: –1
                  - text: ) was added when needed. For mcl-PHA depolymerase extracellular activity detection, strains were grown on solid basal medium supplemented with 1 g L
                  - superscript [ref=e251]: –1
                  - text: mcl-PHA.
                - heading "DNA manipulations and plasmid constructions" [level=3] [ref=e252]
                - paragraph [ref=e253]:
                  - text: Bifunctional pEM4 (Ap
                  - superscript [ref=e254]: R
                  - text: ", Tsr"
                  - superscript [ref=e255]: R
                  - text: ", permE*) (Quirós et al."
                  - link "Reference 1998" [ref=e256] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR46
                    - text: "1998"
                  - text: ) and pNV19 (Km
                  - superscript [ref=e257]: R
                  - text: ", lacZ) (Chiba et al."
                  - link "Reference 2007" [ref=e258] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR11
                    - text: "2007"
                  - text: ) plasmids were used to obtain the recombinant vectors for gene expression in Rhodococcus sp. T104. Chromosomal DNA from S. exfoliatus DSMZ 41693 was purified according to the method described in Kieser et al. (
                  - link "Reference 2000" [ref=e259] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR31
                    - text: "2000"
                  - text: ). DNA manipulations and other molecular biology techniques were essentially performed as described previously (Kieser et al.
                  - link "Reference 2000" [ref=e260] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR31
                    - text: "2000"
                  - text: ; Sambrook and Russell
                  - link "Reference 2001" [ref=e261] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR48
                    - text: "2001"
                  - text: ). To construct pENVO, the 870-bp DNA fragment coding for the putative depolymerase of S. exfoliatus DSMZ 41693 was amplified by PCR using the oligonucleotides PhaZ1 (5′ CGTCTAGAAGGAGTTCCTATGTCAGGGAGATTCAGCCGGGC 3′) and PhaZ2 (5′ GCGAATTCTCAGGCCGTGGGACCGGGAATCTGGAGCGCC 3′) and chromosomal DNA from S. exfoliatus DSMZ 41693 as the template. Conditions for amplification were chosen according to the high G + C content of PhaZ
                  - subscript [ref=e262]: Sex2
                  - text: coding sequence (Fig. S
                  - link "1" [ref=e263] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#MOESM1
                  - text: ). The PCR product was digested with the endonucleases EcoRI and XbaI and cloned into the pEM4 vector. The resulting plasmid (pEMZ) (Table
                  - link "1" [ref=e264] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Tab1
                  - text: ) was digested with HindIII and EcoRI in order to obtain the fragments containing the ORF along with the strong ermE* promoter of the erythromycin resistance gene from Saccharopolyspora erythraea (Bibb et al.
                  - link "Reference 1985" [ref=e265] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR4
                    - text: "1985"
                  - text: ","
                  - link "Reference 1994" [ref=e266] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR5
                    - text: "1994"
                  - text: ) and transferred to the pNV19 vector, obtaining the recombinant plasmid pENVO (Table
                  - link "1" [ref=e267] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Tab1
                  - text: ) that was used to transform electrocompetent Rhodococcus sp. T104 cells, as previously described (García-Hidalgo et al.
                  - link "Reference 2012" [ref=e268] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR20
                    - text: "2012"
                  - text: ). All these constructions were confirmed by sequencing, using an ABI Prism 3730 DNA sequencer.
                - figure "Table 1 Bacterial strains, plasmids, and constructs used in this study" [ref=e270]:
                  - link "Full size table 1" [ref=e273] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1/tables/1
                    - text: Full size table
                - heading [level=3] [ref=e276]:
                  - text: Purification of PhaZ
                  - subscript [ref=e277]: Sex2
                  - text: produced by Rhodococcus sp. T104 strain
                - paragraph [ref=e278]:
                  - text: Rhodoccocus sp. T104 (pENVO) cells were cultured aerobically under submerged conditions in 2 × YTG with 100 μg mL
                  - superscript [ref=e279]: –1
                  - text: kanamycin at 30 °C for 72 h. Ammonium sulfate was added to the cell-free culture broth at a final concentration of 0.5 M. Then, the solution was centrifuged at 10,000×g for 10 min at 4 °C and loaded onto a 5-mL HiTrap Butyl HP sepharose column (GE Healthcare) equilibrated with 15 mM Tris-HCl buffer, pH 8, 0.5 M ammonium sulfate (Buffer A) using a BioLogic LP chromatographic system (Bio-Rad). The column was extensively washed with the same buffer, and the retained proteins were eluted with a linear decreasing gradient of 0.5 to 0 M ammonium sulfate in buffer A. The protein fractions containing PhaZ
                  - subscript [ref=e280]: Sex2
                  - text: were pooled, and ammonium sulfate was added until final concentration of 0.5 M. After centrifugation at 10,000×g for 10 min, the supernatant was loaded onto a HiTrap Phenyl HP sepharose cartridge (GE Healthcare) (5 mL bed volume) equilibrated with buffer A. The cartridge was washed with the same buffer and a decreasing linear gradient from 0.5 to 0 M ammonium sulfate allowed elution of the bound proteins. Purity of the fractions showing mcl-PHA depolymerase activity was analyzed by SDS-PAGE (Laemmli
                  - link "Reference 1970" [ref=e281] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR33
                    - text: "1970"
                  - text: ) and the amount of protein in the enzyme solutions was routinely determined by the Coomassie Blue method (Bradford
                  - link "Reference 1976" [ref=e282] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR8
                    - text: "1976"
                  - text: ). To determine the N-terminal sequence, the protein bands were transferred to a polyvinylidene difluoride (PVDF) membrane (Bio-Rad) after protein separation by SDS-PAGE (Speicher
                  - link "Reference 1994" [ref=e283] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR51
                    - text: "1994"
                  - text: ), using the Transblot SD cell (Bio-Rad, Hercules, CA) at 25 V for 3 h. The membrane filter was stained with 0.1 % amido black and destained with 5 % acetic acid. The protein band on the filter was excised and subjected to N-terminal amino acid sequence analysis by automatic Edman degradation (Edman and Begg
                  - link "Reference 1967" [ref=e284] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR14
                    - text: "1967"
                  - text: ), using a gas phase protein sequencer (Procise Protein Sequencing System) connected to online model 610A (Applied Biosystems, Foster, CA).
                - heading "mcl-PHA depolymerase assays" [level=3] [ref=e285]
                - paragraph [ref=e286]:
                  - text: mcl-PHA depolymerase activity of S. exfoliatus K10 was detected by clear halo formation on plates of basal mineral medium supplemented with P(HO-co-HH) as sole carbon source whereas depolymerase activity of Rhodococcus T104 (pENVO) was detected by growing recombinant cells on solid 2 × YTG medium plus P(HO-co-HH). In both cases, plates were incubated for 48 h at 30 °C. On the other hand, extracellular depolymerase activity was measured by the quick and simple qualitative spot test method as previously described (Martínez et al.
                  - link "Reference 2012" [ref=e287] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR39
                    - text: "2012"
                  - text: ) but in 50 mM Tris-HCl buffer, pH 8. Finally, depolymerase activity of the recombinant purified enzyme was determined by the quantitative standard turbidimetric assay (Martínez et al.
                  - link "Reference 2012" [ref=e288] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR39
                    - text: "2012"
                  - text: ) measuring the decrease of the turbidity of a homogeneous P(HO-co-HH) suspension with slight modifications. Five hundred microliters of standard reaction mixture contained 15 mM Glycine-NaOH buffer, pH 10, and 1 mg mL
                  - superscript [ref=e289]: −1
                  - text: of sonicated homogenous suspension of P(HO-co-HH) in deionized water were preincubated at 30 °C for 3 min; then, the reaction was started by the addition of 2 μg of pure enzyme and after 30 min of incubation at 30 °C, the turbidity decrease at 600 nm was measured. The turbidity decrease was linear during the assayed period. Controls without the enzyme were carried out in parallel to ascertain the possible non-enzymatic hydrolysis of P(HO-co-HH). All the activity assays were performed in triplicate and the maximum error was below 5 %. One unit (U) of mcl-PHA depolymerase activity is defined as the amount of enzyme needed to catalyze the decrease of 1 absorbance unit (at 600 ) per minute in the assay conditions described.
                - heading "Matrix-assisted laser desorption-time-of-flight analysis" [level=3] [ref=e290]
                - paragraph [ref=e291]:
                  - text: The MALDI experiments were performed on an Autoflex III matrix-assisted laser desorption-time-of-flight (MALDI-TOF-TOF) instrument (Bruker Daltonics, Bremen, Germany) with a smartbeam laser. The spectra were acquired using a laser power just above the ionization threshold. Samples were analyzed in the positive ion detection and delayed extraction linear mode. Typically, 1000 laser shots were summed into a single mass spectrum. External calibration was performed, using the Bovine Serum Albumin from Sigma, covering the range from 10 to 140 kDa. The 2,5-dihydroxy-acetophenone matrix solution was prepared by dissolving 7.6 mg in 375 μL ethanol followed by the addition of 125 μL of 80 mM diammonium hydrogen citrate aqueous solution. For sample preparation, 2 μL of 0.25 mg mL
                  - superscript [ref=e292]: –1
                  - text: PhaZ
                  - subscript [ref=e293]: Sex2
                  - text: solution in 15 mM Tris-HCl buffer, pH 8, were diluted with 2 μL of 2 % trifluoroacetic acid aqueous solution and 2 μL of matrix solution. A volume of 1 μL of these mixtures was spotted on the 800-μm AnchorChip target (Bruker-Daltonics) and allowed to dry at room temperature.
                - heading [level=3] [ref=e294]:
                  - text: Thermal inactivation of PhaZ
                  - subscript [ref=e295]: Sex2
                - paragraph [ref=e296]:
                  - text: Thermal inactivation experiments were performed by pre-incubating the pure PhaZ
                  - subscript [ref=e297]: Sex2
                  - text: (20 μg mL
                  - superscript [ref=e298]: –1
                  - text: ) in 50 mM Tris-HCl buffer, pH 8 at different temperatures ranging from 25 to 70 °C; then, aliquots were withdrawn at the indicated times and incubated at 4 °C in an ice bath for 10 min. The residual activity was determined at 30 °C using the standard turbidimetric assay conditions described above. The experimental deactivation data were modeled by Eq. (
                  - link "1" [ref=e299] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Equ1
                  - text: ) using a non-linear regression procedure based on the Lvenberg-Marquardt method of iterative convergence (Henley and Sadana
                  - link "Reference 1985" [ref=e300] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR25
                    - text: "1985"
                  - text: ") included into the TableCurve 2D v5.01 program:"
                - generic [ref=e301]:
                  - generic [ref=e302]: "$$ \\begin{array}{c}\\hfill a=\\frac{E+{\\alpha}_1\\cdot {E}_1+{\\alpha}_2\\cdot {E}_2}{E_0}\\hfill \\\\ {}\\hfill ={\\alpha}_2+\\left[1+\\frac{\\alpha_1{k}_1}{k_2-{k}_1}-\\frac{\\alpha_2{k}_2}{k_2-{k}_1}\\right]\\cdot \\left[ \\exp \\left(-{k}_1\\cdot t\\right)\\right]-\\left({\\alpha}_1-{\\alpha}_2\\right)\\left[\\frac{k_1}{k_2-{k}_1}\\right]\\cdot \\left[ \\exp \\left(-{k}_2\\cdot t\\right)\\right]\\hfill \\end{array} $$"
                  - generic [ref=e303]: (1)
                - paragraph [ref=e304]:
                  - text: where α is the residual activity. E, E
                  - subscript [ref=e305]: "1"
                  - text: ", and E"
                  - subscript [ref=e306]: "2"
                  - text: are the specific activities of native, intermediate and denatured enzyme. α
                  - subscript [ref=e307]: "1"
                  - text: and α
                  - subscript [ref=e308]: "2"
                  - text: are the ratio of specific activities E
                  - subscript [ref=e309]: "1"
                  - text: /E and E
                  - subscript [ref=e310]: "2"
                  - text: /E, respectively. k
                  - subscript [ref=e311]: "1"
                  - text: and k
                  - subscript [ref=e312]: "2"
                  - text: are first-order deactivation coefficients. The values of k
                  - subscript [ref=e313]: "1"
                  - text: ", k"
                  - subscript [ref=e314]: "2"
                  - text: ", α"
                  - subscript [ref=e315]: "1"
                  - text: ", and α"
                  - subscript [ref=e316]: "2"
                  - text: were constrained to be non-negative, and the theoretical deactivation curves were obtained from Eq. (
                  - link "1" [ref=e317] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Equ1
                  - text: ) by substitution of the calculated convergence values. A good agreement between the experimental and theoretical data was considered when the convergence relation coefficient was higher than 0.98 for each deactivation experiment.
                - heading "Circular dichroism analysis" [level=3] [ref=e318]
                - paragraph [ref=e319]:
                  - text: Circular dichroism spectra (CD) were recorded with 0.3 mg mL
                  - superscript [ref=e320]: –1
                  - text: of pure PhaZ
                  - subscript [ref=e321]: Sex2
                  - text: in 5 mM potassium phosphate buffer, pH 7 at 25 °C between 190 and 260 nm under thermostated conditions by using a JASCO J-715 spectropolarimeter. The CD readings were expressed as the mean residue molar ellipticity (degrees · cm
                  - superscript [ref=e322]: "2"
                  - text: · dmol
                  - superscript [ref=e323]: −1
                  - text: ), assuming a residue molecular mass of 106 Da according to the average amino acid mass of PhaZ
                  - subscript [ref=e324]: Sex2
                  - text: . Secondary structure data were obtained from CD spectra deconvolution, using the CDNN V2.1 program (Böhm et al.
                  - link "Reference 1992" [ref=e325] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR6
                    - text: "1992"
                  - text: ). Thermal unfolding of PhaZ
                  - subscript [ref=e326]: Sex2
                  - text: was analyzed by CD variation at 209 nm in 20–85 °C range scanned at 20 °C h
                  - superscript [ref=e327]: –1
                  - text: .
                - heading "Analytical ultracentrifugation analysis" [level=3] [ref=e328]
                - paragraph [ref=e329]:
                  - text: Samples of pure PhaZ
                  - subscript [ref=e330]: Sex2
                  - text: at two different concentrations (0.06 and 0.23 mg mL
                  - superscript [ref=e331]: –1
                  - text: ) in 15 mM Tris-HCl, buffer pH 8, were loaded (300 μL) into analytical ultracentrifugation cells. The experiments were carried out at 50,000×g in a XL-I analytical ultracentrifuge (Beckman-Coulter Inc.) equipped with a UV-VIS absorbance detection system, using an An-50Ti rotor, and 12 mm Epon-charcoal standard double-sector centerpieces. Sedimentation velocity profiles were recorded using the UV-VIS absorbance detection system at 280 nm. Sedimentation coefficient distributions were calculated by least-squares boundary modeling of sedimentation velocity data using the continuous distribution c(s) Lamm equation model as implemented in SEDFIT 14.1 (Brown and Schuck
                  - link "Reference 2006" [ref=e332] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR9
                    - text: "2006"
                  - text: ).
                - heading [level=3] [ref=e333]:
                  - text: Identification of the PhaZ
                  - subscript [ref=e334]: Sex2
                  - text: reaction products
                - paragraph [ref=e335]:
                  - text: To identify hydrolytic products of P(HO-co-HH) and PHACOS, 1 g L
                  - superscript [ref=e336]: –1
                  - text: of polymer was subjected to enzymatic hydrolysis with 2 μg of pure PhaZ
                  - subscript [ref=e337]: Sex2
                  - text: depolymerase in 15 mM Glycine-NaOH buffer, pH 10, according to the standard turbidimetric assay. The degradation products were identified by analyzing the supernatant of the reaction mixture by HPLC mass spectrometry (Ion Trap LC-MS) as previously reported (Martínez et al.
                  - link "Reference 2012" [ref=e338] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR39
                    - text: "2012"
                  - text: ). The HPLC-MS experiments were carried out on a Finnigan Surveyor (Thermo Electron) pump coupled with a Finnigan LXQ TM (Thermo Electron) ion trap mass spectrometer. The separation was performed at 40 °C on a 2.1 × 150 mm (3.5 μm particle size) XTerra MS C18 column (Waters) at a flow rate of 100 μL min
                  - superscript [ref=e339]: –1
                  - text: "and an injection volume of 25 μL. The mobile phase for analysis of degradation products of both P(HO-co-HH) and PHACOS was 0.1 % ammonium hydroxide in water (A) and 0.1 % ammonium hydroxide in methanol (B). The following elution program was used as follows: at the start, 95 % A and 5 % B; after 3 min, the percentage of B was linearly increased to 95 % in 7 min, then kept constant for 20 min, ramped to the original composition in 5 min, and then equilibrated for 10 min. The samples were introduced to the ESI source in negative mode by continuous infusion by means of the instrument syringe pump at a rate of 3 mL min"
                  - superscript [ref=e340]: –1
                  - text: . The source was operated at 4.5 kV and the capillary temperature was set to 200 °C. All spectra were recorded in full scan mode (m/z 50-1500).
            - generic [ref=e342]:
              - heading "Results" [level=2] [ref=e343]
              - generic [ref=e344]:
                - heading "Identification and functional characterization of a novel extracellular mcl-PHA depolymerase in S. exfoliatus DSMZ 41693" [level=3] [ref=e345]
                - paragraph [ref=e346]:
                  - text: A putative extracellular mcl-PHA depolymerase (PhaZ
                  - subscript [ref=e347]: Sex2
                  - text: ) has been identified by inspection of the recently published genome sequence of S. exfoliatus DSMZ 41693 (nt 12,616 to 13,485 in Contig334) (Martínez et al.
                  - link "Reference 2014" [ref=e348] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR40
                    - text: "2014"
                  - text: ). PhaZ
                  - subscript [ref=e349]: Sex2
                  - text: shows the typical arrangement of extracellular mcl-PHA depolymerases with a secretion signal peptide (Fig S
                  - link "1" [ref=e350] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#MOESM1
                  - text: ), predicted to be of 29 amino acids with the algorithm of the SignalP 4.1 server (Petersen et al.
                  - link "Reference 2011" [ref=e351] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR44
                    - text: "2011"
                  - text: ) and the occurrence of a motif (G-H-S-Q-G) which agrees with the lipase box consensus sequence (Arpigny and Jaeger
                  - link "Reference 1999" [ref=e352] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR2
                    - text: "1999"
                  - text: ) (Fig.
                  - link "1" [ref=e353] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Fig1
                  - text: ). Alignment of PhaZ
                  - subscript [ref=e354]: Sex2
                  - text: with other mcl-PHA depolymerases characterized so far shows the conserved lipase box and the putative catalytic amino acids (Ser
                  - superscript [ref=e355]: "123"
                  - text: "-Asp"
                  - superscript [ref=e356]: "167"
                  - text: "-His"
                  - superscript [ref=e357]: "197"
                  - text: ) (Fig.
                  - link "1" [ref=e358] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Fig1
                  - text: ). Likewise, PhaZ
                  - subscript [ref=e359]: Sex2
                  - text: shows low sequence identity with depolymerases from Pseudomonas strains and B. bacteriovorus HD100 whereas it displays high identity with S. roseolus SL3 and S. venezuelae SO1, fitting perfectly within the Actinobacteria depolymerase group (Gangoiti et al.
                  - link "Reference 2012" [ref=e360] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR18
                    - text: "2012"
                  - text: ). All these characteristics suggest that this gene codes for a putative extracellular mcl-PHA depolymerase.
