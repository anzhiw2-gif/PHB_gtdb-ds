                - heading "Starvation experiments" [level=3] [ref=e325]
                - paragraph [ref=e326]:
                  - text: A. brasilense 7030 survived longer than its phaZ mutant derivative strain when exposed to starvation stress in phosphate buffer, without exogenous carbon or energy sources supplied in the medium (Fig.
                  - link "4" [ref=e327] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#Fig4
                  - text: ). The cell density of viable cells in the phaZ mutant decreased from the onset of the starvation period. In contrast, strain 7030 showed an increase in cell density at the beginning of the starvation period, followed by a moderate decrease during the time course of the experiment. At the end of the experiment, about ten times more wild-type than mutant cells were still viable.
