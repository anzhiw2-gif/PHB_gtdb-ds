                - heading "1. Introduction" [level=2] [ref=f1e301]
                - generic [ref=f1e302]:
                  - text: Anaerobic digestion is a method for the treatment of the organic fraction of municipal solid waste (OFMSW) supported by legislation and principally used worldwide for its ability to produce renewable energy in the form of methane. Moreover, the nutrient-rich digestate residue can be utilized as a bio-fertilizer (
                  - link "Albanna, 2013" [ref=f1e303] [cursor=pointer]:
                    - /url: "#b0015"
                  - text: ). However, plastic bags, such as those used for OFMSW collection, are not separated properly and are a serious challenge for digesters, even in regions where advanced waste management technologies are used.
                - generic [ref=f1e305]:
                  - text: The OFMSW is mostly composed of food waste, accounting for up to approximately 45% of municipal solid waste (MSW) in Europe (
                  - link "Cerda et al., 2018" [ref=f1e306] [cursor=pointer]:
                    - /url: "#b0050"
                  - text: ) and 46% globally (
                  - link "Hoornweg and Bhada-Tata, 2012" [ref=f1e308] [cursor=pointer]:
                    - /url: "#b0085"
                  - text: ). Because of its high moisture content (approximately 80% or some reports as high as 85–90% (
                  - link "Albanna, 2013" [ref=f1e310] [cursor=pointer]:
                    - /url: "#b0015"
                  - text: )) and organic matter content, the OFMSW is commonly treated via composting or anaerobic digestion in many countries, such as Sweden, Germany, and the Netherlands. While composting produces good quality soil fertilizer and heat that are difficult to collect (
                  - link "Smith et al., 2017" [ref=f1e312] [cursor=pointer]:
                    - /url: "#b0255"
                  - text: ), anaerobic digestion results in the production of biogas containing mostly methane and carbon dioxide that is easy to collect and use for renewable energy production. Therefore, from an energy perspective, anaerobic digestion is a preferable method for treating the OFMSW. If the OFMSW is separated with source sorted collection, a practice already applied in several countries, such as the Nordic countries, Germany and Austria, it is then usually collected in plastic or paper bags. However, the use of plastic bags can lead to plastic contamination in the biogas plants. A pretreatment method that is often applied in Sweden is pressing the OFMSW together with the collection bags through a star press, by which an easily degradable fraction, called a slurry, is formed, which is sent to the anaerobic digestion plant. The remaining part that does not go through the press is called “reject” and contains, among other components, most of the plastics, but it also contains a large amount of remaining organic matter that otherwise could be utilized for the production of methane. An alternative collection method for the OFMSW, which is applied in certain regions of Sweden, is the use of paper bags. However, some problems still can occur because paper bags can easily be damaged, and acidic leakage that causes corrosion problems in the collection trucks is common. Hence, biodegradable carrier bags, namely, bioplastic bags, could solve the problems mentioned above.
                - generic [ref=f1e314]:
                  - text: The use of bioplastics has been increasing worldwide for numerous applications, but since various bioplastics are relatively new products on the market, the disposal of bioplastics has been intensively investigated for the most appropriate implementation in existing disposal systems. Studies have thoroughly evaluated the different end-of-life options (
                  - link "Endres and Siebert-Raths, 2011" [ref=f1e315] [cursor=pointer]:
                    - /url: "#b0065"
                  - text: ) and the biodegradation and composting processes (
                  - link "Ahmed et al., 2018" [ref=f1e317] [cursor=pointer]:
                    - /url: "#b0010"
                  - text: ","
                  - link "Kale et al., 2007" [ref=f1e319] [cursor=pointer]:
                    - /url: "#b0110"
                  - text: ","
                  - link "Shah et al., 2008" [ref=f1e321] [cursor=pointer]:
                    - /url: "#b0220"
                  - text: ","
                  - link "Song et al., 2009" [ref=f1e323] [cursor=pointer]:
                    - /url: "#b0260"
                  - text: ) for bioplastics. A recent review (
                  - link "Ahmed et al., 2018" [ref=f1e325] [cursor=pointer]:
                    - /url: "#b0010"
                  - text: ) also highlighted the microbial strains involved in the degradation processes and the application of certain types of non-biodegradable and biodegradable polymers. However, to the best of our knowledge, there is a lack of comprehensive reviews on the anaerobic digestion of bioplastics. Therefore, this review focuses on the degradation of bioplastics in anaerobic conditions while also considering the requirements for smooth operation at biogas plants.
              - generic [ref=f1e327]:
                - heading "2. What are bioplastics?" [level=2] [ref=f1e328]
                - generic [ref=f1e329]:
                  - generic [ref=f1e330]:
                    - text: Within the term bioplastics, we distinguish (a) bio-based and (b) biodegradable plastics, but a bioplastic can also fulfil both of these criteria. Bio-based plastics are typically made from renewable sources by the action of living organisms. They can be polysaccharides (e.g., starches, such as thermoplastic starch (TPS); cellulose, such as regenerated cellulose; pectin, and chitin), proteins (e.g., wheat gluten, wool, silk, casein and gelatine), lipids (e.g., animal fats, plant oils), or products of microorganisms (e.g., poly(hydroxyalkanoate)s (PHAs) such as poly(hydroxybutyrate) (PHB)). Furthermore, bio-based plastics can also be chemically synthesized from bio-derived products (e.g., poly(lactic acid) (PLA), poly(butylene succinate) (PBS), and poly(trimethylene terephthalate) (PTT)) (
                    - link "IfBB, 2017" [ref=f1e331] [cursor=pointer]:
                      - /url: "#b0090"
                    - text: ","
                    - link "Song et al., 2009" [ref=f1e333] [cursor=pointer]:
                      - /url: "#b0260"
                    - text: ). Moreover, there is another fraction of plastics that is bio-based but not biodegradable that is called “drop-ins” (e.g., bio-PET, bio-PE, bio-PP) with identical features as their petrochemical ancestors. Moreover, biodegradable plastics, with a certain degree of biodegradability, can also be synthesized from petrochemical origins, such as poly(glycolic acid) (PGA), poly(caprolactone) (PCL), poly(butylene succinate-
                    - emphasis [ref=f1e335]: co
                    - text: "-terephthalate) (PBST), poly(butylene adipate-"
                    - emphasis [ref=f1e336]: co
                    - text: "-terephthalate) (PBAT) and poly(vinyl alcohol) (PVA). Some of these biodegradable bioplastics are already on the market and produced by different companies under different trade names. One example for PBAT is Ecoflex®, Wango, Ecoworld™, etc. The classification of different bioplastics is illustrated in"
                    - link "Fig. 1" [ref=f1e337] [cursor=pointer]:
                      - /url: "#f0005"
                    - text: .
                  - figure [ref=f1e339]:
                    - list [ref=f1e341]:
                      - listitem [ref=f1e342]:
                        - 'link "Download: Download high-res image (328KB)" [ref=f1e343] [cursor=pointer]':
                          - /url: https://ars.els-cdn.com/content/image/1-s2.0-S0956053X18305816-gr1_lrg.jpg
                      - listitem [ref=f1e346]:
                        - 'link "Download: Download full-size image" [ref=f1e347] [cursor=pointer]':
