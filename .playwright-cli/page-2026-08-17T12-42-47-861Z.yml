          - generic [ref=e167]:
            - generic [ref=e169]:
              - heading "Introduction" [level=2] [ref=e170]
              - generic [ref=e171]:
                - paragraph [ref=e172]:
                  - text: The gram-negative nitrogen-fixing rhizobacterium Azospirillum brasilense lives in close association with plant roots, where it exerts beneficial effects on plant growth and yield of many crops of agronomic importance (Okon and Labandera-Gonzalez
                  - link "Reference 1994" [ref=e173] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR31
                    - text: "1994"
                  - text: ; Okon and Vanderleyden
                  - link "Reference 1997" [ref=e174] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR32
                    - text: "1997"
                  - text: ). Under suboptimal conditions, such as high C/N ratio, A. brasilense can accumulate poly-β-hydroxyalkanoates (PHAs) to more than 80% of its cell dry weight. It was shown that, in contrast to other bacterial species, A. brasilense does not produce copolymers of hydroxyalkanoates, rather only homopolymers of poly-β-hydroxybutyrate (PHB) (Itzigsohn et al.
                  - link "Reference 1995" [ref=e175] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR18
                    - text: "1995"
                  - text: ). Recently, the genes phbA (β-ketothiolase), phbB (acetoacetyl coenzyme A reductase), and phbC (PHB synthase) of the PHB biosynthetic pathway in A. brasilense Sp7 were identified, and a Sp7 mutant strain impaired in PHB production was obtained (Kadouri et al.
                  - link "Reference 2002" [ref=e176] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR22
                    - text: "2002"
                  - text: ). A. brasilense strain Sp7 and the mutant strain impaired in PHB production were evaluated for their metabolic versatility, their ability to endure various stress conditions, their survival in soil inoculants, and their potential to promote plant growth. Based on these studies it was suggested that the synthesis and utilization of PHB as a carbon and energy source under stress favors the establishment and the survival of A. brasilense in competitive environments (Kadouri et al.
                  - link "Reference 2002" [ref=e177] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR22
                    - text: "2002"
                  - text: ","
                  - link "Reference 2003" [ref=e178] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR23
                    - text: "2003"
                  - text: ).
                - paragraph [ref=e179]:
                  - text: The PHB degradation pathway, as described in most bacteria and particularly in Sinorhizobium meliloti, begins with the depolymerization of PHB to d-β-hydroxybutyrate oligomers by PHB depolymerase (PhaZ). A NAD dependent d-β-hydroxybutyrate dehydrogenase oxidizes d-β-hydroxybutyrate to acetoacetate, which can then be converted into acetoacetyl-CoA by several systems. The transfer of CoA to acetoacetate occurs either directly, catalyzed by acetoacetyl-CoA synthetase, or indirectly, through succinyl-CoA, by succinyl-CoA transferase. In the following reaction, activated acetoacetyl-CoA is hydrolyzed into two acetyl-CoA molecules, which can then enter the TCA cycle (Aneja and Charles
                  - link "Reference 1999" [ref=e180] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR2
                    - text: "1999"
                  - text: "). There are two degradation systems for PHB: intracellular and extracellular (Jendrossek and Handrick"
                  - link "Reference 2002" [ref=e181] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR20
                    - text: "2002"
                  - text: ). Extracellular PHB depolymerases degrade PHB in the environment (Jendrossek et al.
                  - link "Reference 1996" [ref=e182] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR21
                    - text: "1996"
                  - text: ; Tanio et al.
                  - link "Reference 1982" [ref=e183] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR44
                    - text: "1982"
                  - text: ), while intracellular PHB depolymerases degrade intracellular PHB granules (Saegusa et al.
                  - link "Reference 2001" [ref=e184] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR38
                    - text: "2001"
                  - text: ).
                - paragraph [ref=e185]: In this study, we isolated and sequenced phaZ from A. brasilense strain Sp7. We also report on the construction and characterization of a phaZ mutant strain of A. brasilense that is unable to degrade PHB.
            - generic [ref=e187]:
              - heading "Materials and methods" [level=2] [ref=e188]
              - generic [ref=e189]:
                - heading "Bacterial strains, plasmids, and growth conditions" [level=3] [ref=e190]
                - paragraph [ref=e191]:
                  - text: The bacterial strains and plasmids used in this work are listed in Table
                  - link "1" [ref=e192] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#Tab1
                  - text: . A high carbon-to-nitrogen (C:N) ratio medium (Burdman et al.
                  - link "Reference 1999" [ref=e193] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR6
                    - text: "1999"
                  - text: ; Okon et al.
                  - link "Reference 1977" [ref=e194] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR33
                    - text: "1977"
                  - text: ) was used to induce accumulation of PHB in A. brasilense. Azospirillum transconjugants were selected on minimal medium for A. brasilense (MMAB) (Vanstockem et al.
                  - link "Reference 1987" [ref=e195] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR47
                    - text: "1987"
                  - text: ).
                - 'figure "Table 1. Bacterial strains and plasmids used in this study. Abbreviations for antibiotics: r resistance, Tc tetracycline, Ap ampicillin, Km kanamycin, Cm cycloheximide, Sm streptomycin" [ref=e197]':
                  - link "Full size table 1" [ref=e201] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z/tables/1
                    - text: Full size table
                - heading "DNA manipulations and analysis" [level=3] [ref=e204]
                - paragraph [ref=e205]:
                  - text: Subcloning, transformation, and DNA extractions were carried out according to standard methods (Sambrook et al.
                  - link "Reference 1989" [ref=e206] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR39
                    - text: "1989"
                  - text: ). Sequence similarity searches were done using the Blast network service (Altschul et al.
                  - link "Reference 1997" [ref=e207] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR1
                    - text: "1997"
                  - text: ). Sequences were aligned with the Clustal W program (Thompson et al.
                  - link "Reference 1994" [ref=e208] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR46
                    - text: "1994"
                  - text: ) and edited with GeneDoc (K.B. Nicholas and J.B. Nicholas Jr., GeneDoc [
                  - link "http://www.cris.com/~Ketchup/genedoc.shtml" [ref=e209] [cursor=pointer]:
                    - /url: http://www.cris.com/~Ketchup/genedoc.shtml
                  - text: "])."
                - heading "Synthesis of oligonucleotides and PCR" [level=3] [ref=e210]
                - paragraph [ref=e211]:
                  - text: Oligonucleotide primers were synthesized according to the codon frequency for A. brasilense extracted from the Codon Usage Database compiled from the codon usage tabulated from GenBank (Nakamura et al.
                  - link "Reference 1998" [ref=e212] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR29
                    - text: "1998"
                  - text: "). Based on known poly-β-hydroxyalkanoates depolymerase (phaZ) sequences, two degenerate primers were designed to amplify the putative phaZ fragment from total DNA of A. brasilense Sp7: phaZ-R, 5′-CCG-ATG-TCS-GGC-CAC-TAC-GCS-ACS-CTG-CTG-CGS-3′, and phaZ-L, 5′-CGG-CTC-GCA-SAC-SGC-GAT-SAC-3′ (with S=G or C). The primers anneal with phaZ of Ralstonia eutropha, Rickettsia prowazekii and Rhodobacter capsulatus in positions 357–537, 350–530, and 270–447, respectively."
                - heading "Southern blot and hybridization" [level=3] [ref=e213]
                - paragraph [ref=e214]:
                  - text: Total DNA from A. brasilense, A. lipoferum, A. amazonense, A. halopraeferens, A. irakense, and A. doebereinerae was isolated and digested with restriction enzymes. Southern blot and hybridization were carried out by standard methods (Sambrook et al.
                  - link "Reference 1989" [ref=e215] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR39
                    - text: "1989"
                  - text: ).
                - heading "Construction of an A. brasilense Sp7 phaZ::Km mutant" [level=3] [ref=e216]
                - paragraph [ref=e217]: The Tn5-derived 1.4-kb HincII Km resistance cassette of pUCA800 was inserted in the unique NaeΙ restriction site of pDpoly-E/P to yield pDpolyKm. The 2.2-kb phaZ::Km EcoRI–AatII fragment of pDpolyKm was subsequently cloned into the EcoRI–AatII site of the suicide vector pSUP202 to give pSUP-DpolyKm. E. coli S17.1 was transformed with pSUP-DpolyKm, which was further mobilized to A. brasilense 7030 through biparental mating. Azospirillum transconjugants were selected on MMAB supplemented with Km, and Km-resistant clones were isolated. Southern blot hybridization, DNA sequencing, and PCR screening with specific oligonucleotides against either the 700-bp phaZ fragment of pDpoly-S/S or the 1.4-kb HincII Km resistance cassette of pUCA800 showed the correct genetic configuration. One of these A. brasilense 7030 phaZ::Km mutants was used for further analysis.
                - paragraph [ref=e218]: The sequences of A. brasilense corresponding to PHB depolymerase was submitted to GenBank (accession no. AF474374).
                - paragraph [ref=e219]: Metabolic versatility experiments were done using BIOLOG GN plates according to manufacturer's instructions (Biolog, Hayward, Calif., USA).
                - paragraph [ref=e220]:
                  - text: PHB concentration was assayed by gas chromatography (Braunegg et al.
                  - link "Reference 1978" [ref=e221] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR4
                    - text: "1978"
                  - text: ), using poly β-hydroxybutyric acid from Ralstonia (Alcaligenes) (Sigma) as a standard, and A. brasilense 7030 as a control.
                - heading "Transmission electron microscopy" [level=3] [ref=e222]
                - paragraph [ref=e223]:
                  - text: Bacteria were embedded in a low-viscosity epoxy resin as described by Burdman et al. (
                  - link "Reference 1998" [ref=e224] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR5
                    - text: "1998"
                  - text: ). Thin sections were examined on a JEM 100-CX transmission electron microscope (JEOL, Tokyo, Japan).
                - heading "Quantitative measurement of aggregation" [level=3] [ref=e225]
                - paragraph [ref=e226]:
                  - text: The extent of aggregation was measured according to the method of Madi and Henis (
                  - link "Reference 1989" [ref=e227] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR26
                    - text: "1989"
                  - text: ), with some modifications (Burdman et al.
                  - link "Reference 1998" [ref=e228] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR5
                    - text: "1998"
                  - text: ). After settling, the culture was dispersed by homogenization (Heidolph RzR 50) for 1 min, and the total turbidity was immediately measured (OD
                  - subscript [ref=e229]: t
                  - text: "). Percentage of aggregation was estimated as follows: % aggregation=(OD"
                  - subscript [ref=e230]: t
                  - text: −OD
                  - subscript [ref=e231]: s
                  - text: )×100/OD
                  - subscript [ref=e232]: t
                  - text: .
                - heading "Extraction of extracellular polysaccharides" [level=3] [ref=e233]
                - paragraph [ref=e234]:
                  - text: Polysaccharides were extracted from a 24-h culture (Burdman et al.
                  - link "Reference 1998" [ref=e235] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR5
                    - text: "1998"
                  - text: ; Del Gallo et al.
                  - link "Reference 1990" [ref=e236] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR10
                    - text: "1990"
                  - text: ). The amounts of sugar in the polysaccharide fractions were measured by the anthrone method (Dische
                  - link "Reference 1962" [ref=e237] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR11
                    - text: "1962"
                  - text: ). Cell dry weight was determined as described by Wang et al. (
                  - link "Reference 1997" [ref=e238] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR48
                    - text: "1997"
                  - text: ).
                - heading "Starvation experiments" [level=3] [ref=e239]
                - paragraph [ref=e240]:
                  - text: Overnight cultures of A. brasilense (2-ml aliquot) were used to inoculate flasks containing 25 ml of high C:N medium. After 48 h of growth, bacteria were collected and washed twice by centrifugation at 4,000×g for 10 min in 0.06 M potassium phosphate buffer (pH 6.8). Bacteria were then resuspended in the same buffer and incubated on a shaker at 170 rpm for 11 days under starvation conditions (Tal et al.
                  - link "Reference 1985" [ref=e241] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR43
                    - text: "1985"
                  - text: ). Bacterial density (CFU/ml) was subsequently determined by dilution plating.
                - heading "Stress endurance" [level=3] [ref=e242]
                - paragraph [ref=e243]:
                  - text: In all experiments described, overnight cultures of A. brasilense (2-ml aliquot) were used to inoculate flasks containing 25 ml of high C:N medium, and these cultures were grown for 24 h. The number of viable cells (CFU/ml) was determined by dilution plating prior to and at the end of each experiment. For each experiment, the same initial number of cells (A. brasilense 7030 and mutant strain) was used (between 3×10
                  - superscript [ref=e244]: "8"
                  - text: and 7×10
                  - superscript [ref=e245]: "8"
                  - text: cells/ml). In heat resistance experiments, cells were incubated in a water-bath at 50 °C for a total of 120 min. Resistance to ultraviolet irradiation was tested by placing 20 ml of cells in 90 mm Petri dishes and exposing them to short-wave ultraviolet irradiation (254 nm) from a VL-6LC ultraviolet lamp (Vilber-Lourmat, Cedex, France) for 80 s. Survival of cells under desiccation was tested by placing 100 μl of bacteria on 18×18-mm cover-glasses. The cover-glasses were air dried in a Gelman class-100 laminar flow (Gelman, Milano, Italy) in a constant air flow of 0.45 m/s for 60 min. The cells were resuspended in potassium phosphate buffer (0.06 M, pH 6.8) and plated. Sensitivity of both strains to osmotic shock was estimated as described by Kadouri et al. (
                  - link "Reference 2003" [ref=e246] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR23
                    - text: "2003"
                  - text: ). Bacterial viability was determined as above. Sensitivity to sonication was determined by placing the cells for 40 s at 4 °C in a MSE ultrasonic disintegrator. To assess A. brasilense sensitivity to hydrogen peroxide. Cell aliquots (100 µl) were evenly spread on 90-mm Petri dishes containing a high C:N solid medium . Aliquots of a 1.5% solution of H
                  - subscript [ref=e247]: "2"
                  - text: O
                  - subscript [ref=e248]: "2"
                  - text: (25 μl) were placed on 13-mm Whatman discs and left to air-dry for 15 min. A single disc was placed in each dish and the cells were incubated at 30 °C for 24 h. The size of the halo around the disk was taken as a measure of the sensitivity of each strain.
                - heading "Survival in soil carriers" [level=3] [ref=e249]
                - paragraph [ref=e250]:
                  - text: Inoculants were tested according to the method of Fallik and Okon (
                  - link "Reference 1996" [ref=e251] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR13
                    - text: "1996"
                  - text: ") with some modifications. One ml of bacterial suspension was mixed with one of three autoclaved carriers: washed Sianic Sand (30 g) mixed with 0.7% CaCO"
                  - subscript [ref=e252]: "3"
                  - text: (w/w); peat (5 g) (Biolan, Kauttua, Finland) mixed with 3.0% CaCO
                  - subscript [ref=e253]: "3"
                  - text: (w/w); Perlite (5 g) (Agrikal, Israel) mixed with 0.8% CaCO
                  - subscript [ref=e254]: "3"
                  - text: (w/w). Inoculants were stored in sterile flasks at 30 °C. After 7 days of incubation, the carriers had undergone desiccation to different extents. Potassium phosphate (0.06 M, pH 6.8) was added and the slurry was stirred at 200 rpm for 2 h at 30 °C. Bacterial viability was determined as above.
                - paragraph [ref=e255]: All experiments were done at least three times (unless stated differently) and were highly reproducible. Therefore, data from one of each experiment are presented.
            - generic [ref=e257]:
