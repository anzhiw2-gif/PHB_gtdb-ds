            - generic [ref=e484]:
              - heading "RESULTS" [level=2] [ref=e485]
              - generic [ref=e486]:
                - heading "Mobilization of PHA in H. mediterranei." [level=3] [ref=e487]
                - paragraph [ref=e488]:
                  - text: PHA is a carbon and energy storage compound accumulated within the bacterial cells, it is usually mobilized when the exogenous carbon is inadequate; e.g., R. eutropha can use the PHB degradation products for growth and survival under conditions of carbon starvation (
                  - link "4" [ref=e489] [cursor=pointer]:
                    - /url: "#core-collateral-B4"
                  - text: ). Here we investigated PHA degradation in H. mediterranei in carbon-rich medium (
                  - link "Fig. 1A" [ref=e490] [cursor=pointer]:
                    - /url: "#F1"
                  - text: ) and carbon-free medium (
                  - link "Fig. 1B" [ref=e491] [cursor=pointer]:
                    - /url: "#F1"
                  - text: ). The concentration and content of PHA accumulated in the cells were analyzed via GC assay to determine whether the accumulated PHA was mobilized. The concentration of glucose, which was the sole carbon source in the medium, was measured as described in Materials and Methods. Unlike the case for bacteria (
                  - link "15" [ref=e492] [cursor=pointer]:
                    - /url: "#core-collateral-B15"
                  - text: ), which mobilize the accumulated PHA when the exogenous carbon source in the medium is exhausted, the accumulated PHA in H. mediterranei was not obviously mobilized after the glucose in the medium was used up even for a period of 5 days (
                  - link "Fig. 1A" [ref=e493] [cursor=pointer]:
                    - /url: "#F1"
                  - text: ).
                - generic [ref=e494]:
                  - generic [ref=e495]:
                    - generic [ref=e496]: FIG 1
                    - button "Open FIG 1 in Viewer" [ref=e498] [cursor=pointer]:
                      - generic [ref=e499]: 
                  - figure "FIG 1 PHA accumulation and degradation in the haloarchaeon H. mediterranei. (A) PHA accumulation in H. mediterranei grown in medium with glucose as the sole carbon source. (B) PHA degradation in H. mediterranei incubated in fresh medium without carbon. (C) GPC analysis of the molecular weight (Mw) distribution of PHA extracted on days 1, 5, and 10 as indicated in panel B. (D) SDS-PAGE analysis of proteins located on the PHA granules. Lanes 1 and 2, PHA granule isolated on days 0 and 5 as shown in panel B, respectively. The arrow indicates PhaZh1. Lane M, protein markers." [ref=e500]:
                    - img "FIG 1 PHA accumulation and degradation in the haloarchaeon H. mediterranei. (A) PHA accumulation in H. mediterranei grown in medium with glucose as the sole carbon source. (B) PHA degradation in H. mediterranei incubated in fresh medium without carbon. (C) GPC analysis of the molecular weight (Mw) distribution of PHA extracted on days 1, 5, and 10 as indicated in panel B. (D) SDS-PAGE analysis of proteins located on the PHA granules. Lanes 1 and 2, PHA granule isolated on days 0 and 5 as shown in panel B, respectively. The arrow indicates PhaZh1. Lane M, protein markers." [ref=e501] [cursor=pointer]
                - paragraph [ref=e503]:
                  - text: Considering that other nutrients (such as N or P) in the medium may be exhausted or any unknown metabolites may be accumulated and thus inhibit the PHA mobilization, we then transferred the PHA-rich cells into a fresh carbon-free medium (
                  - link "Fig. 1B" [ref=e504] [cursor=pointer]:
                    - /url: "#F1"
                  - text: ). Notably, when PHA-rich cells were incubated in this freshly prepared carbon-free medium, the previously accumulated PHA was degraded gradually in H. mediterranei (
                  - link "Fig. 1B" [ref=e505] [cursor=pointer]:
                    - /url: "#F1"
                  - text: ). Over a period of 5 days, the PHA content in the cells decreased from 61% (of dry cell weight) to 38%, and 0.71 g liter
                  - superscript [ref=e506]: −1
                  - text: PHA was degraded. After 10 days, approximately 47% of the accumulated PHA was mobilized. The molecular weight distribution of PHA in the degradation stage was analyzed via GPC assay as described in Materials and Methods (
                  - link "Fig. 1C" [ref=e507] [cursor=pointer]:
                    - /url: "#F1"
                  - text: ). With an increase in the incubation time, the molecular weight of PHA decreased. This finding demonstrated that PHA was degraded in PHA-rich cells incubated in carbon-free medium. Because the PHA content decreased slowly from the 5th day to the 10th day (
                  - link "Fig. 1B" [ref=e508] [cursor=pointer]:
                    - /url: "#F1"
                  - text: and
                  - link "C" [ref=e509] [cursor=pointer]:
                    - /url: "#F1"
                  - text: ), incubation of PHA-rich cells in carbon-free medium for 5 days was chosen for the following PHA degradation research.
              - generic [ref=e510]:
                - heading "PhaZh1 is a novel PGAP in H. mediterranei." [level=3] [ref=e511]
                - paragraph [ref=e512]:
                  - text: Depolymerase is the key enzyme involved in PHA degradation. To isolate the potential PHA depolymerase from H. mediterranei, we collected and purified nPHA granules from cells in which PHA was accumulated and degraded, as described in Materials and Methods. The proteins located on the granules were analyzed by SDS-PAGE (
                  - link "Fig. 1D" [ref=e513] [cursor=pointer]:
                    - /url: "#F1"
                  - text: ). A new protein located on the granule was purified from the PHA degradation cells that were incubated in carbon-free medium for 5 days (
                  - link "Fig. 1B" [ref=e514] [cursor=pointer]:
                    - /url: "#F1"
                  - text: ). The new protein was identified by MALDI-TOF/TOF MS as HFX_6464 (
                  - link "Fig. 2A" [ref=e515] [cursor=pointer]:
                    - /url: "#F2"
                  - text: ). Interestingly, HFX_6464 was a patatin-like protein (
                  - link "36" [ref=e516] [cursor=pointer]:
                    - /url: "#core-collateral-B36"
                  - text: ) (belonging to the Pfam01734 family). Patatin is a major storage protein found in potatoes that also has lipid acyl hydrolase and acyl transferase activities (
                  - link "37" [ref=e517] [cursor=pointer]:
                    - /url: "#core-collateral-B37"
                  - text: ). A classical lipase box (G-T-S
                  - subscript [ref=e518]: "47"
                  - text: "-G-G) was found in the sequence of HFX_6464 ("
                  - link "Fig. 2B" [ref=e519] [cursor=pointer]:
                    - /url: "#F2"
                  - text: ), and such a box is also found in several bacterial PhaZs and is very important for the hydrolysis activity of these PHA depolymerases in bacteria (
                  - link "6" [ref=e520] [cursor=pointer]:
                    - /url: "#core-collateral-B6"
                  - text: ","
                  - link "38" [ref=e521] [cursor=pointer]:
                    - /url: "#core-collateral-B38"
                  - text: ","
                  - link "39" [ref=e522] [cursor=pointer]:
                    - /url: "#core-collateral-B39"
                  - text: ).
