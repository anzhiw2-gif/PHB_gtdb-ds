                                  - /url: /action/downloadFigures?id=emi15409-fig-0004&partId=&doi=10.1111%2F1462-2920.15409
                                  - generic [ref=e772]: 
                                  - text: PowerPoint
                            - generic [ref=e773]:
                              - text: Environmental origin and phylogenetic relationships of the 231 PHA depolymerases predicted from all 143 MAGs. Tree scale bar indicates number of substitutions per site. Outer rings are coloured by environmental origin of predicted PHA depolymerases. Inner rings are coloured by phylum of the MAG encoding the predicted PHA depolymerase. ML trees showing (A) 10 (eight unique) PHAmcl depolymerases (B) 156 (133 unique) PHAscl T1 depolymerases and (C) 65 (56 unique) PHAscl T2 depolymerases. [Color figure can be viewed at
                              - link "wileyonlinelibrary.com" [ref=e774] [cursor=pointer]:
                                - /url: http://wileyonlinelibrary.com
                              - text: "]"
                        - paragraph [ref=e775]:
                          - text: "(ii) ePHAscl depolymerases: In our MAG screen, we predicted 109 unique ePHAsclT1 depolymerases from 84 dereplicated MAGs from the Proteobacteria (59), Bacteroidota (11), Myxococcota (4), Actinobacteriota (3), Bdellovibrionota (2) Desulfobacterota (1), Firmicutes (1), Methylomirabilota (1), Planctomycetota (1) and Spirochaetota (1) (Fig."
                          - link "4B" [ref=e776] [cursor=pointer]:
                            - /url: "#emi15409-fig-0004"
                          - text: ). Predicted T1 enzymes occurred as mostly as singletons (62 MAGs) but also in pairs (19 MAGs) or triplets (three MAGs). T1 and T2 enzymes were predicted to co-occur in 17 Proteobacteria MAGs. We predicted 44 unique ePHAsclT2 depolymerases in 33 dereplicated MAGs exclusively from members of the Proteobacteria (Fig.
                          - link "4C" [ref=e777] [cursor=pointer]:
                            - /url: "#emi15409-fig-0004"
                          - text: ). Three MAGs were not classified with GTDB-tk but placed among the Proteobacteria in the concatenated rp tree near Burkholderiales (one MAG) and Rhizobiales (two MAGs) reference sequences. Most predicted T2 enzymes occurred as singletons (24) or co-occurred with T1 enzymes (23). Notably, seven Burkholderiales from the Rhodocyclaceae family encoded two predicted T2 enzymes as well as a predicted T1 enzyme.
                    - generic [ref=e778]:
                      - heading "Discussion" [level=2] [ref=e779]
                      - paragraph [ref=e780]:
                        - text: PHA depolymerases degrade PHA substrates in the environment and have potential applications for bioremediation, composting and chemical recycling. The objective of this study was to increase the recognized diversity of PHA depolymerases and to elucidate their phylogenetic affiliations and occurrence in the environment. We used a homology-based search seeded with biochemically validated ePHA depolymerases followed by manual curation to identify 13 869 predicted PHA depolymerases in 1295 annotated and assembled metagenomes from diverse global environments (from all seven continents) and affiliated these enzymes with a broader-than-expected distribution of taxonomic lineages. Our results indicate that PHA depolymerases are globally distributed and occur in most ecosystems. However, PHA depolymerases were not universally detected in metagenomic datasets (e.g. less than a third of the 1492 aquatic metagenomes screened had predicted hits) or occurred with low frequency (Supp. Fig.
                        - link "1" [ref=e781] [cursor=pointer]:
                          - /url: "#support-information-section"
                        - text: ). PHAmcl depolymerases were particularly poorly represented in the metagenomic dataset, with only 3% of aquatic metagenomes and no solid waste metagenomes harbouring predicted enzymes. There are very few reports of isolated PHAmcl degraders in the literature (Martínez et al.,
                        - link "2015" [ref=e783] [cursor=pointer]:
                          - /url: "#emi15409-bib-0039"
                        - text: ) and our screen supports a sparse environmental distribution of these organisms. We allowed a permissive size cut-off threshold of 0.5 Mb of assembled sequence data to retain even small datasets. Notably, the majority of thermal spring and volcanic metagenomes were small (81/121 and 4/5 metagenomes were <10 Mb respectively), as well as a significant fraction of sediment, freshwater and activated sludge (212/442, 213/481 and 60/140 were <10 Mb respectively). Since we were less likely to identify enzymes in smaller metagenomes, we performed normalization by dataset size to calculate PHA depolymerase frequency. We note that PHA depolymerases may be present in a greater proportion of environments than our screen predict. We explored the relationship between metagenome size and the frequency of predicted PHA depolymerases and did not find a strong linear relationship (R
                        - superscript [ref=e784]: "2"
                        - text: = 0.0282) (Supp. Fig.
                        - link "4" [ref=e785] [cursor=pointer]:
                          - /url: "#support-information-section"
                        - text: ). Predicted PHA depolymerases were placed in ML trees anchored with reference enzymes (Supp. Fig.
                        - link "2" [ref=e786] [cursor=pointer]:
                          - /url: "#support-information-section"
                        - text: ). Based on tree placement, only a handful of predicted enzymes were closely related to biomarker enzymes; the majority of predicted enzymes formed more distantly related clades. If functional, these enzymes significantly expand the known sequence diversity of PHA depolymerases.
                      - paragraph [ref=e787]:
                        - text: PHA depolymerase subtypes were predicted at different frequencies across ecosystems. PHAsclT1 depolymerases were the most prevalent followed by PHAsclT2 enzymes, with PHAmcl depolymerases having substantially lower frequencies across all ecosystems. Wastewater metagenomes, particularly those from activated sludge and nutrient removal systems, had the highest frequency of predicted PHA depolymerases and may be ecological hotspots for these enzymes. Interestingly, wastewater has been explored as a promising carbon source for PHA production (Pittmann and Steinmetz,
                        - link "2017" [ref=e789] [cursor=pointer]:
                          - /url: "#emi15409-bib-0048"
                        - text: ). With the predicted presence of PHA degraders in the majority of wastewater systems, there is the possibility of engineering a circular system where wastewater acts as both a feedstock and a waste processing component in the bioplastic life cycle. Notably, a high frequency of PHAsclT1 depolymerases were detected in terrestrial metagenomes, with soil metagenomes harbouring a huge number of novel predicted T1 enzymes, though at average or low relative frequencies.
                      - paragraph [ref=e790]:
                        - text: Prior to our screen, bacterial ePHA depolymerases were characterized from the Proteobacteria, Actinobacteriota, Bdellovibrionota (formerly within the Deltaproteobacteria) and Firmicutes, as well as one fungal phylum, the Ascomycetes. Our screen infers PHA depolymerases occur in 23 additional bacterial phyla and two archaeal phyla. An LCA analysis on unbinned predicted PHA-depolymerase encoding scaffolds associated this predicted function with 28 different phylum-level lineages, 10 of which were also identified in our MAG screen. MAGs allowed us to more confidently taxonomically place putative PHA depolymerase hosts, compare enzyme frequencies between lineages and place predicted enzymes within a genomic context, whereas our work with metagenomic scaffolds provided a larger dataset originating from a greater number of environmental samples. Together, our analyses affiliated predicted PHA depolymerases predominantly with the Proteobacteria, Bdellovibrionota, Myxococcota, Methylomirabilota, Actinobacteriota and Chloroflexota (Fig.
                        - link "3" [ref=e791] [cursor=pointer]:
                          - /url: "#emi15409-fig-0003"
                        - text: ", Supp. Fig."
                        - link "3" [ref=e792] [cursor=pointer]:
                          - /url: "#support-information-section"
                        - text: ). Many Proteobacterial PHA degraders have been identified through culture-based studies, particularly from soils (Jendrossek,
                        - link "2002" [ref=e794] [cursor=pointer]:
                          - /url: "#emi15409-bib-0030"
                        - text: ) and many of the PHA depolymerases used to seed our screen were from this phylum (Supp.
                        - link "Data 1" [ref=e795] [cursor=pointer]:
                          - /url: "#support-information-section"
                        - text: and references within). For this reason, we cannot be certain if this phylum is genuinely enriched for this function compared with other phyla, meaning efforts to characterize distantly related enzymes from non-Proteobacterial lineages may confirm a broader phylogenetic distribution for this enzyme family.
                      - paragraph [ref=e796]:
                        - text: A small number of predicted PHAscl depolymerase-encoding scaffolds identified from metagenomes were classified as archaeal, from the Halobacteriota, and one predicted PHAmcl depolymerase-encoding scaffold was classified as Thermoplasmatota. A number of distantly related genes were identified in archaeal MAGs but none passed our curation steps. These archaeal sequences may represent true PHA depolymerases that are distantly related to reference enzymes and thus may be interesting targets for future characterization (Supp.
                        - link "Data 6" [ref=e797] [cursor=pointer]:
                          - /url: "#support-information-section"
                        - text: ).
                      - paragraph [ref=e798]: Reference ePHAmcl depolymerases originated from the Bdellovibrionota (formerly a lineage within the Deltaproteobacteria), Gammaproteobacteria and Actinobacteriota. We identified PHAmcl depolymerase-encoding MAGs from the Proteobacteria, Firmicutes and Myxococcota (formerly the Deltaproteobacteria), with the highest overall frequency occurring in the Firmicutes. More phylum-level diversity was found in the LCA analyses of PHAmcl depolymerase-encoding scaffolds but interestingly no Firmicutes were identified. Most scaffolds were affiliated with the Proteobacteria, Myxococcota and Actinobacteriota but many were unclassified. Intriguingly, a few ePHAmcl-encoding scaffolds were classified as Acidobacteriota, Deinococcota and Dormibacterota, which are lineages that have not yet been associated with PHAmcl depolymerases. T2 reference enzymes originated from the Proteobacteria (most), a fungal species (1) and Actinobacteriota (1). All MAG-encoded PHAsclT2 depolymerases occurred in members of the Proteobacteria (mainly the Burkholderiales) and often co-occurred with PHAsclT1 depolymerases. The restriction of predicted T2 enzymes to only a few lineages is an interesting result which was mirrored by our LCA analyses on T2-encoding scaffolds.
                      - paragraph [ref=e799]: Two biochemically validated intracellular PHAsclT1 depolymerases (ACN29674.1 & BAE44206.1) are homologous to our reference extracellular PHAsclT1 depolymerases. To assess cellular localization of our predicted PHA depolymerases, we predicted signal peptides. The majority of MAG-encoded PHA depolymerases are expected to localize extracellularly. In contrast, fewer than half of the metagenome-derived PHA depolymerases had predicted signal peptides. We predict that a small fraction of identified PHA depolymerases may represent intracellular enzymes, but suspect that signal prediction algorithms may overlook valid signal peptides, particularly for organisms not well-represented in current databases.
                      - paragraph [ref=e800]: We identified several hosts with multiple predicted PHA depolymerases, which may indicate metabolic flexibility on PHA substrates. We consider these organisms and their PHA depolymerases important targets for future characterization. Most notably, we identified a Herminiimonas species from the Burkholderiales which encoded a complement of nine predicted PHA depolymerases, suggesting it may be an efficient and/or highly versatile PHA degrader. We also identified a scaffold encoding two PHAmcl enzymes that were classified as from a member of the Myxococcota, indicating this family may be enriched for this rarer enzyme subtype.
                      - paragraph [ref=e801]:
                        - text: Biodegradable plastics like PHA offer a promising solution to the devastating environmental effects caused by conventional plastics; however, it is important to understand the potential impacts of adding a novel substrate into the environment. Our screen identified low frequencies or non-detection of PHA depolymerases in many environments. The presence of PHA waste may enrich low-abundance community members with PHA degradation capacity and significantly alter microbial community structure. In a controlled trial, biofilms associated with PHAs were dominated by sulfate-reducing microorganisms in comparison to polyethylene terephthalate controls (Pinnell and Turner,
                        - link "2019" [ref=e803] [cursor=pointer]:
                          - /url: "#emi15409-bib-0047"
                        - text: ). The potential for low abundance organisms to respond to PHAs in an environment may allow more robust PHA degradation than our screen predicts and also may have unexpected impacts on microbial community dynamics and biogeochemical cycling.
                      - paragraph [ref=e804]: In conclusion, our work presents a carefully curated set of predicted PHA depolymerases to conservatively catalogue the existing environmental sequence diversity and the associated taxonomic affiliations of this enzyme family. We dramatically expand the inventory of PHA depolymerases available to target for future biochemical characterization and affiliate many of these enzymes with novel taxonomic lineages for this function. We also provide an overview of the occurrence and frequency of PHA depolymerases detected in the environment. Future research should employ a combination of metagenomic predictions, possibly leveraging hidden Markov models for broader diversity capture, burial degradation trials with functional profiling and biochemical validation of predicted enzymes (particularly for enzymes distantly related to biomarker enzymes) in targeted environments to confirm predictions developed here.
