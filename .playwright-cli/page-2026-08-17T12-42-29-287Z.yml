                            - paragraph [ref=e631]:
                              - text: PhaZ production under Cascade
                              - superscript [ref=e632]: TM
                              - text: system. PhaZ expression in E. coli MPO12 (pPAZ6) strain. Twenty-five microlitres of each cell suspension at OD
