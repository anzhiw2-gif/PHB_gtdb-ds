                    - img [ref=e530] [cursor=pointer]
                - paragraph [ref=e532]:
                  - text: Notably, HFX_6463 (bdhA), which encodes a putative NAD
                  - superscript [ref=e533]: +
                  - text: "-dependent 3HB dehydrogenase ("
                  - link "40" [ref=e534] [cursor=pointer]:
                    - /url: "#core-collateral-B40"
                  - text: ), and HFX_6464 formed a gene cluster in the megaplasmid pHM500 of H. mediterranei (
                  - link "Fig. 2A" [ref=e535] [cursor=pointer]:
                    - /url: "#F2"
                  - text: ). Moreover, through an SSDB gene cluster search (see Materials and Methods), we found five other archaeal and three bacterial strains that had the same genetic organization in their genomes (
