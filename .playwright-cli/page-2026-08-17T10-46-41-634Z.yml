            - generic [ref=f219e128]:
              - heading "Abstract" [level=2] [ref=f219e129]
              - paragraph [ref=f219e131]: Taxonomy is an organizing principle of biology and is ideally based on evolutionary relationships among organisms. Development of a robust bacterial taxonomy has been hindered by an inability to obtain most bacteria in pure culture and, to a lesser extent, by the historical use of phenotypes to guide classification. Culture-independent sequencing technologies have matured sufficiently that a comprehensive genome-based taxonomy is now possible. We used a concatenated protein phylogeny as the basis for a bacterial taxonomy that conservatively removes polyphyletic groups and normalizes taxonomic ranks on the basis of relative evolutionary divergence. Under this approach, 58% of the 94,759 genomes comprising the Genome Taxonomy Database had changes to their existing taxonomy. This result includes the description of 99 phyla, including six major monophyletic units from the subdivision of the Proteobacteria, and amalgamation of the Candidate Phyla Radiation into a single phylum. Our taxonomy should enable improved classification of uncultured bacteria and provide a sound basis for ecological and evolutionary studies.
          - region [ref=f219e133]:
            - heading "Similar content being viewed by others" [level=3] [ref=f219e134]
            - generic [ref=f219e135]:
              - article [ref=f219e137]:
                - generic [ref=f219e139]:
                  - heading [level=3] [ref=f219e140]:
                    - link "New globally distributed bacterial phyla within the FCB superphylum" [ref=f219e141] [cursor=pointer]:
                      - /url: https://www.nature.com/articles/s41467-022-34388-1?fromPaywallRec=false
                  - generic [ref=f219e142]:
                    - text: Article Open access
                    - generic [ref=f219e143]: 06 December 2022
              - article [ref=f219e145]:
                - generic [ref=f219e147]:
                  - heading [level=3] [ref=f219e148]:
                    - link "Efficient and robust search of microbial genomes via phylogenetic compression" [ref=f219e149] [cursor=pointer]:
                      - /url: https://www.nature.com/articles/s41592-025-02625-2?fromPaywallRec=false
                  - generic [ref=f219e150]: Article 09 April 2025
              - article [ref=f219e152]:
                - generic [ref=f219e154]:
                  - heading [level=3] [ref=f219e155]:
                    - link "Life history strategies among soil bacteria—dichotomy for few, continuum for many" [ref=f219e156] [cursor=pointer]:
                      - /url: https://www.nature.com/articles/s41396-022-01354-0?fromPaywallRec=false
                  - generic [ref=f219e157]:
                    - text: Article Open access
                    - generic [ref=f219e158]: 02 February 2023
          - generic [ref=f219e159]:
            - generic [ref=f219e161]:
              - heading "Main" [level=2] [ref=f219e162]
              - generic [ref=f219e163]:
                - paragraph [ref=f219e164]:
                  - text: The rapid expansion of sequenced bacterial and archaeal genomes in the past decade has enabled the construction of genome-based phylogenies
                  - superscript [ref=f219e165]:
                    - link "Reference 1" [ref=f219e166] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR1
                      - text: "1"
                    - text: ","
                    - link "Reference 2" [ref=f219e167] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR2
                      - text: "2"
                    - text: ","
                    - link "Reference 3" [ref=f219e168] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR3
                      - text: "3"
                  - text: suitable for defining taxonomy. A robust taxonomy is needed to accurately describe microbial diversity, to interpret metagenomic data and to provide a common language for communicating scientific results
                  - superscript [ref=f219e169]:
                    - link "Reference 4" [ref=f219e170] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR4
                      - text: "4"
                  - text: . Sequence-based phylogenetic trees provide a framework for the development of a taxonomy that takes into account both evolutionary relationships and differing rates of evolution. Current microbial taxonomies such as those provided by NCBI
                  - superscript [ref=f219e171]:
                    - link "Reference 5" [ref=f219e172] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR5
                      - text: "5"
                  - text: ", SILVA"
                  - superscript [ref=f219e173]:
                    - link "Reference 6" [ref=f219e174] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR6
                      - text: "6"
                  - text: ", RDP"
                  - superscript [ref=f219e175]:
                    - link "Reference 7" [ref=f219e176] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR7
                      - text: "7"
                  - text: ", Greengenes"
                  - superscript [ref=f219e177]:
                    - link "Reference 8" [ref=f219e178] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR8
                      - text: "8"
                  - text: and EzTaxon
                  - superscript [ref=f219e179]:
                    - link "Reference 3" [ref=f219e180] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR3
                      - text: "3"
                  - text: "are often inconsistent with evolutionary relationships, because many taxa circumscribe polyphyletic groupings. This inconsistency is partly attributable to historical phenotype-based classification, as exemplified by the clostridia: microorganisms sharing morphological similarities have been erroneously classified in the genus Clostridium"
                  - superscript [ref=f219e181]:
                    - link "Reference 9" [ref=f219e182] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR9
                      - text: "9"
                    - text: ","
                    - link "Reference 10" [ref=f219e183] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR10
                      - text: "10"
                  - text: . Modern microbial taxonomy is primarily guided by 16S rRNA relationships, and such discrepancies are observable in 16S rRNA gene trees
                  - superscript [ref=f219e184]:
                    - link "Reference 6" [ref=f219e185] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR6
                      - text: "6"
                    - text: ","
                    - link "Reference 8" [ref=f219e186] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR8
                      - text: "8"
                  - text: ", but most have not been corrected, owing to the scale of the task and the lengthy process of formally reclassifying microorganisms"
                  - superscript [ref=f219e187]:
                    - link "Reference 11" [ref=f219e188] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR11
                      - text: "11"
                  - text: .
                - paragraph [ref=f219e189]:
                  - text: A second, less obvious, issue with existing sequence-based microbial taxonomies is the uneven application of taxonomic ranks across the tree. Regions that are the subject of intense study tend to be split into more taxa than other parts of the tree with equivalent phylogenetic depth; for example, the family Enterobacteriaceae (comprising dozens of genera) is equivalent to a single genus in other parts of the tree, such as Bacillus
                  - superscript [ref=f219e190]:
                    - link "Reference 12" [ref=f219e191] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR12
                      - text: "12"
                  - text: . Conversely, understudied groups are often lumped together; for example, the phylum Synergistetes is currently represented by a single family
                  - superscript [ref=f219e192]:
                    - link "Reference 13" [ref=f219e193] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR13
                      - text: "13"
                  - text: that would constitute multiple family-level groupings in more intensively studied parts of the tree. A proposal to standardize taxonomic ranks by using 16S rRNA sequence identity thresholds has identified a high degree of discordance between these thresholds and the SILVA taxonomy
                  - superscript [ref=f219e194]:
                    - link "Reference 11" [ref=f219e195] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR11
                      - text: "11"
                  - text: .
                - paragraph [ref=f219e196]:
                  - text: Current microbial taxonomies based on 16S rRNA gene relationships
                  - superscript [ref=f219e197]:
                    - link "Reference 3" [ref=f219e198] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR3
                      - text: "3"
                    - text: ","
                    - link "Reference 6" [ref=f219e199] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR6
                      - text: "6"
                    - text: ","
                    - link "Reference 7" [ref=f219e200] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR7
                      - text: "7"
                    - text: ","
                    - link "Reference 8" [ref=f219e201] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR8
                      - text: "8"
                  - text: have several limitations, including low phylogenetic resolution at the highest and lowest taxonomic ranks
                  - superscript [ref=f219e202]:
                    - link "Reference 14" [ref=f219e203] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR14
                      - text: "14"
                  - text: ", missing diversity as a result of primer mismatches"
                  - superscript [ref=f219e204]:
                    - link "Reference 15" [ref=f219e205] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR15
                      - text: "15"
                  - text: and PCR-produced chimeric sequences that can corrupt tree topologies by drawing together disparate groups
                  - superscript [ref=f219e206]:
                    - link "Reference 16" [ref=f219e207] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR16
                      - text: "16"
                  - text: . Trees inferred from the concatenation of single-copy vertically inherited proteins provide higher resolution than those obtained from a single phylogenetic-marker gene
                  - superscript [ref=f219e208]:
                    - link "Reference 17" [ref=f219e209] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR17
                      - text: "17"
                    - text: ","
                    - link "Reference 18" [ref=f219e210] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR18
                      - text: "18"
                    - text: ","
                    - link "Reference 19" [ref=f219e211] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR19
                      - text: "19"
                  - text: and are increasingly representative of microbial diversity, as culture-independent techniques are now producing thousands of metagenome-assembled genomes (MAGs) from diverse microbial communities
                  - superscript [ref=f219e212]:
                    - link "Reference 20" [ref=f219e213] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR20
                      - text: "20"
                    - text: ","
                    - link "Reference 21" [ref=f219e214] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR21
                      - text: "21"
                    - text: ","
                    - link "Reference 22" [ref=f219e215] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR22
                      - text: "22"
                  - text: . Despite some caveats of their own, including potential lateral gene transfer, differing rates of evolution, and recombination
                  - superscript [ref=f219e216]:
                    - link "Reference 19" [ref=f219e217] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR19
                      - text: "19"
                    - text: ","
                    - link "Reference 23" [ref=f219e218] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR23
                      - text: "23"
                  - text: ", concatenated protein trees have been extensively used in the literature"
                  - superscript [ref=f219e219]:
                    - link "Reference 20" [ref=f219e220] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR20
                      - text: "20"
                    - text: ","
                    - link "Reference 24" [ref=f219e221] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR24
                      - text: "24"
                    - text: ","
                    - link "Reference 25" [ref=f219e222] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR25
                      - text: "25"
                  - text: and have been proposed as the best basis for a reference bacterial phylogeny
                  - superscript [ref=f219e223]:
                    - link "Reference 26" [ref=f219e224] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR26
                      - text: "26"
                  - text: .
                - paragraph [ref=f219e225]:
                  - text: Here we present a phylogeny inferred from the concatenation of 120 ubiquitous single-copy proteins, and we used this phylogeny to propose a bacterial taxonomy that covers 94,759 bacterial genomes, including 13,636 (14.4%) from uncultured organisms (metagenome-assembled or single-cell genomes). Taxonomic groups in this classification describe monophyletic lineages of similar phylogenetic depth after normalization for lineage-specific rates of evolution. This taxonomy, which we have named the GTDB taxonomy, is publicly available at the Genome Taxonomy Database website (
                  - link "http://gtdb.ecogenomic.org/" [ref=f219e226] [cursor=pointer]:
                    - /url: http://gtdb.ecogenomic.org/
                  - text: ).
            - generic [ref=f219e228]:
              - heading "Results" [level=2] [ref=f219e229]
              - generic [ref=f219e230]:
                - heading "Deriving the GTDB taxonomy" [level=3] [ref=f219e231]
                - paragraph [ref=f219e232]:
                  - text: A data set comprising 87,106 bacterial genomes was obtained from RefSeq/GenBank release 80 and augmented with 11,603 MAGs recovered from Sequence Read Archive metagenomes according to the approach of Parks et al.
                  - superscript [ref=f219e233]:
                    - link "Reference 22" [ref=f219e234] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR22
                      - text: "22"
                  - text: . After removal of 2,482 of these genomes on the basis of a completeness/contamination threshold and 1,468 genomes on the basis of a multiple sequence alignment (MSA) threshold, the resulting 94,759 genomes were dereplicated to remove highly similar genomes with high-quality reference material retained as representatives when possible (Online
                  - link "Methods" [ref=f219e235] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Sec12
                  - text: ). Nearly 40% (8,559) of the dereplicated data set of 21,943 genomes represents uncultured organisms reflecting the microbial diversity currently being revealed by culture-independent techniques
                  - superscript [ref=f219e236]:
                    - link "Reference 20" [ref=f219e237] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR20
                      - text: "20"
                    - text: ","
                    - link "Reference 21" [ref=f219e238] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR21
                      - text: "21"
                    - text: ","
                    - link "Reference 22" [ref=f219e239] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR22
                      - text: "22"
                  - text: . A bacterial genome tree was inferred from the dereplicated data set by applying FastTree to a concatenated alignment of 120 ubiquitous single-copy proteins
                  - superscript [ref=f219e240]:
                    - link "Reference 22" [ref=f219e241] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR22
                      - text: "22"
                  - text: (subsequently referred to as 'bac120') comprising a total of 34,744 columns after trimming of 1,021 columns represented in <50% of the genomes and 5,390 columns with an amino acid consensus <25% (Online
                  - link "Methods" [ref=f219e242] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Sec12
                  - text: ). The bac120 data set represents ∼4% of an average bacterial genome and is comparable to other bacterial domain marker sets
                  - superscript [ref=f219e243]:
                    - link "Reference 27" [ref=f219e244] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR27
                      - text: "27"
                    - text: ","
                    - link "Reference 28" [ref=f219e245] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR28
                      - text: "28"
                  - text: .
                - paragraph [ref=f219e246]:
                  - text: Having inferred the concatenated protein phylogeny, we annotated the tree with group names by using the NCBI taxonomy
                  - superscript [ref=f219e247]:
                    - link "Reference 5" [ref=f219e248] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR5
                      - text: "5"
                  - text: standardized to seven ranks (Online
                  - link "Methods" [ref=f219e249] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Sec12
                  - text: ). Taxon names were overwhelmingly assigned to interior nodes with high bootstrap support (99.7% ± 2.9%) to ensure taxonomic stability. However, a few poorly supported nodes (<70%) in the bac120 tree were assigned names on the basis of independent analyses or to preserve widely used existing classifications (
                  - link "Supplementary Table 1" [ref=f219e250] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM99
                  - text: and Firmicutes example below). Because more than one-third of the data set represents uncultured organisms, a substantial part of the tree was not effectively annotated with the NCBI genome taxonomy. Therefore, 16S rRNA gene sequences present in the MAGs were classified against the Greengenes
                  - superscript [ref=f219e251]:
                    - link "Reference 8" [ref=f219e252] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR8
                      - text: "8"
                  - text: 2013 and SILVA
                  - superscript [ref=f219e253]:
                    - link "Reference 6" [ref=f219e254] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR6
                      - text: "6"
                  - text: v123.1 taxonomies to provide additional taxonomic identifiers. Using a set of criteria to ensure accurate mapping between 16S rRNA and MAG sequences (Online
                  - link "Methods" [ref=f219e255] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Sec12
                  - text: ), we labeled 74 groups lacking cultured representatives with 16S rRNA-based names, including well-recognized clades such as SAR202 (ref.
                  - link "Reference 29" [ref=f219e256] [cursor=pointer]:
                    - /url: /articles/nbt.4229#ref-CR29
                    - text: "29"
                  - text: ), WS6 (ref.
                  - link "Reference 30" [ref=f219e257] [cursor=pointer]:
                    - /url: /articles/nbt.4229#ref-CR30
                    - text: "30"
                  - text: ) and ACK-M1 (ref.
                  - link "Reference 31" [ref=f219e258] [cursor=pointer]:
                    - /url: /articles/nbt.4229#ref-CR31
                    - text: "31"
                  - text: ) (
                  - link "Supplementary Table 2" [ref=f219e259] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM100
                  - text: "). We term all such alphanumeric names nonstandard placeholders to be replaced with standard validated names in due course. Curation of the taxonomy then involved two main tasks: the removal of polyphyletic groups and the normalization of taxonomic ranks according to relative evolutionary divergence (RED)."
                - heading "Removal of polyphyletic groups" [level=3] [ref=f219e260]
                - paragraph [ref=f219e261]:
                  - text: Twenty phyla and 25 classes as defined by the NCBI taxonomy could not be reproducibly resolved as monophyletic in the bootstrapped bac120 tree (
                  - link "Supplementary Table 3" [ref=f219e262] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM101
                  - text: ). Most of these were the result of a small number of misclassified genomes; however, some taxa seemed to be truly polyphyletic, including well-known lineages such as the Firmicutes and Proteobacteria (
                  - link "Supplementary Table 3" [ref=f219e263] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM101
                  - text: ). The instability of the Firmicutes has previously been noted, primarily as a result of the Tenericutes and/or Fusobacteria moving into or out of the group
                  - superscript [ref=f219e264]:
                    - link "Reference 25" [ref=f219e265] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR25
                      - text: "25"
                    - text: ","
                    - link "Reference 32" [ref=f219e266] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR32
                      - text: "32"
                  - text: . In this prominent case, we chose to preserve the existing classification until more in-depth phylogenetic analyses are performed to resolve the issue (rationale described below). Other poorly supported lineages such as the Proteobacteria, which have been widely reported to be polyphyletic on the basis of the 16S rRNA gene
                  - superscript [ref=f219e267]:
                    - link "Reference 8" [ref=f219e268] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR8
                      - text: "8"
                    - text: ","
                    - link "Reference 33" [ref=f219e269] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR33
                      - text: "33"
                  - text: and protein markers
                  - superscript [ref=f219e270]:
                    - link "Reference 34" [ref=f219e271] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR34
                      - text: "34"
                    - text: ","
                    - link "Reference 35" [ref=f219e272] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR35
                      - text: "35"
                  - text: ", were conservatively divided into stable monophyletic groups. When possible, polyphyletic taxa containing the nomenclature type retained the name, and all other groups were renamed according to the International Code of Nomenclature of Prokaryotes (Online"
                  - link "Methods" [ref=f219e273] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Sec12
                  - text: "). For lower-level ranks, notably genus, existing names were often retained with alphabetical suffixing to resolve polyphyly in the bac120 tree (for example, Bacillus_A, Bacillus_B and so forth). Only the group containing type material (if known) kept the original unsuffixed name to indicate the validity of the name assignment. This procedure serves two purposes: it preserves continuity in the literature, and it avoids the necessity to propose dozens of new names for highly polyphyletic groups, although we suggest that such renaming should ultimately be done. A total of 436 genera, 152 families and 67 orders were identified as polyphyletic in the tree, thus highlighting important deficiencies in the current taxonomy ("
                  - link "Supplementary Table 3" [ref=f219e274] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM101
                  - text: ). The genus Clostridium was the most polyphyletic, representing 121 genera spanning 29 families, and was followed by Bacillus (81 genera across 25 families) and Eubacterium (30 genera across 8 families). However, these numbers were also influenced by rank normalization in some cases (described below).
                - heading "Taxonomic-rank normalization" [level=3] [ref=f219e275]
                - paragraph [ref=f219e276]:
                  - text: There is currently no accepted standardized approach for assigning species to higher taxonomic ranks (i.e., genus to phylum), although 16S rRNA sequence identity and amino acid identity (AAI) thresholds have been proposed
                  - superscript [ref=f219e277]:
                    - link "Reference 11" [ref=f219e278] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR11
                      - text: "11"
                    - text: ","
                    - link "Reference 36" [ref=f219e279] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR36
                      - text: "36"
                    - text: ","
                    - link "Reference 37" [ref=f219e280] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR37
                      - text: "37"
                  - text: . The assignment of ranks within the NCBI taxonomy is highly variable under both these measures, because they have been proposed relatively recently and have not been widely adopted
                  - superscript [ref=f219e281]:
                    - link "Reference 2" [ref=f219e282] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR2
                      - text: "2"
                    - text: ","
                    - link "Reference 11" [ref=f219e283] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR11
                      - text: "11"
                  - text: . We normalized the assignment of higher taxonomic ranks by using RED calculated from the bac120 tree, an approach conceptually similar to that used by Wu et al.
                  - superscript [ref=f219e284]:
                    - link "Reference 38" [ref=f219e285] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR38
                      - text: "38"
                  - text: . Our method provides an operational approximation of relative time with extant taxa existing in the present (RED = 1), the last common ancestor occurring at a fixed time in the past (RED = 0) and internal nodes being linearly interpolated between these values according to lineage-specific rates of evolution (
                  - link "Fig. 1" [ref=f219e286] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig1
                  - text: and Online
                  - link "Methods" [ref=f219e287] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Sec12
                  - text: ). RED intervals for normalizing taxonomic ranks were defined as the median RED value for taxa at each rank ± 0.1 (
                  - link "Fig. 1" [ref=f219e288] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig1
                  - text: ). This procedure represents a compromise between strict normalization and the desire to preserve existing group names on well-supported interior nodes. Visualization of the NCBI taxonomy according to RED highlighted a substantial number of over- or underclassified taxa according to the proposed criteria (
                  - link "Fig. 2a" [ref=f219e289] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig2
                  - text: ). To correct these inconsistencies, we reassigned taxa falling outside of their RED intervals to either a new taxonomic rank (with appropriate nomenclatural changes) or a new node in the tree (
                  - link "Fig. 2b" [ref=f219e290] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig2
                  - text: ).
                - 'figure "Figure 1: Rank normalization through RED." [ref=f219e292]':
                  - generic [ref=f219e295]:
                    - generic [ref=f219e296]:
                      - 'img "Figure 1: Rank normalization through RED." [ref=f219e298]'
                      - link "Full size image figure 1" [ref=f219e300] [cursor=pointer]:
                        - /url: /articles/nbt.4229/figures/1
                        - text: Full size image
                    - paragraph [ref=f219e304]:
                      - text: (a) Example illustrating the calculation of RED. Numbers on branches indicate their length, and numbers below each node indicate their RED. The root of the tree is defined to have a RED of zero, and leaf nodes have a RED of one. The RED of an internal node n is linearly interpolated from the branch lengths comprising its lineage, as defined by p + (d/u) × (1 – p), where p is the RED of its parent, d is the branch length to its parent, and u is the average branch length from the parent node to all extant taxa descendant from n. For example, the parent node of leaves C and D has a RED value of 0.75 (0.42 + (2/3.5) × (1 – 0.42)), because its parent has a RED of p = 0.42, the branch length to the parent node is d = 2, and the average branch length from the parent node to C and D is u = (3+4)/2 = 3.5. (b) Bacterial genome tree inferred from 120 concatenated proteins (bac120) and contoured with the RED interval assigned to each taxonomic rank. Adjacent ranks overlap in some instances, because this permits existing group names to be placed on well-supported interior nodes. To accommodate visualizing the RED intervals, the initial tree inferred across 21,943 was pruned to 10,462 genomes by retaining one genome per species. The tree is rooted on the phylum Acetothermia for illustrative purposes. RED values used for rank normalization are averaged over multiple plausible rootings (Online
                      - link "Methods" [ref=f219e305] [cursor=pointer]:
                        - /url: /articles/nbt.4229#Sec12
                      - text: "). Examples of taxa with high expected substitution rates are as follows: U, o__UBA9983; T, s__Tropheryma whipplei; M, o__Mycoplasmatales; Bl, f__Blattabacteriaceae; R, g__RC9; P, g__Porphyromonas; L, g__Liberibacter; and B, g__Buchnera. Prefixes indicate taxonomic ranks. (c) The bac120 tree, with branch lengths scaled by RED values, illustrating that rank normalization follows concentric rings that provide an operational approximation of the relative time of divergence."
                - 'figure "Figure 2: RED of NCBI and GTDB taxa in a genome tree inferred from 120 concatenated proteins." [ref=f219e307]':
                  - generic [ref=f219e310]:
                    - generic [ref=f219e311]:
                      - 'img "Figure 2: RED of NCBI and GTDB taxa in a genome tree inferred from 120 concatenated proteins." [ref=f219e313]'
                      - link "Full size image figure 2" [ref=f219e315] [cursor=pointer]:
                        - /url: /articles/nbt.4229/figures/2
                        - text: Full size image
                    - paragraph [ref=f219e319]: (a,b) RED of taxa defined by the NCBI (a) and GTDB (b) taxonomies. Each point represents a taxon distributed according to its rank (y axis) and is colored green, orange or red to indicate monophyletic, operationally monophyletic or polyphyletic in the genome tree, respectively. A histogram is overlaid on the points to show the relative density of monophyletic, operationally monophyletic and polyphyletic taxa. The median RED value of each rank is shown by a blue line, and the RED interval for each rank is shown by black lines. Only monophyletic or operationally monophyletic taxa were used to calculate the median RED values for each rank. The GTDB aims to resolve taxa that are over- or underclassified on the basis of their RED value by either reassigning them to a new rank (vertical shift in plot) or moving them to a new interior node (horizontal shift in plot). For example, the family Synergistaceae was normalized by reclassifying the family to encompass only the genera Synergistes, Cloacibacillus, Thermanaerovibrio and Aminomonas, rather than the 12 genera circumscribed by this family in the NCBI taxonomy. Only taxa with two or more subordinate taxa are plotted, because these taxa have positions in the tree indicative of their rank (for example, only 33 of the 99 phyla defined by the GTDB contain two or more classes, and a phylum with a single class consisting of multiple orders is expected to have a RED value commensurate with the rank of class). The number of taxa plotted at each rank is given in parentheses along the y axis.
                - paragraph [ref=f219e320]:
                  - text: In contrast to 16S rRNA sequence identity or AAI thresholds, RED normalization accounts for the phylogenetic relationships between taxa and variable rates of evolution. For example, members of the rapidly evolving genus Mycoplasma
                  - superscript [ref=f219e321]:
                    - link "Reference 39" [ref=f219e322] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR39
                      - text: "39"
                  - text: (
                  - link "Fig. 1" [ref=f219e323] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig1
                  - text: ) are sufficiently diverged to represent two phyla on the basis of a 16S rRNA gene sequence identity threshold of 75% (ref.
                  - link "Reference 11" [ref=f219e324] [cursor=pointer]:
                    - /url: /articles/nbt.4229#ref-CR11
                    - text: "11"
                  - text: ). However, vertebrate-associated Mycoplasma and Ureaplasma diverged from their arthropod-associated sister families only 400 Ma (ref.
                  - link "Reference 39" [ref=f219e325] [cursor=pointer]:
                    - /url: /articles/nbt.4229#ref-CR39
                    - text: "39"
                  - text: ), as is approximately consistent with the emergence of vertebrates
                  - superscript [ref=f219e326]:
                    - link "Reference 40" [ref=f219e327] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR40
                      - text: "40"
                  - text: . This evolutionary event occurred much later than the primary diversification of bacterial phyla, which is estimated to have occurred between 2 and 3 Ga (ref.
                  - link "Reference 41" [ref=f219e328] [cursor=pointer]:
                    - /url: /articles/nbt.4229#ref-CR41
                    - text: "41"
                  - text: ). The relatively recent emergence of Mycoplasma is more consistent with their RED-normalized ranking into a single order within the Firmicutes (
                  - link "Fig. 2b" [ref=f219e329] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig2
                  - text: ) than the two phyla that would be indicated by a 16S rRNA sequence identity of 75%.
                - heading "Validation of the GTDB taxonomy" [level=3] [ref=f219e330]
                - paragraph [ref=f219e331]:
                  - text: The robustness of the approach used to generate the GTDB taxonomy was evaluated with various tree-inference software, evolutionary models, marker sets and genome data sets. We first considered trees inferred with ExaML and IQ-TREE. Because these methods are computationally intensive, it was necessary to decrease the bac120 MSA from 34,744 to 5,038 columns by evenly sampling columns across each of the 120 proteins and to use subsampled sets of 4,985 or 10,462 genomes dereplicated to retain one genome per GTDB genus or species, respectively (Online
                  - link "Methods" [ref=f219e332] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Sec12
                  - text: ). We also inferred trees by using FastTree with the reduced MSA and subsampled genome sets to isolate the effect of inference software from data-set reduction. For each of these trees, we determined the optimal position of each GTDB taxon and classified a taxon as monophyletic, operationally monophyletic (defined as having an F measure ≥0.95) or polyphyletic (Online
                  - link "Methods" [ref=f219e333] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Sec12
                  - text: ). Most GTDB taxa above the rank of species and with two or more genomes were found to be monophyletic or operationally monophyletic, and only 79 of 2,586 (3.1%) taxa were polyphyletic in one or more of the species-dereplicated FastTree, IQ-TREE or ExaML trees (
                  - link "Fig. 3a" [ref=f219e334] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig3
                  - text: and
                  - link "Supplementary Table 4" [ref=f219e335] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM102
                  - text: ). Notably, 44 of the 79 polyphyletic taxa were found to be polyphyletic in the species-dereplicated FastTree, suggesting that most of the identified incongruence with GTDB taxa was the result of using a subsampled MSA and a dereplicated set of genomes. On average, 95.2% (IQ-TREE), 96.5% (ExaML) and 96.9% (FastTree) of GTDB taxa at each taxonomic rank were classified as monophyletic or operationally monophyletic within the species-dereplicated trees (
                  - link "Fig. 3a" [ref=f219e336] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig3
                  - text: and
                  - link "Supplementary Fig. 1a" [ref=f219e337] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig6
                  - text: ). Taxa that were not monophyletic within the species-dereplicated trees were most often a result of the incongruent placement of a small number of genomes, thus resulting in either direct conflict with the GTDB taxonomy or unresolved groups in the tree (Online
                  - link "Methods" [ref=f219e338] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Sec12
                  - text: ). Less than 0.1% of genomes had a conflicting taxonomic assignment at any rank in any of the three species-dereplicated trees, and <1.6% had an unresolved taxonomic assignment at any rank, with the exception of order-level assignments in the ExaML tree, for which 7.5% were unresolved (
                  - link "Supplementary Fig. 1b" [ref=f219e339] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig6
                  - text: and
                  - link "Supplementary Table 5" [ref=f219e340] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM103
                  - text: ). This result was primarily due to fragmentation of the order Bacillales in the ExaML tree, which was one of the poorly supported nodes in the bac120 tree (
                  - link "Supplementary Table 1" [ref=f219e341] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM99
                  - text: ). Taxa at the same taxonomic rank were also observed to have similar RED values in all three species-dereplicated trees, thus indicating that rank normalization is robust to the maximum-likelihood method used, MSA subsampling and genome dereplication (
                  - link "Fig. 3a" [ref=f219e342] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig3
                  - text: ","
                  - link "Supplementary Fig. 1c" [ref=f219e343] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig6
                  - text: and
                  - link "Supplementary Table 1" [ref=f219e344] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM99
                  - text: ). Similar results were observed for the genus-dereplicated trees and are summarized in
                  - link "Supplementary Tables 1" [ref=f219e345] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM99
                  - text: and
                  - link "4" [ref=f219e346] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM102
                  - text: ". The GTDB taxonomy was also robust to model selection: only three taxa were polyphyletic in a tree inferred with FastTree under the LG protein-substitution model instead of the WAG model ("
                  - link "Supplementary Table 1" [ref=f219e347] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM99
                  - text: ).
                - 'figure "Figure 3: RED and polyphyly of GTDB and NCBI taxa on trees inferred by using varying inference methods and marker sets." [ref=f219e349]':
                  - generic [ref=f219e352]:
                    - generic [ref=f219e353]:
                      - 'img "Figure 3: RED and polyphyly of GTDB and NCBI taxa on trees inferred by using varying inference methods and marker sets." [ref=f219e355]'
                      - link "Full size image figure 3" [ref=f219e357] [cursor=pointer]:
                        - /url: /articles/nbt.4229/figures/3
                        - text: Full size image
                    - paragraph [ref=f219e361]:
                      - text: (a) Trees inferred with FastTree, IQ-TREE and ExaML from the concatenated alignment of 120 bacterial proteins and spanning 10,462 genomes dereplicated to one genome per species. RED distributions for taxa at each rank are shown relative to the median RED value of the rank. Results are summarized in box-and-whisker plots indicating percentiles 0/100, 5/95, 25/75 and 50. Distributions were calculated over monophyletic and operationally monophyletic taxa with two or more subordinate taxa, because these taxa have positions in the tree indicative of their rank. The number of taxa comprising each distribution is shown next to each box-and-whisker plot. The percentage of taxa classified as polyphyletic in each tree at each rank is indicated by a color gradient from blue to red. (b) Analogous results for trees inferred with FastTree by using 120 bacterial proteins (bac120), 16 ribosomal proteins (rp1) or the 16S rRNA gene and spanning the dereplicated set of 21,943 genomes used to define the GTDB. Plots showing the RED values of individual GTDB and NCBI taxa are shown in
                      - link "Figure 2" [ref=f219e362] [cursor=pointer]:
                        - /url: /articles/nbt.4229#Fig2
                      - text: and
                      - link "Supplementary Figures 1" [ref=f219e363] [cursor=pointer]:
                        - /url: /articles/nbt.4229#Fig6
                      - text: ","
                      - link "2" [ref=f219e364] [cursor=pointer]:
                        - /url: /articles/nbt.4229#Fig7
                      - text: ","
                      - link "3" [ref=f219e365] [cursor=pointer]:
                        - /url: /articles/nbt.4229#Fig8
                      - text: ","
                      - link "4" [ref=f219e366] [cursor=pointer]:
                        - /url: /articles/nbt.4229#Fig9
                      - text: ","
                      - link "5" [ref=f219e367] [cursor=pointer]:
                        - /url: /articles/nbt.4229#Fig10
                      - text: ","
                      - link "6" [ref=f219e368] [cursor=pointer]:
                        - /url: /articles/nbt.4229#Fig11
                      - text: ","
                      - link "7" [ref=f219e369] [cursor=pointer]:
                        - /url: /articles/nbt.4229#Fig12
                      - text: . (c) Hierarchical-cluster tree illustrating the Robinson–Foulds distance between trees inferred with different maximum-likelihood methods, neighbor joining (NJ) and alternative-marker sets (rp1 and 16S rRNA) over a common set of 4,985 genomes constructed by sampling one genome per GTDB genus. The alternative inference methods were also applied to trees originally dereplicated to one genome per species, which were subsequently pruned to the common set of 4,985 genomes. The bac120 tree was used to define the GTDB r80 taxonomy. (d) Hierarchical-cluster tree illustrating the proportion of supported splits in common among trees over the common set of 4,985 genomes. (e,f) Analogous plots to c (e) and d (f), except that pairwise distances were calculated over trees defined on a common set of 10,462 genomes constructed by sampling one genome per GTDB species. Because nonparametric bootstraps could not be determined for IQ-TREE and ExaML when dereplicated at the species level, these trees do not appear in f.
                - paragraph [ref=f219e370]:
                  - text: Having established that the GTDB taxonomy is robust across different maximum-likelihood-inference software, we next considered the effect of different marker sets. Applying FastTree to a concatenated alignment of 16 ribosomal proteins
                  - superscript [ref=f219e371]:
                    - link "Reference 20" [ref=f219e372] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR20
                      - text: "20"
                    - text: ","
                    - link "Reference 25" [ref=f219e373] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR25
                      - text: "25"
                  - text: (rp1) resulted in only 199 of the 4,501 (4.4%) GTDB taxa above the rank of species being classified as polyphyletic (
                  - link "Fig. 3b" [ref=f219e374] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig3
                  - text: and
                  - link "Supplementary Table 4" [ref=f219e375] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM102
                  - text: ). On average, 94.7% of GTDB taxa at each taxonomic rank were monophyletic or operationally monophyletic within the rp1 tree; the least was 92.7% at the class level, and the most was 96.5% at the order level (
                  - link "Fig. 3b" [ref=f219e376] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig3
                  - text: and
                  - link "Supplementary Fig. 2a" [ref=f219e377] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig7
                  - text: ). Less than 0.5% of genomes had a conflicting taxonomic assignment at any rank, and <1.5% had an unresolved taxonomic assignment at any rank (
                  - link "Supplementary Fig. 2" [ref=f219e378] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig7
                  - text: and
                  - link "Supplementary Table 5" [ref=f219e379] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM103
                  - text: ), with the exception of order-level assignments, which were unresolved for 4.0% of genomes. This result was largely due to an instability of the Enterobacterales probably caused by the inclusion of a highly reduced endosymbiont genome, 'Candidatus Zinderia insecticola', in the rp1 tree. As with the inference-software comparisons, we observed that taxa at the same taxonomic rank had similar RED values, thus indicating that rank normalization was largely preserved in the rp1 tree (
                  - link "Fig. 3b" [ref=f219e380] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig3
                  - text: and
                  - link "Supplementary Fig. 2c" [ref=f219e381] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig7
                  - text: ). Performing the same analysis on a 16S rRNA gene tree resulted in 387 of the 2,576 (15.0%) GTDB taxa above the rank of species, with two or more genomes being classified as polyphyletic; and 78.1% (species) to 90.8% (class) of GTDB taxa being recovered as monophyletic or operationally monophyletic (
                  - link "Fig. 3b" [ref=f219e382] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig3
                  - text: and
                  - link "Supplementary Fig. 3a" [ref=f219e383] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig8
                  - text: ). Incongruent taxonomic assignments in the 16S rRNA tree were largely the result of unresolved taxa, and <1.1% of genomes had conflicting assignments at any taxonomic rank (
                  - link "Supplementary Fig. 3b" [ref=f219e384] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig8
                  - text: and
                  - link "Supplementary Table 5" [ref=f219e385] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM103
                  - text: ). Taxa at the same rank had similar RED values in the 16S rRNA gene tree, though the spread of values was greater than observed on the bac120 or rp1 trees (
                  - link "Fig. 3b" [ref=f219e386] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig3
                  - text: and
                  - link "Supplementary Fig. 3c" [ref=f219e387] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig8
                  - text: ).
                - paragraph [ref=f219e388]:
                  - text: For comparison, we evaluated the congruence of the NCBI taxonomy with the trees inferred by using different inference software (species-dereplicated FastTree, IQ-TREE and ExaML) and marker sets (bac120, rp1 and 16S rRNA). In contrast to the GTDB taxonomy, all trees had numerous discrepancies with the NCBI taxonomy, in terms of both polyphyly and over- and underclassified taxa (
                  - link "Figs. 2" [ref=f219e389] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig2
                  - text: and
                  - link "3" [ref=f219e390] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig3
                  - text: ). On average, 26.1% (rp1) to 28.0% (species-dereplicated FastTree) of NCBI taxa were classified as polyphyletic in these trees, and taxa at the same taxonomic rank had highly variable RED distributions (
                  - link "Fig. 3" [ref=f219e391] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig3
                  - text: and
                  - link "Supplementary Figs. 4" [ref=f219e392] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig9
                  - text: ","
                  - link "5" [ref=f219e393] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig10
                  - text: ","
                  - link "6" [ref=f219e394] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig11
                  - text: ","
                  - link "7" [ref=f219e395] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig12
                  - text: ). Only 59.5% to 64.2% of genomes had NCBI taxonomy assignments congruent with the topology of these trees, whereas 76.1% to 96.8% had GTDB assignments in agreement with the tree topologies (
                  - link "Table 1" [ref=f219e396] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Tab1
                  - text: ).
                - figure "Table 1 Congruency of GTDB and NCBI taxonomic classifications with tree topology" [ref=f219e398]:
                  - link "Full size table 1" [ref=f219e401] [cursor=pointer]:
                    - /url: /articles/nbt.4229/tables/1
                    - text: Full size table
                - paragraph [ref=f219e404]:
                  - text: Trees inferred from alternative-marker sets showed a higher degree of discordance with the GTDB taxonomy than those inferred by using alternative maximum-likelihood-inference software. To further explore the relationship between alternative-marker sets and inference methods (including neighbor joining), we calculated pairwise tree distances between all trees (
                  - link "Fig. 3c,f" [ref=f219e405] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig3
                  - text: and
                  - link "Supplementary Table 6" [ref=f219e406] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM104
                  - text: ). These results showed that, in terms of both tree topology and supported splits, the maximum-likelihood-inference software used is less critical than the choice of marker set, and that genome dereplication and MSA subsampling also have a nontrivial effect on the inferred tree.
                - paragraph [ref=f219e407]:
                  - text: The stability of the GTDB taxonomy on trees inferred by using subsets of the bac120 marker set and under taxon subsampling was also evaluated in anticipation of decreasing computational burden as the database size increases. Subsampling of the 120 bacterial marker genes was performed 100 times with 60 of the markers randomly selected for each replicate. Notably, 96.7% of GTDB taxa were classified as monophyletic in ≥90% of the replicate trees, and only ten taxa (0.11%) were classified as polyphyletic in ≥50% of replicates (
                  - link "Supplementary Table 1" [ref=f219e408] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM99
                  - text: ). Given the lower phylogenetic resolution of individual genes
                  - superscript [ref=f219e409]:
                    - link "Reference 26" [ref=f219e410] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR26
                      - text: "26"
                    - text: ","
                    - link "Reference 42" [ref=f219e411] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR42
                      - text: "42"
                  - text: ", the results from individual gene trees were also highly robust: 86.1% of GTDB taxa were monophyletic in ≥50% of trees ("
                  - link "Supplementary Table 1" [ref=f219e412] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM99
                  - text: ), and all gene trees recovered ≥51.6% of GTDB phyla and ≥82.0% of GTDB genera as monophyletic or operationally monophyletic (
                  - link "Supplementary Table 7" [ref=f219e413] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM105
                  - text: ). Taxon resampling with one genome per genus was performed 100 times, and representative genomes were randomly selected in each replicate. Across the 1,430 taxa with two or more genera, 97.5% were recovered as monophyletic in ≥90% of the taxon-resampled trees, and only four taxa were classified as polyphyletic in ≥50% of replicates (
                  - link "Supplementary Table 1" [ref=f219e414] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM99
                  - text: ).
                - heading "Comparison of GTDB with other classifications" [level=3] [ref=f219e415]
                - paragraph [ref=f219e416]:
                  - text: Overall, 58% of the 84,634 genomes with an NCBI taxonomy had one or more changes to their classification above the rank of species (
                  - link "Fig. 4a" [ref=f219e417] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig4
                  - text: ). These changes included both reclassification of taxa and filling in missing rank name information (∼3% of genus to phylum names are currently undefined across the 84,634 genomes with an NCBI taxonomy). On average, 19% of names were changed per rank, the least being 7% at the phylum level and the most being 31% at the order level (
                  - link "Fig. 4a" [ref=f219e418] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig4
                  - text: ). A total of 199 NCBI names above the rank of species were 'retired' from the GTDB taxonomy mostly as a result of RED normalization (
                  - link "Supplementary Table 8" [ref=f219e419] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM106
                  - text: "). An analogous comparison to the SILVA taxonomy also showed substantial differences across all taxonomic ranks: 66% of genomes had one or more changes above the rank of species ("
                  - link "Supplementary Table 9" [ref=f219e420] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM107
                  - text: and
                  - link "Supplementary Fig. 8" [ref=f219e421] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig13
                  - text: ). Many of these differences are in common with the NCBI taxonomy, owing to the GTDB rank normalization process; however, there are also many documented differences between NCBI and SILVA
                  - superscript [ref=f219e422]:
                    - link "Reference 43" [ref=f219e423] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR43
                      - text: "43"
                  - text: .
                - 'figure "Figure 4: Comparison of GTDB and NCBI taxonomies and naming status of GTDB taxa." [ref=f219e425]':
                  - generic [ref=f219e428]:
                    - generic [ref=f219e429]:
                      - 'img "Figure 4: Comparison of GTDB and NCBI taxonomies and naming status of GTDB taxa." [ref=f219e431]'
                      - link "Full size image figure 4" [ref=f219e433] [cursor=pointer]:
                        - /url: /articles/nbt.4229/figures/4
                        - text: Full size image
                    - paragraph [ref=f219e437]:
                      - text: (a) Comparison of GTDB and NCBI taxonomic assignments across 84,634 bacterial genomes from RefSeq/GenBank release 80. For each rank, a taxon was classified as being unchanged if its name was identical in both taxonomies; passively changed if the GTDB taxonomy provided name information absent in the NCBI taxonomy; or actively changed if the name was different between the two taxonomies. Changes between the GTDB and NCBI taxonomies are fully listed in
                      - link "Supplementary Table 3" [ref=f219e438] [cursor=pointer]:
                        - /url: /articles/nbt.4229#MOESM101
                      - text: . (b) Percentage of GTDB taxa at each rank that are validly published and approved; proposed but not validated; or nonstandard placeholder names. The number of taxa at each rank is shown in parentheses.
                - paragraph [ref=f219e439]:
                  - text: Only 18% of taxon names in the GTDB taxonomy above the rank of species have been validly published; a further 19% have been proposed but not validated; and the remaining 63% are currently nonstandard placeholder names (
                  - link "Fig. 4b" [ref=f219e440] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig4
                  - text: ), thus indicating the scope of the task remaining to produce a fully standardized taxonomy consisting of validated names. This task will be greatly facilitated by recent proposals to use genome sequences as type material for as-yet-uncultured lineages, which in principle would allow for validation of names
                  - superscript [ref=f219e441]:
                    - link "Reference 44" [ref=f219e442] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR44
                      - text: "44"
                    - text: ","
                    - link "Reference 45" [ref=f219e443] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR45
                      - text: "45"
                  - text: .
                - heading "Genus- and species-level classifications" [level=3] [ref=f219e444]
                - paragraph [ref=f219e445]:
                  - text: Genera and species comprise 84% of the 16,924 defined taxon names in the bac120 tree. Misclassified species in the public repositories are an area of particular concern to researchers, because they can introduce noise into a variety of analyses, including strain typing
                  - superscript [ref=f219e446]:
                    - link "Reference 46" [ref=f219e447] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR46
                      - text: "46"
                  - text: ", biogeographic distributions of species"
                  - superscript [ref=f219e448]:
                    - link "Reference 47" [ref=f219e449] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR47
                      - text: "47"
                  - text: and pangenome analyses
                  - superscript [ref=f219e450]:
                    - link "Reference 48" [ref=f219e451] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR48
                      - text: "48"
                  - text: . Moreover, classification errors can propagate over time as incorrectly labeled genomes are used as reference material to identify novel sequences. A small number of microbial genera have been rigorously examined for this problem, and taxonomic corrections have been proposed, including Aeromonas
                  - superscript [ref=f219e452]:
                    - link "Reference 49" [ref=f219e453] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR49
                      - text: "49"
                  - text: and Fusobacterium
                  - superscript [ref=f219e454]:
                    - link "Reference 50" [ref=f219e455] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR50
                      - text: "50"
                  - text: . We compared the results of these analyses to the GTDB taxonomy as a means of providing an independent verification of our results. On the basis of multilocus sequence analysis and average nucleotide identity (ANI) comparisons, Beaz-Hidalgo et al.
                  - superscript [ref=f219e456]:
                    - link "Reference 49" [ref=f219e457] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR49
                      - text: "49"
                  - text: have proposed that nine Aeromonas dhakensis genomes are incorrectly classified as Aeromonas hydrophila. All nine of these genomes were reclassified as A. dhakensis in the bac120 tree, and an additional four genomes not included in the Beaz-Hidalgo study were also reclassified as A. dhakensis (
                  - link "Supplementary Table 10" [ref=f219e458] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM108
                  - text: ). Kook et al.
                  - superscript [ref=f219e459]:
                    - link "Reference 50" [ref=f219e460] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR50
                      - text: "50"
                  - text: have recently recommended the reclassification of Fusobacterium nucleatum subspecies animalis, nucleatum, polymorphum and vincentii as separate species, on the basis of ANI and genome distance metrics. Rank normalization of the GTDB taxonomy by using RED values largely reproduced this finding without prior knowledge of the authors' work (
                  - link "Supplementary Table 10" [ref=f219e461] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM108
                  - text: ). Reclassification of species according to the bac120 tree is also consistent with recent efforts to objectively define bacterial species according to barriers to homologous recombination estimated against the core genome of each species
                  - superscript [ref=f219e462]:
                    - link "Reference 51" [ref=f219e463] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR51
                      - text: "51"
                  - text: . In that study, 23 of 91 bacterial species have been proposed to contain one or more members not belonging to their respective species ('excluded taxa'). We found that almost all comparable instances of excluded taxa were due to misclassification in the NCBI taxonomy (
                  - link "Supplementary Table 10" [ref=f219e464] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM108
                  - text: ). These results suggest that the bac120 tree topology and RED estimates of species-level groups based on ∼4% of the genome (120 conserved markers) are consistent with alternative analytical approaches using larger fractions of the genome.
                - paragraph [ref=f219e465]:
                  - text: The genus Clostridium is widely acknowledged to be polyphyletic, and efforts have been made to rectify this problem, including a global attempt to reclassify the genus by using a combination of phylogenetic markers
                  - superscript [ref=f219e466]:
                    - link "Reference 9" [ref=f219e467] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR9
                      - text: "9"
                  - text: . The authors of that study have proposed the reclassification of 78 Clostridium species, and nine other species, into six novel genera
                  - superscript [ref=f219e468]:
                    - link "Reference 9" [ref=f219e469] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR9
                      - text: "9"
                    - text: ","
                    - link "Reference 52" [ref=f219e470] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR52
                      - text: "52"
                  - text: . Of these, we confirmed that Erysipelatoclostridium (with the exception of Clostridium innocuum str. 2959), Gottschalkia and Tyzzerella (excepting Clostridium nexile CAG:348) represent monophyletic genus-level groups. The remaining three genera proposed by Yutin and Galperin
                  - superscript [ref=f219e471]:
                    - link "Reference 7" [ref=f219e472] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR7
                      - text: "7"
                  - text: represent multiple genera in the GTDB taxonomy, including genera with validly published names (
                  - link "Supplementary Table 11" [ref=f219e473] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM109
                  - text: ). This result is consistent with recent analyses of individual taxa in these groups
                  - superscript [ref=f219e474]:
                    - link "Reference 53" [ref=f219e475] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR53
                      - text: "53"
                    - text: ","
                    - link "Reference 54" [ref=f219e476] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR54
                      - text: "54"
                  - text: . The GTDB taxonomy is also largely in agreement at the genus level with a recent global genome-based classification of the Bacteroidetes
                  - superscript [ref=f219e477]:
                    - link "Reference 55" [ref=f219e478] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR55
                      - text: "55"
                  - text: . Of the 122 genera addressed in that study, six were found to be in need of reclassification; Chryseobacterium, Epilithonimonas, Aequorivita, Vitellibacter, Flexibacter and Pedobacter. All six were similarly identified as polyphyletic in the GTDB taxonomy and reclassified accordingly. These findings demonstrate that our methods are broadly consistent with rigorous independent analyses of problematic genera and species.
                - heading "Taxonomic changes at higher ranks" [level=3] [ref=f219e479]
                - paragraph [ref=f219e480]:
                  - text: A number of notable taxonomic changes at higher ranks are proposed for well-studied groups. For example, the class Betaproteobacteria was reclassified as an order within the class Gammaproteobacteria because it is entirely circumscribed within the latter group and is closer to the median RED value for an order than a class (
                  - link "Fig. 2a" [ref=f219e481] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig2
                  - text: ). This change is consistent with the original 16S rRNA gene topology of the Proteobacteria and subsequent trees
                  - superscript [ref=f219e482]:
                    - link "Reference 6" [ref=f219e483] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR6
                      - text: "6"
                    - text: ","
                    - link "Reference 8" [ref=f219e484] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR8
                      - text: "8"
                    - text: ","
                    - link "Reference 56" [ref=f219e485] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR56
                      - text: "56"
                  - text: ", although such a rank change has not been proposed in these studies. The Deltaproteobacteria and Epsilonproteobacteria were removed entirely from the Proteobacteria, because this phylum is not consistently recovered as a monophyletic unit, as found in many previous 16S rRNA and other marker gene analyses"
                  - superscript [ref=f219e486]:
                    - link "Reference 11" [ref=f219e487] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR11
                      - text: "11"
                    - text: ","
                    - link "Reference 57" [ref=f219e488] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR57
                      - text: "57"
                    - text: ","
                    - link "Reference 58" [ref=f219e489] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR58
                      - text: "58"
                  - text: . In the case of the Epsilonproteobacteria, this class was combined with the order Desulfurellales (Deltaproteobacteria) to form a new phylum
                  - superscript [ref=f219e490]:
                    - link "Reference 58" [ref=f219e491] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR58
                      - text: "58"
                  - text: .
                - paragraph [ref=f219e492]:
                  - text: The Firmicutes also underwent extensive internal reclassification. As a clade, this phylum is typically monophyletic but poorly supported in most trees (
                  - link "Supplementary Table 1" [ref=f219e493] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM99
                  - text: ), and it has a RED in the phylum range, albeit to the left of the median for this taxonomic rank (
                  - link "Fig. 2b" [ref=f219e494] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig2
                  - text: ). The Firmicutes were therefore retained as a phylum-level lineage, although future revision of this status may be warranted. This phylum was divided into 34 classes including the mycoplasmas, which are currently classified as a separate phylum, the Tenericutes
                  - superscript [ref=f219e495]:
                    - link "Reference 59" [ref=f219e496] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR59
                      - text: "59"
                  - text: and 14 classes exclusively comprising MAGs. Incorporation of the Tenericutes within the Firmicutes is consistent with single-gene phylogenies
                  - superscript [ref=f219e497]:
                    - link "Reference 6" [ref=f219e498] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR6
                      - text: "6"
                    - text: ","
                    - link "Reference 8" [ref=f219e499] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR8
                      - text: "8"
                    - text: ","
                    - link "Reference 32" [ref=f219e500] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR32
                      - text: "32"
                    - text: ","
                    - link "Reference 53" [ref=f219e501] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR53
                      - text: "53"
                  - text: and is further supported by recent evidence based on multiple molecular markers
                  - superscript [ref=f219e502]:
                    - link "Reference 25" [ref=f219e503] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR25
                      - text: "25"
                    - text: ","
                    - link "Reference 26" [ref=f219e504] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR26
                      - text: "26"
                    - text: ","
                    - link "Reference 60" [ref=f219e505] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR60
                      - text: "60"
                  - text: . Similarly to its type genus, the order Clostridiales was extensively subdivided (
                  - link "Fig. 5a" [ref=f219e506] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig5
                  - text: ), largely as a consequence of an anomalous RED for this rank (
                  - link "Fig. 2a" [ref=f219e507] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig2
                  - text: ).
                - 'figure "Figure 5: Comparisons of NCBI and GTDB classifications of genomes designated as Clostridia or Bacteroidetes in the GTDB taxonomy." [ref=f219e509]':
                  - generic [ref=f219e512]:
                    - generic [ref=f219e513]:
                      - 'img "Figure 5: Comparisons of NCBI and GTDB classifications of genomes designated as Clostridia or Bacteroidetes in the GTDB taxonomy." [ref=f219e515]'
                      - link "Full size image figure 5" [ref=f219e517] [cursor=pointer]:
                        - /url: /articles/nbt.4229/figures/5
                        - text: Full size image
                    - paragraph [ref=f219e521]: (a) Comparison of NCBI (left) and GTDB (right) order-level classifications of the 2,368 bacterial genomes assigned to the class Clostridia in the GTDB taxonomy. Genomes classified in a class other than Clostridia by NCBI are indicated in parentheses. (b) Comparison of NCBI and GTDB class-level classifications of the 2,058 bacterial genomes assigned to the phylum Bacteroidetes in the GTDB taxonomy. Genomes classified in a phylum other than the Bacteroidetes by NCBI are indicated in parentheses.
                - paragraph [ref=f219e522]:
                  - text: On the basis of robust monophyly, taxonomic rank normalization and naming priority in the literature, the phylum Bacteroidetes is proposed to encompass the Chlorobi and Ignavibacteriae as class-level lineages. Concomitantly, several former classes of Bacteroidetes were amalgamated into the class Bacteroidia as order-level lineages, including the Chitinophagales, Cytophagales, Flavobacteriales and Sphingobacteriales (
                  - link "Fig. 5b" [ref=f219e523] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig5
                  - text: ). These proposed changes are in contrast to recent reclassifications, in which Bacteroidetes is divided into three major lineages by promoting the families Rhodothermaceae and Balneolaceae to phyla
                  - superscript [ref=f219e524]:
                    - link "Reference 55" [ref=f219e525] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR55
                      - text: "55"
                    - text: ","
                    - link "Reference 61" [ref=f219e526] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR61
                      - text: "61"
                  - text: (
                  - link "Fig. 2a" [ref=f219e527] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig2
                  - text: ). In the GTDB taxonomy, these were retained as families within their own orders in the class Rhodothermia, according to their RED values (
                  - link "Fig. 2b" [ref=f219e528] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig2
                  - text: ). The higher-level taxonomy of the phylum Actinobacteria was largely unchanged. The five classes Actinobacteria, Acidimicrobiia, Coriobacteriia, Thermoleophilia and Rubrobacteria were retained, and the sole change at the class level was the downgrading of the Nitriliruptoria to an order within the class Actinobacteria according to rank normalization. Changes to other major lineages are summarized in
                  - link "Supplementary Table 3" [ref=f219e529] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM101
                  - text: .
                - heading "Rank normalization of uncultured microbial diversity" [level=3] [ref=f219e530]
                - paragraph [ref=f219e531]:
                  - text: Having normalized the taxonomy on existing isolate-based classifications, we were able to calibrate the taxonomic ranks of uncultured lineages. Candidate phylum KSB3 was initially proposed on the basis of comparative analysis of environmental 16S rRNA gene sequences
                  - superscript [ref=f219e532]:
                    - link "Reference 62" [ref=f219e533] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR62
                      - text: "62"
                    - text: ","
                    - link "Reference 63" [ref=f219e534] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR63
                      - text: "63"
                  - text: ", and more recently two near-complete MAGs belonging to this phylum have been reconstructed from a bulking sludge metagenome, for which the names 'Candidatus Moduliflexus flocculans' and 'Candidatus Vecturathrix granuli' have been proposed"
                  - superscript [ref=f219e535]:
                    - link "Reference 64" [ref=f219e536] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR64
                      - text: "64"
                  - text: . These genomes were further classified into separate families, orders and classes within the phylum; however, by rank normalization, they represent separate genera belonging to a single family. The group still retains a phylum-level status, because it is not reproducibly affiliated with other bacterial lineages
                  - superscript [ref=f219e537]:
                    - link "Reference 36" [ref=f219e538] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR36
                      - text: "36"
                  - text: ; however, we propose that the phylum (Modulibacteria) is currently genomically represented by a single class (Moduliflexia), single order (Moduliflexales) and single family (Moduliflexaceae;
                  - link "Fig. 2b" [ref=f219e539] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig2
                  - text: ).
                - paragraph [ref=f219e540]:
                  - text: As part of a single-cell-genomics study, the superphylum Patescibacteria has been proposed to encompass the candidate phyla Parcubacteria (OD1), Microgenomates (OP11) and Gracilibacteria (GN02)
                  - superscript [ref=f219e541]:
                    - link "Reference 57" [ref=f219e542] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR57
                      - text: "57"
                  - text: . These candidate phyla have been further subsumed within the Candidate Phyla Radiation (CPR) on the basis of the addition of 797 MAGs
                  - superscript [ref=f219e543]:
                    - link "Reference 20" [ref=f219e544] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR20
                      - text: "20"
                  - text: . Currently, there are at least 65 candidate phyla proposed to belong to the CPR
                  - superscript [ref=f219e545]:
                    - link "Reference 20" [ref=f219e546] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR20
                      - text: "20"
                    - text: ","
                    - link "Reference 21" [ref=f219e547] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR21
                      - text: "21"
                  - text: ", and the justification of individual phyla has been based primarily on a 16S rRNA sequence-identity threshold of 75% (ref."
                  - link "Reference 11" [ref=f219e548] [cursor=pointer]:
                    - /url: /articles/nbt.4229#ref-CR11
                    - text: "11"
                  - text: ). The CPR has been consistently recovered as a monophyletic group by using concatenated protein markers in this and previous studies
                  - superscript [ref=f219e549]:
                    - link "Reference 20" [ref=f219e550] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR20
                      - text: "20"
                    - text: ","
                    - link "Reference 22" [ref=f219e551] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR22
                      - text: "22"
                    - text: ","
                    - link "Reference 25" [ref=f219e552] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR25
                      - text: "25"
                  - text: . However, rank normalization suggests that the CPR should be reclassified as a single phylum, for which we suggest reimplementing the name Patescibacteria (
                  - link "Fig. 2b" [ref=f219e553] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig2
                  - text: ), although ultimately the group should be named according to the nomenclature type material
                  - superscript [ref=f219e554]:
                    - link "Reference 65" [ref=f219e555] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR65
                      - text: "65"
                  - text: .
            - generic [ref=f219e557]:
              - heading "Discussion" [level=2] [ref=f219e558]
              - generic [ref=f219e559]:
                - paragraph [ref=f219e560]: We present the GTDB taxonomy, which aims to provide an objective, phylogenetically consistent classification of bacterial species. We show that this taxonomy is largely congruent with the topology and substitution rates of phylogenies inferred by using different marker sets and maximum-likelihood-inference methods. Although we preserved existing taxonomic classifications when possible, a substantial number of modifications were required to resolve polyphyletic groups and to normalize taxa at each taxonomic rank on the basis of our operational approximation of relative time of divergence.
                - paragraph [ref=f219e561]:
                  - text: The GTDB taxonomy covers 94,759 bacterial genomes, but we expect the number of available reference genomes to expand rapidly and to encompass new lineages
                  - superscript [ref=f219e562]:
                    - link "Reference 21" [ref=f219e563] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR21
                      - text: "21"
                    - text: ","
                    - link "Reference 22" [ref=f219e564] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR22
                      - text: "22"
                  - text: . In anticipation of this expansion, we will curate the taxonomy biannually to incorporate new genomes and proposed taxonomic groups, while retaining a phylogenetically consistent classification. Subsampling of the bac120 data set suggests that subsets of these marker genes could be used in the future to produce reliable phylogenies that better scale with the projected increase in the reference-genome database
                  - superscript [ref=f219e565]:
                    - link "Reference 2" [ref=f219e566] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR2
                      - text: "2"
                  - text: . Some incongruencies between genome trees inferred for each biannual update are expected to affect the GTDB taxonomy, as has already been observed for well-established groups such as the Firmicutes, which may require reclassification in subsequent iterations. A small number of GTDB taxa were also not recovered as monophyletic groups under trees inferred with different inference methods or marker sets. Such regions of instability should be addressed individually with more in-depth analyses to establish the most suitable classification, as for example, has been done recently with the class Epsilonproteobacteria
                  - superscript [ref=f219e567]:
                    - link "Reference 58" [ref=f219e568] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR58
                      - text: "58"
                  - text: .
                - paragraph [ref=f219e569]:
                  - text: The GTDB taxonomy is available through the Genome Taxonomy Database website (
                  - link "http://gtdb.ecogenomic.org/" [ref=f219e570] [cursor=pointer]:
                    - /url: http://gtdb.ecogenomic.org/
                  - text: ), and we are facilitating its incorporation into other public bioinformatic resources. We are also developing a standalone tool, GTDB-Tk (
                  - link "https://github.com/Ecogenomics/GtdbTk/" [ref=f219e571] [cursor=pointer]:
                    - /url: https://github.com/Ecogenomics/GtdbTk/
                  - text: ), to enable researchers to classify their own genomes according to the GTDB taxonomy and its classification criteria. The methods reported here are applicable to any taxonomically annotated phylogenetic tree, and we are in the process of expanding the GTDB to include Archaea and double-stranded DNA viruses. We anticipate that the availability of an up-to-date normalized genome-based classification should greatly facilitate the analysis of microbial genome data and communication of scientific results.
            - generic [ref=f219e573]:
              - heading "Methods" [level=2] [ref=f219e574]
              - generic [ref=f219e575]:
                - heading "Genome data set." [level=3] [ref=f219e576]
                - paragraph [ref=f219e577]:
                  - text: A data set of 87,106 bacterial genomes was obtained from RefSeq/GenBank
                  - superscript [ref=f219e578]:
                    - link "Reference 66" [ref=f219e579] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR66
                      - text: "66"
                  - text: release 80 on 17 January 2017. An additional 11,603 MAGs obtained from Sequence Read Archive metagenomes
                  - superscript [ref=f219e580]:
                    - link "Reference 67" [ref=f219e581] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR67
                      - text: "67"
                  - text: were added to this data set to improve coverage of uncultured lineages, most of which have been reported previously
                  - superscript [ref=f219e582]:
                    - link "Reference 22" [ref=f219e583] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR22
                      - text: "22"
                  - text: . These genomes were dereplicated as described in Parks et al.
                  - superscript [ref=f219e584]:
                    - link "Reference 22" [ref=f219e585] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR22
                      - text: "22"
                  - text: with the exception that dereplication was based on ANI values estimated on the basis of Mash distances
                  - superscript [ref=f219e586]:
                    - link "Reference 68" [ref=f219e587] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR68
                      - text: "68"
                  - text: "instead of pairwise AAI values calculated from the bac120 alignment. Specifically, a genome was assigned to a representative genome if one of the following criteria was met: (i) the Mash distance to the representative genome was ≤0.035 (∼ANI of 96.5%), and the query genomes had no species assignment in the previous iteration of the GTDB taxonomy (release 78;"
                  - link "http://gtdb.ecogenomic.org/downloads" [ref=f219e588] [cursor=pointer]:
                    - /url: http://gtdb.ecogenomic.org/downloads
                  - text: ); (ii) the Mash distance was ≤0.05 (∼ANI of 95%), and the query and representative genomes had the same species assignment in the previous iteration of the GTDB; or (iii) the Mash distance was ≤0.1 (∼ANI of 90%), the query and representative genomes had the same species assignment in the previous iteration of the GTDB and under the NCBI taxonomy. After dereplication, genomes were excluded that had (i) amino acids in <50% of the columns within the bac120 alignment and/or (ii) an estimated quality <50, defined as completeness – 5× contamination and calculated with the default lineage-specific marker gene sets of CheckM
                  - superscript [ref=f219e589]:
                    - link "Reference 69" [ref=f219e590] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR69
                      - text: "69"
                  - text: .
                - heading "Metadata." [level=3] [ref=f219e591]
                - paragraph [ref=f219e592]:
                  - text: The NCBI taxonomy
                  - superscript [ref=f219e593]:
                    - link "Reference 5" [ref=f219e594] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR5
                      - text: "5"
                  - text: associated with the reference genomes was obtained from the NCBI Taxonomy FTP site on January 17, 2017. This taxonomy was standardized to seven ranks (domain to species) by removing nonstandard ranks and identifying missing standard ranks with rank prefixes. Standard ranks were also prefixed with rank identifiers as previously described
                  - superscript [ref=f219e595]:
                    - link "Reference 8" [ref=f219e596] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR8
                      - text: "8"
                  - text: . For example, the full NCBI lineage for ′Nostoc azollae′ 0708 (
                  - link "GCF_000196515.1" [ref=f219e597] [cursor=pointer]:
                    - /url: https://www.ncbi.nlm.nih.gov/assembly/GCF_000196515.1/
                  - text: ) at the time of download was 'cellular organisms (no rank); Bacteria (superkingdom); Terrabacteria group (no rank); Cyanobacteria/Melainabacteria group (no rank); Cyanobacteria (phylum); Nostocales (order); Nostocaceae (family); Trichormus (genus); Trichormus azollae (species); 'Nostoc azollae' 0708 (strain)', which was standardized to 'd__Bacteria; p__Cyanobacteria; c__; o__Nostocales; f__Nostocaceae; g__Trichormus; s__Trichormus azollae'. Additional metadata from NCBI such as 'Isolate', 'Assembly level' and 'Genome representation' were also parsed from the assembly reports of all bacterial genomes (
                  - link "http://gtdb.ecogenomic.org/downloads" [ref=f219e598] [cursor=pointer]:
                    - /url: http://gtdb.ecogenomic.org/downloads
                  - text: ) to provide information for manual tree curation. To complement the NCBI taxonomy and metadata, we identified 16S rRNA gene sequences from all NCBI genomes and MAGs by using HMMER
                  - superscript [ref=f219e599]:
                    - link "Reference 70" [ref=f219e600] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR70
                      - text: "70"
                  - text: v3.1b1 and the most similar sequence within the Greengenes
                  - superscript [ref=f219e601]:
                    - link "Reference 8" [ref=f219e602] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR8
                      - text: "8"
                  - text: 2013 and SILVA
                  - superscript [ref=f219e603]:
                    - link "Reference 6" [ref=f219e604] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR6
                      - text: "6"
                  - text: v123.1 databases identified with BLASTN v2.2.30+
                  - superscript [ref=f219e605]:
                    - link "Reference 71" [ref=f219e606] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR71
                      - text: "71"
                  - text: .
                - heading "Inference and annotation of the bac120 tree." [level=3] [ref=f219e607]
                - paragraph [ref=f219e608]:
                  - text: A phylogenetic tree spanning the dereplicated genomes was inferred from the concatenation of 120 ubiquitous single-copy marker genes (bac120 marker set) identified within the Pfam
                  - superscript [ref=f219e609]:
                    - link "Reference 72" [ref=f219e610] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR72
                      - text: "72"
                  - text: v27 and TIGRFAMs
                  - superscript [ref=f219e611]:
                    - link "Reference 73" [ref=f219e612] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR73
                      - text: "73"
                  - text: v15.0 databases, which had previously been evaluated to be phylogenetically informative
                  - superscript [ref=f219e613]:
                    - link "Reference 22" [ref=f219e614] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR22
                      - text: "22"
                  - text: . Gene calling was performed with Prodigal
                  - superscript [ref=f219e615]:
                    - link "Reference 74" [ref=f219e616] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR74
                      - text: "74"
                  - text: v2.6.3, and the 120 marker proteins were identified and aligned with HMMER v3.1b1. The resulting MSA was trimmed by removal of columns represented by <50% of genomes and/or with an amino acid consensus <25%. In addition, genomes with amino acids in <50% of columns were removed before phylogenetic inference. The bac120 reference tree was inferred with FastTree
                  - superscript [ref=f219e617]:
                    - link "Reference 75" [ref=f219e618] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR75
                      - text: "75"
                  - text: v2.1.7 under the WAG model
                  - superscript [ref=f219e619]:
                    - link "Reference 76" [ref=f219e620] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR76
                      - text: "76"
                  - text: of protein evolution with gamma-distributed rate heterogeneity
                  - superscript [ref=f219e621]:
                    - link "Reference 77" [ref=f219e622] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR77
                      - text: "77"
                  - text: (+GAMMA). Branch support was estimated by performing 100 nonparametric bootstrap replicates. Group names based on the standardized NCBI genome taxonomy were added to interior nodes of the bac120 tree with tax2tree
                  - superscript [ref=f219e623]:
                    - link "Reference 8" [ref=f219e624] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR8
                      - text: "8"
                  - text: .
                - heading "Calculating relative evolutionary divergence and thresholds for taxonomic ranks." [level=3] [ref=f219e625]
                - paragraph [ref=f219e626]:
                  - text: RED values were calculated from the annotated bac120 tree with PhyloRank (v0.0.27;
                  - link "https://github.com/dparks1134/PhyloRank/" [ref=f219e627] [cursor=pointer]:
                    - /url: https://github.com/dparks1134/PhyloRank/
                  - text: ). PhyloRank performs a preorder tree traversal with the RED of the root defined to be zero and the RED of node n defined as p + (d/u)(1 – p), where p is the RED of the parent node, d is the branch length to the parent node, and u is the average branch length from the parent node to all extant taxa descendant from n. Because the RED of taxa is influenced by root placement, and the rooting of the bacterial tree remains controversial
                  - superscript [ref=f219e628]:
                    - link "Reference 78" [ref=f219e629] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR78
                      - text: "78"
                  - text: ", we took an operational approach and rooted trees at the midpoint of all branches leading to phyla with two or more classes. The RED of a taxon was then taken as the median RED over all tree rootings, excluding the tree in which the taxon was part of the outgroup. Median RED values for each taxonomic rank were determined from taxa with two or more immediately subordinate taxa (for example, phyla with two or more defined classes) and the RED rank intervals used to guide the GTDB taxonomy defined as ±0.1 from these median RED values."
                - heading "Tree-based taxonomic curation." [level=3] [ref=f219e630]
                - paragraph [ref=f219e631]:
                  - text: The annotated bac120 tree was manually curated in ARB
                  - superscript [ref=f219e632]:
                    - link "Reference 79" [ref=f219e633] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR79
                      - text: "79"
                  - text: to (i) resolve polyphyletic groups, (ii) correct taxa falling outside of their RED distribution and (iii) add 16S rRNA-based group names to uncultured lineages. Branch lengths in the bac120 tree were replaced with their corresponding RED values to produce a 'scaled' tree as a visual aid in the taxonomic-rank normalization process (
                  - link "Fig. 1c" [ref=f219e634] [cursor=pointer]:
                    - /url: /articles/nbt.4229#Fig1
                  - text: ). Polyphyletic groups were identified as part of the initial annotation of group names with numerical suffixes generated by tax2tree. Groups containing type material according to the List of Prokaryotic Names with Standing in Nomenclature
                  - superscript [ref=f219e635]:
                    - link "Reference 80" [ref=f219e636] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR80
                      - text: "80"
                  - text: "(LPSN) kept the original unsuffixed name to indicate the validity of name assignment, and other groups were renamed according to a set of nomenclatural rules (described below). Outlier-group names (±0.1 from the median RED values) were moved into their rank distributions in one of two ways: (i) the name was moved to another interior node in the bac120 tree, or (ii) the name was left on the original interior node but reclassified to a different rank. 16S rRNA taxonomy-based names were assigned to clades in the bac120 tree if one or more genomes spanning the clade had ≥95% identity over ≥500 bp to a reference 16S rRNA sequence with a given name. Robust interior nodes (bootstrap support >90%) were given preference for name assignments."
                - heading "Generation of final GTDB taxonomy." [level=3] [ref=f219e637]
                - paragraph [ref=f219e638]: The GTDB taxonomy was extracted from the curated bac120 tree (Newick input format) by concatenating group names from the relevant interior nodes for each genome and exporting them as a flat text file for validation. Validation included checks for correct number and order of taxonomic ranks; presence of multiple parents (polyphyly); orthographic and semantic errors; and consistency of order (-ales) and family (-aceae) rank suffixes. Because names can be applied only to groups of two or more taxa in ARB, 'singleton' genomes often have incomplete taxonomic lineages in the exported flat text file. These were autocompleted to at least the level of genus on the basis of the nomenclatural rules outlined below. The consistency of filled ranks between releases was tracked with additional scripts, and the completed taxonomy was validated once more.
                - heading "Nomenclatural rules for standard names." [level=3] [ref=f219e639]
                - paragraph [ref=f219e640]:
                  - text: Nomenclatural changes of validly published names were made according to the International Code of Nomenclature of Prokaryotes
                  - superscript [ref=f219e641]:
                    - link "Reference 81" [ref=f219e642] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR81
                      - text: "81"
                  - text: . In the event of the nomenclature type being excluded from or not present in the group, a new type was designated on the basis of priority in the literature, and provisional higher-rank names were established with the addition of corresponding rank suffixes to the stem of the generic name, including the recently proposed standard suffix -aeota for the rank of phylum
                  - superscript [ref=f219e643]:
                    - link "Reference 82" [ref=f219e644] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR82
                      - text: "82"
                  - text: . Priority was established for all other taxa names, namely those without standing in nomenclature and Candidatus taxa, on the basis of the earliest published taxon in the group, and ranks with missing annotations derived their name from the corresponding generic name of the earliest named taxon.
                - paragraph [ref=f219e645]:
                  - text: The term Candidatus was removed from GTDB taxon names to standardize the taxonomy but is easily tracked via the NCBI Organism Name in the genome metadata (
                  - link "http://gtdb.ecogenomic.org/" [ref=f219e646] [cursor=pointer]:
                    - /url: http://gtdb.ecogenomic.org/
                  - text: ). In cases in which new names were not proposed to resolve polyphyly, notably for the rank of genus, alphabetical suffixes were added to the standard name (for example, Bacillus_A, Bacillus_B and so forth). Species-level groups with nonstandard or ambiguous names were designated as 'genus name' sp1, 'genus name' sp2 and so forth. The official naming hierarchy from lower to higher ranks was followed, with the exception of some provisional phylum names lacking named species (notably CPR phyla), which were retained after rank normalization with appropriate rank suffix changes, for example, o__Levybacterales from 'Candidatus Levybacteria'
                  - superscript [ref=f219e647]:
                    - link "Reference 20" [ref=f219e648] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR20
                      - text: "20"
                  - text: .
                - heading "Nomenclatural rules for nonstandard placeholder names." [level=3] [ref=f219e649]
                - paragraph [ref=f219e650]:
                  - text: Nonstandard placeholder names were given to groups lacking standardly named representatives. Several sources were used to derive nonstandard names; (i) 16S rRNA environmental clone names grafted onto the bac120 tree (described above;
                  - link "Supplementary Table 2" [ref=f219e651] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM100
                  - text: ), (ii) isolate strain names, for example, g__Mor1 from the genome 'Acidobacteria bacterium Mor1' (
                  - link "GCA_001664505.1" [ref=f219e652] [cursor=pointer]:
                    - /url: https://www.ncbi.nlm.nih.gov/genome/?term=GCA_001664505.1
                  - text: ), (iii) MAG names, for example, g__UBA4820 from 'SRA genome UBA4820' (
                  - link "GCA_002402325.1" [ref=f219e653] [cursor=pointer]:
                    - /url: https://www.ncbi.nlm.nih.gov/genome/?term=GCA_002402325.1
                  - text: ), and (iv) genome assembly identifiers for groups exclusively comprising complex symbiont names, for example, g__GCF-001602625 for 'Sodalis-like endosymbiont of Proechinophthirus fluctus' (
                  - link "GCF_001602625.1" [ref=f219e654] [cursor=pointer]:
                    - /url: https://www.ncbi.nlm.nih.gov/assembly/GCF_001602625.1/
                  - text: ). Nonstandard names longer than 15 characters were trimmed for brevity and to minimize spelling errors, for example, g__2-02-FULL-67-57 from the name 'Acidobacteria bacterium RIFCSPHIGHO2_02_FULL_67_57' (
                  - link "GCA_001766975.1" [ref=f219e655] [cursor=pointer]:
                    - /url: https://www.ncbi.nlm.nih.gov/genome/?term=GCA_001766975.1
                  - text: ). In the rare event of identical placeholder names for two or more phylogenetically distinct groups resulting from automated name trimming, or rank filling, we appended hyphenated alphabetical suffixes (-A, -B and so forth) to distinguish them. As with standard binomial names, species-level groups were defined as 'genus name' sp1, 'genus name' sp2 and so forth. When necessary, nonstandard names were propagated to higher ranks differentiated only by rank prefix, for example, d__Bacteria; p__Acidobacteria; c__UBA4820; o__UBA4820; f__UBA4820; g__UBA4820.
                - heading "Inference of trees used to validate the GTDB taxonomy." [level=3] [ref=f219e656]
                - paragraph [ref=f219e657]: The stability of the GTDB taxonomy was evaluated with trees inferred in a manner analogous to that described for the bac120 tree. Briefly, proteins were called with Prodigal; marker genes were identified and aligned with HMMER with Pfam and TIGRfam HMMs; MSAs were trimmed according to consistency and ubiquity; genomes with poor representation in the alignment were removed before phylogenetic inference; and trees were inferred with FastTree under the WAG+GAMMA models unless otherwise specified.
                - paragraph [ref=f219e658]:
                  - text: Alternative inference methods. A neighbor-joining tree was inferred with NINJA
                  - superscript [ref=f219e659]:
                    - link "Reference 83" [ref=f219e660] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR83
                      - text: "83"
                  - text: v1.2.2 with default parameters. Maximum-likelihood trees were inferred with ExaML
                  - superscript [ref=f219e661]:
                    - link "Reference 84" [ref=f219e662] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR84
                      - text: "84"
                  - text: v3.0.20 under the JTT+PSR (-m PSR and -D flags) models and IQ-TREE
                  - superscript [ref=f219e663]:
                    - link "Reference 85" [ref=f219e664] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR85
                      - text: "85"
                  - text: v1.5.5 under the WAG+GAMMA models. ExaML requires a starting tree, and RaxML
                  - superscript [ref=f219e665]:
                    - link "Reference 86" [ref=f219e666] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR86
                      - text: "86"
                  - text: v8.1.11 was used to create a parsimony tree for this purpose. To reduce computational requirements, the trees were inferred over a reduced set of 4,985 or 10,462 genomes dereplicated to one genome per GTDB genus or species, respectively. This dereplication was performed by preferentially selecting type strains, genomes with good assembly statistics and genomes estimated to be highly complete with minimal contamination from the 21,943 genomes used to define the GTDB. The original MSA of 34,744 columns was also subsampled to 5,038 columns by evenly sampling columns with ≤10% gaps and ≤95% identical amino acids from each of the 120 bacterial marker genes. Branch support for the neighbor-joining and IQ-TREE trees were determined with 100 nonparametric bootstrap replicates, whereas the ExaML tree was limited to 30 replicates, owing to the high computational requirements of this method.
                - paragraph [ref=f219e667]:
                  - text: Alternative marker sets. A ribosomal protein tree (rp1) was inferred from the concatenation of 16 ribosomal proteins
                  - superscript [ref=f219e668]:
                    - link "Reference 20" [ref=f219e669] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR20
                      - text: "20"
                    - text: ","
                    - link "Reference 22" [ref=f219e670] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR22
                      - text: "22"
                  - text: and consisted of 1,949 aligned columns after trimming of 101 columns represented by <50% of the genomes and 11 columns with an amino acid consensus <25%. The rp1 tree spanned 21,444 genomes after removal of 1,967 genomes with amino acids in <50% of the filtered columns. Subsampled marker trees were inferred by random selection of 60 genes from the bac120 marker set. A total of 100 replicate trees were generated in this fashion to assess the effects of using different subsets of the bac120 marker set. The filtered MSAs ranged in length from 15,010 to 20,061 amino acids, and all trees spanned 21,943 genomes, because no additional genome filtering was performed. Individual gene trees were also inferred for each of the genes composing the bac120 marker set. The filtered alignments for these trees ranged in length from 43 to 1,069 amino acids and spanned 16,932 to 21,050 genomes.
                - paragraph [ref=f219e671]: Alternative genome sets. Trees were inferred from sets of extent taxa subsampled to one genome per genus in the GTDB taxonomy. Representative genomes for each genus were randomly selected from the 21,943 dereplicated genomes composing the bac120 tree. The alignments used for the full bac120 tree were used to infer the 100 subsampled trees.
                - paragraph [ref=f219e672]:
                  - text: Alternative models. A bac120 tree under the LG model
                  - superscript [ref=f219e673]:
                    - link "Reference 87" [ref=f219e674] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR87
                      - text: "87"
                  - text: was inferred with FastTree v2.1.7 compiled for double precision to avoid numerically unstable issues. This tree was inferred with the same MSA used for the bac120 tree under the WAG+GAMMA models, and it spans the same set of genomes.
                - paragraph [ref=f219e675]:
                  - text: Inference of 16S rRNA gene tree. A 16S rRNA gene tree was inferred from genes >1,200 bp identified within the 21,943 dereplicated and quality-controlled genomes. The 16S rRNA genes were identified with HMMER and domain-specific SSU/LSU HMM models, as implemented in the 'ssu-finder' method of CheckM, and the longest gene was retained for genomes with multiple copies of the 16S rRNA gene. The 12,712 identified 16S rRNA genes were filtered to remove sequences potentially representing contamination with a reciprocal BLAST protocol. Genes were searched against each other with BLASTN, and a gene was removed from consideration if its closest match belonged to a genome classified in a different taxonomic order, as defined by the GTDB, the gene had an alignment length ≥800 bp, and the gene had a percentage identity ≥82%. The percentage-identity criterion was based on the thresholds proposed by Yarza et al.
                  - superscript [ref=f219e676]:
                    - link "Reference 11" [ref=f219e677] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR11
                      - text: "11"
                  - text: . This procedure resulted in 277 sequences being removed from consideration (
                  - link "Supplementary Table 12" [ref=f219e678] [cursor=pointer]:
                    - /url: /articles/nbt.4229#MOESM110
                  - text: ). The remaining 12,435 16S rRNA genes were aligned with ssu-align
                  - superscript [ref=f219e679]:
                    - link "Reference 88" [ref=f219e680] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR88
                      - text: "88"
                  - text: v0.1, and trailing or leading columns represented by ≤70% of the sequences were trimmed, thus resulting in an alignment of 1,409 bp. The gene tree was inferred with FastTree v2.1.7 under the GTR
                  - superscript [ref=f219e681]:
                    - link "Reference 89" [ref=f219e682] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR89
                      - text: "89"
                  - text: and GAMMA models.
                - paragraph [ref=f219e683]:
                  - text: Pairwise comparison of inferred trees. The similarity of inferred trees was determined with the normalized Robinson–Foulds
                  - superscript [ref=f219e684]:
                    - link "Reference 90" [ref=f219e685] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR90
                      - text: "90"
                  - text: distance, which yields values between 0 (identical tree topologies) and 1 (trees with no splits in common). We also considered the proportion of supported splits (branches) in common between two trees. A split was considered supported if it had a nonparametric bootstrap support value ≥70%. The similarity of two trees was determined by dividing the weight of all supported splits in common between the two trees by the total weight of all supported splits. This procedure yielded a value between 0 (no supported splits in common) and 1 (all supported splits in common). Pairwise distances were visualized as an Unweighted Pair Group Method with Arithmetic Mean (UPGMA) hierarchical-cluster tree.
                - heading "Assessing stability of the NCBI and GTDB taxonomy on inferred trees." [level=3] [ref=f219e686]
                - paragraph [ref=f219e687]:
                  - text: The congruency of the NCBI and GTDB taxonomies on different trees was assessed by placing each taxon on the node with the highest resulting F measure. The F measure is the harmonic mean of precision and recall, and it has been previously proposed for decorating trees with a donor taxonomy
                  - superscript [ref=f219e688]:
                    - link "Reference 8" [ref=f219e689] [cursor=pointer]:
                      - /url: /articles/nbt.4229#ref-CR8
                      - text: "8"
                  - text: . Taxonomic stability was assessed as both the percentage of taxa identified as being monophyletic, operationally monophyletic or polyphyletic within a tree and the percentage of genomes in the tree with identical, unresolved or conflicting taxonomic assignments relative to the NCBI or GTDB taxonomies. Because a few incongruent genomes (resulting from phylogenetic incongruence, phylogenetic instability, chimeric artifacts or erroneous NCBI taxonomic assignments) are sufficient to cause a large number of polyphyletic taxa, we classified taxa with an F measure ≥0.95 as operationally monophyletic. The results were restricted to taxa containing two or more genomes, because taxa represented by a single genome are guaranteed to be monophyletic in a tree. Genomes in a tree with incongruent taxonomic assignments were classified as either (i) conflicting if the genome was assigned to a different taxon or (ii) unresolved if the taxon had no taxonomic label or multiple taxonomic labels at a specific taxonomic rank, one of which was the expected label (for example, a polyphyletic lineage spanning two or more genera, one of which is the expected genus for the genome).
                - heading "Comparison of GTDB to the NCBI and SILVA taxonomies." [level=3] [ref=f219e690]
                - paragraph [ref=f219e691]: GTDB and NCBI taxonomic assignments were compared across the 84,634 bacterial genomes comprising RefSeq/GenBank release 80. Assigned names at each taxonomic rank were classified as 'unchanged', 'passive' change or 'active' change. A taxon was classified as unchanged if its name was identical in both taxonomies; passively changed if the GTDB taxonomy provided name information absent in the NCBI taxonomy; or actively changed if the name was different between the two taxonomies. Because the GTDB taxonomy does not qualify taxon names as 'Candidatus' or 'candidate division', differences due solely to these designations were classified as unchanged. Taxa modified with alphabetical suffices to resolve identified polyphyly were treated as active changes, because such taxa should eventually be assigned new designations.
                - paragraph [ref=f219e692]: "Comparison to SILVA was performed in a similar fashion. The 12,435 16S rRNA genes identified within the 21,943 dereplicated genomes were associated with the SILVA v128 taxonomy according to sequence similarity with BLASTN. To ensure an accurate comparison, only the 11,178 16S rRNA genes with a match in SILVA of >99% identity and >95% alignment length were considered. SILVA does not specify a seven-rank taxonomy for all genes, and the 399 genes with fewer than seven specified taxa were removed from consideration to ensure that taxa at corresponding ranks were being compared. Differences due solely to a 'Candidatus', 'candidate division', 'uncultivated candidate division', 'sensu stricto', 'clade', 'cluster', 'sp.' or 'marine group' designations were classified as unchanged. Taxa containing any of the following designations were treated as missing taxonomic information and classified as a passive change: unknown, unidentified, uncultured, bacterium, metagenome, lineage, class, order, family, genus, subgroup, group, subsection, surface, env or incertae sedis. Taxa in SILVA with numerical suffixes used to designate polyphyly were considered unchanged if they matched a corresponding GTDB taxon with a different suffix also indicating polyphyly (for example, 'Spirochaeta 2' was considered unchanged with 'Spirochaeta_A')."
                - heading "Reporting Summary." [level=3] [ref=f219e693]
                - paragraph [ref=f219e694]: Further information on research design is available in the Nature Research Reporting Summary linked to this article.
                - heading "Code availability." [level=3] [ref=f219e695]
                - paragraph [ref=f219e696]:
                  - text: RED values were calculated with PhyloRank v0.0.27 (
                  - link "https://github.com/dparks1134/PhyloRank/" [ref=f219e697] [cursor=pointer]:
                    - /url: https://github.com/dparks1134/PhyloRank/
                  - text: ), which is freely available under the GNU General Public License v3.0.
                - heading "Data availability." [level=3] [ref=f219e698]
                - paragraph [ref=f219e699]:
                  - text: Data files for the GTDB taxonomy are available at
                  - link "http://gtdb.ecogenomic.org/" [ref=f219e700] [cursor=pointer]:
                    - /url: http://gtdb.ecogenomic.org/
                  - text: "and include: (i) flat file with the GTDB taxonomy defined for 94,759 genomes; (ii) bootstrapped bac120 tree in Newick format spanning the 21,943 dereplicated genomes and annotated with the GTDB taxonomy; (iii) FASTA files for each marker gene and the trimmed concatenated alignment; (iv) metadata for all genomes including NCBI, SILVA and Greengenes taxonomies, completeness and contamination estimates, assembly statistics (for example, N50) and genomic properties (for example, GC content and genome size); (v) FASTA file of 16S rRNA gene sequences identified within the 21,943 dereplicated genomes; and (vi) ARB database containing the bac120 tree. The 3,087 MAGs introduced in this study are available under BioProject"
                  - link "PRJNA417962" [ref=f219e701] [cursor=pointer]:
                    - /url: http://www.ncbi.nlm.nih.gov/bioproject/?term=PRJNA417962
                  - text: and on the GTDB website.
