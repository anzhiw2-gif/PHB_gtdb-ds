                - generic [ref=e571]:
                  - paragraph [ref=e573]:
                    - superscript [ref=e574]: a
                    - text: Catalytic domain type 1 (C1), catalytic domain type 2 (C2), threonine-rich region (Thr), fibronectin 3 domain (Fn3), Cadherin-like domain (Cad), substrate-binding domain type 1 (SBD1), substrate-binding domain type 2 (SBD2).
                  - paragraph [ref=e576]:
                    - superscript [ref=e577]: b
                    - text: Value from protein purified from recombinant E. coli. Empty spaces indicate that the parameter is not known.
                - paragraph
                - paragraph [ref=e578]:
                  - text: PHA-degrading bacteria differ in respect to the type of polyester they can degrade. Most characterized bacteria are specific to either dPHASCL or dPHAMCL. However, some bacteria reveal a rather broad polyester specificity and are able to utilize a large variety of polymers including PHASCL and PHAMCL (
                  - link "93" [ref=e580] [cursor=pointer]:
                    - /url: "#right-ref-b95"
                  - text: ). Such bacteria synthesize more than one PHA depolymerase, which differ in respect to the substrate specificity for PHASCL or PHAMCL.
                - paragraph [ref=e581]:
                  - text: The ability to degrade PHA is not restricted to bacteria, and many PHA-degrading fungi have been identified [(
                  - link "24" [ref=e583] [cursor=pointer]:
                    - /url: "#right-ref-b26"
                  - text: ","
                  - link "27" [ref=e585] [cursor=pointer]:
                    - /url: "#right-ref-b29"
                  - text: ) and references within (
                  - link "65" [ref=e587] [cursor=pointer]:
                    - /url: "#right-ref-b67"
                  - text: )]. In a comparative study 95 genera of fungi have been identified that include at least one species of a dPHASCL- or dPHAMCL-degrading fungus (
                  - link "74" [ref=e589] [cursor=pointer]:
                    - /url: "#right-ref-b76"
                  - text: ). Whether bacteria or fungi contribute more to the PHA-degrading activities in the environment is not known. Preliminary experiments using ciliates such as Paramecium caudatum indicated that accumulated PHA in food bacteria of ciliates can be utilized by ciliates (J. Gierlich & D. Jendrossek, unpublished results).
              - generic [ref=e590]:
                - text: Biochemical Properties of Extracellular dPHA Depolymerases
                - paragraph [ref=e591]:
                  - text: The microbial degradation of PHA proceeds by enzymatic surface erosion of the polymer to water-soluble monomers and/or oligomers. For a survey of electron-microscopical analysis of surface-eroded PHASCL and PHAMCL see (
                  - link "70" [ref=e593] [cursor=pointer]:
                    - /url: "#right-ref-b72"
                  - text: ","
                  - link "75" [ref=e595] [cursor=pointer]:
                    - /url: "#right-ref-b77"
                  - text: ). The e-dPHA depolymerases of many bacteria and several fungi have been purified and/or characterized [for details see
                  - link "Table 1" [ref=e597] [cursor=pointer]:
                    - /url: "#t1"
                  - text: in (
                  - link "42" [ref=e599] [cursor=pointer]:
                    - /url: "#right-ref-b44"
                  - text: ","
                  - link "43" [ref=e601] [cursor=pointer]:
                    - /url: "#right-ref-b45"
                  - text: ")]. Most e-dPHA depolymerases share several characteristics: (a) high stability at a wide range of pH, temperature, and ionic strength (as far as it has been tested e-dPHA depolymerases are highly resistant to and even active in solvents); (b) a relatively small M r (<70 kDa) with most depolymerases consisting of only one polypeptide; (c) alkaline pH optimum (7.5 to 9.8); (d) many dPHASCL depolymerases are inhibited by reducing agents and by serine hydrolase inhibitors such as diisopropyl-fluorophosphate (DFP) or acylsulfonylderivates; (e) most PHA depolymerases, as far as it has been tested, do not bind to anion exchangers such as DEAE (at neutral pH) but have a strong affinity to hydrophobic materials. Therefore, many purification protocols include a hydrophobic interaction chromatography step."
                - paragraph [ref=e602]:
                  - text: The most intensively studied PHA-degrading bacterium is Paucimonas [Pseudomonas] lemoignei (
                  - link "44" [ref=e604] [cursor=pointer]:
                    - /url: "#right-ref-b46"
                  - text: ). It belongs to the β-subclass of the Proteobacteria. P. lemoignei is unique among PHA-degrading bacteria because it synthesizes at least seven e-PHA depolymerases [PhaZ1 to PhaZ7 (see below)]. Six of them degrade dPHA and are therefore e-dPHA depolymerases. A seventh e-PHA depolymerase of P. lemoignei with specificity to amorphous PHB is described below. At present, the selection advantage for having as many as seven e-PHA depolymerases is not known. A cooperative effect on PHB hydrolysis in the presence of two or more PHB depolymerases with different substrate specificities and k M-values for different chain-length molecules might exist. The presence of several isoenzymes of a respective polymer hydrolase within a single degrading strain seems to be a common theme for the degradation of natural polymers such as cellulose or chitin.
                - paragraph [ref=e605]:
                  - text: All purified dPHA depolymerases are specific for either dPHASCL (EC 3.1.1.75) or dPHAMCL (EC 3.1.1.76). Even a dPHB depolymerase of Streptomyces exfoliatus K10, a strain that degrades both dPHB and dPHO, is specific for dPHASCL, indicating at least one additional depolymerase with specificity for dPHAMCL (
                  - link "55" [ref=e607] [cursor=pointer]:
                    - /url: "#right-ref-b57"
                  - text: "). Experiments with copolymers consisting of 3HB and 3-hydroxyhexanoate and Alcaligenes faecalis T1 dPHB depolymerase are in agreement with results obtained with dPHASCL and dPHAMCL: The depolymerase was not able to hydrolyze ester bonds between 3HB and 3-hydroxyhexanoate ("
                  - link "15" [ref=e609] [cursor=pointer]:
                    - /url: "#right-ref-b17"
                  - text: ). Several lipases are able to hydrolyze PHA if the polymer consists of ω-hydroxyalkanoic acids, i.e., if there are no side chains in the carbon backbone (
                  - link "40" [ref=e611] [cursor=pointer]:
                    - /url: "#right-ref-b42"
                  - text: ).
                - paragraph [ref=e612]:
                  - text: In contrast to most other bacterial dPHA depolymerases, the dPHB depolymerases of P. lemoignei and those of fungi are glycosylated. Glycosylation in P. lemoignei dPHB depolymerases is not well understood. Although several data indicate the presence of carbohydrate (discrepancy between experimentally determined and DNA-deduced M r, positive in periodic acid stain, proof of glucose and N-acetylglucosamine), all attempts to deglycosylate the purified enzyme by deglycosylases or by chemical means (trifluoromethansulfonic acid or alkali treatment) failed (
                  - link "5" [ref=e614] [cursor=pointer]:
                    - /url: "#right-ref-b5"
                  - text: ","
                  - link "9" [ref=e616] [cursor=pointer]:
                    - /url: "#right-ref-b9"
                  - text: ). It might be that the carbohydrate moiety becomes noncovalently attached to the depolymerase during secretion of the enzyme across the cell wall. The presence of carbohydrate is not essential for activity of P. lemoignei depolymerases because recombinant Escherichia coli or Bacillus subtilis strains harboring the corresponding depolymerase gene synthesized the nonglycosylated form of the enzyme but had almost the same specific activity. It is possible that glycosylation enhances the resistance of the exoenzyme to elevated temperature and/or to hydrolytic cleavage by proteases of competing microorganisms (
                  - link "9" [ref=e618] [cursor=pointer]:
                    - /url: "#right-ref-b9"
                  - text: ","
                  - link "46" [ref=e620] [cursor=pointer]:
                    - /url: "#right-ref-b48"
                  - text: ). PHB depolymerases apparently catalyze the reverse reaction, i.e., the synthesis of esters or transesterification if the reaction is performed in the absence of water (e.g., in solvents) (
                  - link "59" [ref=e622] [cursor=pointer]:
                    - /url: "#right-ref-b61"
                  - text: ","
                  - link "105" [ref=e624] [cursor=pointer]:
                    - /url: "#right-ref-b107"
                  - text: ).
              - generic [ref=e625]:
                - generic [ref=e626]: Molecular Biology and Functional Analysis of dPHASCL Depolymerases
                - paragraph [ref=e627]:
                  - text: Twenty genes for extracellular bacterial dPHA depolymerases (phaZ) have been cloned and analyzed since 1989 (
                  - link "Table 1" [ref=e629] [cursor=pointer]:
                    - /url: "#t1"
                  - text: "): Acidovorax sp. ("
                  - link "58" [ref=e631] [cursor=pointer]:
                    - /url: "#right-ref-b60"
                  - text: ), A. faecalis (strains AE122 and T1) (
                  - link "54" [ref=e633] [cursor=pointer]:
                    - /url: "#right-ref-b56"
                  - text: ","
                  - link "76" [ref=e635] [cursor=pointer]:
                    - /url: "#right-ref-b78"
                  - text: ","
                  - link "87" [ref=e637] [cursor=pointer]:
                    - /url: "#right-ref-b89"
                  - text: ), Delftia (Comamonas) acidovorans strain YM1069 (
                  - link "50" [ref=e639] [cursor=pointer]:
                    - /url: "#right-ref-b52"
                  - text: ), Comamonas testosteroni (
                  - link "97" [ref=e641] [cursor=pointer]:
                    - /url: "#right-ref-b99"
                  - text: ), Comamonas sp. (
                  - link "45" [ref=e643] [cursor=pointer]:
                    - /url: "#right-ref-b47"
                  - text: ), Leptothrix sp. strain HS (
                  - link "107" [ref=e645] [cursor=pointer]:
                    - /url: "#right-ref-b109"
                  - text: ), Pseudomonas sp. strain GM101 (acession no. AF293347), P. fluorescens strain GK13 (
                  - link "49" [ref=e647] [cursor=pointer]:
                    - /url: "#right-ref-b51"
                  - text: ","
                  - link "91" [ref=e649] [cursor=pointer]:
                    - /url: "#right-ref-b93"
                  - text: ","
                  - link "93" [ref=e651] [cursor=pointer]:
                    - /url: "#right-ref-b95"
                  - text: ), P. lemoignei (six genes) (
                  - link "9" [ref=e653] [cursor=pointer]:
                    - /url: "#right-ref-b9"
                  - text: ","
                  - link "46" [ref=e655] [cursor=pointer]:
                    - /url: "#right-ref-b48"
                  - text: ","
                  - link "48" [ref=e657] [cursor=pointer]:
                    - /url: "#right-ref-b50"
                  - text: ","
                  - link "94" [ref=e659] [cursor=pointer]:
                    - /url: "#right-ref-b96"
                  - text: ), P. stutzeri (
                  - link "79" [ref=e661] [cursor=pointer]:
                    - /url: "#right-ref-b81"
                  - text: ), R. pickettii (strains A1 and K1, acession no. JO4223, D25315), S. exfoliatus K10 (
                  - link "55" [ref=e663] [cursor=pointer]:
                    - /url: "#right-ref-b57"
                  - text: ), and Streptomyces hygroscopicus (
                  - link "112" [ref=e665] [cursor=pointer]:
                    - /url: "#right-ref-b114"
                  - text: ). Nineteen genes coded for depolymerases with specificity for only PHASCL, especially dPHB. Some of these depolymerase proteins have significant activity with denatured poly(3-hydroxyvalerate) (dPHV) homopolyester (PhaZ6 > PhaZ1 > PhaZ2, all from P. lemoignei), but none of them have significant activity with dPHAMCL. In contrast, the P. fluorescens dPHO depolymerase is specific for dPHO and related dPHAMCL (see below). The dPHO depolymerase is completely inactive with dPHASCL. In conclusion, dPHA depolymerases are highly specific with respect to the length of the monomer carbon side chain of the PHA substrate.
                - paragraph [ref=e666]:
                  - text: All dPHASCL depolymerase proteins have a composite domain structure (
                  - link "Figure 3" [ref=e668] [cursor=pointer]:
                    - /url: "#f3"
                  - text: ) (
                  - link "Table 1" [ref=e670] [cursor=pointer]:
                    - /url: "#t1"
                  - text: ) and consist of
                - paragraph
                - list [ref=e671]:
                  - listitem [ref=e672]: 1. A 22-to-58 amino acid–long signal peptide. The signal peptide is necessary for secretion of the polypetide across the cytoplasmic membrane and is cleaved off during the secretion process by signal peptidases.
                  - listitem [ref=e673]:
                    - text: 2. A large catalytic domain at the N terminus of the mature protein. Three strictly conserved amino acids, serine, aspartate, and histidine, constitute the active center of the catalytic domain. The serine is part of a lipase-box pentapeptide Gly-Xaa1-Ser-Xaa2-Gly, which is present in almost all known serine hydrolases such as lipases, esterases, and serine proteases [for reviews on lipases see (
                    - link "38" [ref=e675] [cursor=pointer]:
                      - /url: "#right-ref-b40"
                    - text: ","
                    - link "39" [ref=e677] [cursor=pointer]:
                      - /url: "#right-ref-b41"
                    - text: )]. Site-directed mutagenesis of the lipase-box amino acids from two PHASCL and one PHAMCl depolymerase resulted in inactive proteins and confirmed the requirement of the catalytic triad amino acids for activity (
                    - link "76" [ref=e679] [cursor=pointer]:
                      - /url: "#right-ref-b78"
                    - text: ","
                    - link "93" [ref=e681] [cursor=pointer]:
                      - /url: "#right-ref-b95"
                    - text: ","
                    - link "96" [ref=e683] [cursor=pointer]:
                      - /url: "#right-ref-b98"
                    - text: ","
                    - link "105" [ref=e685] [cursor=pointer]:
                      - /url: "#right-ref-b107"
                    - text: ). A second histidine residue is also conserved in dPHB depolymerases (
                    - link "Figure 3" [ref=e687] [cursor=pointer]:
                      - /url: "#f3"
                    - text: ). The region around this histidine resembles the oxyanion hole known from lipases [see references within (
                    - link "39" [ref=e689] [cursor=pointer]:
                      - /url: "#right-ref-b41"
                    - text: ")]. The oxyanion amino acid stabilizes the transient state of the hydrolysis reaction by allowing the formation of a hydrogen bridge from the histidine peptide bond to the negatively charged enzyme-bound tetrahedral intermediate (oxyanion). Two types of catalytic domains can be differentiated by the arrangement of the catalytic active amino acids within the primary amino acid sequence: In many PHA depolymerases and lipases the sequential order is histidine (oxyanion)-serine-aspartate-histidine (type 1,"
                    - link "Figure 3" [ref=e691] [cursor=pointer]:
                      - /url: "#f3"
                    - text: ) (supplemental Figure 1A; follow the Supplemental Material link on the Annual Reviews homepage at
                    - link "http://www.annualreviews.org/" [ref=e692] [cursor=pointer]:
                      - /url: http://arjournals.annualreviews.org/doi/suppl/10.1146/annurev.micro.56.012302.160838
                    - text: ). In S. exfoliatus and in several Comamonas and Leptothrix species, the depolymerases have the putative histidine (oxyanion) C-terminal of the catalytic triad (type 2,
                    - link "Figure 3" [ref=e694] [cursor=pointer]:
                      - /url: "#f3"
                    - text: ) (supplemental Figure 1B; follow the Supplemental Material link on the Annual Reviews homepage at
                    - link "http://www.annualreviews.org/" [ref=e695] [cursor=pointer]:
                      - /url: http://arjournals.annualreviews.org/doi/suppl/10.1146/annurev.micro.56.012302.160838
                    - text: ), and the sequential order is serine-aspartate-histidine-histidine (oxyanion). This indicates a different primary structure of the protein.
                  - listitem [ref=e696]:
                    - text: 3. A linking domain that links the catalytic domain to the C-terminal domain. The function of the linking region between the catalytic and the C-terminal domain in PHASCL depolymerases is unknown. In five dPHB depolymerases, namely PhaZ1, PhaZ2, PhaZ3, PhaZ5, and PhaZ6 of P. lemoignei, this region consists of about 40 amino acids with repeating clusters of two to six threonine residues. This threonine (Thr)-rich region is replaced by a fibronectin type III (Fn3) fingerprint in PhaZ4 of P. lemoignei and in most other sequenced dPHASCL depolymerases. Fn3-sequences have been described for many eukaryotic extracellular matrix proteins and in several prokaryotic polymer-hydrolyzing proteins such as chitinases, cellulases, and several glucoamylases (
                    - link "61" [ref=e698] [cursor=pointer]:
                      - /url: "#right-ref-b63"
                    - text: ). The Fn3-sequence of the Bacillus circulans chitinase is not essential for activity (
                    - link "111" [ref=e700] [cursor=pointer]:
                      - /url: "#right-ref-b113"
                    - text: ). However, the Fn3-domain of the A. faecalis dPHB depolymerase was essential because its deletion resulted in a protein that had lost the depolymerase activity but not the 3HB dimer hydrolase activity (
                    - link "76" [ref=e702] [cursor=pointer]:
                      - /url: "#right-ref-b78"
                    - text: ). Interestingly, the Fn3-domain of the A. faecalis depolymerase could be functionally replaced by a Thr-rich region of the dPHB depolymerase A (PhaZ5) of P. lemoignei. These findings support the hypothesis that Fn3-sequences and/or the Thr-rich regions are necessary to provide a proper distance (linker) between the substrate-binding domain (SBD) and the catalytic center of the protein, but the nature of this linker appears to be less important. Recently, a third type of linker consisting of an ∼100–amino acid–long cadherin-like sequence (Cad) has been described for the dPHB depolymerase of P. stutzeri (
                    - link "79" [ref=e704] [cursor=pointer]:
                      - /url: "#right-ref-b81"
                    - text: ). Cad sequences have also been found in other polymer hydrolases, e.g., in chitinases.
                  - listitem [ref=e705]:
                    - text: 4. C-terminal SBD dPHASCL depolymerases bind to dPHA-granules. The C-terminal domains of the depolymerases (40 to 60 amino acids) (
                    - link "Figure 3" [ref=e707] [cursor=pointer]:
                      - /url: "#f3"
                    - text: ) are responsible for this ability and constitute a SBD. The SBD apparently has some specificity for PHA because dPHB depolymerases do not bind to chitin or to (crystalline) cellulose (
                    - link "6" [ref=e709] [cursor=pointer]:
                      - /url: "#right-ref-b6"
                    - text: ","
                    - link "51" [ref=e711] [cursor=pointer]:
                      - /url: "#right-ref-b53"
                    - text: ","
                    - link "79" [ref=e713] [cursor=pointer]:
                      - /url: "#right-ref-b81"
                    - text: ). The dPHB-binding ability can be used for affinity purification of dPHA depolymerases. The dPHB-binding ability is lost in proteins that lack the C-terminal domain (60 amino acids), and these truncated enzymes do not hydrolyze dPHB anymore. However, the ability to hydrolyze soluble esters (e.g., p-nitrophenylesters) is unaffected (
                    - link "6" [ref=e715] [cursor=pointer]:
                      - /url: "#right-ref-b6"
                    - text: ","
                    - link "7" [ref=e717] [cursor=pointer]:
                      - /url: "#right-ref-b7"
                    - text: ","
                    - link "22" [ref=e719] [cursor=pointer]:
                      - /url: "#right-ref-b24"
                    - text: ","
                    - link "34" [ref=e721] [cursor=pointer]:
                      - /url: "#right-ref-b36"
                    - text: ","
                    - link "76" [ref=e723] [cursor=pointer]:
                      - /url: "#right-ref-b78"
                    - text: ). Obviously SBD is responsible and sufficient for dPHB binding. The function of SBD for binding the water-insoluble substrate was confirmed by analysis of fusion proteins consisting of the maltose-binding protein MalE or the glutathione-S-transferase (GST) with SBD (
                    - link "7" [ref=e725] [cursor=pointer]:
                      - /url: "#right-ref-b7"
                    - text: ","
                    - link "50" [ref=e727] [cursor=pointer]:
                      - /url: "#right-ref-b52"
                    - text: ","
                    - link "51" [ref=e729] [cursor=pointer]:
                      - /url: "#right-ref-b53"
                    - text: ","
                    - link "79" [ref=e731] [cursor=pointer]:
                      - /url: "#right-ref-b81"
                    - text: ","
                    - link "97" [ref=e733] [cursor=pointer]:
                      - /url: "#right-ref-b99"
                    - text: ). The fusion proteins were able to bind specifically to dPHA in all cases. Recently, the dPHB depolymerase sequences of A. faecalis AE122, P. stutzeri, and Pseudomonas sp. GM101 (the latter being identical to the P. stutzeri depolymerase), which contain two instead of only one dPHB-binding domains were published (
                    - link "54" [ref=e735] [cursor=pointer]:
                      - /url: "#right-ref-b56"
                    - text: ","
                    - link "79" [ref=e737] [cursor=pointer]:
                      - /url: "#right-ref-b81"
                    - text: ).
