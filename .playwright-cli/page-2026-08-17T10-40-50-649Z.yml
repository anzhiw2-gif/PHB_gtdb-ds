                  - link "Fig. 5B" [ref=e600] [cursor=pointer]:
                    - /url: "#F5"
                  - text: ), and the final pH of the solution was 5.0 to 6.0, in contrast to the initial pH of 7.0. Changes in pH indicated that some acidic materials were produced in the solution. The analysis of the peak spectrum of the HPLC assay results revealed a small peak at 16 min (
                  - link "Fig. 5A" [ref=e601] [cursor=pointer]:
                    - /url: "#F5"
                  - text: ), which may represent the 3HV monomer (
                  - link "33" [ref=e602] [cursor=pointer]:
                    - /url: "#core-collateral-B33"
                  - text: ). This result confirmed that PhaZh1 hydrolyzed the nPHA granules isolated from H. mediterranei and that the main product was 3HB monomer.
