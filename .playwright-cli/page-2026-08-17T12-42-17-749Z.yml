            - generic [ref=f1e346]:
              - generic [ref=f1e347]:
                - generic [ref=f1e348]:
                  - heading "Introduction" [level=2] [ref=f1e349]
                  - generic [ref=f1e350]:
                    - text: Polyhydroxyalkanoates (PHAs) are a class of aliphatic microbial polyesters produced by a variety of microorganisms as a carbon and energy-storage material.
                    - link [ref=f1e351] [cursor=pointer]:
                      - /url: "#bib1"
                      - superscript [ref=f1e354]: "1"
                    - text: The most commonly occurring PHA is polyhydroxybutyrate (PHB), which is comprised of condensed (
                    - emphasis [ref=f1e355]: R
                    - text: )-3-hydroxybutyrate (R3HB) monomers. Secondary monomers can be incorporated into PHA, by varying the carbon source that is fed to the PHB-producing bacteria, by regulating genes involved in PHB biosynthesis, or by introducing a gene that affects a PHB biosynthetic pathway.
                    - link [ref=f1e356] [cursor=pointer]:
                      - /url: "#bib2"
                      - superscript [ref=f1e359]: "2"
                    - text: PHAs have attracted commercial and academic interest, because they can be produced from renewable resources such as sugars and plant oils, and because the incorporation of secondary monomers affects the mechanical properties of the polymer, which can vary from thermoplastic to elastomer.
                    - link [ref=f1e360] [cursor=pointer]:
                      - /url: "#bib3"
                      - superscript [ref=f1e363]: "3"
                    - text: Recent studies have focused on the elucidation of the mechanisms of PHA biodegradation and biosynthesis as well as production of new biodegradable polyesters.
                    - link "2" [ref=f1e364] [cursor=pointer]:
                      - /url: "#bib2"
                    - text: ","
                    - link "4" [ref=f1e366] [cursor=pointer]:
                      - /url: "#bib4"
                    - text: ","
                    - link "5" [ref=f1e368] [cursor=pointer]:
                      - /url: "#bib5"
                  - generic [ref=f1e370]:
                    - text: PHB is degraded by specific hydrolyzing enzymes, extracellular and intracellular PHB depolymerases (EC 3.1.1.75).
                    - link "6" [ref=f1e371] [cursor=pointer]:
                      - /url: "#bib6"
                    - text: ","
                    - link "7" [ref=f1e373] [cursor=pointer]:
                      - /url: "#bib7"
                    - text: "Extracellular depolymerases are able to degrade partially crystallized (denatured) PHB, whereas intracellular depolymerases act on amorphous (native) PHB. Extracellular PHB depolymerases are typically comprised of three functional domains: a catalytic (320–400 aa), a linker (50–100 aa), and a substrate-binding (40–60 aa) domain. The catalytic domain contains a lipase-like catalytic triad (serine, aspartic acid, and histidine residues), as well as a signature sequence of a pentapeptide [Gly-Xaa-Ser-Xaa-Gly] (where Xaa denotes any amino acid residue), known as the lipase box."
                    - link [ref=f1e375] [cursor=pointer]:
                      - /url: "#bib6"
                      - superscript [ref=f1e378]: "6"
                    - text: Two types of catalytic domains have been identified, based on the position of the lipase box. In the type I domain, the lipase box is located in the middle of the primary structure, and in the type II domain, it is located at the amino terminus of the structure. The substrate-binding domain is responsible for the adsorption of the enzyme to the surface of the polymer, which permits the catalytic domain to interact with polymer chains, thus catalyzing their efficient hydrolysis.
                    - link "8" [ref=f1e379] [cursor=pointer]:
                      - /url: "#bib8"
                    - text: ","
                    - link "9" [ref=f1e381] [cursor=pointer]:
                      - /url: "#bib9"
                    - text: It has recently been proposed that the substrate-binding domain has an additional and more active function of disrupting the structure of the polymer.
                    - link "10" [ref=f1e383] [cursor=pointer]:
                      - /url: "#bib10"
                    - text: ","
                    - link "11" [ref=f1e385] [cursor=pointer]:
                      - /url: "#bib11"
                    - text: ","
                    - link "12" [ref=f1e387] [cursor=pointer]:
                      - /url: "#bib12"
                    - text: The role of the linker domain is not clearly understood, but it may function as a spacer that introduces a flexible region between the catalytic and substrate-binding domains to increase the hydrolytic efficiency of the catalytic domain.
                    - link [ref=f1e389] [cursor=pointer]:
                      - /url: "#bib13"
                      - superscript [ref=f1e392]: "13"
                    - text: A recent study of a homologous protein to the linker domain, the fibronectin type III homology domain of cellobiohydrolase ChbA of
                    - emphasis [ref=f1e393]: Clostridium thermocellum
                    - text: ", indicates that the linker domain may also exhibit a disruptive function against crystalline substrates, analogous to the substrate-binding domain."
                    - link [ref=f1e394] [cursor=pointer]:
                      - /url: "#bib14"
                      - superscript [ref=f1e397]: "14"
                    - text: The substrate-binding and linker domains are divided into two and three types, respectively, based on sequence similarity. Since these three functional domains are essential for the enzymatic degradation of water-insoluble polymers,
                    - link [ref=f1e398] [cursor=pointer]:
                      - /url: "#bib13"
                      - superscript [ref=f1e401]: "13"
                    - text: "it has been proposed that the degradation of the crystalline region of the polymer should proceed in three steps: adsorption of the enzyme to the polymer, non-hydrolytic disruption of the structure of the polymer, and hydrolysis."
                    - link "10" [ref=f1e402] [cursor=pointer]:
                      - /url: "#bib10"
                    - text: ","
                    - link "12" [ref=f1e404] [cursor=pointer]:
                      - /url: "#bib12"
                    - text: ","
                    - link "15" [ref=f1e406] [cursor=pointer]:
                      - /url: "#bib15"
                    - text: ","
                    - link "16" [ref=f1e408] [cursor=pointer]:
                      - /url: "#bib16"
                    - text: ","
                    - link "17" [ref=f1e410] [cursor=pointer]:
                      - /url: "#bib17"
                  - generic [ref=f1e412]:
                    - text: An extracellular PHB depolymerase from
                    - emphasis [ref=f1e413]: Penicillium funiculosum
                    - text: has been purified and characterized.
                    - link "18" [ref=f1e414] [cursor=pointer]:
                      - /url: "#bib18"
                    - text: ","
                    - link "19" [ref=f1e416] [cursor=pointer]:
                      - /url: "#bib19"
                    - text: It has a molecular mass of about 33,000, and is the smallest of the known extracellular depolymerases, typically ranging from 40,000 to 57,000.
                    - link [ref=f1e418] [cursor=pointer]:
                      - /url: "#bib6"
                      - superscript [ref=f1e421]: "6"
                    - text: It efficiently degrades PHB and a trimer of R3HB, although the degradation of PHB is less efficient by two orders of magnitude than a multi-domain enzyme from
                    - emphasis [ref=f1e422]: Ralstonia pickettii
                    - text: .
                    - link [ref=f1e423] [cursor=pointer]:
                      - /url: "#bib19"
                      - superscript [ref=f1e426]: "19"
                    - text: Furthermore, when the enzyme is inactivated by the inhibitor diisopropylfluorophosphate, it still retains the ability to bind reversibly to PHB.
                    - link [ref=f1e427] [cursor=pointer]:
                      - /url: "#bib19"
                      - superscript [ref=f1e430]: "19"
                    - text: The issue of how depolymerases recognize a PHB chain with an intrinsically hydrophobic nature, as well as how such a small depolymerase effectively interacts with PHB, is of considerable interest.
                  - generic [ref=f1e431]:
                    - text: Here we report on the crystal structure of the PHB depolymerase from
                    - emphasis [ref=f1e432]: P. funiculosum
                    - text: at a resolution of 1.71 Å. The results show a single domain structure with a circularly permuted variant of the α/β hydrolase fold. Furthermore, we determined the structure of the S39A mutant–R3HB trimer methyl ester (H(R3HB)
                    - subscript [ref=f1e433]: "3"
                    - text: M) substrate complex at a resolution of 1.66 Å, and reveal the binding mode for a trimer substrate. Solvent-exposed hydrophobic residues are aligned flat on the surface of the enzyme, serving as a polymer-adsorption site.
                - generic [ref=f1e434]:
                  - heading "Results and Discussion" [level=2] [ref=f1e435]
                  - generic [ref=f1e436]:
                    - heading "Overall structure" [level=3] [ref=f1e437]
                    - generic [ref=f1e438]:
                      - generic [ref=f1e439]:
                        - text: The crystal structure of the wild-type PHB depolymerase was determined at a resolution of 1.71 Å with the crystallographic
                        - emphasis [ref=f1e440]: R
                        - text: and free-
                        - emphasis [ref=f1e441]: R
                        - text: factors of 19.0% and 22.1%, respectively. The shape of the molecule is globular with approximate dimensions of 52 Å×48 Å×41 Å, showing that the enzyme is comprised of a single domain. The enzyme represents an α/β-type structure (
                        - link "Figure 1" [ref=f1e442] [cursor=pointer]:
                          - /url: "#fig1"
                        - text: ). It consists of an eight-stranded β-sheet composed of seven parallel and one antiparallel β-strands, nine α-helices surrounding the β-sheet, two concomitant two-stranded antiparallel β-sheets, and six 3
                        - subscript [ref=f1e444]: "10"
                        - text: "-helices ("
                        - link "Figure 2" [ref=f1e445] [cursor=pointer]:
                          - /url: "#fig2"
                        - text: ","
                        - link "Figure 3" [ref=f1e447] [cursor=pointer]:
                          - /url: "#fig3"
                        - text: ). Four disulfide bridges, between Cys70–Cys79, Cys169–Cys180, Cys234–Cys241, and Cys250–Cys304 were identified. The topology of the secondary structure resembles that of the α/β hydrolase fold
                        - link [ref=f1e449] [cursor=pointer]:
                          - /url: "#bib20"
                          - superscript [ref=f1e452]: "20"
                        - text: (
                        - link "Figure 2" [ref=f1e453] [cursor=pointer]:
                          - /url: "#fig2"
                        - text: ). A remarkable feature is that its polypeptide linkage is circularly permuted
                        - link [ref=f1e455] [cursor=pointer]:
                          - /url: "#bib21"
                          - superscript [ref=f1e458]: "21"
                        - text: in comparison with that of the α/β hydrolase fold, that is, the positions of the N and C termini of the depolymerase are different from those of the canonical α/β hydrolase fold. A sequence analysis indicated that the enzyme can be classified as having a type II catalytic domain (K. K.
                        - emphasis [ref=f1e459]: et al
                        - text: ., unpublished data). In the type II depolymerase structure, the location of the nucleophilic serine residue in the lipase box pentapeptide at the N-terminal region of the protein results in discontinuity of the polypeptide linkage in the middle of the central β-sheet, whereas in the canonical α/β hydrolase fold, the polypeptide linkage is continued from one edge to the other edge of the β-sheet. This is the first observation of a circularly permuted α/β hydrolase fold. This finding reveals an interesting relationship between the two types of catalytic domains, which are not apparently similar, with respect to the primary structure. In fact, a comparison of the amino acid sequences of the type I enzymes with a modified sequence of
                        - emphasis [ref=f1e460]: P. funiculosum
                        - text: enzyme in which the circular permutation is cancelled so that Ser205 becomes an N-terminal residue show about a 28% homology (
                        - link "Figure 3" [ref=f1e461] [cursor=pointer]:
                          - /url: "#fig3"
                        - text: (b)). Thus, both type I and II enzymes are related by an unexpected evolutionary relationship, that is, the type II depolymerase could have been derived from the type I enzyme, probably by gene duplication.
                        - link [ref=f1e463] [cursor=pointer]:
                          - /url: "#bib22"
                          - superscript [ref=f1e466]: "22"
                        - text: Therefore, it is very likely that the structure of the type I catalytic domain resembles that of the
                        - emphasis [ref=f1e467]: P. funiculosum
                        - text: enzyme, and exhibits an α/β hydrolase fold. A structural comparison using DALI
                        - link [ref=f1e468] [cursor=pointer]:
                          - /url: "#bib23"
                          - superscript [ref=f1e471]: "23"
                        - text: resulted in a number of α/β hydrolase fold enzymes, including carboxylesterase from
                        - emphasis [ref=f1e472]: Pseudomonas fluorescens
                        - link [ref=f1e473] [cursor=pointer]:
                          - /url: "#bib24"
                          - superscript [ref=f1e476]: "24"
                        - text: with the highest similarity of
                        - emphasis [ref=f1e477]: Z
                        - text: =18.6. However, PHB depolymerase is largely different from these structural homologs in regions between β2 and α2, β3 and α3, and β10 and α9, which contribute to the substrate-binding and the polymer-adsorption sites of the depolymerase (see below).
