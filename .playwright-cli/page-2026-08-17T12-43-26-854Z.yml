                  - heading "PHA Diversity and the PHAome" [level=2] [ref=f1e212]
                  - generic [ref=f1e213]:
                    - text: Poly-
                    - emphasis [ref=f1e214]: R
                    - text: "-3-hydroxybutyrate (PHB) was the first PHA family member reported"
                    - link "[1]" [ref=f1e215] [cursor=pointer]:
                      - /url: "#bib0210"
                    - text: . Thereafter, medium chain-length (mcl) PHA containing 3-hydroxyhexanoate (3HHx), 3-hydroxyoctanoate (3HO), 3-hydroxydecanoate (3HD), and 3-hydroxydodecanoate (3HDD) were found to be synthesized by
                    - emphasis [ref=f1e217]: Pseudomonas oleovorans
                    - link "[2]" [ref=f1e218] [cursor=pointer]:
                      - /url: "#bib0400"
                    - text: . In 1995, already 91 different hydroxyalkanoic acids had been reported as monomers of PHA
                    - link "[3]" [ref=f1e220] [cursor=pointer]:
                      - /url: "#bib0215"
                    - text: . Graft polymers were also obtained, which make additional PHAs obtainable using combinatorial methods in practically endless variations
                    - link "[4]" [ref=f1e222] [cursor=pointer]:
                      - /url: "#bib0220"
                    - text: .
                  - generic [ref=f1e224]:
                    - text: More than 30 years have elapsed since Witholt first discovered and described mcl PHA diversity
                    - link "[5]" [ref=f1e225] [cursor=pointer]:
                      - /url: "#bib0225"
                    - text: . PHA diversity has been further expanded to include microstructures of the PHA polymer chains, such as homopolymers, random copolymers, block copolymers, block-random copolymers, functional polymers, graft polymers, thiopolyesters, rare PHAs, and diversified molecular weights including oligomers or ultrahigh molecular weight polymers and similar
                    - link "[6]" [ref=f1e227] [cursor=pointer]:
                      - /url: "#bib0230"
                    - text: .
                  - generic [ref=f1e229]:
                    - generic [ref=f1e230]:
                      - text: It has become possible to precisely design and obtain PHA homopolymers, random, and block PHA copolymers or functional and graft PHA polymers using β-oxidation-deleted strains of
                      - emphasis [ref=f1e231]: Pseudomonas putida
                      - text: or
                      - emphasis [ref=f1e232]: P. entomophila
                      - text: (
                      - link "7" [ref=f1e233] [cursor=pointer]:
                        - /url: "#bib0235"
                      - text: ","
                      - link "8" [ref=f1e235] [cursor=pointer]:
                        - /url: "#bib0240"
                      - text: ","
                      - link "9" [ref=f1e237] [cursor=pointer]:
                        - /url: "#bib0245"
                      - text: ","
                      - link "10" [ref=f1e239] [cursor=pointer]:
                        - /url: "#bib0405"
                      - text: ","
                      - link "11" [ref=f1e241] [cursor=pointer]:
                        - /url: "#bib0250"
                      - text: ","
                      - link "12" [ref=f1e243] [cursor=pointer]:
                        - /url: "#bib0255"
                      - text: and A.L. Chung, PhD Thesis, Tsinghua University, 2013). PHA research and development is thus entering an era of ‘designs based on demands’, especially block copolymerization, which provides another diverse platform for PHA structure–property modulation. Blocks can vary in block length, block order, and the number of different discreet block types. Furthermore, blocks may consist of homopolymers, random copolymers, and graft polymers (
                      - link "Table 1" [ref=f1e245] [cursor=pointer]:
                        - /url: "#tbl0005"
                      - text: ), enabling a wide range of choices of materials for particular applications. Several concepts have been used to describe the diversity in biological systems, including genome, proteome, transcriptome, and metabolome, that describe all DNA genetic materials (or RNA in RNA viruses) of an organism, the entire set of proteins expressed by a genome, cell, tissue or organism at a given time, the set of all RNA molecules, including mRNA, rRNA, tRNA, and other non-coding RNAs transcribed in one cell or a population of cells, and the complete set of small-molecule chemicals found within a biological sample, respectively. The diversity of microbial PHAs can be similarly described as the microbial ‘PHAome’. Accordingly, the study of the entirety of diverse PHAs may be called ‘PHAomics’ (
                      - link "Figure 1" [ref=f1e247] [cursor=pointer]:
                        - /url: "#fig0005"
                      - text: ).
