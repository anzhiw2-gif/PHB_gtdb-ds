                      - paragraph [ref=f1e411]: "Fig. 2. Biodegradation of biopolymers: aerobic vs anaerobic degradation. Dark green symbols represent the microorganisms involved in the processes. (For interpretation of the references to colour in this figure legend, the reader is referred to the web version of this article.)"
                - generic [ref=f1e412]:
                  - heading "3.2. Aerobic and anaerobic degradation" [level=3] [ref=f1e413]
                  - generic [ref=f1e414]:
                    - text: Aerobic biodegradation usually means composting within industrial composting conditions. In a high-oxygen environment (not less than 6%) (
                    - link "Kale et al., 2007" [ref=f1e415] [cursor=pointer]:
                      - /url: "#b0110"
                    - text: ), microorganisms utilize the polymer as a carbon and energy source and produce carbon dioxide and water as the main degradation by-products in addition to the remaining part, which is called compost (Eq.
                    - link "(1)" [ref=f1e417] [cursor=pointer]:
                      - /url: "#e0005"
                    - text: ). Industrially composting is performed in a warm (approximately 60–70 °C) and moist (approximately 60%) environment under controlled conditions (∼ pH 8.5) (
                    - link "Mohee et al., 2008" [ref=f1e419] [cursor=pointer]:
                      - /url: "#b0165"
                    - text: "):"
                    - generic [ref=f1e422]:
                      - generic [ref=f1e423]: (1)
                      - generic [ref=f1e424]:
                        - text: Organic matter + S + O
                        - subscript [ref=f1e425]: "2"
                        - text: → CO
                        - subscript [ref=f1e426]: "2"
                        - text: + H
                        - subscript [ref=f1e427]: "2"
                        - text: O + NO
                        - subscript [ref=f1e428]: "2"
                        - text: + SO
                        - subscript [ref=f1e429]: "2"
                        - text: + Heat + Compost
                  - generic [ref=f1e430]:
                    - text: Anaerobic biodegradation usually means anaerobic digestion in oxygen-free conditions in mesophilic (37 °C) or thermophilic (55 °C) biogas plants. In the absence of oxygen, the organic matter is converted to methane gas, carbon dioxide, water, hydrogen sulphide, ammonia and hydrogen, which results in a sequence of metabolic interactions by different groups of microorganisms (
                    - link "Mohee et al., 2008" [ref=f1e431] [cursor=pointer]:
                      - /url: "#b0165"
                    - text: ). The remaining part is called the digestate residue (Eq.
                    - link "(2)" [ref=f1e433] [cursor=pointer]:
                      - /url: "#e0010"
                    - text: "):"
                    - generic [ref=f1e436]:
                      - generic [ref=f1e437]: (2)
                      - generic [ref=f1e438]:
                        - text: Organic matter + H
                        - subscript [ref=f1e439]: "2"
                        - text: O + Nutrients → Digestate residue + CO
                        - subscript [ref=f1e440]: "2"
                        - text: + CH
                        - subscript [ref=f1e441]: "4"
                        - text: + NH
                        - subscript [ref=f1e442]: "3"
                        - text: + H
                        - subscript [ref=f1e443]: "2"
                        - text: S + Less heat
                  - generic [ref=f1e444]:
                    - text: The energy stored in organic matter is released in the form of heat during aerobic degradation, and it requires continuous turning of the biomass to release some of this heat for a healthy microbial community. This heat is lost and cannot be captured. On the contrary, in anaerobic degradation, the energy stored in organic matter is mainly released as methane, and due to the lack of oxygen in the process, less heat and less microbial biomass are produced (
                    - link "Fig. 2" [ref=f1e445] [cursor=pointer]:
                      - /url: "#f0010"
                    - text: ).
              - generic [ref=f1e447]:
                - heading "4. Biodegradation of bioplastics under anaerobic conditions" [level=2] [ref=f1e448]
                - generic [ref=f1e449]:
                  - text: Extensive reviews of the various microbial communities are mostly focused on aerobic degradation of plastics and are available in the literature (
                  - link "Shah et al., 2008" [ref=f1e450] [cursor=pointer]:
                    - /url: "#b0220"
                  - text: ","
                  - link "Shimao, 2001" [ref=f1e452] [cursor=pointer]:
                    - /url: "#b0225"
                  - text: ). In addition to the nature of the polymeric substance, the biological degradation of polymers is usually influenced by the kind of microorganism involved in the biodegradation process. If the biodegradation process aims to produce methane gas, a mixture of cultures obtained from active biogas plants are used for the degradation tests. A summary of anaerobic degradation of various bioplastics is presented here.
                - generic [ref=f1e454]:
                  - heading "4.1. Poly(hydroxyalkanoate)s" [level=3] [ref=f1e455]
                  - generic [ref=f1e456]:
                    - text: Poly(hydroxyalkanoate)s (PHAs) are a class of polyesters that accumulate in bacterial and archaeal (
                    - link "Koller et al., 2017" [ref=f1e457] [cursor=pointer]:
                      - /url: "#b0115"
                    - text: ","
                    - link "Kourmentza et al., 2017" [ref=f1e459] [cursor=pointer]:
                      - /url: "#b0125"
                    - text: ) cells through fermentation of sugars and lipids as energy and carbon storage compounds (
                    - link "Lu et al., 2009" [ref=f1e461] [cursor=pointer]:
                      - /url: "#b0135"
                    - text: ). Poly(3-hydroxybutyrate) (P3HB) or commonly known as poly(hydroxybutyrate) (PHB) belongs to the PHA class. Other polymers that belong to the PHA class, e.g., poly(4-hydroxybutyrate) (P4HB), poly(3-hydroxyvalerate) (PHV), poly(3-hydroxyhexanoate) (PHH), poly(3-hydroxyoctanoate) (PHO) and their co-polymers, are produced by several types of microorganisms. PHAs that accumulate intracellularly can be degraded by intracellular depolymerase enzymes (
                    - link "Lee and Choi, 1999" [ref=f1e463] [cursor=pointer]:
                      - /url: "#b0130"
                    - text: ). However, in environmental conditions, extracellular enzymes are involved in the degradation process which can be produced and excreted by various microorganisms, such as the soil bacteria
                    - emphasis [ref=f1e465]: Pseudomonas stutzeri
                    - text: (
                    - link "Shimao, 2001" [ref=f1e466] [cursor=pointer]:
                      - /url: "#b0225"
                    - text: ) and
                    - emphasis [ref=f1e468]: Alcaligenes faecalis
                    - text: (
                    - link "Reddy et al., 2003" [ref=f1e469] [cursor=pointer]:
                      - /url: "#b0200"
                    - text: ","
                    - link "Shimao, 2001" [ref=f1e471] [cursor=pointer]:
                      - /url: "#b0225"
                    - text: ), a bacterium that also requires oxygen.
                    - emphasis [ref=f1e473]: Rhodospirillum rubrum, Bacillus megaterium, Acinetobacter beijerinckii,
                    - text: and
                    - emphasis [ref=f1e474]: Pseudomonas lemoignei
                    - text: are other organisms in which PHB depolymerases have been identified (
                    - link "Reddy et al., 2003" [ref=f1e475] [cursor=pointer]:
                      - /url: "#b0200"
                    - text: ). The primary enzyme for the degradation of PHB and its oligomers is PHB depolymerase, an extracellular endo-type hydrolase of
                    - emphasis [ref=f1e477]: A. faecalis
                    - text: (
                    - link "Reddy et al., 2003" [ref=f1e478] [cursor=pointer]:
                      - /url: "#b0200"
                    - text: ). While studying the anaerobic degradation of natural and synthetic polyesters,
                    - link "Abou-Zeid et al. (2001)" [ref=f1e480] [cursor=pointer]:
                      - /url: "#b0005"
                    - text: identified two poly(3-hydroxybutyrate-
                    - emphasis [ref=f1e482]: co
                    - text: "-3-hydroxyvalerate) (PHBV)-degrading strains that showed strain resemblance to"
                    - emphasis [ref=f1e483]: Clostridium botulinum
                    - text: (with approximately 95% 16s rRNA sequence homology).
                  - generic [ref=f1e484]:
                    - text: According to
                    - link "Siracusa et al. (2008)" [ref=f1e485] [cursor=pointer]:
                      - /url: "#b0250"
                    - text: ", PHAs are able to degrade to carbon dioxide and water in 5–6 weeks in aerobic conditions, but in anaerobic environments, the degradation is faster, and methane production is advantageous ("
                    - link "Siracusa et al., 2008" [ref=f1e487] [cursor=pointer]:
                      - /url: "#b0250"
                    - text: ). In a study performed by
                    - link "Shin et al. (1997)" [ref=f1e489] [cursor=pointer]:
                      - /url: "#b0245"
                    - text: ", PHBV (8% 3HV) reached approximately 85% degradation within 20 days in anaerobic sludge. In another study ("
                    - link "Noda et al., 2009" [ref=f1e491] [cursor=pointer]:
                      - /url: "#b0180"
                    - text: ), degradation tests performed aerobically and anaerobically showed rapid biodegradation of
                    - superscript [ref=f1e493]: "14"
                    - text: C labelled poly(3-hydroxybutyrate-
                    - emphasis [ref=f1e494]: co
                    - text: "-3-hydroxyoctanate) (PHBO) under both conditions, up to approximately 80% after 25 days under anaerobic conditions. A 16-day fermentation of PHB and PHBV (13 and 20% 3HV) was performed for methane and carbon dioxide formation using anaerobic sewage sludge by"
                    - link "Budwill et al. (1992)" [ref=f1e495] [cursor=pointer]:
                      - /url: "#b0040"
                    - text: . The results showed that between 83 and 96% of the substrate carbon was transformed to methane and carbon dioxide (
                    - link "Budwill et al., 1992" [ref=f1e497] [cursor=pointer]:
                      - /url: "#b0040"
                    - text: ). According to
                    - link "Verlinden et al. (2007)" [ref=f1e499] [cursor=pointer]:
                      - /url: "#b0310"
                    - text: a PHB sample can require a few months to degrade in anaerobic sewage and can require years in seawater. UV light, however, can accelerate the degradation (
                    - link "Verlinden et al., 2007" [ref=f1e501] [cursor=pointer]:
                      - /url: "#b0310"
                    - text: ). Nodax™, a Procter & Gamble product that is used for manufacturing biodegradable agricultural films, can be degraded anaerobically, and consequently, it can be used as urea fertilizer (
                    - link "Philip et al., 2007" [ref=f1e503] [cursor=pointer]:
                      - /url: "#b0185"
                    - text: ). Nodax™ class PHA co-polymers are a family of promising PHA polyesters consisting of (R)-3-hydroxyalkanoate co-monomer units with medium-chain-length side groups (mcl-3HA) and (R)-3-hydroxybutyrate (3HB) (
                    - link "Noda et al., 2009" [ref=f1e505] [cursor=pointer]:
                      - /url: "#b0180"
                    - text: ). PHA co-polymers comprising mcl-3HA have lower crystallinity than PHB homopolymers of PHBV co-polymer, and thus, faster degradation can occur.
                - generic [ref=f1e507]:
                  - heading "4.2. Starch blends" [level=3] [ref=f1e508]
                  - generic [ref=f1e509]:
                    - text: Starch is rarely used on its own for bioplastics production due to its hydrophilic nature and its poor mechanical properties. It is often modified chemically, physically or mechanically and/or blended with other polymeric compounds or plasticizers (
                    - link "Davis and Song, 2006" [ref=f1e510] [cursor=pointer]:
                      - /url: "#b0060"
                    - text: ). The starch content of a typical starch blend can vary from 5 to 90 wt% (
                    - link "Davis and Song, 2006" [ref=f1e512] [cursor=pointer]:
                      - /url: "#b0060"
                    - text: ). A Novamont product, Mater-Bi™ (MB), composed of a minimum of 60% starch and starch derivatives and of approximately 40% synthetic resin that is hydrophilic and biodegradable, was examined for anaerobic degradation in a study by
                    - link "Mohee et al. (2008)" [ref=f1e514] [cursor=pointer]:
                      - /url: "#b0165"
                    - text: . The authors measured the cumulative methane production over 32 days of batch digestion assays and compared it to that of the reference cellulose material. The results showed methane productions of 245 mL and 246.8 mL for MB and cellulose, respectively. In another study (
                    - link "Bastioli, 1998" [ref=f1e516] [cursor=pointer]:
                      - /url: "#b0025"
                    - text: ), a Y class (injection moulded rigid items made of thermoplastic starch and cellulose derivatives) MB product showed approximately 90% anaerobic degradability within 30 days.
                    - link "Russo et al. (2009)" [ref=f1e518] [cursor=pointer]:
                      - /url: "#b0210"
                    - text: reported anaerobic degradation of thermoplastic starch (TPS) - PVA blended films in mesophilic conditions. The blends of TPS:PVA were varied at 90:10, 75:25, 50:50, and 0:100 (w/w%). The authors concluded that a higher quantity of starch in the blend resulted in increased biogas production, and starch degraded faster than PVA. They also noted that PVA affected the rate of starch degradation to a lesser extent.
                - generic [ref=f1e520]:
                  - heading "4.3. Pectin-cellulose biofilms" [level=3] [ref=f1e521]
                  - generic [ref=f1e522]:
                    - text: Pectin-cellulose biofilms were produced from orange waste via a solution casting method, and the anaerobic degradation of biofilms was studied in thermophilic conditions (
                    - link "Bátori et al., 2017" [ref=f1e523] [cursor=pointer]:
                      - /url: "#b0030"
                    - text: ). Because orange waste consists of pectin (30%) and cellulose and hemicelluloses (approximately 40%), microcrystalline cellulose (Avicel®), was used as the reference for the degradation test. The study showed that 90% of the orange waste films were degraded in approximately 15 days, with an average corresponding methane production of over 300 NmL/g COD (there COD stands for chemical oxygen demand).
                - generic [ref=f1e525]:
                  - heading "4.4. Poly(lactic acid)" [level=3] [ref=f1e526]
                  - generic [ref=f1e527]:
                    - generic [ref=f1e528]:
                      - text: Poly(lactic acid) (PLA) is a bio-based and biodegradable thermoplastic polyester, and the monomer, lactic acid, used in the polymerization processes, is commonly produced by fermentation. Despite its biocompatible nature, the degradation of PLA in the environment is not easy because, under ambient conditions, PLA in soil or in sewage was found to be resistant to microbial attacks (
                      - link "Hamad et al., 2015" [ref=f1e529] [cursor=pointer]:
                        - /url: "#b0075"
                      - text: ). As
                      - link "Hamad et al. (2015)" [ref=f1e531] [cursor=pointer]:
                        - /url: "#b0075"
                      - text: explains, PLA must be hydrolysed first at elevated temperature (approximately 58 °C) to reduce molecular weight before biodegradation can start. The
                      - emphasis [ref=f1e533]: Amycolatopsis
                      - text: sp. strain (
                      - link "Pranamuda et al., 1997" [ref=f1e534] [cursor=pointer]:
                        - /url: "#b0190"
                      - text: ) and the thermophilic bacterium
                      - emphasis [ref=f1e536]: Bacillus brevis
                      - text: (
                      - link "Tomita et al., 1999" [ref=f1e537] [cursor=pointer]:
                        - /url: "#b0300"
                      - text: ) were isolated from soil samples, but clear-zone methods have reported that PLA-degrading strains are seldom present in soil (
                      - link "Pranamuda et al., 1997" [ref=f1e539] [cursor=pointer]:
                        - /url: "#b0190"
                      - text: ). According to
                      - link "Shin et al. (1997)" [ref=f1e541] [cursor=pointer]:
                        - /url: "#b0245"
                      - text: ", PLA did not degrade under anaerobic conditions at all during the 100-day-long investigation."
                      - link "Massardier-Nageotte et al. (2006)" [ref=f1e543] [cursor=pointer]:
                        - /url: "#b0145"
                      - text: examined PLA degradation according to ISO 14853, and the authors concluded that the microorganisms could not consume the polymer after 28 days of digestion. A commercially available PLA product, Ingeo™ from Nature Works, was studied for anaerobic degradation via two different test methods (
                      - link "Kolstad et al., 2012" [ref=f1e545] [cursor=pointer]:
                        - /url: "#b0120"
                      - text: ). The first test was performed under accelerated landfill conditions (ALC), in which three different humidity levels were monitored under ambient conditions for 390 days. Then, a high-solids anaerobic digestion (HSAD) test followed, which was performed for 170 days at 35 °C. No statistically significant biogas production was reported from the tested samples during ALC. Furthermore, no significant methane production was found in the HSAD tests. The authors concluded, therefore, that under anaerobic conditions, no population of organisms was found to be available for the degradation of high molecular weight PLA.
                      - link "Kale et al. (2007)" [ref=f1e547] [cursor=pointer]:
                        - /url: "#b0110"
                      - text: reported that PLA degraded, but only at a minor level (>10%), under anaerobic conditions when using ASTM
                      - link [ref=f1e549] [cursor=pointer]:
                        - /url: http://www.astm.org/Standards/D5511
                        - generic [ref=f1e550]:
                          - text: D5511
                          - img "Opens in new window" [ref=f1e551]
                      - text: and ISO 14,853 test methods. However, PLA was degraded using dry digestion with high solids content under thermophilic conditions up to a level of 60% over 40 days (
                      - link "Itävaara et al., 2002" [ref=f1e553] [cursor=pointer]:
                        - /url: "#b0100"
                      - text: ). Contrarily,
                      - link "Yagi et al. (2009a)" [ref=f1e555] [cursor=pointer]:
                        - /url: "#b0320"
                      - text: developed a new evaluation system using the MODA-B apparatus for testing PLA degradation under anaerobic aquatic conditions. The system allows collecting biogas in a gas sampling bag at atmospheric pressure. In their study, PLA showed 91% biodegradability in undiluted (gas production started within approximately 10 days and finished after approximately 75 days) sludge and approximately 80% biodegradability in diluted (gas production started within approximately 14 days and finished after approximately 90 days) sludge in aquatic conditions at a thermophilic temperature. The sludge they used in the study was, however, obtained from a biogas plant operating at mesophilic temperatures and then adapted to 55 °C. In another study, using this adapted sludge,
                      - link "Yagi et al. (2009b)" [ref=f1e557] [cursor=pointer]:
                        - /url: "#b0325"
                      - text: measured approximately 60% biodegradability of PLA powder in 30 days, approximately 80% in 40 days and approximately 90% in 60 days under thermophilic conditions. The degradation in mesophilic conditions, however, started only after 55 days. It was, however, unclear whether the sludge adapted to 55 °C included certain strains responsible for PLA degradation under thermophilic conditions. In their next study (
                      - link "Yagi et al., 2010" [ref=f1e559] [cursor=pointer]:
                        - /url: "#b0330"
                      - text: ), the authors therefore analysed the bacterial population involved in the degradation processes. Based on biogas evaluation and the methane ratio, the authors expected newly grown eubacteria between days 7 and 18 in the tests. However, the result showed minor growth of microorganisms in the biomass. In their next study,
                      - link "Yagi et al. (2012)" [ref=f1e561] [cursor=pointer]:
                        - /url: "#b0335"
                      - text: tested the degradation of four different sizes of PLA films (
                      - link "Table 1" [ref=f1e563] [cursor=pointer]:
                        - /url: "#t0005"
                      - text: ) under thermophilic conditions. It was concluded that the smaller pieces of PLA had a lower degradation rate compared to the larger pieces. Although the smaller pieces were expected to degrade faster, it turned out that the small pieces stuck together at the start of the experiment due to static electricity. Thus, the total surface area in contact with the sludge was less than with larger pieces. The authors concluded that PLA, and perhaps other types of bioplastic films, does not need to be cut into smaller pieces (
                      - link "Yagi et al., 2012" [ref=f1e565] [cursor=pointer]:
                        - /url: "#b0335"
                      - text: ).
                    - generic [ref=f1e567]:
                      - paragraph [ref=f1e570]:
                        - text: Table 1. Biodegradation rate of different sizes of PLA films (
                        - link "Yagi et al., 2012" [ref=f1e571] [cursor=pointer]:
                          - /url: "#b0335"
                        - text: ).
                      - table [ref=f1e574]:
                        - rowgroup [ref=f1e575]:
                          - row [ref=f1e576]:
                            - cell "Empty Cell" [ref=f1e577]
                            - columnheader "20 days" [ref=f1e579]
                            - columnheader "30 days" [ref=f1e580]
                            - columnheader "40 days" [ref=f1e581]
                        - rowgroup [ref=f1e582]:
                          - row [ref=f1e583]:
                            - rowheader ">500 µm PLA film" [ref=f1e584]
                            - cell "17%" [ref=f1e585]
                            - cell "50%" [ref=f1e586]
                            - cell "75%" [ref=f1e587]
                          - row [ref=f1e588]:
                            - rowheader "1 × 1 cm PLA film" [ref=f1e589]
                            - cell "25%" [ref=f1e590]
                            - cell "59%" [ref=f1e591]
                            - cell "80–83%" [ref=f1e592]
                          - row [ref=f1e593]:
                            - rowheader "15 × 34 cm and 39 × 82 cm PLA film" [ref=f1e594]
                            - cell "35–40%" [ref=f1e595]
                            - cell "70–75%" [ref=f1e596]
                            - cell "84%" [ref=f1e597]
                - generic [ref=f1e598]:
                  - heading "4.5. Poly(caprolactone)" [level=3] [ref=f1e599]
                  - generic [ref=f1e600]:
                    - text: Poly(caprolactone) (PCL) is a synthetic fossil-based polyester that can smoothly be degraded by microorganisms. Just as PHA and PHB-degrading bacteria, PCL-degrading bacteria can be found in nature. However, while PHAs are degraded by depolymerases, PCL is degraded by lipases and esterases (
                    - link "Ruiz and Flotats, 2014" [ref=f1e601] [cursor=pointer]:
                      - /url: "#b0205"
                    - text: ).
                    - link "Murphy et al. (1996)" [ref=f1e603] [cursor=pointer]:
                      - /url: "#b0175"
                    - text: found that the PCL depolymerase is in fact a cutinase produced by the fungal pathogen
                    - emphasis [ref=f1e605]: Fusarium solani
                    - text: . Cutinase degrades cutin, the waxy polymer that is known as the structural polymer of the plant cuticle. However, PCL degradation is controversial, as some authors did not find anaerobic biodegradability of the material (
                    - link "Abou-Zeid et al., 2001" [ref=f1e606] [cursor=pointer]:
                      - /url: "#b0005"
                    - text: ).
                    - link "Kale et al. (2007)" [ref=f1e608] [cursor=pointer]:
                      - /url: "#b0110"
                    - text: reported that PCL did not biodegrade under anaerobic conditions when using ASTM
                    - link [ref=f1e610] [cursor=pointer]:
                      - /url: http://www.astm.org/Standards/D5511
                      - generic [ref=f1e611]:
                        - text: D5511
                        - img "Opens in new window" [ref=f1e612]
                    - text: and ISO 14,853 tests. Contrarily,
                    - link "Abou-Zeid et al. (2001)" [ref=f1e614] [cursor=pointer]:
                      - /url: "#b0005"
                    - text: made an interesting comparison between PHB, PHBV, and PCL degradation. The authors found that PCL was more resistant to an anaerobic attack than the natural polymers, but the anaerobic degradability of PCL in mesophilic conditions was clearly shown with two different types of anaerobic sludge. In their study, they also isolated four PHB- and PCL-degrading strains belonging to the genus
                    - emphasis [ref=f1e616]: Clostridium
                    - text: . The two PCL-degrading strains showed almost 92% strain resemblance with
                    - emphasis [ref=f1e617]: Clostridium acetobutylicum
                    - text: (16s rRNA sequence homology).
                    - link "Cho et al. (2011)" [ref=f1e618] [cursor=pointer]:
                      - /url: "#b0055"
                    - text: studied the anaerobic degradation of PCL-starch blends according to ISO 14,853 and determined a biodegradability of 83% within 139 days. In comparison, as mentioned above, 92% degradation of PCL powder was achieved by
                    - link "Yagi et al. (2009a)" [ref=f1e620] [cursor=pointer]:
                      - /url: "#b0320"
                    - text: at thermophilic temperatures in 47 days using the adapted sludge from a mesophilic biogas plant.
                - generic [ref=f1e622]:
                  - heading "4.6. Poly(butylene succinate)" [level=3] [ref=f1e623]
                  - generic [ref=f1e624]:
                    - text: Poly(butylene succinate) (PBS) is a synthetically produced thermoplastic and biodegradable aliphatic polyester. It is claimed to be biodegradable in certain environments, such as sea, river, soil, activated sludge and compost (
                    - link "Xu and Guo, 2010" [ref=f1e625] [cursor=pointer]:
                      - /url: "#b0315"
                    - text: ), but PBS does not seem to be biodegradable under anaerobic conditions. In a study,
                    - link "Cho et al. (2011)" [ref=f1e627] [cursor=pointer]:
                      - /url: "#b0055"
                    - text: showed only 2% biodegradability of PBS under anaerobic conditions in 100 days according to the ISO 14,853 test method. In another study, PBS did not biodegrade at all using the same conditions (i.e., at thermophilic conditions using a sludge adapted from 37 °C), where PHB showed 90% biodegradability in 14 days, and PCL and PLA showed 80% and 75% biodegradability in 50 and 75 days, respectively (
                    - link "Yagi et al., 2013" [ref=f1e629] [cursor=pointer]:
                      - /url: "#b0340"
                    - text: ).
                - generic [ref=f1e631]:
                  - heading "4.7. Poly(vinyl alcohol)" [level=3] [ref=f1e632]
                  - generic [ref=f1e633]:
                    - text: Poly(vinyl alcohol) (PVA) is a synthetic vinyl polymer that is water soluble and biodegradable. It is the only polymer with a carbon – carbon backbone that can be degraded biologically under both aerobic (
                    - link "Mori et al., 1996" [ref=f1e634] [cursor=pointer]:
                      - /url: "#b0170"
                    - text: ","
                    - link "Sakazawa et al., 1981" [ref=f1e636] [cursor=pointer]:
                      - /url: "#b0215"
                    - text: ","
                    - link "Shimao et al., 1986" [ref=f1e638] [cursor=pointer]:
                      - /url: "#b0230"
                    - text: ","
                    - link "Shimao et al., 1983" [ref=f1e640] [cursor=pointer]:
                      - /url: "#b0235"
                    - text: ","
                    - link "Shimao et al., 1984" [ref=f1e642] [cursor=pointer]:
                      - /url: "#b0240"
                    - text: ","
                    - link "Suzuki et al., 1973" [ref=f1e644] [cursor=pointer]:
                      - /url: "#b0285"
                    - text: ","
                    - link "Watanabe et al., 1975" [ref=f1e646] [cursor=pointer]:
                      - /url: "#b0305"
                    - text: ) and anaerobic (
                    - link "Matsumura et al., 1993" [ref=f1e648] [cursor=pointer]:
                      - /url: "#b0150"
                    - text: ) conditions (
                    - link "Matsumura et al., 1999" [ref=f1e650] [cursor=pointer]:
                      - /url: "#b0155"
                    - text: ). However, its degradation rate, particularly the anaerobic degradation of PVA, is low (
                    - link "Pšeja et al., 2006" [ref=f1e652] [cursor=pointer]:
                      - /url: "#b0195"
                    - text: ). PVA-degrading microorganisms are not omnipresent in nature (
                    - link "Shimao, 2001" [ref=f1e654] [cursor=pointer]:
                      - /url: "#b0225"
                    - text: ). Aerobic degradation of PVA has been performed using mostly
                    - emphasis [ref=f1e656]: Pseudomonas
                    - text: strains (
                    - link "Sakazawa et al., 1981" [ref=f1e657] [cursor=pointer]:
                      - /url: "#b0215"
                    - text: ","
                    - link "Shimao et al., 1986" [ref=f1e659] [cursor=pointer]:
                      - /url: "#b0230"
                    - text: ","
                    - link "Shimao et al., 1983" [ref=f1e661] [cursor=pointer]:
                      - /url: "#b0235"
                    - text: ","
                    - link "Shimao et al., 1984" [ref=f1e663] [cursor=pointer]:
                      - /url: "#b0240"
                    - text: ","
                    - link "Suzuki et al., 1973" [ref=f1e665] [cursor=pointer]:
                      - /url: "#b0285"
                    - text: ) and
                    - emphasis [ref=f1e667]: Alcaligenes faecalis KK314
                    - text: (
                    - link "Matsumura et al., 1999" [ref=f1e668] [cursor=pointer]:
                      - /url: "#b0155"
                    - text: ). Anaerobic degradation (
                    - link "Matsumura et al., 1993" [ref=f1e670] [cursor=pointer]:
                      - /url: "#b0150"
                    - text: ) of PVA was confirmed for the first time by comparing PVA-2000 (number is average molecular weight of 2200) with PVA-14000 (number is average molecular weight of 14000) using inoculation cultures as black river sediments or activated sewage sludge. In general, both PVA samples degraded at a higher degradation rate when the activated sludge was used as the inoculum. As expected, PVA-2000 showed the highest degradation rate of approximately 75% after 125 days of incubation and reached 50% degradation after approximately 25 days.
              - generic [ref=f1e672]:
                - 'heading "5. Anaerobic digestion of bioplastics in biogas plants: challenges, standards, and suggestions" [level=2] [ref=f1e673]'
                - generic [ref=f1e674]:
                  - text: As shown in previous sections, different microorganisms degrade different biopolymers (
                  - link "Shah et al., 2008" [ref=f1e675] [cursor=pointer]:
                    - /url: "#b0220"
                  - text: ","
                  - link "Yagi et al., 2013" [ref=f1e677] [cursor=pointer]:
                    - /url: "#b0340"
                  - text: ). Thus, not all types of bioplastics are suitable for anaerobic digestion (
                  - link "Endres and Siebert-Raths, 2011" [ref=f1e679] [cursor=pointer]:
                    - /url: "#b0065"
                  - text: ","
                  - link "Kale et al., 2007" [ref=f1e681] [cursor=pointer]:
                    - /url: "#b0110"
                  - text: "). To determine which kinds of bioplastics are suitable for OFMSW collection, we need to keep in mind that the anaerobic digestion process goes through four typical degradation steps (i.e., hydrolysis, acidogenesis, acetogenesis and methanogenesis). These stages have been thoroughly discussed in the literature and are not the main focus of this review. This study focused on conditions needed for effective anaerobic degradation of bioplastics, such as degradation time, temperature, and microbial strains involved in the process. In other words, this study is meant to answer the question of whether a bioplastic bag is suitable for collecting the OFMSW with the aim of reducing the contamination caused by conventional plastic bags in biogas processes. A typical biogas plant treating the OFMSW operates with a hydraulic retention time (HRT) of 15–30 days under thermophilic or mesophilic conditions. Therefore, a bioplastic bag suitable for collecting food waste should be able to degrade within these conditions. Some of the biopolymers discussed above degrade within the HRT applied for a biogas plant, such as PHB, starch, cellulose, and pectin. A general order of increasing biodegradation rate of bioplastics is as follows: PHB > PCL > PLA > PVA. However, PCL, PLA and PVA take longer than the usual HRTs used in biogas plants treating OFMSW. We can also conclude that PBS is not suitable for collection bags because it is does not degrade under the conditions used at biogas plants."
                - generic [ref=f1e683]: Standards for bioplastic bags suitable for the collection of the OFMSW have not yet been established thoroughly due to the novelty of the process. First, standardization for biodegradable bags suitable for OFMSW collection should include some mechanical requirements. Tensile strength and water resistance are important aspects because a material that is too strong could be misused for other purposes, and a bag should withstand moisture until it reaches the fermenters but should undergo biodegradation at elevated temperatures. These two qualities are important in all plastics, if not the most important ones. Most conventional, petroleum-based plastics, such as low-density poly(ethylene) (LDPE) and high-density poly(ethylene) (HDPE) are water-resistant and have enough appropriate mechanical properties to be used as plastic bags. Bioplastics, on the other hand, are more likely to be less water resistant because of the hydrophilic nature of the biopolymers used for their fabrication. Some bioplastics, such as PHA, PLA and PCL, are water resistant and can be used as coatings for other bioplastics, such as those made from starch or agar. Bioplastics are not yet versatile, and further research is needed for the functionalized production of bioplastics. Since the bioplastics industry is in its beginning phase, it is difficult to define how strong and how water-resistant a bioplastic bag has to be in order to be suitable as a food waste collection bag.
                - generic [ref=f1e684]:
                  - text: In regard to the biogas plants, according to the best of our knowledge, there are few published data available on bioplastic conversion or optimum treatment conditions for the AD process. Nevertheless, there are methods for determining the anaerobic biodegradation of plastic materials, such as ISO 14853:2016 (
                  - link "Standardization, 2016" [ref=f1e685] [cursor=pointer]:
                    - /url: "#b0280"
                  - text: ), ISO 15985:2014 (
                  - link "Standardization, 2014" [ref=f1e687] [cursor=pointer]:
                    - /url: "#b0275"
                  - text: ) and ASTM
                  - link [ref=f1e689] [cursor=pointer]:
                    - /url: http://www.astm.org/Standards/D5511
                    - generic [ref=f1e690]:
                      - text: D5511
                      - img "Opens in new window" [ref=f1e691]
                  - text: (
                  - link "International, 2018" [ref=f1e693] [cursor=pointer]:
                    - /url: "#b0095"
                  - text: ).
                - generic [ref=f1e695]:
                  - text: In the Swedish OFMSW treatment plants, the bags suitable for collection must comply with standards for biodegradation according to SS EN 13,432 (Packaging - Requirements for packaging recoverable through composting and biodegradation) (
                  - link "Standardization, 2000" [ref=f1e696] [cursor=pointer]:
                    - /url: "#b0265"
                  - text: ) if the bags are not sorted out in a pretreatment plant prior to the anaerobic digestion process. The standard specifies the criteria for the anaerobic biodegradation of plastics as a minimum of 50% degradation within a maximum of 2 months. However, plastic contamination can still exist in biogas plants since the HRT (i.e., the average period of time a given quantity of substance stays in the digester) is usually less than 2 months. Accordingly, to avoid contamination, a plastic bag ought to be degraded during the HRT used. Therefore, one suggestion is that the standard requirements for the bioplastics bags used for collection should be revised. The requirement should rather specify a maximum of 1-month degradation time for the collection bags. The % degradation of the bags could also be revised to be in accordance with the CEN specifications for biodegradation or at least increased from the actual 50%. If the bags are sorted out first in a pretreatment plant, the requirement for visible contamination in biogas plants in Sweden meets the SPCR 120 regulation (
                  - link "Sverige, 2018" [ref=f1e698] [cursor=pointer]:
                    - /url: "#b0290"
                  - text: ) as an average of 20 cm
                  - superscript [ref=f1e700]: "2"
                  - text: plastics/kg digestate residue in a sample taken once a month under a period of 12 months.
                - generic [ref=f1e701]: Consequently, there is a need to gain more knowledge about the nature and growth features of microbial strains capable of biopolymer degradation in order to achieve an efficient anaerobic biodegradation process and to understand the mechanisms involved. The microbial strains that are currently isolated or yet to be isolated can then be used as bioactive agents in the anaerobic degradation process. With these suggestions, hopefully, bioplastic bags used for OFMSW collection would avoid plastic contamination and loss of valuable organic matter and improve performance and biological processes.
              - generic [ref=f1e702]:
                - heading "6. Conclusions" [level=2] [ref=f1e703]
                - generic [ref=f1e704]: Biodegradation of bioplastics is dependent on the physical and chemical properties of the polymers. Different biopolymers are degraded by different microorganisms, and different microbial communities are available in the same digester depending on the composition of the waste available. The complexity of the biodegradation processes for biopolymers in a digester, challenges regulations. However, standards for the biodegradability of bioplastics exist, although standardization of collecting bags for the OFMSW needs more research to meet the conditions of an active biogas plant and improve the biological processes in the digester, such as the hydraulic retention time and the average composition of the waste.
