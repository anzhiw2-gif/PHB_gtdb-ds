                    - generic [ref=f1e179]: Increasing PHA diversity reflects more on polymer microstructures.
                  - listitem [ref=f1e181]:
                    - generic [ref=f1e182]: •
                    - generic [ref=f1e183]: Engineering the β-oxidation pathway allows controlled synthesis of PHA compositions.
                  - listitem [ref=f1e185]:
                    - generic [ref=f1e186]: •
                    - generic [ref=f1e187]: Grafting of PHA site chains result in endless variation of PHA.
              - generic [ref=f1e191]:
                - text: Many bacteria have been found to produce various polyhydroxyalkanoates (PHA) biopolyesters. In many cases, it is not easy to control the structures of PHA including homopolymers, random copolymers and block copolymers as well as ratios of monomers in the copolymers. It has become possible to engineer bacteria for controllable synthesis of PHA with the desirable structures by creating new PHA synthesis pathways. Remarkably, the weakening of β-oxidation cycle in
                - emphasis [ref=f1e192]: Pseudomonas putida
                - text: and
                - emphasis [ref=f1e193]: Pseudomonas entomophila
                - text: led to controllable synthesis of all kinds of PHA structures including monomer ratios in random and/or block copolymers when fatty acids are used as PHA precursors. Introduction of functional groups into PHA polymer chains in predefined proportions has become a reality provided fatty acids containing the functional groups are taken up by the bacteria for PHA synthesis. This allows the formation of functional PHA for further grafting. The PHA diversity is further widened by the endless possibility of controllable homopolymerization, random copolymerization, block copolymerization and grafting on functional PHA site chains.
