                        - text: ); b. slow-release fertilizer with PHB coating (
                        - link "Kontárová et al., 2022" [ref=f1e1205] [cursor=pointer]:
                          - /url: "#bb0300"
                        - text: ); c. Self-regulating PHA denitrification system for marine aquaculture system (
                        - link "Ebeling and Drennan, 2007" [ref=f1e1207] [cursor=pointer]:
                          - /url: "#bb0620"
                        - text: ); d. PHA biodegradable mulch film (TBV 100 series,
                        - link [ref=f1e1209] [cursor=pointer]:
                          - /url: https://terraverdae.com
                          - generic [ref=f1e1210]:
                            - text: https://terraverdae.com
                            - img "Opens in new window" [ref=f1e1211]
                        - text: ).
                  - generic [ref=f1e1213]:
                    - text: In sewage treatment systems, the carbon source properties of PHA allow it to act as an adsorbent for nitrogen and organic wastes (
                    - link "Venkata Mohan et al., 2010" [ref=f1e1214] [cursor=pointer]:
                      - /url: "#bb0705"
                    - text: ). Early research in biopolymer denitrification found that PHB and poly(ε-caprolactone) (PCL) had lower surface-bound denitrification rates compared to methanol and ethanol carbon carrier methods (
                    - link "Poirier, 2002" [ref=f1e1216] [cursor=pointer]:
                      - /url: "#bb0530"
                    - text: ). However, further research has shown that PHA can more specifically target nitrogen removal from water, reducing the generation of organic carbon sources and improving final wastewater quality (
                    - link "Khurram, 2015" [ref=f1e1218] [cursor=pointer]:
                      - /url: "#bb0270"
                    - text: ).
                  - generic [ref=f1e1220]:
                    - text: In general, β-proteobacteria are the main microbial species used for PHA-degrading denitrifying bacteria. Since PHA acts as a carbon storage material for microbes, this naturally gives the molecule ability to function metabolically as a denitrifying substance for microbial digestion (
                    - link "Amelia et al., 2019" [ref=f1e1221] [cursor=pointer]:
                      - /url: "#bb0025"
                    - text: ;
                    - link "Hiraishi and Khan, 2003" [ref=f1e1223] [cursor=pointer]:
                      - /url: "#bb0235"
                    - text: ). To this end, PHA in the form of solid substrate is preferred. Another well-known denitrifier is
                    - emphasis [ref=f1e1225]: Paracoccus denitrificans
                    - text: ", which uses PHA depolymerase during denitrification. In one study, PHB and PHBV were found to degrade rapidly, while other polymers such as PLA and PCL had reduced degradation and denitrification potential ("
                    - link "El-Sayed et al., 2009" [ref=f1e1226] [cursor=pointer]:
                      - /url: "#bb0155"
                    - text: ). Cells bound to PHA granules outperformed suspended cells in this research in terms of denitrification rate (
                    - link "El-Sayed et al., 2009" [ref=f1e1228] [cursor=pointer]:
                      - /url: "#bb0155"
                    - text: ).
                - generic [ref=f1e1230]:
                  - heading "2.7. PHA as animal feeds (replacing antibiotics)" [level=3] [ref=f1e1231]
                  - generic [ref=f1e1232]:
                    - text: Waste streams can be used to recover nutrients and create healthy single-cell proteins (SCPs). A recent strategy using PHA has been explored to both reduce waste management costs and increase the quality and quantity of animal feed. In a recent paper, PHB bound to SCPs was used as a healthy aquaculture feed to replace conventional antibiotics-supplemented feeds (
                    - link "Asiri and Chu, 2022" [ref=f1e1233] [cursor=pointer]:
                      - /url: "#bb0045"
                    - text: ). The work tested PHA-SCPs from various renewable wastes, including agro-industrial and wastewater sources, for the proper growth and infection resistance of the aquaculture animal model brine shrimp
                    - emphasis [ref=f1e1235]: Artemia
                    - text: . Two microorganisms,
                    - emphasis [ref=f1e1236]: Zobellella denitrificans
                    - text: ZD1 and
                    - emphasis [ref=f1e1237]: Pseudomonas oleovorans
                    - text: ", were grown on the agro-industrial wastes and produced PHA-SCPs of different lengths and molecular weights. It was found that middle-chain-length PHA was most effective as a biocontrol agent, and low doses were sufficient to suppress the growth of pathogens in the aquaculture environment. In fact, mcl-PHA-SCPs were also shown to act as a food and energy source for the brine shrimp ("
                    - link "Asiri and Chu, 2022" [ref=f1e1238] [cursor=pointer]:
                      - /url: "#bb0045"
                    - text: ).
                  - generic [ref=f1e1240]:
                    - text: Scl PHA that has been pretreated has been used as an animal feed supplement for fingerlings and piglets, showing an improved digestibility index for these animals (
                    - link "Wang et al., 2019" [ref=f1e1241] [cursor=pointer]:
                      - /url: "#bb0750"
                    - text: ).
                - generic [ref=f1e1243]:
                  - heading "2.8. PHA as biofuels (after methyl esterification)" [level=3] [ref=f1e1244]
                  - generic [ref=f1e1245]:
                    - text: Recently, the use of PHA for biofuels has been explored using its synthetic pathway in bacteria (
                    - link "Muneer et al., 2020" [ref=f1e1246] [cursor=pointer]:
                      - /url: "#bb0470"
                    - text: ). If waste-sources could be used to grow bacteria producing PHA, PHA could become a sustainable source for biofuel production. PHA-based biofuel produced from wastewater or activated sludge has been proposed as a technique to simultaneously generate energy and treat waste (
                    - link "Kourmentza et al., 2017" [ref=f1e1248] [cursor=pointer]:
                      - /url: "#bb0315"
                    - text: ).
                  - generic [ref=f1e1250]:
                    - text: Specifically, PHB methyl ester (HBME) and hydroxyalkanoate methyl ester (HAME) were tested using the acid-catalyzed hydrolytic esterification of PHB (
                    - link "Kinyanjui Muiruri et al., 2023" [ref=f1e1251] [cursor=pointer]:
                      - /url: "#bb0275"
                    - text: ). In the acid-catalyzed hydrolysis process, PHB and mcl-PHA are converted to (
                    - emphasis [ref=f1e1253]: R
                    - text: )-3-hydroxybutyrate methyl ester (3HBME) and middle chain length hydroxyalkanoate methyl ester (3HAME). 10% of both products can be used to enhance ethanol combustion (
                    - link "Zhang et al., 2009" [ref=f1e1254] [cursor=pointer]:
                      - /url: "#bb0800"
                    - text: ).
                - generic [ref=f1e1256]:
                  - heading "2.9. PHA as mulching film" [level=3] [ref=f1e1257]
                  - generic [ref=f1e1258]:
                    - text: Mulching is essential to maintain soil structure. Mulching also prevents soil pollution, retains water for better plant growth, and limits weed growth (
                    - link "Bandopadhyay et al., 2018" [ref=f1e1259] [cursor=pointer]:
                      - /url: "#bb0050"
                    - text: ;
                    - link "Venkateswar Reddy and Venkata Mohan, 2012" [ref=f1e1261] [cursor=pointer]:
                      - /url: "#bb0710"
                    - text: ). Typically, mulch is made of polyethylene (low and high-density) which is not biodegradable (
                    - link "Suyama et al., 1998" [ref=f1e1263] [cursor=pointer]:
                      - /url: "#bb0665"
                    - text: ). Some estimate that 40% of single-use plastics were used in agricultural mulch and applications (year 2012) (
                    - link "Bandopadhyay et al., 2018" [ref=f1e1265] [cursor=pointer]:
                      - /url: "#bb0050"
                    - text: ; Reddy and Mohan, 2012). PHA, along with PLA and other biodegradable polymers are therefore attractive alternative replacements that can also elevate soil health (
                    - link "Niaounakis, 2014" [ref=f1e1267] [cursor=pointer]:
                      - /url: "#bb0485"
                    - text: ).
                  - generic [ref=f1e1269]:
                    - text: Recently, PHA films have been used as a mulch to facilitate water-efficient agricultural practices. PHA films can be degraded rapidly over time depending on climate and crop conditions (
                    - link "Mosnáčková et al., 2019" [ref=f1e1270] [cursor=pointer]:
                      - /url: "#bb0450"
                    - text: ;
                    - link "França et al., 2021" [ref=f1e1272] [cursor=pointer]:
                      - /url: "#bb0190"
                    - text: ). Scl-PHA can also be used as a fertilizer encapsulant, in order to boost food production while also supporting carbon neutral agriculture practices (
                    - link "Kontárová et al., 2022" [ref=f1e1274] [cursor=pointer]:
                      - /url: "#bb0300"
                    - text: ;
                    - link "França et al., 2021" [ref=f1e1276] [cursor=pointer]:
                      - /url: "#bb0190"
                    - text: ). Outside of mulch material, microbial species that produce PHA are also of interest for promoting plant growth (
                    - link "Rehm and Steinbüchel, 1999" [ref=f1e1278] [cursor=pointer]:
                      - /url: "#bb0575"
                    - text: ). As PHA acts as a carbon source for certain bacteria, it can also reduce bacterial stress in the soil caused by carbon limitation or temperature and salt variation (
                    - link "Sehgal and Gupta, 2020" [ref=f1e1280] [cursor=pointer]:
                      - /url: "#bb0615"
                    - text: ).
                    - link "Fig. 4" [ref=f1e1282] [cursor=pointer]:
                      - /url: "#f0020"
                    - text: a and b show fertilizers coated with PHA that are designed for slow release.
                  - generic [ref=f1e1284]:
                    - text: In terms of companies, Danimer Scientific produces biodegradable PHA copolymer P(3HB-
                    - emphasis [ref=f1e1285]: co
                    - text: "-3HHx) ("
                    - link [ref=f1e1286] [cursor=pointer]:
                      - /url: "#bb0075"
                      - generic [ref=f1e1288]:
                        - text: Biopol–mers - PVA Hydrogels Anionic Polymerisation Nanocomposites
                        - emphasis [ref=f1e1289]: ","
                        - text: "2003"
                    - text: ) that forms a custom agricultural mulch. Metabolix has also manufactured a mulch product that claims to use natural carbohydrates as a carbon source for its microorganisms (
                    - link "Randon and Attard, 2007" [ref=f1e1290] [cursor=pointer]:
                      - /url: "#bb0560"
                    - text: ). A commercialized PHA biodegradable mulch film is shown in
                    - link "Fig. 4" [ref=f1e1292] [cursor=pointer]:
                      - /url: "#f0020"
                    - text: d.
              - generic [ref=f1e1294]:
                - heading "3. Future prospects" [level=2] [ref=f1e1295]
                - generic [ref=f1e1296]: Achieving cost competitiveness with traditional plastics is a multifaceted challenge, and several battles remain before PHA and similar biomaterials can replace petroleum-derived plastics. Factors such as feedstock costs, process optimization, and advancements in fermentation technologies are important to bring down the cost of PHA production. However, an often overlooked area of research that is nevertheless paramount to achieving PHA transition is the development of clear commercial applications for PHA raw materials. As demonstrated in the studies mentioned throughout this article, targeted research is required during material processing of PHA to ensure appropriate product-market fit and in turn accelerate production efforts and investment.
                - generic [ref=f1e1297]: Development of high-end applications for unique PHA applications can command premium prices in the market, which in turn can support economic feasibility of PHA production. High-end applications for PHA include products in the cosmetic and medical fields, and in certain 3D printed materials. High-end applications typically require specific and tailored properties, which can be achieved by versatile PHAs but only after targeted research effort. Meanwhile, applications for PHA in industries with ever-stricter environmental regulations such as biofuels and mulching films, or with stronger consumer emphasis, such as in textile manufacturing and certain consumer products, create demand for adoption of biodegradable materials. This can lead to incentive structures in the market that will foster a more favorable environment for future investment and development. In addition, a diverse range of applications can mitigate risks associated with relying on a single market sector, and create a more stable market for PHA producers.
                - generic [ref=f1e1298]:
                  - text: We foresee many potential future application areas for PHA in current new industries. For example, recent research in nanocomposites for PHA might make it be a good replacement for plastic in microchips, breaking into the electronics industry. PHA's inherently safe biocompatibility lends it naturally to be used for applications on the human body, such as new hydrogels and microspheres for cosmetics, PHA contact lenses, and PHA plastic surgery. Higher-end applications of PHA in clothing and wearable accessories include PHA wigs and PHA leathers. Meanwhile, higher price applications in the consumer sector include legos, dollhouses, and board games. PHA has been shown to function excellently in 3D printing, which can allow artist personalization and higher priced items. Finally, the PHA monomer 3-hydroxybutyrate (3HB) itself has applications in medicine, functioning as a ketone body that can ameliorate insulin resistance (
                  - link "Zhang et al., 2023" [ref=f1e1299] [cursor=pointer]:
                    - /url: "#bb0810"
                  - text: ).
                - generic [ref=f1e1301]:
                  - text: No matter the company, key to scale up success for PHA production is a direct supply chain to the application space, be it in packaging, food and beverage materials, medical devices or in agriculture (
                  - link "Rosenboom et al., 2022" [ref=f1e1302] [cursor=pointer]:
                    - /url: "#bb0590"
                  - text: ). A heavy focus in the coming research should be for PHA applications in the industries mentioned here and more in order for PHA to replace bulk plastic uses and achieve a circular economy, together with high value implant application in medical fields.
