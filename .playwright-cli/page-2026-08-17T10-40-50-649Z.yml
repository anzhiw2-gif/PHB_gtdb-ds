                - heading "Protein sequence analysis and gene cluster search." [level=3] [ref=e478]
                - paragraph [ref=e479]:
                  - text: The protein domain and active site were analyzed using NCBI BLASTP with the conserved-domain database (
                  - link "34" [ref=e480] [cursor=pointer]:
                    - /url: "#core-collateral-B34"
                  - text: ","
                  - link "35" [ref=e481] [cursor=pointer]:
