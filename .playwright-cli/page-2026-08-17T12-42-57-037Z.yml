                  - text: gene was cloned in the phylogenetically related Gram-positive host, Rhodococcus sp. T104. To this aim, the phaZ
                  - subscript [ref=e399]: Sex2
                  - text: "-coding gene was PCR amplified and cloned into the pEM4 plasmid, containing the strong and constitutive ermE* promoter, and subcloned into pNV19 shuttle vector, enabling the expression of heterologous genes in Rhodococcus sp. T104, as previously demonstrated (García-Hidalgo et al."
                  - link "Reference 2012" [ref=e400] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR20
                    - text: "2012"
                  - text: ","
                  - link "Reference 2013" [ref=e401] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR21
                    - text: "2013"
                  - text: ). Remarkably, the abilitiy of Rhodococcus sp. T104 carrying the pENVO plasmid for degrading mcl-PHA was determined by the formation of clear hydrolysis halos surrounding the colonies when growing in the presence of mcl-PHA (Fig.
                  - link "2b" [ref=e402] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Fig2
                  - text: ). Moreover, PHA depolymerase activity was detected in the cell-free culture supernatant of Rhodococcus sp. T104 (pENVO). SDS-PAGE analysis of these supernatants revealed the appearance of a 30-kDa protein band, which is consistent with the predicted molecular mass of the mature protein deduced from its amino acid sequence (27.6 kDa) (Fig.
                  - link "2c" [ref=e403] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Fig2
                  - text: ). Subsequently, the N-terminal amino acid sequence of this band was determined to be AEAPTGRI, by Edman sequential degradation, confirming its identity as PhaZ
                  - subscript [ref=e404]: Sex2
                  - text: depolymerase and also proving that the signal peptide is correctly processed to render the mature form of the protein in Rhodococcus sp. T104 (pENVO).
                - heading [level=3] [ref=e405]:
                  - text: Purification and biochemical characterization of PhaZ
                  - subscript [ref=e406]: Sex2
                - paragraph [ref=e407]:
                  - text: PhaZ
                  - subscript [ref=e408]: Sex2
                  - text: produced by Rhodococcus sp. T104 (pENVO) was purified from the culture supernatant by two consecutive hydrophobic interaction chromatographic (HIC) steps (Fig.
                  - link "2c" [ref=e409] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Fig2
                  - text: ). MALDI-TOF-TOF analysis of pure enzyme showed a main peak of 27.6 kDa, which perfectly fits the theoretical value deduced from the amino acid sequence (27.6 kDa) (Fig.
                  - link "S2" [ref=e410] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#MOESM1
                  - text: ). In addition, aliquots of pure PhaZ
                  - subscript [ref=e411]: Sex2
                  - text: with two different concentrations (0.06 and 0.23 mg mL
                  - superscript [ref=e412]: –1
                  - text: ) were subjected to sedimentation velocity analysis to ascertain the expected monomeric nature of the enzyme. The experiments performed with low protein concentration (0.06 mg mL
                  - superscript [ref=e413]: –1
                  - text: ) showed a single peak corresponding to the active monomeric form of PhaZ
                  - subscript [ref=e414]: Sex2
                  - text: ", showing characteristic values of a globular shaped protein (Fig."
                  - link "S3" [ref=e415] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#MOESM1
                  - text: A). However, analysis of higher concentrations of the protein revealed the existence of both monomers and dimers (Fig.
                  - link "S3" [ref=e416] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#MOESM1
                  - text: B).
                - paragraph [ref=e417]:
                  - text: The secondary structure content of PhaZ
                  - subscript [ref=e418]: Sex2
                  - text: was experimentally calculated by CD spectrum deconvolution, pointing to an α/β structure (Fig.
                  - link "3" [ref=e419] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Fig3
                  - text: ). This study has revealed a secondary structure showing 7.9 % α-helix, 43.9 % β-sheet, 19.4 % β-turns, and 31.2 % random coil. Thermal denaturation of PhaZ
                  - subscript [ref=e420]: Sex2
                  - text: was also monitored by CD, measuring the change of ellipticity at 209 nm in a temperature range from 20 to 85 °C, showing a single melting temperature (Tm) of 44.2 °C (inset, Fig.
                  - link "3" [ref=e421] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Fig3
                  - text: ).
                - figure "Fig. 3" [ref=e423]:
                  - generic [ref=e426]:
                    - generic [ref=e427]:
                      - generic:
                        - img "Fig. 3"
                      - link "Full size image figure 3" [ref=e429] [cursor=pointer]:
                        - /url: /article/10.1007/s00253-015-6780-1/figures/3
                        - text: Full size image
                    - paragraph [ref=e433]:
                      - text: Far UV circular dichroism spectrum of pure PhaZ
                      - subscript [ref=e434]: Sex2
                      - text: . Inset, thermal unfolding of PhaZ
                      - subscript [ref=e435]: Sex2
                      - text: ", studied by CD variation at 209 nm in 20–85 °C range"
                - paragraph [ref=e436]:
                  - text: In addition, PhaZ
                  - subscript [ref=e437]: Sex2
                  - text: was biochemically characterized in detail. With regard to temperature and pH studies, PhaZ
                  - subscript [ref=e438]: Sex2
                  - text: showed highest activity at 30 °C and pH 10 (Fig.
                  - link "S4" [ref=e439] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#MOESM1
                  - text: ). Depolymerase activity decreased to 56 and 15 % when the reaction was carried out at 25 and 45 °C, respectively, and it showed 7 and 30 % activity at pH 6 and 8, respectively. The specific activity of purified PhaZ
                  - subscript [ref=e440]: Sex2
                  - text: ", calculated by turbidimetry with mcl-PHA as substrate, was found to be 42 U mg"
                  - superscript [ref=e441]: −1
                  - text: protein at optimal conditions.
                - paragraph [ref=e442]:
                  - text: Moreover, thermal inactivation was studied by pre-incubating the PhaZ
                  - subscript [ref=e443]: Sex2
                  - text: at different temperatures ranging from 25 to 70 °C. The enzyme was unstable above 30 °C becoming inactive after 1 h of incubation at this temperature whereas it was stable up to 30 °C for at least 4 h in presence of 10 % glycerol (Fig.
                  - link "4" [ref=e444] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Fig4
                  - text: ). As shown, the deactivation curves exhibited classical biphasic decays where the value of k
                  - subscript [ref=e445]: "2"
                  - text: is very small in presence of glycerol (Table
                  - link "2" [ref=e446] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Tab2
                  - text: ) indicating that the remaining activity of the intermediate E
                  - subscript [ref=e447]: "1"
                  - text: is more thermostable, with a higher half-life than enzyme in absence of glycerol (Table
                  - link "2" [ref=e448] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Tab2
                  - text: ), and resulting in a thermal stabilization factor of 6.85-fold.
