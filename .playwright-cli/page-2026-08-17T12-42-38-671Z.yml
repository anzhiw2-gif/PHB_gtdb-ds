            - generic [ref=e109]:
              - heading "Abstract" [level=2] [ref=e110]
              - paragraph [ref=e112]:
                - text: The thermophilic bacterium Thermus thermophilus HB8 has been characterized as a polyhydroxybutyrate (PHB)-degrading microorganism since it grows efficiently and forms clear zones on agar plates containing PHB as sole carbon source. T. thermophilus extracellular PHB depolymerase was purified to homogeneity using an affinity chromatography protocol. The purified enzyme was estimated to have an apparent molecular mass of 42 kDa. The extracellular PHB depolymerase gene was identified as the TTHA0199 gene product of T. thermophilus HB8. The amino acid sequence of the TTHA0199 gene product shared significant homologies to other carboxylesterases. A catalytic triad was identified consisting of S
                - subscript [ref=e113]: "183"
                - text: ", E"
                - subscript [ref=e114]: "310"
                - text: ", and H"
                - subscript [ref=e115]: "405"
                - text: . A pentapeptide sequence (GX
                - subscript [ref=e116]: "1"
                - text: SX
                - subscript [ref=e117]: "2"
                - text: G) exists within the molecule, characteristic for PHB depolymerases (lipase box) and for other serine hydrolases. Purified extracellular PHB depolymerase was stable at high temperatures with an optimum activity at pH 8.0. The apparent Km value of the purified enzyme for PHB was 53 μg/ml. As the main product of the enzymic hydrolysis of PHB, the monomer 3-hydroxybutyrate was identified, suggesting that the enzyme acts principally as an exo-type hydrolase.
