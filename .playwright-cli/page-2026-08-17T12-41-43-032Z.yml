                - paragraph [ref=e1186]:
                  - text: Analysis of the DNA-deduced amino acid sequence of PhaZ7 showed no significant sequence similarity to any PHB depolymerase. Only low similarities to several hypothetical proteins of Caenorhabditis elegans, to lipase LipB of B. subtilis, and to some other lipase-like proteins were found (supplemental Figure 2; follow the Supplemental Material link on the Annual Reviews homepage at
                  - link "http://www.annualreviews.org/" [ref=e1187] [cursor=pointer]:
                    - /url: http://arjournals.annualreviews.org/doi/suppl/10.1146/annurev.micro.56.012302.160838
                  - text: ). The similarities were restricted to a modified lipase-box pentapeptide sequence Ala-His-Ser136-Met-Gly and to short regions around a putative oxyanion pocket at His47. This result, in combination with the observed sensitivity of the PhaZ7 to the serine esterase inhibitor DFP and secondary structure prediction in silicio, suggests that PhaZ7 is different from known PHA depolymerases and lipases, but apparently is a member of the serine hydrolase family having a catalytic triad of Ser136, Asp242, His306 (
                  - link "39" [ref=e1189] [cursor=pointer]:
                    - /url: "#right-ref-b41"
                  - text: ","
                  - link "80" [ref=e1191] [cursor=pointer]:
                    - /url: "#right-ref-b82"
                  - text: ).
              - generic [ref=e1192]:
                - text: Enantioselectivity and Hydrolysis Products of PHA Depolymerases
                - paragraph [ref=e1193]:
                  - text: The specificity of PHA depolymerases with respect to the enantiomeric composition of the polymer has been studied mainly with dPHB depolymerase of A. faecalis T1 (
                  - link "1" [ref=e1195] [cursor=pointer]:
                    - /url: "#right-ref-b1"
                  - text: ","
                  - link "4" [ref=e1197] [cursor=pointer]:
                    - /url: "#right-ref-b4"
                  - text: ","
                  - link "16" [ref=e1199] [cursor=pointer]:
                    - /url: "#right-ref-b18"
                  - text: ) and with nPHB depolymerase PhaZ7 of P. lemoignei (
                  - link "29" [ref=e1201] [cursor=pointer]:
                    - /url: "#right-ref-b31"
                  - text: ). All PHA depolymerases analyzed so far are specific for 3HA-esters in the natural (R)-configuration. Polymers or oligomers of (S)-3HA or ester bonds between a (R)- and (S)-3HA unit are not cleaved. However, copolymers of (R)- and (S)-3HA were hydrolyzed between two adjacent (R)-3HA (
                  - link "4" [ref=e1203] [cursor=pointer]:
                    - /url: "#right-ref-b4"
                  - text: ). Such (R)-(R)-ester bonds statistically appear in atactic PHB [Poly(R, S-3HB)]. Therefore, the hydrolysis products of microbial-degraded atactic PHB are higher oligomers compared to the hydrolysis products of natural PHB with 100% (R)-configuration (
                  - link "18" [ref=e1205] [cursor=pointer]:
                    - /url: "#right-ref-b20"
                  - text: ).
                - paragraph [ref=e1206]:
                  - text: Hydrolysis of end-labeled 3HB oligomers by purified A. faecalis dPHB depolymerase showed that the enzyme mainly cleaved the second and third ester linkage from the hydroxy terminus (
                  - link "73" [ref=e1208] [cursor=pointer]:
                    - /url: "#right-ref-b75"
                  - text: ). Since the enzyme also hydrolyzes cyclic 3HB oligomers, the A. faecalis depolymerase has endohydrolase activity in addition to exohydrolase activity (
                  - link "4" [ref=e1210] [cursor=pointer]:
                    - /url: "#right-ref-b4"
                  - text: ","
                  - link "98" [ref=e1212] [cursor=pointer]:
                    - /url: "#right-ref-b100"
                  - text: ). Similar conclusions were drawn by de Koning et al. (
                  - link "11B" [ref=e1214] [cursor=pointer]:
                    - /url: "#right-ref-b13"
                  - text: ), who demonstrated that covalently cross-linked dPHAMCL was hydrolyzed by P. fluorescens GK13. It is assumed that most if not all extracellular PHA depolymerases including fungal enzymes have endo- and exohydrolase activity (
                  - link "90" [ref=e1216] [cursor=pointer]:
                    - /url: "#right-ref-b92"
                  - text: ). Depending on the depolymerase the end products are only monomers, monomers and dimers, or a mixture of oligomers. If oligomers are the end products of PHA depolymerases, bacteria have oligomer hydrolases or dimer hydrolases that cleave the oligomers/dimers to the monomer [see references within (
                  - link "85" [ref=e1218] [cursor=pointer]:
                    - /url: "#right-ref-b87"
                  - text: )].
              - generic [ref=e1219]:
                - generic [ref=e1220]: Molecular Biology and Functional Analysis of dPHAMCL Depolymerases
                - paragraph [ref=e1221]:
                  - text: In contrast to a large variety of isolated and more or less well-characterized dPHASCL depolymerases, only few dPHAMCL depolymerases have been described so far. The dPHO depolymerase of P. fluorescens GK13 is the only one that has been purified and studied at the molecular level (
                  - link "49" [ref=e1223] [cursor=pointer]:
                    - /url: "#right-ref-b51"
                  - text: ","
                  - link "91" [ref=e1225] [cursor=pointer]:
                    - /url: "#right-ref-b93"
                  - text: ","
                  - link "92" [ref=e1227] [cursor=pointer]:
                    - /url: "#right-ref-b94"
                  - text: ). For a survey of gram-positive and gram-negative dPHAMCL-degrading bacteria see (
                  - link "93" [ref=e1229] [cursor=pointer]:
                    - /url: "#right-ref-b95"
                  - text: "). The dPHO depolymerase of P. fluorescens significantly differs from dPHASCL depolymerases: It is specific for PHAMCL and for soluble esters such as p-nitrophenylacylesters with six or more carbon atoms in the fatty acid moiety. dPHB and other dPHASCL are not hydrolyzed. The enzyme is not inhibited by DTT or EDTA and is not dependent on Ca"
                  - superscript [ref=e1230]: 2+
                  - text: or other divalent cations. Recently, a PHAMCL depolymerase was isolated from a Xanthomonas-like strain that hydrolyzed a copolyester of 3-hydroxy-5-phenoxyvalerate and 28% 3-hydroxy-7-phenoxyheptanoate (
                  - link "53" [ref=e1232] [cursor=pointer]:
                    - /url: "#right-ref-b55"
                  - text: ). The purified enzyme could not hydrolyze PHASCL; the ability to hydrolyze PHO was not tested. Another bacterium with extracellular PHAMCL activity is Comamonas sp. P37C (
                  - link "81" [ref=e1234] [cursor=pointer]:
                    - /url: "#right-ref-b83"
                  - text: ). Cell-free culture fluid of PHO-grown Comamonas sp. P37C cells showed high PHO depolymerase and weak PHB depolymerase activity. It is not known whether the bacterium synthesizes two enzymes with different substrate specificities for PHASCL and PHAMCL or only one enzyme with broad specificity for both types of polyesters.
                - paragraph [ref=e1235]:
                  - text: The deduced amino acid sequence of the cloned dPHO depolymerase gene of P. fluorescens GK13 has no significant homology to PHASCL depolymerases except for small regions in the neighborhood of a lipase-box (Gly-Xaa1-Ser172-Xaa2-Gly), an aspartate (Asp228), and a histidine (His260) residue. Site-directed mutagenesis of these amino acids confirmed that these amino acids are essential for activity (
                  - link "91" [ref=e1237] [cursor=pointer]:
                    - /url: "#right-ref-b93"
                  - text: ","
                  - link "93" [ref=e1239] [cursor=pointer]:
                    - /url: "#right-ref-b95"
                  - text: ) and that they presumably constitute a catalytic triad (serine hydrolase). Interestingly, the three catalytic triad amino acids (Ser172, Asp228, His260) are located in the C-terminal region of the protein, which is different to all known PHASCL depolymerases. It is assumed that the N-terminal part of the protein constitutes a polymer-binding site. This assumption was supported by PCR-induced mutagenesis of the dPHO depolymerase gene and selection of mutants that were impaired in dPHO depolymerase activity but still had almost-normal levels of esterase activity with p-nitrophenyloctanoate. DNA sequencing of 30 mutants revealed that most of the mutations were located in the N-terminal region of the mature depolymerase [amino acid 1-65 (
                  - link "49" [ref=e1241] [cursor=pointer]:
                    - /url: "#right-ref-b51"
                  - text: )]. In particular, amino acids near Leu15, Phe50, and Phe63 represented hot spots because these or neighboring amino acids were mutated in 16 independently isolated mutants (supplemental Figure 3; follow the Supplemental Material link on the Annual Reviews homepage at
                  - link "http://www.annualreviews.org/" [ref=e1242] [cursor=pointer]:
                    - /url: http://arjournals.annualreviews.org/doi/suppl/10.1146/annurev.micro.56.012302.160838
                  - text: ). Because the esterase activity of these mutant dPHO depolymerase proteins was not significantly changed, it is assumed that these amino acids are involved in the interaction of the enzyme with its polymeric substrate. The reason for the observed phenotypic differences between mutants with residual opaqueness of the clearing zones and mutants with clear halos is unknown (
                  - link "Figure 1" [ref=e1244] [cursor=pointer]:
                    - /url: "#f1"
                  - text: ).
              - generic [ref=e1245]:
                - text: Regulation of PHA Depolymerase Synthesis
                - paragraph [ref=e1246]:
                  - text: The synthesis of PHA depolymerases in bacteria is generelly repressed if suitable soluble carbon sources such as glucose or organic acids are present. However, after exhaustion of the soluble nutrients synthesis of PHA depolymerases is derepressed in many strains (
                  - link "47" [ref=e1248] [cursor=pointer]:
                    - /url: "#right-ref-b49"
                  - text: ). At least in some bacteria dPHB depolymerase is expressed even in the absence of the polymer after cessation of growth. Therefore, an induction mechanism by the polymer itself is not necessary.
                - paragraph [ref=e1249]:
                  - text: In most known dPHA-degrading bacteria high levels of dPHA depolymerase are produced only during growth on dPHA but are repressed on succinate. In contrast, production of PHASCL depolymerases by P. lemoignei is maximal during growth in batch culture on succinate. Therefore, isolation of PHASCL depolymerases from P. lemoignei is usually performed from succinate-grown cells (
                  - link "12" [ref=e1251] [cursor=pointer]:
                    - /url: "#right-ref-b14"
                  - text: ","
                  - link "71" [ref=e1253] [cursor=pointer]:
                    - /url: "#right-ref-b73"
                  - text: ","
                  - link "73" [ref=e1255] [cursor=pointer]:
                    - /url: "#right-ref-b75"
                  - text: ). Synthesis of dPHB depolymerase on succinate is pH-dependent and occurs only above pH 7 (
                  - link "103" [ref=e1257] [cursor=pointer]:
                    - /url: "#right-ref-b105"
                  - text: ). Recently, the relationship between depolymerase synthesis and growth on/uptake of succinate has been elucidated (
                  - link "110" [ref=e1259] [cursor=pointer]:
                    - /url: "#right-ref-b112"
                  - text: "): It was shown that transport of succinate into the bacteria is pH-dependent and does not work well above pH 7 in P. lemoignei. As a consequence the bacteria starve even in the presence of residual succinate at pH above 7, and depolymerase synthesis is derepressed. Analysis of the succinate transport system of P. lemoignei revealed that it utilizes only the monocarboxylate form of succinate (H-succinate"
                  - superscript [ref=e1260]: 1−
                  - text: ) but is not able to take up the dicarboxylate (succinate
                  - superscript [ref=e1261]: 2−
                  - text: ). The pH of the culture fluid increases during growth of P. lemoignei in batch culture on succinate owing to the uptake of succinic acid. As a consequence, the concentration of the H-succinate
                  - superscript [ref=e1262]: 1−
                  - text: ion (pKA2 = 5.6) decreases. The inition of dPHB depolymerase synthesis above pH 7 can be considered as induced by carbon starvation because of insufficient uptake of H-succinate
                  - superscript [ref=e1263]: 1−
                  - text: at high pH (
                  - link "110" [ref=e1265] [cursor=pointer]:
                    - /url: "#right-ref-b112"
                  - text: ).
                - paragraph [ref=e1266]:
                  - text: Analysis of the DNA region adjacent to depolymerase genes revealed a putative transcriptional regulator gene, phaR, in front of phaZ2 in P. lemoignei. Based on analysis of phaZ::lacZ transcriptional fusions in P. lemoignei wild-type and in phaR null mutants, it was demonstrated that PhaR is a negative regulator of phaZ2 (dPHB depolymerase B) but does not affect the expression of other depolymerases (
                  - link "109" [ref=e1268] [cursor=pointer]:
                    - /url: "#right-ref-b111"
                  - text: ).
                - paragraph [ref=e1269]:
                  - text: "Regulation of dPHAMCL depolymerase synthesis apparently is similar to that of dPHB depolymerases: High levels of dPHO depolymerase activity were found during growth of P. fluorescens GK13 on dPHAMCL and on low concentrations of HAMCL-monomers. The presence of sugars or fatty acids repressed synthesis of dPHO depolymerase ("
                  - link "92" [ref=e1271] [cursor=pointer]:
                    - /url: "#right-ref-b94"
                  - text: ). Similar results have been reported for a dPHO depolymerase of P. maculicola (
                  - link "21" [ref=e1273] [cursor=pointer]:
                    - /url: "#right-ref-b23"
                  - text: ).
              - generic [ref=e1274]:
                - text: Influence of Physicochemical Properties of the Polymer on Its Biodegradability
                - paragraph [ref=e1275]:
                  - text: The physicochemical properties of a polyester have a strong impact on its biodegradability. The most important factors are (a) stereoregularity, (b) crystallinity, (c) monomeric composition, and (d) accessibility of the polymer surface. For a recent summary of the influence of physicochemical properties of the polymer on its biodegradability see (
                  - link "42" [ref=e1277] [cursor=pointer]:
                    - /url: "#right-ref-b44"
                  - text: ","
                  - link "43" [ref=e1279] [cursor=pointer]:
                    - /url: "#right-ref-b45"
                  - text: ).
            - generic [ref=e1280]:
              - generic [ref=e1281]: INTRACELLULAR DEGRADATION OF PHA
              - generic [ref=e1284]:
                - text: Mobilization of PHA in Bacteria
                - paragraph [ref=e1285]:
                  - text: The mechanism and regulation of the intracellular degradation of PHA (i.e., the mobilization of previously accumulated polyester) is poorly understood. Lemoigne (
                  - link "60" [ref=e1287] [cursor=pointer]:
                    - /url: "#right-ref-b62"
                  - text: ) observed already 80 years ago that 3HB appeared upon anaerobic incubation of Bacillus. Macrae & Wilkinson (
                  - link "62" [ref=e1289] [cursor=pointer]:
                    - /url: "#right-ref-b64"
                  - text: ) described a reduction of the PHB content of Bacillus megaterium after aerobic incubation of PHB-rich cells in phosphate buffer. The authors found that autolysis of PHB-rich cells occurred later and to a minor extent compared to PHB-poor cells, and proposed that PHB might function as a storage compound. Hayward et al. (
                  - link "31" [ref=e1291] [cursor=pointer]:
                    - /url: "#right-ref-b33"
                  - text: ) observed that the intracellular content of PHA in Rhizobium, Spirillum, and Pseudomonas species had a maximum followed by a decrease in the stationary growth phase. Similar reports have been published for Micrococcus halodenitrificans and Ralstonia eutropha H16 [(
                  - link "32" [ref=e1293] [cursor=pointer]:
                    - /url: "#right-ref-b34"
                  - text: ) and references within (
                  - link "33" [ref=e1295] [cursor=pointer]:
                    - /url: "#right-ref-b35"
                  - text: )]. Survival of bacteria in the absence of exogeneous carbon sources was dependent on the intracellular PHB content. A cyclic metabolic route (the PHB circle) from acetyl-CoA via acetoacetyl-CoA, 3HB-CoA to PHB (PHB biosynthesis-sequence); and from PHB via 3HB and acetoacetate to acetoacetyl-CoA and acetyl-CoA by i-PHB depolymerase, 3HB dehydrogenase, acetoacetate:succinyl-CoA transferase, and ketothiolase (PHB degradation-sequence) was formulated (
                  - link "77" [ref=e1297] [cursor=pointer]:
                    - /url: "#right-ref-b79"
                  - text: ","
                  - link "95" [ref=e1299] [cursor=pointer]:
                    - /url: "#right-ref-b97"
                  - text: ). Doi and coworkers (
                  - link "17" [ref=e1301] [cursor=pointer]:
                    - /url: "#right-ref-b19"
                  - text: ) reported on the cyclic nature of PHA metabolism. The assumption of a simultaneous synthesis and degradation of PHB was confirmed by
                  - superscript [ref=e1302]: "14"
                  - text: C-glucose pulse experiments (
                  - link "106" [ref=e1304] [cursor=pointer]:
                    - /url: "#right-ref-b108"
                  - text: "): The bacteria incorporated the label into PHB at a high rate even after the end of net PHB accumulation, i.e., during PHB degradation. However, the physiological reason for the energy-consuming cycle of degradation and synthesis of PHA remains unknown. One could imagine that PHB functions as a carbon buffer similar to a water reservoir that is continuously filled up by river water (PHA accumulation) but is also continuously utilized by taking drinking water from the reservoir (PHA mobilization). Depending on the volumes of influx and efflux the sum of both processes is either positive (≈PHB net accumulation) or negative (≈PHB net mobilization)."
                - paragraph [ref=e1305]:
                  - text: Rapid intracellular mobilization of PHB was shown also for Legionella pneumophila and Hydrogenophaga pseudoflava in the absence of an exogeneous carbon source (
                  - link "10" [ref=e1307] [cursor=pointer]:
                    - /url: "#right-ref-b10"
                  - text: ","
                  - link "41" [ref=e1309] [cursor=pointer]:
                    - /url: "#right-ref-b43"
                  - text: ). For L. pneumophila a correlation between the amount of accumulated PHB and the long-term survival (up to 600 days) in the absence of an exogeneous carbon source was found. Recently, it was shown that R. eutropha H16 could even grow in the absence of any exogeneous carbon source by utilizing previously accumulated PHB (
                  - link "30" [ref=e1311] [cursor=pointer]:
                    - /url: "#right-ref-b32"
                  - text: ","
                  - link "49" [ref=e1313] [cursor=pointer]:
                    - /url: "#right-ref-b51"
                  - text: ). The key enzymes of intracellular mobilization of PHA are intracellularly located PHA depolymerases, which are able to hydrolyze nPHA. These enzymes differ from e-dPHA depolymerases in their inability to hydrolyze crystalline dPHA (see below). It is interesting that an e-PHB depolymerase (PhaZ7) with specificity for nPHB has been described for P. lemoignei [see above, (
                  - link "29" [ref=e1315] [cursor=pointer]:
                    - /url: "#right-ref-b31"
                  - text: )]. However, this enzyme was located extracellularly and cannot be responsible for intracellular PHA mobilization.
              - generic [ref=e1316]:
                - text: Structure and Properties of nPHA Granules
                - paragraph [ref=e1317]:
                  - text: It is generally accepted that intracellular PHB granules are amorphous and are covered by a surface layer consisting of proteins and phospholipids (nPHB) (
                  - link "26" [ref=e1319] [cursor=pointer]:
                    - /url: "#right-ref-b28"
                  - text: ","
                  - link "66" [ref=e1321] [cursor=pointer]:
                    - /url: "#right-ref-b68"
                  - text: ). The surface layer of nPHB granules can be destroyed or removed by exposure to chemicals such as solvents, detergents, and alkali [(
                  - link "25" [ref=e1323] [cursor=pointer]:
                    - /url: "#right-ref-b27"
                  - text: ) and references within]. Physical stress such as freezing-thawing cycles or repeated centrifugation also leads to denaturation of nPHB granules (
                  - link "68" [ref=e1325] [cursor=pointer]:
                    - /url: "#right-ref-b70"
                  - text: ) (
                  - link "Figure 1" [ref=e1327] [cursor=pointer]:
                    - /url: "#f1"
                  - text: ). Denaturation of PHB can be avoided by careful disruption of the cells (French press or enzymatic lysis) and subsequent cautious purification of the granules by density gradient centrifugation.
                - paragraph [ref=e1328]:
                  - text: The major fraction of the proteins of the granule surface layer consists of relatively small amphiphilic polypeptides that presumably have a structural function by mediating between the water-insoluble polymer core and the hydrophilic cytoplasm. These structural proteins are called phasins and have a high affinity to PHA granules [(
                  - link "99" [ref=e1330] [cursor=pointer]:
                    - /url: "#right-ref-b101"
                  - text: ) and references within (
                  - link "101" [ref=e1332] [cursor=pointer]:
                    - /url: "#right-ref-b103"
                  - text: )]. Phasins may also participate in regulation of PHA synthesis and deposition (
                  - link "114" [ref=e1334] [cursor=pointer]:
                    - /url: "#right-ref-b116"
                  - text: ). The surface layer contains additional proteins responsible for biosynthesis (PHB synthase) and polymer degradation (i-PHB depolymerase).
              - generic [ref=e1335]:
                - text: Assay Systems for i-PHA Depolymerases
                - paragraph [ref=e1336]:
                  - text: i-PHA depolymerases are specific for the native, amorphous form of the polymer, and dPHA are not a substrate for these enzymes. Therefore, any form of amorphous PHA may be suited for assay of i-PHA depolymerases. The best way to obtain amorphous PHB is to purifiy PHA granules in the native form. nPHA granules, at least those of Zoogloea ramigera, P. oleovorans, and R. eutropha, contain a significant portion of endogeneous PHB depolymerase attached to the surface of the granules. Therefore, nPHA granules have a slow but significant autohydrolysis rate if incubated under appropriate conditions (
                  - link "19" [ref=e1338] [cursor=pointer]:
                    - /url: "#right-ref-b21"
                  - text: ","
                  - link "20" [ref=e1340] [cursor=pointer]:
                    - /url: "#right-ref-b22"
                  - text: ","
                  - link "30" [ref=e1342] [cursor=pointer]:
                    - /url: "#right-ref-b32"
                  - text: ","
                  - link "49" [ref=e1344] [cursor=pointer]:
                    - /url: "#right-ref-b51"
                  - text: ","
                  - link "86" [ref=e1346] [cursor=pointer]:
                    - /url: "#right-ref-b88"
                  - text: ). Alternatively, nPHA granules can be isolated from recombinant E. coli strains harboring the PHA-biosynthetic genes. Because E. coli does not have any PHA depolymerase genes, nPHA granules from recombinant E. coli are free of any endogeneous self-hydrolyzing activity (
                  - link "30" [ref=e1348] [cursor=pointer]:
                    - /url: "#right-ref-b32"
                  - text: ).
                - paragraph [ref=e1349]:
                  - text: Another way to prepare amorphous PHA is to prepare a PHA latex by emulsifying the chloroform-solubilized polymer with water in the presence of a detergent (SDS, cholate, oleate) and evaporating the solvent afterward (
                  - link "36" [ref=e1351] [cursor=pointer]:
                    - /url: "#right-ref-b38"
                  - text: ). The obtained PHA latex (artificial PHA) remains amorphous for a long time and is a suitable substrate for many i- and some e-PHA depolymerases. However, it should be noted that such PHA lattices contain an artificial surface layer without phasin proteins. These proteins in vivo may have an impact on the accessibility and degradability of the polymer, and therefore depolymerase activities with artificial granules cannot be compared to those obtained with nPHA granules. Another method to obtain a substrate for i-PHA depolymerases is the treatment of isolated PHA granules with lipases and/or proteases in the presence or absence of surfactants (e.g., oleate) (
                  - link "88" [ref=e1353] [cursor=pointer]:
                    - /url: "#right-ref-b90"
                  - text: ). It should be emphasized that the physiological relevance of an i-PHA depolymerase activity that has been determined with artificial granules remains uncertain unless the same activity has been confirmed with the in vivo substrate (nPHA granules) or by physiological analysis of the respective knock-out mutants.
                - paragraph [ref=e1354]: i-PHA depolymerase activity can be determined by (a) following the decrease of the optical density in buffered solution (turbidometric method) or (b) by determination of the amount of NaOH required to keep the decreasing pH constant in an aqueous, nonbuffered medium (titristat method). The turbidometric method is quick, easy to perform, and can be automated in a microtiter plate reader. However, this method is sensitive to experimental errors such as artificial coalescence of the granules, change of optical density, and change in surface area due to changes of the granule's diameter during the reaction. It is not possible to correlate the degree of reduction in optical density with the number of ester bonds cleaved directly. The titristat method is more sophisticated, time-consuming, and needs to be performed in distilled water (problem of enzyme stability), but it provides quantitative data on the number of ester bonds cleaved. The assay of released product, e.g., 3HB or 3HB-oligomers by 3HB dehydrogenase or by HPLC, is possible but higher oligomers are hardly soluble in water and may not be detected quantitatively. Because 3HA oligomers generally are sensitive to treatment with heat, acid, or alkali, the reaction mixtures should not be stopped by these treatments unless appropriate controls on the stability of the oligomers have been performed.
              - generic [ref=e1355]:
                - generic [ref=e1356]: The i-PHB Depolymerase System of Rhodospirillum rubrum
                - paragraph [ref=e1357]:
                  - text: The first biochemical study on intracellular PHB degradation was done by Merrick & Doudoroff (
                  - link "68" [ref=e1359] [cursor=pointer]:
                    - /url: "#right-ref-b70"
                  - text: ). nPHB granules isolated from B. megaterium were used as a substrate for the depolymerase assay. The granules themselves had only low self-hydrolysis activity but were rapidly hydrolyzed by crude extracts of Rhodospirillum rubrum to 3HB and oligomers. Remaining dimers and oligomers could be hydrolyzed to 3HB by a soluble 3HB dimer hydrolase [(
                  - link "85" [ref=e1361] [cursor=pointer]:
                    - /url: "#right-ref-b87"
                  - text: ) and references within]. Interestingly, crude extracts of R. rubrum contained two soluble components that were necessary for hydrolysis of the polymer. One compound was heat-sensitive and was the i-PHB depolymerase itself. The second component was heat-stable and was named activator (
                  - link "68" [ref=e1363] [cursor=pointer]:
                    - /url: "#right-ref-b70"
                  - text: ). Because the effect of the activator on nPHB granules could be replaced by incubation with trace amounts of trypsin (
                  - link "25" [ref=e1365] [cursor=pointer]:
                    - /url: "#right-ref-b27"
                  - text: ) or other unspecific proteases (
                  - link "108" [ref=e1367] [cursor=pointer]:
                    - /url: "#right-ref-b110"
                  - text: ), one would expect that the activator is a protease that removes some protein of the surface layer of nPHA thus making the polyester molecules accessible for the depolymerase. This assumption was supported by the finding that hydrolysis of artificial surfactant-coated PHB granules (see above) did not require treatment with activator (
                  - link "28" [ref=e1369] [cursor=pointer]:
                    - /url: "#right-ref-b30"
                  - text: ","
                  - link "69" [ref=e1371] [cursor=pointer]:
                    - /url: "#right-ref-b71"
                  - text: ). However, the activator could not be inhibited by any protease inhibitor. The activator appeared in the high molecular fraction during gel filtration experiments and was sensitive to proteases; the activator therefore should have at least one peptide or ester bond. Trypsin-activated nPHB were rapidly hydrolyzed by dPHB depolymerase A (PhaZ5) from P. lemoignei but the same enzyme was inactive with nPHB that had been incubated with the activator compound of R. rubrum (U. Technow, R. Handrick & D. Jendrossek, unpublished result). This indicated that the mechanism of activation by trypsin is different from activation by the activator. The activator was resistant to many solvents including phenol and chloroform. It is assumed that the activator somehow interacts with the surface of nPHB, making the polymer accessible for the depolymerase. All attempts to purify the activator and to elucidate its structure were not successful (
                  - link "68" [ref=e1373] [cursor=pointer]:
                    - /url: "#right-ref-b70"
                  - text: ","
                  - link "108" [ref=e1375] [cursor=pointer]:
                    - /url: "#right-ref-b110"
                  - text: ). It must be mentioned that we cannot exclude that the activator compound is an artifact of the in vitro test system.
              - generic [ref=e1376]:
                - generic [ref=e1377]: Properties of the i-PHB Depolymerase of R. rubrum
                - paragraph [ref=e1378]:
                  - text: The i-PHB depolymerase of R. rubrum has been purified (
                  - link "28" [ref=e1380] [cursor=pointer]:
                    - /url: "#right-ref-b30"
                  - text: ). It consists of one polypeptide of 35 kDa and has a pH and temperature optimum of pH 9 and 50°C. In contrast to e-PHA depolymerases the purified i-PHB depolymerase is highly unstable. A high specific activity of 3100 μmol cleaved ester bonds min
                  - superscript [ref=e1381]: −1
                  - text: mg
                  - superscript [ref=e1382]: −1
                  - text: protein was determined (at 45°C) independent whether the nPHB granules were activated by trypsin or by activator. The purified enzyme was inactive with dPHB and had no lipase, protease, or esterase activity with p-nitrophenylacyl esters (2 to 8 carbon atoms). nPHV granules (trypsin-treated) were hydrolyzed but nPHO granules were not indicating a high substrate specificity similar to e-dPHBSCL depolymerases (
                  - link "Table 2" [ref=e1384] [cursor=pointer]:
                    - /url: "#t2"
                  - text: ).
                - paragraph [ref=e1385]:
                  - text: Sequence analysis of the cloned i-PHB depolymerase gene of R. rubrum revealed that the depolymerase had high homologies to e-dPHB depolymerases with a catalytic triad and a type II catalytic domain (
                  - link "Figure 3" [ref=e1387] [cursor=pointer]:
                    - /url: "#f3"
                  - text: ; supplemental Figure 1B; follow the Supplemental Material link on the Annual Reviews homepage at
                  - link "http://www.annualreviews.org/" [ref=e1388] [cursor=pointer]:
                    - /url: http://arjournals.annualreviews.org/doi/suppl/10.1146/annurev.micro.56.012302.160838
                  - text: ", unpublished result), and it had a putative two-dimensional structure related to α/β-proteins. However, the polypeptide was significantly smaller compared to e-dPHB depolymerases (35 kDa compared to 40–60 kDa) and did not contain a linking domain or SBD. Interestingly, a typical signal peptide sequence was found at the N terminus of the predicted polypeptide, and the experiment-determined N terminus of the purified depolymerase coincided with the predicted signal peptidase cleavage site. Therefore, the depolymerase should be located extracellularly, but there is evidence that it is located intracellularly and no activity could be detected in cell-free culture supernatant (R. Handrick & D. Jendrossek, unpublished result). One might speculate that the signal peptide directs the depolymerase into the surface layer of the PHB granule; however, so far there is no experimental support for this assumption. It will be necessary to identify the true location of the depolymerase."
              - generic [ref=e1389]:
                - generic [ref=e1390]: The i-PHASCL Depolymerases of Ralstonia eutropha and of Paracoccus denitrificans
                - paragraph [ref=e1391]:
                  - text: Isolated n-PHB granules of R. eutropha have a low rate of self-hydrolysis, which is about two orders of magnitude lower compared to the hydrolysis rates obtained by R. rubrum extracts. The endogeneous activity of R. eutropha granules can be enhanced about threefold if the PHB-rich bacteria have been exposed to carbon starvation before cell harvest (i.e., mobilization conditions) (
                  - link "30" [ref=e1393] [cursor=pointer]:
                    - /url: "#right-ref-b32"
                  - text: ). The pH optimum of this endogeneous i-PHB depolymerase activity was at pH 7. It was concluded that this activity represents the i-PHB depolymerase and was responsible for mobilization of the storage material during starvation. No significant i-PHB depolymerase activity could be detected in soluble cell extracts of R. eutropha if nPHB granules were used as a substrate (
                  - link "30" [ref=e1395] [cursor=pointer]:
                    - /url: "#right-ref-b32"
                  - text: ). However, a soluble i-PHB depolymerase activity and a second pH optimum at pH 9 have been reported for R. eutropha (
                  - link "88" [ref=e1397] [cursor=pointer]:
                    - /url: "#right-ref-b90"
                  - text: ), as high level trypsin-treated and oleate-coated PHB granules were used. This finding demonstrates the dependence of the results on the assay system. Recently, the DNA sequence of a putative i-PHB depolymerase of R. eutropha was published (
                  - link "84" [ref=e1399] [cursor=pointer]:
                    - /url: "#right-ref-b86"
                  - text: ). The heterologically (E. coli) expressed depolymerase hydrolyzed artificial amorphous PHB granules but not freeze-dried dPHB. The depolymerase was located in the PHB granules fraction. Surprisingly, the DNA-deduced amino acid sequence (47.3 kDa) did not contain a lipase-box fingerprint and had no similarities to the R. rubrum i-PHB depolymerase. Chromosomal knock-out mutants in the i-PHB depolymerase gene showed a reduced but still significant self-hydrolyis activity. It was concluded that the gene could be partially responsible for PHB mobilization and that other (so far unkown) depolymerase isoenzymes must be present in R. eutropha (
                  - link "30" [ref=e1401] [cursor=pointer]:
                    - /url: "#right-ref-b32"
                  - text: ).
                - paragraph [ref=e1402]:
                  - text: Recently, a putative i-PHB depolymerase gene of P. denitrificans was found adjacent but in opposite orientation to the PHB synthase gene phaC (
                  - link "23" [ref=e1404] [cursor=pointer]:
                    - /url: "#right-ref-b25"
                  - text: ). The heterologically expressed (E. coli) gene product hydrolyzed artificial protease- and oleate-treated PHB granules. The DNA-deduced amino acid sequence had no similarities to the R. rubrum i-PHB depolymerase but had high similarities to the R. eutropha i-PHB depolymerase and to several hypothetical proteins, which have been identified by sequencing of several bacterial genomes (supplemental Figure 4; follow the Supplemental Material link on the Annual Reviews homepage at
                  - link "http://www.annualreviews.org/" [ref=e1405] [cursor=pointer]:
                    - /url: http://arjournals.annualreviews.org/doi/suppl/10.1146/annurev.micro.56.012302.160838
                  - text: ). None of the DNA-deduced genes contained a lipase box or any other significant homologies to proteins of databases. More biochemical and physiological data on i-PHB depolymerase are necessary for a better understanding of the in vivo function of these genes.
              - generic [ref=e1406]:
                - generic [ref=e1407]: i-PHAMCL Depolymerases
                - paragraph [ref=e1408]:
                  - text: Self-hydrolysis of n-PHA granules has been described for n-PHO granules of P. oleovorans (
                  - link "19" [ref=e1410] [cursor=pointer]:
                    - /url: "#right-ref-b21"
                  - text: ","
                  - link "20" [ref=e1412] [cursor=pointer]:
                    - /url: "#right-ref-b22"
                  - text: ","
                  - link "104" [ref=e1414] [cursor=pointer]:
                    - /url: "#right-ref-b106"
                  - text: ). The pH optimum was at pH 8. Inhibition by serine esterase inhibitors indicated that the active center of i-PHAMCL depolymerases might be related to that of e-PHA depolymerases and other serine esterases. A putative i-PHAMCL depolymerase gene (phaD, suggested to be renamed as phaZ) was identified first for P. oleovorans (
                  - link "37" [ref=e1416] [cursor=pointer]:
                    - /url: "#right-ref-b39"
                  - text: ). Interestingly, phaZ was located colinear between two copies of PHA synthase genes (phaC1 and phaC2). Mutants in phaZ were defective in PHAMCL degradation. Therefore, it is likely that the open reading frame between the two synthase genes represents the i-PHO depolymerase gene. The deduced amino acid sequence contained a potential lipase box (GVSWG) but no significant homologies to any i-PHASCL depolymerases. Recently, physiological data confirmed the involvement of this gene for survival during starvation (
                  - link "83" [ref=e1418] [cursor=pointer]:
                    - /url: "#right-ref-b85"
                  - text: ). The same arrangement of two PHO synthase genes separated by a putative depolymerase gene with high sequence similarity to the putative P. oleovorans i-PHAMCL depolymerase was also found for several other pseudomonads and related bacteria (see supplemental Figure 5; follow the Supplemental Material link on the Annual Reviews homepage at
                  - link "http://www.annualreviews.org/" [ref=e1419] [cursor=pointer]:
                    - /url: http://arjournals.annualreviews.org/doi/suppl/10.1146/annurev.micro.56.012302.160838
                  - text: ).
