                            - generic [ref=e336]:
                              - text: A total of 13 869 PHA depolymerases were predicted in 1295 metagenomes from aquatic (417), terrestrial (764), solid waste (23) and wastewater (91) environments. A. World map showing geocoordinates of samples with metagenomes containing one or more predicted PHA depolymerase, coloured by GOLD ecosystem type. Metagenomes sequenced from all seven continents were included in our dataset but were unequally represented, with certain regions having more sampled locations and sample types than others. B. Metagenomes from North America were the most heavily represented in our dataset and nearly every ecosystem type showed some evidence for PHA depolymerase genes within this region. Several samples share geocoordinates and represent samples taken at different depths, samples taken within close proximity to each other, or at different time points. [Color figure can be viewed at
                              - link "wileyonlinelibrary.com" [ref=e337] [cursor=pointer]:
