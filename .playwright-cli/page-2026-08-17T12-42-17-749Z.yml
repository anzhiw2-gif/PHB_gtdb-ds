                  - generic [ref=f1e1161]:
                    - heading "Preparation of the S39A mutant protein" [level=3] [ref=f1e1162]
                    - generic [ref=f1e1163]:
                      - text: Because attempts to purify recombinant proteins (either wild-type or mutant) from
                      - emphasis [ref=f1e1164]: Escherichia coli
                      - text: cells have been unsuccessful due to the lack of efficiency of protein expression in that host cell, we prepared the mutant protein using a recombinant yeast as a host, according to manufacturers′ protocols. A cDNA fragment of a gene encoding PHB depolymerase (
                      - emphasis [ref=f1e1165]: phaZ
                      - subscript [ref=f1e1166]:
                        - emphasis [ref=f1e1167]: Pfu
                      - text: ) was amplified with a pair of primers 5′-GCAGGAATTCTAACGGCCCTACCTGCCTTC-3′ (pPICZαNEco) and 5′-TACTGAATTCCTAGCCTTGAAAGCCACTGACAAT-3′ (pPICZαCEco), and recombinant plasmid pUC18 carrying
                      - emphasis [ref=f1e1168]: phaZ
                      - subscript [ref=f1e1169]:
                        - emphasis [ref=f1e1170]: Pfu
                      - text: at the EcoRI site (designated as pUCPFDP) as a template. Site-directed mutagenesis was performed using an LA PCR
                      - superscript [ref=f1e1171]: TM
                      - emphasis [ref=f1e1172]: in vitro
                      - text: mutagenesis kit (TaKaRa Bio Inc, Kyoto, Japan). For mutation of the nucleophilic Ser39 to Ala, a synthetic oligonucleotide 5′-GCTAGCTAGACCAGAGACAG-3′ was used as a primer. The template for the mutagenesis was obtained by PCR using a pair of primers pPICZαNEco and pPICZαCEco, pUCPFDP as a template, and Deep Vent DNA polymerase (New England Biolabs, MA, USA). The PCR product was ligated to SmaI–digested pUC18, yielding a plasmid pUCPFDPTemp, which contained a complete
                      - emphasis [ref=f1e1173]: phaZ
                      - subscript [ref=f1e1174]:
                        - emphasis [ref=f1e1175]: Pfu
                      - text: gene. The mutated DNA fragment was inserted into pUC18, and was transformed into
                      - emphasis [ref=f1e1176]: E. coli
                      - text: DH5α. The mutated DNA fragment was amplified by the PCR method with a set of primers (pPICZαNEco and pPICZαCEco). EcoRI-digested PCR product was ligated into EcoRI-digested and dephosphorylated pPICZαB (Invitrogen Japan KK, Tokyo, Japan), yielding a plasmid, pPICZS39A. pPICZS39A was cloned in
                      - emphasis [ref=f1e1177]: Pichia pastoris
                      - text: KM71H.
                      - emphasis [ref=f1e1178]: P. pastoris
                      - text: carrying the
                      - emphasis [ref=f1e1179]: phaZ
                      - subscript [ref=f1e1180]:
                        - emphasis [ref=f1e1181]: Pfu
                      - text: gene was cultivated for three days at 30 °C in 1 l of BMGH medium under aerobic conditions on a reciprocal shaker (120 strokes/min) in ten 500-ml Sakaguchi flasks. Methanol was added at 24 h intervals, to maintain the concentration at 0.5%. The liquid culture of recombinant
                      - emphasis [ref=f1e1182]: P. pastoris
                      - text: was centrifuged in a KUBOTA AG-5006 rotor at 10,000
                      - emphasis [ref=f1e1183]:
                        - strong [ref=f1e1184]: g
                      - text: for 10 min. The supernatant was filtrated by a mixed cellulose membrane filter with 0.45 μm pore size (Toyo Roshi Kaisha. Ltd., Tokyo, Japan) to remove contaminating mycelium. The mutant protein was purified by hydrophobic column chromatography using a Phenyl Toyopearl column (Tosoh, Tokyo, Japan) from the supernatant according to the same protocol as was used for the wild-type protein.
                      - link [ref=f1e1185] [cursor=pointer]:
                        - /url: "#bib19"
                        - superscript [ref=f1e1188]: "19"
                      - text: Immunological cross-reactivity using an anti-PhaZ
                      - subscript [ref=f1e1189]:
                        - emphasis [ref=f1e1190]: Pfu
                      - text: antibody confirmed the purified mutant depolymerase. The amino-terminal sequence, determined by Edman degradation, was AGILTALPAF, identical to that of the wild-type protein with an extra tetrapeptide (underlined), which was artificially added as a result of the mutagenesis procedure. The activity of the mutant protein was measured by the same method as that for the wild-type protein,
                      - link [ref=f1e1191] [cursor=pointer]:
                        - /url: "#bib19"
                        - superscript [ref=f1e1194]: "19"
                      - text: resulting in no hydrolytic activity toward P(3HB) or
                      - emphasis [ref=f1e1195]: p
                      - text: "-nitrophenylbutyrate."
                  - generic [ref=f1e1196]:
                    - heading "Crystallization, data collection, and structure refinement of the S39A–substrate complex" [level=3] [ref=f1e1197]
                    - generic [ref=f1e1198]:
                      - text: Crystals of the S39A protein were obtained by sitting-drop vapor-diffusion equilibrated against a reservoir containing 2.0 M sodium chloride, 100 mM acetate–NaOH buffer (pH 4.5), and 5% (v/v) 1,4-dioxane, at 21 °C. The crystals belonged to the monoclinic space group
                      - emphasis [ref=f1e1199]: C
                      - text: 2 with cell dimensions
                      - emphasis [ref=f1e1200]: a
                      - text: =82.0,
                      - emphasis [ref=f1e1201]: b
                      - text: =48.7,
                      - emphasis [ref=f1e1202]: c
                      - text: =64.8 Å, and β=93.6°, and contained one molecule per asymmetric unit. Crystals of the S39A protein–substrate complex were obtained by soaking S39A protein crystals in a solution containing 2.5 M sodium chloride, 100 mM acetate–NaOH buffer (pH 4.5), 5% 1,4-dioxane, 20% glycerol, and 10 mM H(R3HB)
                      - subscript [ref=f1e1203]: "3"
                      - text: M for about 5 min. They diffracted X-rays up to 1.6 Å resolution. Data collection, reduction, and structure refinement were conducted using the same procedures as those for the native data. An initial model was obtained by the molecular replacement method using the coordinates of the wild-type enzyme as a search model. Crystallographic
                      - emphasis [ref=f1e1204]: R
                      - text: and free-
                      - emphasis [ref=f1e1205]: R
                      - text: (calculated with 10% of the total reflections) factors were converged to 17.9% and 20.7%, respectively, against data up to a 1.66 Å resolution. The current model consists of 318 residues (Thr21–Gln338), one
                      - emphasis [ref=f1e1206]: "N"
                      - text: "-acetylglucosamine bound to Asn144, one trimer of R3HB (H(R3HB)"
                      - subscript [ref=f1e1207]: "3"
                      - text: M lacking the carboxy-terminal methyl group), and 256 water molecules. N-terminal four residues, which are artificially added in the mutant protein due to the experimental design of the mutation, were not clearly visible in the electron density map. The refined model has reasonable stereochemistry, as verified with the PROCHECK program,
                      - link [ref=f1e1208] [cursor=pointer]:
                        - /url: "#bib42"
                        - superscript [ref=f1e1211]: "42"
                      - text: "giving 0.4% (one residue: Ala39, the mutation site) of the non-glycine residues in the generously allowed region of the Ramachandran plot. Data collection and refinement statistics are summarized in"
                      - link "Table 1" [ref=f1e1212] [cursor=pointer]:
                        - /url: "#tbl1"
                      - text: ","
                      - link "Table 2" [ref=f1e1214] [cursor=pointer]:
                        - /url: "#tbl2"
                      - text: ", respectively."
                  - generic [ref=f1e1216]:
                    - heading "Protein Data Bank accession numbers" [level=3] [ref=f1e1217]
                    - generic [ref=f1e1218]:
                      - text: The atomic coordinates have been deposited in the RCSB Protein Data Bank
                      - link "†" [ref=f1e1219] [cursor=pointer]:
                        - /url: "#fn1"
                      - text: with accession codes 2D80 and 2D81 for the wild-type enzyme and the S39A–R3HB complex, respectively.
