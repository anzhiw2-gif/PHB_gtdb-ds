                  - link "Fig. 4B" [ref=e577] [cursor=pointer]:
                    - /url: "#F4"
                  - text: ), which was consistent with the optimal growth temperature (45°C) of H. mediterranei (
                  - link "41" [ref=e578] [cursor=pointer]:
                    - /url: "#core-collateral-B41"
                  - text: ). The purified His
                  - subscript [ref=e579]: "6"
                  - text: "-PhaZh1 hydrolyzed the nPHA granules isolated from the haloarchaeon strain H. mediterranei EPSΔphaZh1 ("
                  - link "Fig. 4B" [ref=e580] [cursor=pointer]:
