                        - paragraph [ref=e467]: Taking into account all these results, we can assume that the observed differences in biomass among these strains might be a direct consequence of the PHA content versus carbon consumption by central metabolic pathways. The complete exhaustion of octanoic acid in the KT42C1 culture correlates with the increased number of viable cells in comparison with that of the wild-type and KT42Z strains.
                        - paragraph [ref=e468]: The lack of PHA synthesis directed the cells metabolism to consume the carbon source for increasing cell number, even in the presence of a low concentration of nitrogen and thus, we can conclude that the bacterial community is strongly influenced by PHA metabolism.
                      - generic [ref=e469]:
                        - heading "Cell viability versus PHA mobilization under carbon starvation and nitrogen extra addition" [level=3] [ref=e470]
                        - paragraph [ref=e471]:
                          - text: The number of viable cells in cultures of KT42C1 and KT42Z mutants and wild-type strain was monitored over 16 days of incubation to determine their ability to mobilize the accumulated PHA under carbon starvation conditions, as well as the influence of PHA content in cell viability over the time.
                          - link "Figure 3" [ref=e472] [cursor=pointer]:
                            - /url: "#f3"
                          - text: shows that cell viability was constant during the first week for all the strains, maintaining the difference of an order of magnitude between KT42C1 and the other strains. At day number 7, all cultures were split up and the influence of nitrogen supplementation in cell viability was tested during 9 days. Thus, the number of viable cells was determined in culture samples supplemented with ammonium sulfate and compared with that of culture samples without nitrogen (
                          - link "Fig. 3" [ref=e473] [cursor=pointer]:
                            - /url: "#f3"
                          - text: ). At the eighth day, PHA granules completely disappeared in KT2442 nitrogen-supplemented cells as determined by phase-contrast microscopy (data not shown). Simultaneously, the number of KT2442 cells increased to the same level of the mutant KT42C1 while that of KT42Z and KT42C1 remained unchanged. The results demonstrated that P. putida KT2442 is able to mobilize the stored carbon in the presence of nitrogen even in the absence of external energy sources. The cell viability of KT42C1 cells slightly decreased after the first week of cultivation independently of the addition of extra nitrogen sources, but it kept in the same order of magnitude over 16 days of monitoring (
                          - link "Fig. 3" [ref=e474] [cursor=pointer]:
                            - /url: "#f3"
                          - text: ). These experiments strongly suggest that the ability for PHA accumulation/mobilization in P. putida KT2442 makes this strain more robust to become adapted to unfavourable nutrient conditions. Moreover, the fact that addition of extra nitrogen source promotes PHA hydrolysis is in agreement with our previous finding, which demonstrated the induction of the depolymerase transcription in the presence of extra added nitrogen sources (
                          - link "de Eugenio et al., 2007" [ref=e475] [cursor=pointer]:
                            - /url: "#b7"
                          - text: ;
                          - link "2008" [ref=e476] [cursor=pointer]:
                            - /url: "#b12"
                          - text: ).
