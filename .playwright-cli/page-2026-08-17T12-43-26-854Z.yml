                      - /url: "#bib0310"
                    - text: ","
                    - link "25" [ref=f1e395] [cursor=pointer]:
                      - /url: "#bib0315"
                    - text: ", functional PHAs"
                    - link "26" [ref=f1e397] [cursor=pointer]:
                      - /url: "#bib0320"
                    - text: ","
                    - link "27" [ref=f1e399] [cursor=pointer]:
                      - /url: "#bib0325"
