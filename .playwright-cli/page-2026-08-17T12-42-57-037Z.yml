            - generic [ref=e140]:
              - heading "Abstract" [level=2] [ref=e141]
              - paragraph [ref=e143]:
                - text: Cloning and biochemical characterization of a novel extracellular medium-chain-length polyhydroxyalkanoate (mcl-PHA) depolymerase from Streptomyces exfoliatus K10 DSMZ 41693 are described. The primary structure of the depolymerase (PhaZ
                - subscript [ref=e144]: Sex2
                - text: ) includes the lipase consensus sequence (serine-histidine-aspartic acid) which is known for serine hydrolases. Secondary structure analysis shows 7.9 % α-helix, 43.9 % β-sheet, 19.4 % β-turns, and 31.2 % random coil, suggesting that this enzyme belongs to the α/β hydrolase fold family, in agreement with other PHA depolymerases and lipases. The enzyme was efficiently produced as an extracellular active form in Rhodococcus and purified by two consecutive hydrophobic chromatographic steps. Matrix-assisted laser desorption-time-of-flight (MALDI-TOF) analysis of the purified enzyme revealed a monomer of 27.6 kDa with a midpoint transition temperature of 44.2 °C. Remarkably, the activity is significantly enhanced by low concentrations of nonionic and anionic detergents and thermal stability is improved by the presence of 10 % glycerol. PhaZ
                - subscript [ref=e145]: Sex2
                - text: is an endo-exohydrolase that cleaves both large and small PHA molecules, producing (R)-3-hydroxyoctanoic acid monomers as the main reaction product. Markedly, PhaZ
                - subscript [ref=e146]: Sex2
                - text: is able to degrade functionalized polymers containing thioester groups in the side chain (PHACOS), releasing functional thioester-based monomers and oligomers demonstrating the potentiality of this novel biocatalyst for the industrial production of enantiopure (R)-3-hydroxyalkanoic acids.
