                                  - /url: /action/downloadFigures?id=f5&partId=&doi=10.1111%2Fj.1462-2920.2009.02061.x
                                  - generic [ref=e562]: 
                                  - text: PowerPoint
                            - paragraph [ref=e564]: Cyclic nature of PHA metabolism in P. putida KT2442. For PHA content and composition analysis KT2442 and KT42Z strains were cultured under different conditions for 24 or 48 h. Cultures 1 and 4 were grown in 0.1 N M63 plus 15 mM octanoate for 24 h; cultures 2 and 5 were grown in 0.1 N M63 plus 15 mM octanoate for 48 h; cultures 3 and 6 were grown in 0.1 N M63 15 mM octanoate for 24 h, supplemented with 10 mM nonanoic acid and further incubated for 24 additional hours. Numbers inside shadowed bars represent monomer ratio as percentage of CDW. Grey solid bars represent biomass concentration. Error bars represent standard deviation found in three different experiments.
                      - generic [ref=e565]:
                        - heading [level=3] [ref=e566]:
                          - text: Redirecting the PHA metabolism to its hydrolysis in growing cells by increasing PhaZ
                          - subscript [ref=e567]: KT
                          - text: "dosage: multicopy versus monocopy expression systems"
                        - paragraph [ref=e568]:
                          - text: We have demonstrated above that the lack of PHA accumulation machinery in the KT42C1 mutant strain directed the cells to completely consume the carbon and energy sources of the culture medium in order to promote cell division even when a low nitrogen concentration was supplied to the growth medium. Although PHA synthesis and hydrolysis function simultaneously in the wild-type cells, when PHA must be accumulated the synthase and depolymerase levels are precisely balanced to direct the metabolism to polymer synthesis. Then, it could be hypothesized that an extra dosage of PHA depolymerase could break this balance and redirect their PHA metabolism to the hydrolysis counterpart, even when cells were cultured under PHA production conditions. To test this hypothesis we have used the plasmid pPAZ2, which overexpresses PhaZ
                          - subscript [ref=e569]: KT
                          - text: depolymerase. The functionality of the PhaZ
                          - subscript [ref=e570]: KT
                          - text: depolymerase cloned in this plasmid was demonstrated by showing that an increase in the copy number of phaZ
                          - subscript [ref=e571]: KT
                          - text: gene in a PhaZ mutant of the strain P. putida U resulted in a significant reduction of PHA accumulation (
                          - link "de Eugenio et al., 2007" [ref=e572] [cursor=pointer]:
                            - /url: "#b7"
                          - text: ). These findings also suggested that PHA can be hydrolysed simultaneously to its synthesis during growth. In this case, we have constructed the P. putida KTLacI
                          - superscript [ref=e573]: q
                          - text: strain (
                          - link "Table 1" [ref=e574] [cursor=pointer]:
                            - /url: "#t1"
                          - text: ) able to control the expression of the phaZ
                          - subscript [ref=e575]: KT
                          - text: gene cloned in pPAZ2 by a P
                          - subscript [ref=e576]: lac
                          - text: promoter and the inducer IPTG (isopropyl-beta-d-thiogalactopyranoside), since this strain carries a copy of the transcriptional repressor LacI
                          - superscript [ref=e577]: q
                          - text: of Escherichia coli in its genome (see Experimental procedures for the construction). Pseudomonas putida KT2442 (pPAZ2) and P. putida KTLacI
                          - superscript [ref=e578]: q
                          - text: (pPAZ2) were cultured under PHA production conditions and samples were collected after 24 h of growth. Cells of P. putida KTLacI
                          - superscript [ref=e579]: q
                          - text: (pPAZ2) were also cultured in the presence of 5 mM IPTG to induce the expression of the PhaZ
                          - subscript [ref=e580]: KT
                          - text: depolymerase. The PHA content and the composition of the culture medium of each strain were analysed (
                          - link "Table 2" [ref=e581] [cursor=pointer]:
                            - /url: "#t2"
                          - text: ). As expected, the PHA content in the untransformed wild-type strain was 3.5-fold higher than in the recombinant P. putida KT2442 (pPAZ2) which constitutively overexpresses PhaZ
                          - subscript [ref=e582]: KT
                          - text: depolymerase. Even more, the high amount of HAs detected in the culture medium of the recombinant strain also suggests that it has increased its depolymerization capacity. This high PHA hydrolytic capacity was further confirmed when P. putida KTlacI
                          - superscript [ref=e583]: q
                          - text: (pPAZ2) was cultured in the presence or absence of IPTG (
                          - link "Table 2" [ref=e584] [cursor=pointer]:
                            - /url: "#t2"
                          - text: ). In the absence of IPTG, i.e. when depolymerase extra expression is switched off, the PHA content was equally high in both P. putida KTLacI
                          - superscript [ref=e585]: q
                          - text: (pPAZ2) and in the wild-type strain (
                          - link "Table 2" [ref=e586] [cursor=pointer]:
                            - /url: "#t2"
                          - text: ). Similar results were obtained in P. putida KT2442 carrying the control plasmid pBBR1MCS5 (data not shown). However, in the presence of IPTG, i.e. when depolymerase extra expression is switched on, the PHA content is reduced to approximately the half in P. putida KTLacI
                          - superscript [ref=e587]: q
                          - text: (pPAZ2) (
                          - link "Table 2" [ref=e588] [cursor=pointer]:
                            - /url: "#t2"
                          - text: ). The amounts of HAs detected in the culture medium correlate with the PHA content, i.e. the HAs levels increases as far as the PHA content decreases when depolymerase is overexpressed. These results indicate that phaZ expression is perfectly controlled under P
                          - subscript [ref=e589]: lac
                          - text: promoter in the new recombinant strain and allowed us to demonstrate that PHA metabolic balance can be controlled and redirected to promote PHA hydrolysis and, consequently, to secrete HAs to the culture medium. Nevertheless, the growth of these recombinant strains was significantly affected by the presence of gentamicin in the growth media which causes a reduction of cell viability and biomass, and the detection of non-consumed carbon source in the culture media. To solve these problems, we studied the possibility of using a miniTn5 expression system to control the depolymerase dosage in the recombinant strains avoiding the use of antibiotic-containing media (
                          - link "de Lorenzo et al., 1993" [ref=e590] [cursor=pointer]:
                            - /url: "#b20"
                          - text: ;
                          - link "Panke et al., 1998" [ref=e591] [cursor=pointer]:
                            - /url: "#b21"
                          - text: ;
                          - link "Prieto et al., 1999b" [ref=e592] [cursor=pointer]:
                            - /url: "#b1001"
                          - text: ). Therefore, we constructed a stable and regulated expression system for PhaZ
                          - subscript [ref=e593]: KT
                          - text: depolymerase by inserting both regulatory and expression systems into the bacterial genome using the minitransposons from Cascade
                          - superscript [ref=e594]: TM
                          - text: system (Fig. S2). In this case, the overexpression of the target gene is under the control of the benzoate-dependent mutant activator XylS2 and the P
                          - subscript [ref=e595]: m
                          - text: promoter from the well-characterized meta-cleavage catabolic operon of the TOL plasmid of P. putida. Furthermore, the cascade regulatory circuit implies the control of xylS2 expression through NahR4, the benzoate-sensitive mutant of the regulator NahR from the naphthalene degradation plasmid NAH7 (
                          - link "Cebolla et al., 2001" [ref=e596] [cursor=pointer]:
                            - /url: "#b22"
                          - text: ). First, we constructed the plasmid pPAZ6, by cloning the phaZ
                          - subscript [ref=e597]: KT
                          - text: gene in the vector pALEX1b (
                          - link "Table 1" [ref=e598] [cursor=pointer]:
                            - /url: "#t1"
                          - text: ", Fig. S2). For testing the overproduction of the depolymerase under the Cascade"
                          - superscript [ref=e599]: TM
                          - text: system, the plasmid was transferred to E. coli MPO12 (
                          - link "Table 1" [ref=e600] [cursor=pointer]:
                            - /url: "#t1"
                          - text: ), which carries the nahR-P
                          - subscript [ref=e601]: sal
                          - text: "-XylS2 in its chromosome and activates P"
                          - subscript [ref=e602]: m
                          - text: promoter in the presence of salicylate (
                          - link "Royo et al., 2005" [ref=e603] [cursor=pointer]:
                            - /url: "#b23"
                          - text: ) (
                          - link "Fig. 6" [ref=e604] [cursor=pointer]:
                            - /url: "#f6"
                          - text: ). As expected, a protein band of around 32 kDa correlating with the depolymerase molecular mass was clearly detectable in these cells (
                          - link "Fig. 6" [ref=e605] [cursor=pointer]:
                            - /url: "#f6"
                          - text: ", lane 4). The expression cassette P"
                          - subscript [ref=e606]: m
                          - text: ::phaZ
                          - subscript [ref=e607]: KT
                          - text: from plasmid pPAZ6 was excised and cloned into the pPUTTc resulting plasmid pUTTcZ (
                          - link "Table 1" [ref=e608] [cursor=pointer]:
                            - /url: "#t1"
                          - text: ). Then, the plasmids pUTTcZ and pCNB44S2 were transferred by conjugation into P. putida KT2442 resulting the recombinant KTZ1 strain, which carries into its chromosome the expression system nahR4/P
                          - subscript [ref=e609]: sal
                          - text: ::xylS2/P
                          - subscript [ref=e610]: m
                          - text: ::phaZ
                          - subscript [ref=e611]: KT
                          - text: that can be induced by benzoate (
                          - link "Table 1" [ref=e612] [cursor=pointer]:
                            - /url: "#t1"
                          - text: ). In the absence of benzoate, all parameters tested in P. putida KTZ1 cultures, i.e. PHA content, extracellular content of HAs, residual carbon source, biomass and viable cells, were very similar to those observed for the wild-type strain (
                          - link "Table 2" [ref=e613] [cursor=pointer]:
                            - /url: "#t2"
                          - text: ). However, the addition of 5 mM benzoate leads to a drastic decrease in PHA content and an increase in HAs detected in the P. putida KTZ1 culture medium, 10-fold higher than in the wild-type strain (
                          - link "Table 2" [ref=e614] [cursor=pointer]:
                            - /url: "#t2"
                          - text: ). The significant increase in the number of viable cells of P. putida KTZ1 cells with and without inducer can be explained by the ability of KT2442 and its derivative strains to mineralize benzoate (
                          - link "Jiménez et al., 2002" [ref=e615] [cursor=pointer]:
                            - /url: "#b24"
                          - text: ). In this sense, the benzoate content in the supernatant of the medium of KTZ1 varies from 0.73 g l
                          - superscript [ref=e616]: −1
                          - text: at time zero to 0.09 g l
                          - superscript [ref=e617]: −1
                          - text: after 24 h of growing, indicating that the inducer is consumed as carbon and energy source.
