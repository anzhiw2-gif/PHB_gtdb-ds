                      - generic [ref=f1e558]:
                        - term [ref=f1e559]: ⁎
                        - definition [ref=f1e560]:
                          - generic [ref=f1e561]: Note biodegradability is included in all key properties, and efforts should be taken to ensure regardless of material processing or post-production additives, that biodegradability of material is maintained.
                  - generic [ref=f1e562]:
                    - text: Different PHA exhibit a vast range of properties that can be tailored to specific applications, a versatility that lends advantages over bio-based materials derived from cellulose or starch (
                    - link "Kumari et al., 2022" [ref=f1e563] [cursor=pointer]:
                      - /url: "#bb0335"
                    - text: ). While bio-based materials are abundant and cost-effective feedstocks, their properties differ significantly from PHAs. For example, cellulose-based materials offer specific advantages in applications like paper and textiles, but do not offer the same range of properties as PHA. In addition, bio-based plastics derived from corn or plant matter are limited to the properties inherent in the chosen feedstock. In contrast, PHAs can be produced from a variety of renewable feedstocks, allowing for more flexibility in sourcing. Indeed, PHA blends with other biodegradable fillers are innovative solutions that can improve the properties of both materials. For example, nanofillers like cellulose nanocrystrals can be dispersed into PHA matrix, shown to enhance material properties in applications in the food industry (
                    - link "Bhardwaj et al., 2014" [ref=f1e565] [cursor=pointer]:
                      - /url: "#bb0060"
                    - text: ). Similarly, electrospun poly(3-hydroxybutyrate)-bacterial cellulose nanowhiskers (PHB-BCNW) showed improved barrier properties for packaging applications (
                    - link "Fabra et al., 2016" [ref=f1e567] [cursor=pointer]:
                      - /url: "#bb0165"
                    - text: ).
                  - generic [ref=f1e569]:
                    - text: Historically, the production of PHAs has faced challenges in terms of economic viability. When assessing the environmental sustainability of different bioplastics it is essential to consider the entire life cycle, including production, use, and end-of-life disposal (
                    - link "Kumar et al., 2020" [ref=f1e570] [cursor=pointer]:
                      - /url: "#bb0330"
                    - text: ). While many bio-based plastics are generally biodegradable, PHAs' ability to biodegrade in both aerobic and anaerobic conditions makes them suitable for a wider range of environments. The microbial fermentation process involved in PHA production can be more costly than traditional petrochemical processes for synthetic plastics (
                    - link "Chen et al., 2020" [ref=f1e572] [cursor=pointer]:
                      - /url: "#bb0110"
                    - text: ). PHAs can also be more expensive to produce than bio-based materials such as those derived from cellulose or starch (
                    - link "Kumar et al., 2020" [ref=f1e574] [cursor=pointer]:
                      - /url: "#bb0330"
                    - text: ). This has created challenges for widespread adoption.
                  - generic [ref=f1e576]:
                    - text: Research and development efforts are paramount to improve the commercial viability of PHAs as a sustainable alternative to conventional plastics. Indeed, research efforts have extended the utility of PHA polymers to a growing array of commercial products and are no longer confined to the realm of bioplastics (
                    - link "Raza et al., 2018" [ref=f1e577] [cursor=pointer]:
                      - /url: "#bb0565"
                    - text: ). PHAs manifest unique qualities, applications, and features, positioning them as an elevated class of biomaterials in comparison to the broader bioplastics category (
                    - link "Rosenboom et al., 2022" [ref=f1e579] [cursor=pointer]:
                      - /url: "#bb0590"
                    - text: ). This distinctiveness encompasses their versatility, diverse range of molecular structures, and the capability to find applications across a spectrum of industries extending beyond the traditional scope of bioplastics (
                    - link "Chen and Hajnal, 2015" [ref=f1e581] [cursor=pointer]:
                      - /url: "#bb0100"
                    - text: ).
                - generic [ref=f1e583]:
                  - heading "1.2. Diverse PHA structures and properties" [level=3] [ref=f1e584]
                  - generic [ref=f1e585]:
                    - text: Different microorganisms produce PHA with a variety of molecular structures, monomer ratios, and molecular weights. Poly-3-hydroxybutyrate (PHB) stands out as perhaps the most abundant and extensively studied PHA, synthesized by many bacteria including Gram negative
                    - emphasis [ref=f1e586]: Cupriavidus necator, Ralstonia eutropha, Halomonas bluephagesesis
                    - text: ", and certain Gram positive"
                    - emphasis [ref=f1e587]: Bacillus
                    - text: and
                    - emphasis [ref=f1e588]: Streptomyces spp.
                    - text: (
                    - link "Vicente et al., 2023" [ref=f1e589] [cursor=pointer]:
                      - /url: "#bb0715"
                    - text: ;
                    - link "Valappil et al., 2007" [ref=f1e591] [cursor=pointer]:
                      - /url: "#bb0700"
                    - text: ;
                    - link "Fernandez-Bunster and Pavez, 2022" [ref=f1e593] [cursor=pointer]:
                      - /url: "#bb0175"
                    - text: ) . To date, approximately 92 bacterial genera have demonstrated the capability to produce PHA under both anaerobic and aerobic conditions, with knowledge of >160 PHA monomers (
                    - link "Vicente et al., 2023" [ref=f1e595] [cursor=pointer]:
                      - /url: "#bb0715"
                    - text: ), and new synthetic monomers are being added each year (
                    - link "Chen and Hajnal, 2015" [ref=f1e597] [cursor=pointer]:
                      - /url: "#bb0100"
                    - text: ). Depending on the number of carbon atoms, PHA can be categorized into short-chain length PHA (scl PHA) and medium-chain length PHA (mcl PHA). Scl PHA typically consists of monomers with 3–5 carbon atoms, while mcl PHA comprises hydroxyalkanoate monomers with carbon chain lengths ranging from six to fourteen carbon atoms.
                  - generic [ref=f1e599]:
                    - text: Bacteria are known to synthesize different PHA depending on their metabolism and PHA polymerase (PhaC). For example,
                    - emphasis [ref=f1e600]: Ralstonia eutropha
                    - text: can synthesize poly(3-hydroxybutyrate-
                    - emphasis [ref=f1e601]: co
                    - text: "-3-hydroxyvalerate) (PHBV) and"
                    - emphasis [ref=f1e602]: Aeromonas spp.
                    - text: can synthesize poly(3-hydroxybutyrate-
                    - emphasis [ref=f1e603]: co
                    - text: "-3-hydroxyhexanoate PHA (PHBHHx) when fed substrate with precursor materials ("
                    - link "Kaniuk and Stachewicz, 2021" [ref=f1e604] [cursor=pointer]:
                      - /url: "#bb0265"
                    - text: ). The feed composition can significantly influence final PHA composition. Feeding of short-chain fatty acids (5‑carbon valerate, 6‑carbon hexanoic acid) or gamma-butyrolactone introduces longer chain monomers (3-hydroxyvalerate, 3-hydroxyhexanoate, and 4-hydroxybutyrate, respectively) into PHA (
                    - link "Al Battashi et al., 2021" [ref=f1e606] [cursor=pointer]:
                      - /url: "#bb0015"
                    - text: ;
                    - link "Chen and Hajnal, 2015" [ref=f1e608] [cursor=pointer]:
                      - /url: "#bb0100"
                    - text: ). Metabolic engineering has enabled cells to produce PHA with improved material properties, encompassing a range of ductility, elasticity, thermal conductivity, and transparency. Metabolic engineering is used to both increase PHA percentage in the cell mass, direct the PHA to have a particular monomer composition, or introduce monomers into PHA that are non-native to the host. For example,
                    - emphasis [ref=f1e610]: Escherichia coli
                    - text: was engineered to produce poly(3-hydroxypropionate) (poly(3HP)) from glycerol substrate replacing the carcinogenic substrate β-propiolactone (
                    - link "Aduhene et al., 2021" [ref=f1e611] [cursor=pointer]:
                      - /url: "#bb0010"
                    - text: ).
                  - generic [ref=f1e613]:
                    - text: The physicochemical and thermal properties of PHA as a bioplastic depend on various factors, including the producer organisms, cultivation conditions, carbon source, and engineering efforts to redirect metabolism (
                    - link "Anjum et al., 2016" [ref=f1e614] [cursor=pointer]:
                      - /url: "#bb0030"
                    - text: ;
                    - link "Możejko-Ciesielska and Kiewisz, 2016" [ref=f1e616] [cursor=pointer]:
                      - /url: "#bb0455"
                    - text: ). Features of PHA can vary from brittle thermoplastics to rubbery elastomers (
                    - link "Luis et al., 2016" [ref=f1e618] [cursor=pointer]:
                      - /url: "#bb0390"
                    - text: ). Poly-3-hydroxybutyrate (PHB) holds significant potential for a variety of applications, spanning from photographic materials to textiles, medical implants, and nutritional supplements (
                    - link "Chen, 2009" [ref=f1e620] [cursor=pointer]:
                      - /url: "#bb0095"
                    - text: ). Scl-PHA exhibit properties nearly equivalent to those of polypropylene (PP) and polyethylene terephthalate PET, proving advantageous in specific applications (
                    - link "Kinyanjui Muiruri et al., 2023" [ref=f1e622] [cursor=pointer]:
                      - /url: "#bb0275"
                    - text: ). However, scl-PHAs tend to break easily due to their crystalline structure, which means considerable effort has been made to integrate other monomers or blends with the scl-PHA to enhance its physical properties (
                    - link "Wang et al., 2016" [ref=f1e624] [cursor=pointer]:
                      - /url: "#bb0740"
                    - text: ). PHB copolymers, characterized by the repetition of 3-hydroxybutyrate (3HB) and other non-3HB monomers, greatly expand the physical and mechanical property range of these polymers, rendering them suitable for a wide spectrum of applications. For instance, PHBV has greater flexibility, strength, and lessened crystallization than pure PHB polymer and is now also produced at large volumes in industry (
                    - link "Rivera-Briso and Serrano-Aroca, 2018" [ref=f1e626] [cursor=pointer]:
                      - /url: "#bb0585"
                    - text: ). For example, incorporation of 43% 3 HV monomers into PHA improved elongation at break from 3 to 6% (pure PHA) to 58%, an over ten-times increase (
                    - link "Arcos-Hernández et al., 2013" [ref=f1e628] [cursor=pointer]:
                      - /url: "#bb0035"
                    - text: ).
                  - generic [ref=f1e630]:
                    - text: Medium chain length PHA (mcl-PHA) are rubbery and elastic materials and are useful in multiple applications (
                    - link "Madison and Huisman, 1999" [ref=f1e631] [cursor=pointer]:
                      - /url: "#bb0400"
                    - text: ). Meanwhile, terpolymers have two or more secondary monomers in addition to PHB, and include P(3HB-
                    - emphasis [ref=f1e633]: co
                    - text: "-3 HV-"
                    - emphasis [ref=f1e634]: co
                    - text: "-3HHx) and P(3HB-"
                    - emphasis [ref=f1e635]: co
                    - text: "-3 HV-"
                    - emphasis [ref=f1e636]: co
                    - text: "-4HB) ("
                    - link "Vicente et al., 2023" [ref=f1e637] [cursor=pointer]:
                      - /url: "#bb0715"
                    - text: ). Ultra-high molecular weight PHA, with molecular weights measuring several millions, has proven valuable in applications requiring high-strength fibers, such as fishing nets, string, and more (
                    - link "Zheng et al., 2006" [ref=f1e639] [cursor=pointer]:
                      - /url: "#bb0815"
                    - text: ;
                    - link "Kusaka et al., 1998" [ref=f1e641] [cursor=pointer]:
                      - /url: "#bb0350"
                    - text: ). Furthermore, PHA diols have been employed in the creation of PHA block copolymers, known for their temperature sensitivity and non-toxic, biocompatible nature. PHA-block copolymers find use in tissue engineering implants and as matrices for drug delivery (
                    - link "Guillaume, 2017" [ref=f1e643] [cursor=pointer]:
                      - /url: "#bb0215"
                    - text: ; L.
                    - link "Wu et al., 2008" [ref=f1e645] [cursor=pointer]:
                      - /url: "#bb0775"
                    - text: ).
                  - generic [ref=f1e647]:
                    - text: Post-production processing is equally important from a material properties standpoint, and various PHA materials with unique properties have been developed. Plasticizers were shown to improve mechanical properties, decrease melting temperature, and increase water vapor and oxygen permeability in PHBV, with plasticizers triethyl citrate and polyethylene glycol showing most promise (
                    - link "Jost and Langowski, 2015" [ref=f1e648] [cursor=pointer]:
                      - /url: "#bb0255"
                    - text: ). Copolymerization of PHA monomers with existing polymer materials opens avenues for novel materials and an expanded range of physical properties (
                    - link "Taguchi et al., 2008" [ref=f1e650] [cursor=pointer]:
                      - /url: "#bb0670"
                    - text: ). For example, PLA/PHBV blends increased ductility and gas barrier properties by 26 and 70% (
                    - link "Boufarguine et al., 2013" [ref=f1e652] [cursor=pointer]:
                      - /url: "#bb0080"
                    - text: ). Innovative grafting technologies have introduced functional side chains to PHA molecules, enabling chemical modifications that expand their applications. These diverse properties enable PHA to serve as materials with superior oxygen, water, and grease/odor barriers compared to some conventional plastics like PP (
                    - link "Tsang et al., 2019" [ref=f1e654] [cursor=pointer]:
                      - /url: "#bb0690"
                    - text: ). It is crucial to recognize that the composition and structure of these biopolymers influence their degradation in the environment (
                    - link "Emadian et al., 2017" [ref=f1e656] [cursor=pointer]:
                      - /url: "#bb0160"
                    - text: ). Therefore, concerted efforts are essential to ensure that newly synthesized PHA copolymers or esters remain biodegradable.
                - generic [ref=f1e658]:
                  - heading "1.3. Microbial production of PHA" [level=3] [ref=f1e659]
                  - generic [ref=f1e660]:
                    - text: The production of PHAs involves a multi-step process that leverages the metabolic capabilities of certain bacteria. PHA is synthesized naturally in a variety of organisms including
                    - emphasis [ref=f1e661]: Cupriavidus, Ralstonia, Pseudomonas,
                    - text: and
                    - emphasis [ref=f1e662]: Halomonas
                    - text: (
                    - link "Obruča et al., 2022" [ref=f1e663] [cursor=pointer]:
                      - /url: "#bb0490"
                    - text: ). Genetic engineering is often employed to enhance the PHA-production capability in natural producers or in heterologous bacteria such as
                    - emphasis [ref=f1e665]: Escherichia coli
                    - text: (
                    - link "Sohn et al., 2020" [ref=f1e666] [cursor=pointer]:
                      - /url: "#bb0645"
                    - text: ). During the fermentation process, the microorganisms metabolize culture feed, utilizing carbon and nitrogen sources in order to simultaneously increase cell mass and accumulate PHAs as intracellular granules (
                    - link "Saravanan et al., 2022" [ref=f1e668] [cursor=pointer]:
                      - /url: "#bb0610"
                    - text: ). A 7 L fermentation pilot production of PHB using
                    - emphasis [ref=f1e670]: Halomonas bluephagenesis
                    - text: is shown in
                    - link "Fig. 1" [ref=f1e671] [cursor=pointer]:
                      - /url: "#f0005"
                    - text: d. The fermentation conditions, including temperature, pH, and aeration, are carefully controlled to optimize PHA production. The culture medium carbon and nutrient sources can play an important role in both the final yield and structure of the PHA polymer (
                    - link "Saravanan et al., 2022" [ref=f1e673] [cursor=pointer]:
                      - /url: "#bb0610"
                    - text: ). The carbon source selected is often derived from renewable resources like sugars, plant oils, and industrial byproducts.
                  - generic [ref=f1e675]:
                    - text: Fermentations can be run under continuous conditions which offers certain cost benefits in production, though batch or fed-batch fermentation schemes are more common (
                    - link "Koller and Braunegg, 2015" [ref=f1e676] [cursor=pointer]:
                      - /url: "#bb0280"
                    - text: ). At the end of the fermentation, PHA accumulation and cell-density reach a maximum and the culture is harvested. During harvesting, the bacterial biomass and PHA granules are separated from the culture medium (
                    - link "Kosseva and Rusbandi, 2018" [ref=f1e678] [cursor=pointer]:
                      - /url: "#bb0310"
                    - text: ). In order to release the PHA granules, bacterial cells are disrupted, a process that can involve mechanical methods, solvents, or chemicals. Disrupted cell mass is then extracted to separate the PHA from cellular proteins, lipids, and nucleic acids. The extraction and purification process can use a variety of solvents and steps depending on intended final application, which can impact final cost, purity, and yield (
                    - link "Kurian and Das, 2021" [ref=f1e680] [cursor=pointer]:
                      - /url: "#bb0345"
                    - text: ). Finally, purified PHA is processed into pellets, sheets, films, or threads depending on final application (
                    - link "Kosseva and Rusbandi, 2018" [ref=f1e682] [cursor=pointer]:
                      - /url: "#bb0310"
                    - text: ). PHA processed into pellets and powder forms is shown in
                    - link "Fig. 1" [ref=f1e684] [cursor=pointer]:
                      - /url: "#f0005"
                    - text: f and e, respectively.
                - generic [ref=f1e686]:
                  - heading "1.4. Efficiency and environmental impact of PHA production" [level=3] [ref=f1e687]
                  - generic [ref=f1e688]:
                    - text: The efficiency of the PHA production depends on all the steps previously stated, including the choice of bacterial strain, carbon source, fermentation conditions, and downstream processing (
                    - link "Kurian and Das, 2021" [ref=f1e689] [cursor=pointer]:
                      - /url: "#bb0345"
                    - text: ). Conditions important for high efficiency include choice of chassis able to reach high cell density with high percent PHA on a cell mass basis, and using methods in downstream processing that extract PHA while maintaining final product quality (
                    - link "Ren et al., 2018" [ref=f1e691] [cursor=pointer]:
                      - /url: "#bb0580"
                    - text: ).
                  - generic [ref=f1e693]:
                    - text: Ensuring that PHA type is consistent is an important consideration to ensure product quality. Several strategies can be implemented to maintain batch-to-batch quality, including use of robust strains with constrained PHA pathways that may be endogenous or engineered to avoid changes in PHA structure (
                    - link "Chen et al., 2020" [ref=f1e694] [cursor=pointer]:
                      - /url: "#bb0110"
                    - text: ). Standardization of fermentation conditions, use of well-defined carbon source like glucose, and continuous monitoring during microbial cultivation is also crucial to ensure quality control (
                    - link "Koller and Braunegg, 2018" [ref=f1e696] [cursor=pointer]:
                      - /url: "#bb0285"
                    - text: ). Constraints on cell metabolism are important so that feedstocks that are lower-cost and more environmentally sustainable can be used. For example, use of non-standarized raw materials such as food waste hydrolysates was achieved through genetic linkage of PHA-pathway enzymes to stable genetic elements like essential genes, as demonstrated in recent research (
                    - link "Ji et al., 2023" [ref=f1e698] [cursor=pointer]:
                      - /url: "#bb0250"
                    - text: ). Metabolic engineering to delete genetic pathways that might change PHA monomer composition, and mutation of PHA synthase (PhaC) enzyme to be specific for particular monomers should also be considered as strategies to maintain quality.
                  - generic [ref=f1e700]:
                    - text: Several factors contribute to the environmental impact of PHA and other biomaterials. As previously mentioned, PHA has benefits in terms of environmental impact due to its biodegradability, and renewable sourcing using green feedstocks (
                    - link "Kumar et al., 2020" [ref=f1e701] [cursor=pointer]:
                      - /url: "#bb0330"
                    - text: ). The energy consumption during the production of PHAs, a fermentation process, is considered less energy-intensive than traditional plastic production which involves the extraction and refining of fossil fuels (
                    - link "Raza et al., 2018" [ref=f1e703] [cursor=pointer]:
                      - /url: "#bb0565"
                    - text: ). Petrochemical processes emit significant greenhouse gases and consume substantial amounts of energy. Minimizing the energy expenditure and harsh chemical use during the downstream processing of PHA production is important to lower the environmental impact of this biomaterial, and more research is required to lower costs of downstream processing in PHA production.
                  - generic [ref=f1e705]:
                    - text: Cost of production has remained a challenge, and PHA remains more expensive than petroleum-based polymers. The demand for PHA in different industries and especially in high-end applications can play a strategic role in lowering production cost (
                    - link "Goswami et al., 2021" [ref=f1e706] [cursor=pointer]:
                      - /url: "#bb0200"
                    - text: ). As the demand for sustainable and biodegradable alternatives increases, economies of scale and technological advancements may contribute to making PHAs more cost-competitive with traditional plastics in the future.
                - generic [ref=f1e708]:
                  - heading "1.5. Current commercialization" [level=3] [ref=f1e709]
                  - generic [ref=f1e710]:
                    - text: At present, >25 companies (
                    - link [ref=f1e711] [cursor=pointer]:
                      - /url: http://gopha.com
                      - generic [ref=f1e712]:
                        - text: gopha.com
                        - img "Opens in new window" [ref=f1e713]
                    - text: ), producing 30 different brands, have integrated PHA into either their production processes or final products (
                    - link "Koller and Mukherjee, 2022" [ref=f1e715] [cursor=pointer]:
                      - /url: "#bb0290"
                    - text: "). As a comprehensive class of polymers, PHA offer nearly limitless possibilities for generating copolymers and blends capable of replacing various types of petroleum-based plastics. Nevertheless, despite extensive research efforts, only a limited selection of PHAs have achieved successful large-scale production and are commercially available as biodegradable materials. Currently, only five types of PHAs are reported to be commercialized globally by companies: PHB, PHBV, PHBHHx (3HB and 3-hydroxyhexanoate (3HHx), poly(4-hydroxybutyrate) (P4HB), and poly(3-hydroxybutyrate-"
                    - emphasis [ref=f1e717]: co
                    - text: "-4-hydroxybutyrate) or P34HB ("
                    - link "Chen and Hajnal, 2015" [ref=f1e718] [cursor=pointer]:
                      - /url: "#bb0100"
                    - text: ). The list remains short due to a research focus still largely concentrated on PHA discovery in academic laboratories rather than downstream applications (
                    - link "Chen and Hajnal, 2015" [ref=f1e720] [cursor=pointer]:
                      - /url: "#bb0100"
                    - text: ).
                  - generic [ref=f1e722]: The scaling of bioplastic PHA for different technologies requires investment and therefore remains a high-risk business. For example, in 2010 the companies Metabolic and ADM launched a plant for PHA production in the USA, but due to forecast sales misprediction, costs remained higher than profits, leading to both companies abandoning the project technology. However, commercial production of PHA has since then been revived in companies Danimer Scientific (USA), RWDC Industries (USA and Singapore), Yield10 Biosciences (previously Metabolix) and PhaBuilder (China). Meanwhile Tepha (USA) production is focused on medical uses of PHA in order to improve profit margins.
                  - generic [ref=f1e723]:
                    - generic [ref=f1e724]:
                      - text: We propose the exploration of synergies between the invention of novel PHA and the development of final material technologies for PHA to achieve its full sustainable impact as an environmentally friendly material. The potential applications of PHA span a broad spectrum of industries, with a particular emphasis on the medical sector, where the economic practicality may drive widespread adoption due to the overall cost of finished goods. This manuscript provides a comprehensive overview of the industries and products that can be created using PHA-based materials, encompassing everything from medical (
                      - link "Fig. 3" [ref=f1e725] [cursor=pointer]:
                        - /url: "#f0015"
                      - text: ) to agricultural (
                      - link "Fig. 4" [ref=f1e727] [cursor=pointer]:
                        - /url: "#f0020"
                      - text: ), textiles, and household goods (
                      - link "Fig. 2" [ref=f1e729] [cursor=pointer]:
                        - /url: "#f0010"
                      - text: ).
