        - generic [ref=e117]:
          - generic [ref=e118]:
            - heading "Abstract" [level=2] [ref=e119]
            - generic [ref=e121]:
              - generic [ref=e122]: ▪ Abstract
              - paragraph [ref=e123]: Polyesters such as poly(3-hydroxybutyrate) (PHB) or other polyhydroxyalkanoates (PHA) have attracted commercial and academic interest as new biodegradable materials. The ability to degrade PHA is widely distributed among bacteria and fungi and depends on the secretion of specific extracellular PHA depolymerases (e-PHA depolymerases), which are carboxyesterases (EC 3.1.1.75 and EC 3.1.1.76), and on the physical state of the polymer (amorphous or crystalline). This contribution provides a summary of the biochemical and molecular biological characteristics of e-PHA depolymerases and focuses on the intracellular mobilization of storage PHA by intracellular PHA depolymerases (i-PHA depolymerases) of PHA-accumulating bacteria. The importance of different assay systems for PHA depolymerase activity is also discussed.
