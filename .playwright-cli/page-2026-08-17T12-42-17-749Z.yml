                          - text: M. Models of S39A and the R3HB trimer (H(R3HB)
                          - subscript [ref=f1e581]: "3"
                          - text: M lacking the methyl group) are also shown as a line and a stick model, respectively. The map is contoured at 3.5σ. Figures were produced using the PyMOL program (DeLano, W. L.;
                          - link [ref=f1e582] [cursor=pointer]:
                            - /url: http://www.pymol.org/
