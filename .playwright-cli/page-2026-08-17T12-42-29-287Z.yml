                      - generic [ref=e761]:
                        - heading "Biomass calculation" [level=3] [ref=e762]
                        - paragraph [ref=e763]: Cell densities, expressed in grams of CDW per litre, were determined gravimetrically by using tared 50 ml Falcon tubes. Forty millilitres of culture medium were centrifuged for 45 min at 3800 g and 4°C. Cell pellets were freeze-dried for 24 h in a lyophilizer and weighed.
                      - generic [ref=e764]:
                        - heading "Cell viability calculation" [level=3] [ref=e765]
                        - paragraph [ref=e766]:
                          - text: To calculate cell viability, serial dilutions from 10
                          - superscript [ref=e767]: −1
                          - text: to 10
                          - superscript [ref=e768]: −7
                          - text: were made in salt solution (0.9% NaCl). Three different spots of each dilution from 10
                          - superscript [ref=e769]: −2
                          - text: to 10
                          - superscript [ref=e770]: −7
                          - text: were plated on LB solid medium and colony-forming units (cfu) were counted. For each strain, three different experiments were carried out.
                      - generic [ref=e771]:
                        - heading "DNA manipulation and plasmid construction" [level=3] [ref=e772]
                        - paragraph [ref=e773]:
                          - text: DNA manipulations and other Molecular Biology techniques were essentially performed as described previously (
                          - link "Sambrook and Russell, 2001" [ref=e774] [cursor=pointer]:
                            - /url: "#b42"
                          - text: ). Plasmid transference to the target Pseudomonas strains was performed by the filter-mating technique (
                          - link "Herrero et al., 1990" [ref=e775] [cursor=pointer]:
                            - /url: "#b43"
                          - text: ). DNA fragments were purified by standard procedures using Gene Clean (Bio 101, Vista, CA). Plasmid pPAZ2 was constructed as previously described (
                          - link "de Eugenio et al., 2007" [ref=e776] [cursor=pointer]:
                            - /url: "#b7"
                          - text: ). For PCR amplification, we used 2 units of AmpliTaq DNA polymerase (Perkin Elmer Life Sciences), 1 μg of DNA template, 1 μg of each deoxynucleoside triphosphate, and 2.5 mM MgCl
                          - subscript [ref=e777]: "2"
                          - text: in the buffer recommended by the manufacturer. Conditions for amplification were chosen according to the G + C content of the corresponding oligonucleotides. Pseudomonas putida KT42Z strain was constructed by gene disruption of phaZ gene using plasmid pK18mob (
                          - link "Schafer et al., 1994" [ref=e778] [cursor=pointer]:
                            - /url: "#b44"
                          - text: ). An internal fragment of 335 bp of the gene was cloned in the polylinker of pK18mob after PCR amplification with primers PhaZMUT5′ (CCAGGATCCTCACGATTACCCCGAGCG) and PhaZMUT3′ (CCGGAATTCCAGCCAGTACCAGGGTG). The resulting construction (pK18mob-Z) was introduced into P. putida KT2442 by triparental mating and conjugants were selected in M63 0.2% citrate plus kanamycin. Disruption of phaZ gene was confirmed by PCR and Western blot analysis as described (
                          - link "de Eugenio et al., 2007" [ref=e779] [cursor=pointer]:
                            - /url: "#b7"
                          - text: ). Pseudomonas putida KT42C1 strain was constructed via disruption of phaC1 gene by insertion of a minitransposon containing kanamycin resistance gene (
                          - link "Herrero et al., 1990" [ref=e780] [cursor=pointer]:
                            - /url: "#b43"
                          - text: ). PHA production-defective mutants were selected in plates of M63 0.1 N medium plus 2.5 g l
                          - superscript [ref=e781]: −1
                          - text: sodium octanoate and 0.25 mg ml
                          - superscript [ref=e782]: −1
                          - text: Nile Red with 100 cfu per plate. Due to the toxic effect exerted by the Nile Red, the only strains able to grow in this medium as isolated colonies were those whose PHA accumulation abilities had been impaired by disruption of genes involved in polymer metabolism. These clones were further isolated and selected by their lack of fluorescence under UV light (
                          - link "Spiekermann et al., 1999" [ref=e783] [cursor=pointer]:
                            - /url: "#b45"
                          - text: ). Mutations were identified by arbitrary PCR according to the method described by
                          - link "Espinosa-Urgel and colleagues (2000" [ref=e784] [cursor=pointer]:
                            - /url: "#b46"
                          - text: ), using TNSTOP (CATAAAGCTTGCTCAATCAATCACC), TNINT (GACCTGCAGGCATGCAAGCTTCGGC), ARB1 (GGCACGCGTCGACTAGTACNNNNNNNNNNGATAT) and ARB2 (GGCACGCGTCGACTAGTAC) primers. To construct P. putida KTZ1 strain an 873 bp fragment was PCR-amplified from P. putida KT2442 genome using oligonucleotides PHAZ2 (CAGATATCAAGCTTGGCCGCAGCTGTTTCA) and PHAZ5 (GATATCGCATGCCGCAACCCTATATTTTCAG). The PCR fragment was digested with HindIII and BbuI and cloned into pALEX1b vector (Biomedal S.L.), resulting in the plasmid pPAZ6 (see also Fig. S2). This was digested with NotI and AseI and the resulting 1.9 kb fragment was purified by GeneClean and subcloned into previously NotI cut pUTTc (
                          - link "Herrero et al., 1990" [ref=e785] [cursor=pointer]:
                            - /url: "#b43"
                          - text: ), resulting in plasmid pUTTcZ, which was transferred via triparental mating to a KTXylS2 strain harbouring the regulatory module of plasmid pCNB44S2 (
                          - link "Cebolla et al., 2001" [ref=e786] [cursor=pointer]:
                            - /url: "#b22"
                          - text: ). Pseudomonas putida KTLacI
                          - superscript [ref=e787]: q
                          - text: was constructed by transferring the plasmid pCNB5 harbouring the LacI
                          - superscript [ref=e788]: q
                          - text: repressor in a minitransposon containing kanamycin resistance gene (
                          - link "de Lorenzo et al., 1993" [ref=e789] [cursor=pointer]:
                            - /url: "#b20"
                          - text: ).
                      - generic [ref=e790]:
                        - heading "Transmission electron microscopy" [level=3] [ref=e791]
                        - paragraph [ref=e792]:
                          - text: Pseudomonas putida KT2442 and P. putida KT42C1 cells previously grown under PHA production conditions for 24 h were harvested, washed twice in PBS and fixed in 5% (w/v) glutaraldehyde in the same solution. Afterwards, cells were included with 2.5% (w/v) OsO
                          - subscript [ref=e793]: "4"
                          - text: for 1 h, gradually dehydrated in ethanol [30%, 50%, 70%, 90% and 100% (v/v); 30 min each] and propylene oxide (1 h), and embedded in Epon 812 resin. Ultrathin sections (thickness of 70 nm) were cut with a microtome using a Diatome diamond knife. The sections were picked up with 400 mesh cupper grids coated with a layer of carbon. The sections were observed in a Jeol-1230 electron microscope (Jeol, Akishima, Japan).
                      - generic [ref=e794]:
                        - heading [level=3] [ref=e795]:
                          - superscript [ref=e796]: "14"
                          - text: C-labelled 3-hydroxyalkanoic mobilization in resting cells system
                        - paragraph [ref=e797]:
                          - text: Pseudomonas putida KT2442 or P. putida KT42Z cells were grown in
                          - superscript [ref=e798]: "14"
                          - text: C-labelled PHA production conditions as described (
                          - link "de Eugenio et al., 2007" [ref=e799] [cursor=pointer]:
                            - /url: "#b7"
                          - text: ). After 24 h, cells were centrifuged, washed with 0.1 N M63 medium to avoid nitrogen-triggered PHA degradation, shifted to different conditions as distilled water pH 5.5, 50 mM acetate buffer pH 4 or 50 mM glycine-NaOH buffer pH 10.6 and incubated at 30°C and 250 r.p.m. Samples were taken each hour, centrifuged at 16 000 g for 25 min at 4°C and filtered through cellulose acetate disposable syringe filters (0.2 μ, Asahi Techno Glass). The radioactivity was determined in 100 μl aliquots of the supernatant in a scintillation counter (Beckman). PHA content was determined using GC-MS analysis as described elsewhere (
                          - link "Lageveen et al., 1988" [ref=e800] [cursor=pointer]:
                            - /url: "#b47"
                          - text: ).
                      - generic [ref=e801]:
                        - heading "3-Hydroxyalkanoic acids mobilization under PHA production conditions" [level=3] [ref=e802]
                        - paragraph [ref=e803]:
                          - text: Pseudomonas putida cells were inoculated into 0.1 N M63 medium containing 15 mM sodium octanoate. After 24 h, 40 ml of samples were taken, centrifuged at 3800 g and 4°C for 45 min and freeze-dried. HA levels in filtered supernatants and PHA content were determined using GC-MS as previously described (
                          - link "Lageveen et al., 1988" [ref=e804] [cursor=pointer]:
                            - /url: "#b47"
                          - text: ) (see below).
                      - generic [ref=e805]:
                        - heading "GC-MS analysis for PHA and HA content determinations" [level=3] [ref=e806]
                        - paragraph [ref=e807]:
                          - text: Polyhydroxyalkanoate monomer composition and cellular PHA content were determined by GC-MS of the methanolysed polyester. Methanolysis procedure was carried out by suspending 5–10 mg of lyophilized aliquots in 2 ml of chloroform and 2 ml of methanol containing 15% sulfuric acid and 0.5 mg ml
                          - superscript [ref=e808]: −1
                          - text: 3-methylbenzoic acid (internal standard) and then incubated at 100°C for 4 h. After cooling, 1 ml of demineralized water was added and the organic phase containing the resulting methyl esters of monomers was analysed by GC-MS (
                          - link "Lageveen et al., 1988" [ref=e809] [cursor=pointer]:
                            - /url: "#b47"
                          - text: ).
                        - paragraph [ref=e810]:
                          - text: An Agilent (Waldbronn, Germany) series 7890A coupled with a 5975C MS detector (EI, 70 eV) and a split–splitless injector were used for analysis. An aliquot (1 μl) of organic phase was injected into the gas chromatograph at a split ratio of 1:50. Separation of compounds was achieved using an HP-5 MS capillary column (5% phenyl−95% methyl siloxane, 30 m × 0.25 mm i.d. × 0.25 mm film thickness). Helium was used as carrier gas at a flow rate of 0.9 ml min
                          - superscript [ref=e811]: −1
                          - text: ". The injector and transfer line temperature were set at 275°C and 300°C respectively. The oven temperature programme was: initial temperature 80°C for 2 min, then from 80°C up 150°C at a rate of 5°C min"
                          - superscript [ref=e812]: −1
                          - text: and finally up 200°C at a rate of 10°C min
                          - superscript [ref=e813]: −1
                          - text: . EI mass spectra were recorded in full scan mode (m/z 40–550).
                        - paragraph [ref=e814]: The same sample preparation described above allowed the determination of benzoate content in samples since benzoic acid is susceptible to give rise its methyl ester form after methanolysis. Quantification of methyl-benzoate was carried out in the same chromatographic conditions as methyl esters of monomers obtained from PHA.
                      - generic [ref=e815]:
                        - heading "LC-MS analysis for identification of the products released" [level=3] [ref=e816]
                        - paragraph [ref=e817]:
                          - text: As preliminary step to chromatographic separation, samples were introduced to the ESI source in negative mode by direct infusion in order to optimize the MS conditions. Lyophilized aliquots (5–10 mg) were suspended in methanol and 5 μl were injected in the chromatographic system. Separation of the oligomers present in samples was carried out on a Finnigan Surveyor (Thermo Electron) pump coupled with a Finnigan LCQ Deca (Thermo Electron) ion trap mass spectrometer. The separation was performed at room temperature on a 100 × 2.1 mm (3 μm particle size) Hypersil HyPurity C18 column (Thermo Electron) at a flow rate of 100 μl min
                          - superscript [ref=e818]: −1
                          - text: ". The mobile phase was 0.1% ammonium hydroxide in water (A) and 0.1% ammonium hydroxide in methanol (B). The following elution programme was used: at the start 95% A and 5% B; after 3 min the percentage of B was linearly increased to 95% in 7 min, then kept constant for 20 min, ramped to the original composition in 1 min, and then equilibrated for 10 min. The detection was monitored by MS-ESI spectrometry in negative mode at the conditions of source voltage and capillary temperature that were optimized in the step of continuous infusion (3.5 kV and 200°C respectively). All spectra were recorded in full scan mode (m/z 50–1500)."
                      - generic [ref=e819]:
                        - heading "Gas chromatography analysis of chiral hydroxy fatty acids" [level=3] [ref=e820]
                        - paragraph [ref=e821]:
                          - text: Samples were methanolysed as described for PHA content analysis. Separation of compounds was carried out in a Beta Dex 120 column (30 m × 0.25 mm i.d. × 0.25 mm film thickness) (Supelco, USA). Injector and detector temperature were kept at 300°C. Oven temperature was initially set at 95°C, held isothermally for 10 min and then increased at a rate of 0.5°C min
                          - superscript [ref=e822]: −1
                          - text: up to 120°C.
