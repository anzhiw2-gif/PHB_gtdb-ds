                - article [ref=e133]:
                  - generic [ref=e135]:
                    - heading "Summary" [level=2] [ref=e136]
                    - paragraph [ref=e138]: Polyhydroxyalkanoates (PHAs) are biodegradable polymers produced by a wide range of bacteria, including Pseudomonads. These polymers are accumulated in the cytoplasm as carbon and energy storage materials when culture conditions are unbalanced and hence, they have been classically considered to act as sinks for carbon and reducing equivalents when nutrients are limited. Bacteria facing carbon excess and nutrient limitation store the extra carbon as PHAs through the PHA polymerase (PhaC). Thereafter, under starvation conditions, PHA depolymerase (PhaZ) degrades PHA and releases R-hydroxyalkanoic acids, which can be used as carbon and energy sources. To study the influence of a deficient PHA metabolism in the growth of Pseudomonas putida KT2442 we have constructed two mutant strains defective in PHA polymerase (phaC1)- and PHA depolymerase (phaZ)-coding genes respectively. By using these mutants we have demonstrated that PHAs play a fundamental role in balancing the stored carbon/biomass/number of cells as function of carbon availability, suggesting that PHA metabolism allows P. putida to adapt the carbon flux of hydroxyacyl-CoAs to cellular demand. Furthermore, we have established that the coordination of PHA synthesis and mobilization pathways configures a functional PHA turnover cycle in P. putida KT2442. Finally, a new strain able to secrete enantiomerically pure R-hydroxyalkanoic acids to the culture medium during cell growth has been engineering by redirecting the PHA cycle to biopolymer hydrolysis.
                  - generic [ref=e139]:
                    - generic [ref=e140]:
                      - heading "Introduction" [level=2] [ref=e141]
                      - paragraph [ref=e142]:
                        - text: Polyhydroxyalkanoates (PHAs) are bacterial polyesters accumulated in the cytoplasm as reserve storage granules, which are generally believed to play a role as sinks for carbon and reducing equivalents when other nutrients are limited (
                        - link "Madison and Huisman, 1999" [ref=e143] [cursor=pointer]:
                          - /url: "#b1"
                        - text: ;
                        - link "O'Leary et al., 2005" [ref=e144] [cursor=pointer]:
                          - /url: "#b2"
                        - text: ;
                        - link "Prieto et al., 2007" [ref=e145] [cursor=pointer]:
                          - /url: "#b3"
                        - text: ). The most common PHA is the poly(3-hydroxybutyrate) (PHB), considered as the prototype of the short-chain-length PHAs (scl-PHAs) (
                        - link "Madison and Huisman, 1999" [ref=e146] [cursor=pointer]:
                          - /url: "#b1"
                        - text: ), whereas medium-chain-length PHA (mcl-PHA), containing monomers from 6 to 14 carbon atoms, is less abundant and often produced by Pseudomonas species (
                        - link "Timm and Steinbüchel, 1990" [ref=e147] [cursor=pointer]:
                          - /url: "#b4"
                        - text: ;
                        - link "Luengo et al., 2003" [ref=e148] [cursor=pointer]:
                          - /url: "#b5"
                        - text: ;
                        - link "Prieto et al., 2007" [ref=e149] [cursor=pointer]:
                          - /url: "#b3"
                        - text: ). The pha gene cluster responsible for PHA metabolism is well conserved among the mcl-PHA Pseudomonads producer strains (
                        - link "Huisman et al., 1991" [ref=e150] [cursor=pointer]:
                          - /url: "#b6"
                        - text: ;
                        - link "de Eugenio et al., 2007" [ref=e151] [cursor=pointer]:
                          - /url: "#b7"
                        - text: ;
                        - link "Prieto et al., 2007" [ref=e152] [cursor=pointer]:
                          - /url: "#b3"
                        - text: ) (
                        - link "Fig. 1" [ref=e153] [cursor=pointer]:
                          - /url: "#f1"
                        - text: ). It is composed of (i) two synthase (or polymerase)-coding genes (phaC1 and phaC2) involved in PHA synthesis; and (ii) a depolymerase coding-gene (phaZ) responsible for PHA mobilization (
                        - link "de Eugenio et al., 2007" [ref=e154] [cursor=pointer]:
                          - /url: "#b7"
                        - text: ) and the phaD gene encoding a putative transcriptional regulator (
                        - link "Klinke et al., 2000" [ref=e155] [cursor=pointer]:
                          - /url: "#b8"
                        - text: ). The phaF and phaI genes are transcribed divergently to the other pha genes, and encode the phasins playing regulatory and functional roles (
                        - link "Prieto et al., 1999a" [ref=e156] [cursor=pointer]:
                          - /url: "#b9"
                        - text: ;
                        - link "Moldes et al., 2004" [ref=e157] [cursor=pointer]:
                          - /url: "#b10"
                        - text: ). PhaC, PhaZ, PhaF and PhaI have been so far identified as granule-associated proteins, but very recently, a granule-associated acyl-CoA synthetase that activates the depolymerase products (3-hydroxyalkanoic acids) into the polymerase substrates (3-hydroxyacyl-CoAs thioesters) has been identified in Pseudomonas putida GPo1 (
                        - link "Ruth et al., 2008" [ref=e158] [cursor=pointer]:
                          - /url: "#b11"
                        - text: ) (
                        - link "Fig. 1" [ref=e159] [cursor=pointer]:
                          - /url: "#f1"
                        - text: ).
                      - figure [ref=e161]:
                        - link [ref=e162] [cursor=pointer]:
                          - /url: /cms/asset/ff2ca5df-ff5e-4f9f-a734-e4e3e9afc75f/emi_2061_f1.gif
                          - img "Details are in the caption following the image" [ref=e164]
                        - generic [ref=e165]:
                          - generic [ref=e166]:
                            - strong [ref=e167]: Figure 1
                            - generic [ref=e168]:
                              - link "Open in figure viewer" [ref=e169] [cursor=pointer]:
                                - /url: "#"
                              - link "PowerPoint" [ref=e170] [cursor=pointer]:
                                - /url: /action/downloadFigures?id=f1&partId=&doi=10.1111%2Fj.1462-2920.2009.02061.x
                                - generic [ref=e171]: 
                                - text: PowerPoint
                          - paragraph [ref=e173]:
                            - text: PHA granule schematic representation and pha gene cluster in Pseudomonads.A. Static model for PHA metabolism (adapted from
                            - link "Ruth et al., 2008" [ref=e174] [cursor=pointer]:
                              - /url: "#b11"
                            - text: ). 3-Hydroxy fatty acids are released from PHA granule by PhaZ depolymerase and further activated to 3-hydroxyacyl-CoAs by ACS1 acyl synthetase. These activated monomers will be either metabolized via fatty acid degradation, or re-incorporated into PHA granule by PHA synthase (also named polymerase).B. PHA cluster in Pseudomonads. The phaC1 and phaC2 genes encode two synthases and are separated by the phaZ gene that encodes an intracellular depolymerase. phaD gene encodes a transcriptional regulator. phaF and phaI genes code for phasins. Disruptions in genes phaC1 and phaZ were represented as triangles. MiniTn5 transposon and pK18mobZ plasmid were inserted at base 5699630 and 5701846 of KT2442 genome respectively.
                      - paragraph [ref=e175]:
                        - text: The PhaZ from P. putida KT2442 (PhaZ
                        - subscript [ref=e176]: KT
                        - text: ), which has been purified and biochemically characterized as the prototype of intracellular mcl-PHA depolymerases (
                        - link "de Eugenio et al., 2007" [ref=e177] [cursor=pointer]:
                          - /url: "#b7"
                        - text: ;
                        - link "2008" [ref=e178] [cursor=pointer]:
                          - /url: "#b12"
                        - text: ), remains permanently associated to the PHA granules during PHA-accumulation and PHA-mobilization conditions (
                        - link "de Eugenio et al., 2007" [ref=e179] [cursor=pointer]:
                          - /url: "#b7"
                        - text: ), but a coordinated function of PHA synthase, PHA depolymerase and acyl-CoA synthetase has not been demonstrated yet. Furthermore, the existence of PhaZ
                        - subscript [ref=e180]: KT
                        - text: paralogues encoded in the genome of this model strain and the detection of PhaZ
                        - subscript [ref=e181]: KT
                        - text: cross immunoreactive proteins have been also demonstrated (
                        - link "de Eugenio et al., 2007" [ref=e182] [cursor=pointer]:
                          - /url: "#b7"
                        - text: ). Whether these parologous enzymes could be also involved in mcl-PHA hydrolysis, building up a more complex hydrolytic system similar to that of the model PHB producer strain Ralstonia eutropha H16 (
                        - link "York et al., 2001" [ref=e183] [cursor=pointer]:
                          - /url: "#b13"
                        - text: ;
                        - link "Uchino et al., 2007" [ref=e184] [cursor=pointer]:
                          - /url: "#b14"
                        - text: ), needs to be investigated.
                      - paragraph [ref=e185]:
                        - text: In this study, we have demonstrated that mcl-PHA synthesis and mobilization in P. putida KT2442 is a simultaneous cyclic process where the PhaZ
                        - subscript [ref=e186]: KT
                        - text: depolymerase plays a fundamental role. This knowledge allowed us to redirect the mcl-PHA metabolism to the production of PHA monomers.
                    - generic [ref=e187]:
                      - heading "Results" [level=2] [ref=e188]
                      - generic [ref=e189]:
                        - heading "Cell viability versus PHA accumulation" [level=3] [ref=e190]
                        - paragraph [ref=e191]:
                          - text: It is generally accepted that bacteria accumulate PHAs in response to inorganic nutrient unbalance when they are cultured in excess carbon sources, due to the increase in the synthase substrate availability (
                          - link "Huisman et al., 1991" [ref=e192] [cursor=pointer]:
                            - /url: "#b6"
                          - text: ;
                          - link "Madison and Huisman, 1999" [ref=e193] [cursor=pointer]:
                            - /url: "#b1"
                          - text: ;
                          - link "Olivera et al., 2001" [ref=e194] [cursor=pointer]:
                            - /url: "#b15"
                          - text: ;
                          - link "Prieto et al., 2007" [ref=e195] [cursor=pointer]:
                            - /url: "#b3"
                          - text: ). Depending on the metabolic state of the cell, the hydroxyacyl-CoAs (HA-CoAs) will be incorporated into nascent PHA polymer chains or oxidized through the β-oxidation pathway (
                          - link "Fig. 1" [ref=e196] [cursor=pointer]:
                            - /url: "#f1"
                          - text: ). The PHA accumulation/mobilization ability of wild-type P. putida KT2442 has been compared with that of synthase (KT42C1) and depolymerase (KT42Z) mutants (
                          - link "Table 1" [ref=e197] [cursor=pointer]:
                            - /url: "#t1"
                          - text: ). The KT42C1 strain is unable to polymerize HA-CoAs, but has an intact fatty acid metabolism. It was isolated by a new counter-selection method based on the toxicity of the fluorescent dye Nile Red (see Experimental procedures). The lack of phaC1 transcription in this strain has been demonstrated by RT-PCR (data not shown). To ensure that the observed effects in mutants were specifically caused by phaZ and phaC1 disruptions, complementation studies were carried out (see Fig. S1). The KT2442 wild type, KT42C1 and KT42Z strains were cultured in 0.1 N M63 medium supplemented with sodium octanoate as carbon and energy sources (PHA production growth conditions) and PHA content, biomass, OD
                          - subscript [ref=e198]: "600"
                          - text: and cell viability were monitored in both cultures during the first 24 h of growth (
                          - link "Fig. 2" [ref=e199] [cursor=pointer]:
                            - /url: "#f2"
                          - text: ). Since PHA content disturbs cells turbidimetry, the optical density cannot be used to determine the number of viable cells. Interestingly, although the final PHA content in KT2442 and KT42Z strains were similar after 24 h of growth, the PHA accumulation of KT42Z was delayed during the exponential phase (
                          - link "Fig. 2A and B" [ref=e200] [cursor=pointer]:
                            - /url: "#f2"
                          - text: ). In this sense, mutations in the phaC1-D region could reduce the transcription rate of the rest of the pha genes due to polar mutations. However, alternatives promoters at phaZ and phaC2 upstream regions ensure the transcription of the corresponding pha genes (L.I. de Eugenio, B. Galán, I.F. Escapa, B. Maestro, J. Sanz, J.L. García and M.A. Prieto in preparation) as demonstrated for other P. putida strains (
                          - link "Sandoval et al., 2007" [ref=e201] [cursor=pointer]:
                            - /url: "#b16"
                          - text: ). Remarkably, the mutant KT42C1 cells were considerably smaller than that of the wild-type strain (
                          - link "Fig. 2D" [ref=e202] [cursor=pointer]:
                            - /url: "#f2"
                          - text: ). Moreover, although during the first 8 h of culture, the number of KT42C1 mutant and wild-type viable cells were similar (1 × 10
                          - superscript [ref=e203]: "8"
                          - text: to 5 × 10
                          - superscript [ref=e204]: "8"
                          - text: cells ml
                          - superscript [ref=e205]: −1
                          - text: ), at the late exponential phase, the phaC1 mutant strain increased the number of viable cells, reaching a maximum of 1.9 × 10
                          - superscript [ref=e206]: "9"
                          - text: cells ml
                          - superscript [ref=e207]: −1
                          - text: ; this is more than 10-fold higher than that of wild-type and KT42Z strains (
                          - link "Fig. 2C" [ref=e208] [cursor=pointer]:
                            - /url: "#f2"
                          - text: ).
                          - link "Table 2" [ref=e209] [cursor=pointer]:
                            - /url: "#t2"
                          - text: reflects all the carbon source utilization data of relevant strains, regarding PHA content, biomass, residual carbon source and the presence of 3-hydroxyalkanoic acids (HAs) in the media supernatant after 24 h of growing. Absence (KT42Z) or low content of HAs (KT2442 and KT42C1) were detected. No octanoic acid was present when KT42C1 strain medium supernatant was analysed by gas chromatography-mass spectrometry (GC-MS) (
                          - link "Table 2" [ref=e210] [cursor=pointer]:
                            - /url: "#t2"
                          - text: ). These results excluded the carbon waste when PHA metabolism is not active even in a medium with reduced nitrogen content. It is worth to mention that the residual PHA content of KT42C1 cells is due to the low activity of PhaC2 polymerase still present in this strain (
                          - link "Fig. 1B" [ref=e211] [cursor=pointer]:
                            - /url: "#f1"
                          - text: ). In this sense, the presence of small PHA granules has been confirmed by electronic microscopy (
                          - link "Fig. 2D" [ref=e212] [cursor=pointer]:
                            - /url: "#f2"
                          - text: ).
