                - article [ref=e119]:
                  - generic [ref=e121]:
                    - heading "Summary" [level=2] [ref=e122]
                    - paragraph [ref=e124]: Polyhydroxyalkanoates (PHAs) are a family of microbially made polyesters commercialized as biodegradable plastics. PHA production rates are predicted to increase as concerns around environmental plastic contamination and limited fossil fuel resources have increased the importance of biodegradable and bio-based plastic alternatives. Microbially produced PHA depolymerases are the key enzymes mediating PHA biodegradation, but only a few PHA depolymerases have been well-characterized and screens employing metagenomic sequence data are lacking. Here, we used 3078 metagenomes to analyse the distribution of PHA depolymerases in microbial communities from diverse aquatic, terrestrial and waste management systems. We significantly expand the recognized diversity of this protein family by screening 1914 Gb of sequence data and identifying 13 869 putative PHA depolymerases in 1295 metagenomes. Our results indicate that PHA depolymerases are unevenly distributed across environments. We predicted the highest frequency of PHA depolymerases in wastewater systems and the lowest in marine and thermal springs. In tandem, we screened 5290 metagenome-assembled genomes to describe the phylogenetic distribution of PHA depolymerases, which is substantially broader compared with current cultured representatives. The Proteobacteria and Bacteroidota are key lineages encoding PHA depolymerases, but PHA depolymerases were predicted from members of the Bdellovibrionota, Methylomirabilota, Actinobacteriota, Firmicutes, Spirochaetota, Desulfobacterota, Myxococcota and Planctomycetota.
                  - generic [ref=e125]:
                    - generic [ref=e126]:
                      - heading "Introduction" [level=2] [ref=e127]
                      - paragraph [ref=e128]:
                        - text: Global concerns associated with environmental plastic contamination and fossil fuel use have led to a demand for sustainable alternatives to petroleum-based plastics (Shah et al.,
                        - link "2008" [ref=e130] [cursor=pointer]:
                          - /url: "#emi15409-bib-0053"
                        - text: ). Increased public awareness coupled with ongoing legislative changes aimed at reducing single-use plastics are promoting a pivot to bio-based and biodegradable alternatives like polyhydroxyalkanoates (PHAs) (Aeschelmann and Carus,
                        - link "2015" [ref=e132] [cursor=pointer]:
                          - /url: "#emi15409-bib-0002"
                        - text: ; United Nations Environment Programme,
                        - link "2018" [ref=e134] [cursor=pointer]:
                          - /url: "#emi15409-bib-0058"
                        - text: ). Conventional plastics rely on fossil resources and are extremely recalcitrant to degradation, causing them to persist upon disposal (Danso et al.,
                        - link "2019" [ref=e136] [cursor=pointer]:
                          - /url: "#emi15409-bib-0014"
                        - text: ). Annual plastic production now exceeds 380 million tons, with most plastics experiencing a short service lifespan before being discarded (Geyer et al.,
                        - link "2017" [ref=e138] [cursor=pointer]:
                          - /url: "#emi15409-bib-0023"
                        - text: ). It is estimated that 79% of plastic waste accumulates in landfills or the environment (Geyer et al.,
                        - link "2017" [ref=e140] [cursor=pointer]:
                          - /url: "#emi15409-bib-0023"
                        - text: ) where it can cause ecological damage (Li et al.,
                        - link "2016" [ref=e142] [cursor=pointer]:
                          - /url: "#emi15409-bib-0036"
                        - text: ).
                      - paragraph [ref=e143]:
                        - text: PHAs offer an exciting solution to curb environmental damage caused by liberal plastic use because they are made from renewable carbon resources (bio-based) and biodegrade into non-harmful products in natural environments through the action of microbially secreted PHA depolymerases (Nishida and Tokiwa,
                        - link "1993" [ref=e145] [cursor=pointer]:
                          - /url: "#emi15409-bib-0043"
                        - text: ; Mergaert and Swings,
                        - link "1996" [ref=e147] [cursor=pointer]:
                          - /url: "#emi15409-bib-0040"
                        - text: ; Volova et al.,
                        - link "2011" [ref=e149] [cursor=pointer]:
                          - /url: "#emi15409-bib-0060"
                        - text: ; Boyandin et al.,
                        - link "2013" [ref=e151] [cursor=pointer]:
                          - /url: "#emi15409-bib-0009"
                        - text: ; Altaee et al.,
                        - link "2016" [ref=e153] [cursor=pointer]:
                          - /url: "#emi15409-bib-0004"
                        - text: ; Dilkes-Hoffman et al.,
                        - link "2019" [ref=e155] [cursor=pointer]:
                          - /url: "#emi15409-bib-0017"
                        - text: ). PHAs are a naturally produced family of polyesters synthesized by bacteria and archaea as intracellular energy and carbon storage compounds (Fernandez-Castillo et al.,
                        - link "1985" [ref=e157] [cursor=pointer]:
                          - /url: "#emi15409-bib-0020"
                        - text: ; Jendrossek,
                        - link "2002" [ref=e159] [cursor=pointer]:
                          - /url: "#emi15409-bib-0030"
                        - text: ). Commercial PHAs currently represent a small fraction (1.4%) of the bioplastic market (European Bioplastics,
                        - link "2018" [ref=e161] [cursor=pointer]:
                          - /url: "#emi15409-bib-0019"
                        - text: ) but show the highest growth rates with production capacities forecasted to more than triple in the next 5 years (European Bioplastic, Bioplastic Market Data
                        - link "2019" [ref=e163] [cursor=pointer]:
                          - /url: "#emi15409-bib-0018"
                        - text: ).
                      - paragraph [ref=e164]:
                        - text: Rates of environmental plastic degradation are influenced by polymer properties (e.g. available surface area, monomeric composition, additives), the extant microbial community and abiotic factors (e.g. temperature, UV, pH) (Tokiwa et al.,
                        - link "2009" [ref=e166] [cursor=pointer]:
                          - /url: "#emi15409-bib-0057"
                        - text: ). PHA biodegradation is largely reliant on the abundance and diversity of microorganisms encoding extracellular PHA (ePHA) depolymerases (the key PHA degrading enzymes) (Tokiwa and Calabia,
                        - link "2004" [ref=e168] [cursor=pointer]:
                          - /url: "#emi15409-bib-0056"
                        - text: ; Vigneswari et al.,
                        - link "2015" [ref=e170] [cursor=pointer]:
                          - /url: "#emi15409-bib-0059"
                        - text: ). PHAs are broadly classified as either short-chain length (PHAscl) with 3–5 carbon atoms per monomer or medium-chain length (PHAmcl) with 6–15 carbon atoms per monomer, where the size of the monomer impacts enzyme-substrate specificity (Jendrossek,
                        - link "2002" [ref=e172] [cursor=pointer]:
                          - /url: "#emi15409-bib-0030"
                        - text: ).
                      - paragraph [ref=e173]:
                        - text: PHA depolymerases are a diverse family of intracellular and extracellular carboxylesterases and are members of the alpha/beta-hydrolase fold family (Knoll et al.,
                        - link "2009" [ref=e175] [cursor=pointer]:
                          - /url: "#emi15409-bib-0033"
                        - text: ). To date, approximately 35 PHA depolymerases have been isolated and biochemically characterized (
                        - link "Supp. Data 1" [ref=e176] [cursor=pointer]:
                          - /url: "#support-information-section"
                        - text: and references within), from organisms within the phyla Ascomycetes, Firmicutes, Proteobacteria (most) and Actinobacteria. PHA depolymerases are classified based on subcellular location (extracellular or intracellular), substrate specificity (mcl [EC 3.1.1.76] or scl [EC 3.1.1.75]) and features of the catalytic domain (Jendrossek,
                        - link "2002" [ref=e178] [cursor=pointer]:
                          - /url: "#emi15409-bib-0030"
                        - text: ; Knoll et al.,
                        - link "2009" [ref=e180] [cursor=pointer]:
                          - /url: "#emi15409-bib-0033"
                        - text: ). Intracellular PHA depolymerases mobilize amorphous PHA stores in intracellular, protein-associated granules referred to as carbonosomes (Bresan et al.,
                        - link "2016" [ref=e182] [cursor=pointer]:
                          - /url: "#emi15409-bib-0010"
                        - text: ). ePHA depolymerases are secreted from the cell to scavenge exogenous semi-crystalline PHAs found in the environment (Jendrossek,
                        - link "2002" [ref=e184] [cursor=pointer]:
                          - /url: "#emi15409-bib-0030"
                        - text: ) and are the focus of this project.
                      - paragraph [ref=e185]:
                        - text: Early culture-based studies have isolated ePHAscl-degrading microorganisms from different environments including soil, compost, sewage and aquatic environments but indicate that ePHAmcl degraders appear to be relatively rare (Nishida and Tokiwa,
                        - link "1993" [ref=e187] [cursor=pointer]:
                          - /url: "#emi15409-bib-0043"
                        - text: ; Jendrossek,
                        - link "2002" [ref=e189] [cursor=pointer]:
                          - /url: "#emi15409-bib-0030"
                        - text: ; Tokiwa and Calabia,
                        - link "2004" [ref=e191] [cursor=pointer]:
                          - /url: "#emi15409-bib-0056"
                        - text: ). Reflecting these findings, relatively few ePHAmcl depolymerases have been characterized compared with ePHAscl depolymerases (Knoll et al.,
                        - link "2009" [ref=e193] [cursor=pointer]:
                          - /url: "#emi15409-bib-0033"
                        - text: ; Martínez et al.,
                        - link "2015" [ref=e195] [cursor=pointer]:
                          - /url: "#emi15409-bib-0039"
                        - text: ). All known ePHA depolymerases contain a catalytic triad composed of a serine (embedded in a lipase box motif), histidine and aspartic acid (Knoll et al.,
                        - link "2009" [ref=e197] [cursor=pointer]:
                          - /url: "#emi15409-bib-0033"
                        - text: ). ePHAscl depolymerases typically consist of a signal peptide, a catalytic domain, a linker domain and a C-terminal substrate-binding domain (Jendrossek,
                        - link "2002" [ref=e199] [cursor=pointer]:
                          - /url: "#emi15409-bib-0030"
                        - text: ). There are two recognized ePHAscl depolymerase subtypes (denoted type 1 [T1] and type 2 [T2]) that differ in the arrangement of their catalytic domains. In ePHAsclT1 depolymerases, the oxyanion hole is N-terminal to the lipase box, whereas in ePHAsclT2 depolymerases the oxyanion hole is C-terminal to the lipase box (Jendrossek,
                        - link "2002" [ref=e201] [cursor=pointer]:
                          - /url: "#emi15409-bib-0030"
                        - text: ). Characterized ePHAmcl depolymerases do not exhibit a C-terminal substrate-binding domain; instead, the N-terminal region is presumed to mediate substrate binding (Jendrossek,
                        - link "2002" [ref=e203] [cursor=pointer]:
                          - /url: "#emi15409-bib-0030"
                        - text: ). ePHAmcl depolymerases share no significant homology with ePHAscl depolymerases except for the catalytic triad (Knoll et al.,
                        - link "2009" [ref=e205] [cursor=pointer]:
                          - /url: "#emi15409-bib-0033"
                        - text: ) which is non-specific as it is shared by all carboxylesterases (Sood et al.,
                        - link "2018" [ref=e207] [cursor=pointer]:
                          - /url: "#emi15409-bib-0055"
                        - text: ).
                      - paragraph [ref=e208]:
                        - text: With PHA production levels expected to increase, a strong understanding of the diversity and distribution of PHA-degrading enzymes and organisms is critical for understanding the impact of PHAs on the environment and to reveal biomolecular tools useful for processing these plastics (Tokiwa and Calabia,
                        - link "2004" [ref=e210] [cursor=pointer]:
                          - /url: "#emi15409-bib-0056"
                        - text: ). Culture-based research has developed a foundational understanding of the enzymes and organisms mediating PHA biodegradation (reviewed by Jendrossek,
                        - link "2002" [ref=e212] [cursor=pointer]:
                          - /url: "#emi15409-bib-0030"
                        - text: ). However, many microbial lineages are currently unamenable to culturing and are only recognized from culture-independent analyses (Hug et al.,
                        - link "2016a" [ref=e214] [cursor=pointer]:
                          - /url: "#emi15409-bib-0027"
                        - text: ). With the advent of high-throughput sequencing and metagenomics, there has been a proliferation of publicly available DNA sequence data from microbial communities inhabiting diverse global environments (Meyer et al.,
                        - link "2008" [ref=e216] [cursor=pointer]:
                          - /url: "#emi15409-bib-0041"
                        - text: ; Markowitz et al.,
                        - link "2012" [ref=e218] [cursor=pointer]:
                          - /url: "#emi15409-bib-0037"
                        - text: ), enabling broad surveys of gene distributions (Podar et al.,
                        - link "2015" [ref=e220] [cursor=pointer]:
                          - /url: "#emi15409-bib-0049"
                        - text: ; Danso et al.,
                        - link "2018" [ref=e222] [cursor=pointer]:
                          - /url: "#emi15409-bib-0015"
                        - text: ; Holert et al.,
                        - link "2018" [ref=e224] [cursor=pointer]:
                          - /url: "#emi15409-bib-0026"
                        - text: ).
                      - paragraph [ref=e225]: Here, we employed a culture-independent approach and leveraged large amounts of publicly available environmental sequence data to characterize the phylogenetic and environmental distribution of PHA depolymerases and predict novel PHA-degrading enzymes. We screened 5290 metagenome-assembled genomes (MAGs) and 3078 metagenomes sequenced from globally distributed natural environments and waste-management systems. Biochemically characterized ePHA depolymerases were used to seed a homology-based search to identity novel PHA depolymerase candidates from different environments and across the bacterial tree of life. Our analyses significantly expand the recognized diversity of PHA depolymerases and inform our understanding of the frequency of PHA depolymerases in the environment, with implications for the microbial conversion of PHA litter. Furthermore, we identify enzymes and organisms that may prove suitable for future bioremediation, chemical processing or biotechnological applications.
                    - generic [ref=e226]:
                      - heading "Methods" [level=2] [ref=e227]
                      - generic [ref=e228]:
                        - heading "Identification of ePHA depolymerases" [level=3] [ref=e229]
                        - paragraph [ref=e230]:
                          - text: A reference set of biochemically validated ePHA depolymerases were gathered from the literature (Supp.
                          - link "Data 1" [ref=e231] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ) and used as queries in a BLASTp search (threshold e < 1 × 10
                          - superscript [ref=e232]: −10
                          - text: ) against 3078 assembled and annotated metagenomes (Supp.
                          - link "Data 2" [ref=e233] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ) and 5290 MAGs (Supp.
                          - link "Data 3" [ref=e234] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ) that were publicly available on the Integrated Microbial Genomes and Microbiomes system (IMG/M)
                          - link "https://img.jgi.doe.gov/m/" [ref=e235] [cursor=pointer]:
                            - /url: https://img.jgi.doe.gov/m/
                          - text: (Markowitz et al.,
                          - link "2012" [ref=e237] [cursor=pointer]:
                            - /url: "#emi15409-bib-0037"
                          - text: ). Datasets screened were publicly available, but permissions were requested from PIs associated with the datasets. Many metagenomes came from datasets associated with publications, including He et al., (
                          - link "2015" [ref=e239] [cursor=pointer]:
                            - /url: "#emi15409-bib-0025"
                          - text: ), Anantharaman et al., (
                          - link "2016" [ref=e241] [cursor=pointer]:
                            - /url: "#emi15409-bib-0006"
                          - text: ), Butterfield et al., (
                          - link "2016" [ref=e243] [cursor=pointer]:
                            - /url: "#emi15409-bib-0012"
                          - text: ), Hug et al., (
                          - link "2016b" [ref=e245] [cursor=pointer]:
                            - /url: "#emi15409-bib-0028"
                          - text: ), Oyserman et al., (
                          - link "2015" [ref=e247] [cursor=pointer]:
                            - /url: "#emi15409-bib-0045"
                          - text: ), Hartman et al., (
                          - link "2017" [ref=e249] [cursor=pointer]:
                            - /url: "#emi15409-bib-0024"
                          - text: ), Kimbrel et al., (
                          - link "2018" [ref=e251] [cursor=pointer]:
                            - /url: "#emi15409-bib-0032"
                          - text: ), Schulz et al., (
                          - link "2018" [ref=e253] [cursor=pointer]:
                            - /url: "#emi15409-bib-0052"
                          - text: ), Yao et al., (
                          - link "2018" [ref=e255] [cursor=pointer]:
                            - /url: "#emi15409-bib-0061"
                          - text: ), Acinas et al., (
                          - link "2019" [ref=e257] [cursor=pointer]:
                            - /url: "#emi15409-bib-0001"
                          - text: ), Diamond et al., (
                          - link "2019" [ref=e259] [cursor=pointer]:
                            - /url: "#emi15409-bib-0016"
                          - text: ), Lavy et al., (
                          - link "2019" [ref=e261] [cursor=pointer]:
                            - /url: "#emi15409-bib-0034"
                          - text: ), Sharrar et al., (
                          - link "2019" [ref=e263] [cursor=pointer]:
                            - /url: "#emi15409-bib-0054"
                          - text: ), Alteio et al., (
                          - link "2020" [ref=e265] [cursor=pointer]:
                            - /url: "#emi15409-bib-0005"
                          - text: ), Flores-Nunez et al., (
                          - link "2020" [ref=e267] [cursor=pointer]:
                            - /url: "#emi15409-bib-0021"
                          - text: ), and Bouma-Gregson et al., (
                          - link "2019" [ref=e269] [cursor=pointer]:
                            - /url: "#emi15409-bib-0008"
                          - text: ). A series of curation steps were taken to increase PHA depolymerase prediction accuracy and to reduce or eliminate non-functional homologues. Briefly, curation included eliminating severely truncated hits, ensuring key catalytic residues were present using multiple sequence alignments (MSAs), and protein-tree based curation using tree topology and branch length of hits placed among reference enzymes (for detailed curation notes see Supp.
                          - link "Data 4" [ref=e270] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). BLAST output data for the reference query sequence with the lowest e-value and a summary of the average, minimum, and maximum bit scores, identities, e-values and lengths of predicted PHA depolymerases can be found in
                          - link "Supp. Data 5" [ref=e271] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: . Signal peptides were predicted for predicted PHA depolymerases using Signal P 5.0 (
                          - link "https://services.healthtech.dtu.dk/service.php?SignalP" [ref=e272] [cursor=pointer]:
                            - /url: https://services.healthtech.dtu.dk/service.php?SignalP
                          - text: ) with default settings using both Gram-negative and Gram-positive predictions (Almagro Armenteros et al.,
                          - link "2019" [ref=e274] [cursor=pointer]:
                            - /url: "#emi15409-bib-0003"
                          - text: ).
                      - generic [ref=e275]:
                        - heading "Dataset selection, ecosystem classification and normalization" [level=3] [ref=e276]
                        - paragraph [ref=e277]:
                          - text: All 3078 metagenomic datasets had a minimum of 0.5 Mb of assembled sequence data and were selected to analyse the environmental distribution of PHA depolymerases. All metagenomic datasets had environmental metadata available in accordance with the GOLD five-level ecosystem classification system ([1] ecosystem [2] ecosystem category [3] ecosystem type [4] ecosystem subtype and [5] specific ecosystem) (Mukherjee et al.,
                          - link "2018" [ref=e279] [cursor=pointer]:
                            - /url: "#emi15409-bib-0042"
                          - text: ). All environmental data provided was used without modification with the exception of 8 metagenomes with ecosystem subtype classifications of loam (3) and peat (5) which were modified to soil to match other loam and peat samples. Additionally, sediment samples were inconsistently classified at the [5] specific ecosystem type or [3] ecosystem type levels, which was remedied by manually grouping all aquatic sediment samples together as an ecosystem type (see Supp.
                          - link "Data 2" [ref=e280] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: for modifications). Collectively, 104 unique GOLD ecosystems were described (Supp.
                          - link "Data 2" [ref=e281] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). Less than 2 % of metagenomes (40/3078) lacked latitude and longitude locations, which were input manually using data given in an associated study, or approximate geocoordinates were used given samples' described geographical locations (Supp.
                          - link "Data 2" [ref=e282] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). To account for differing dataset sizes, we calculated the frequency (hits/Gb) of PHA depolymerases occurring in metagenomes and MAGs (Supp. Fig. 1 Supp.
                          - link "Data 3" [ref=e283] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). Frequencies for different GOLD level ecosystem classifications were derived by dividing the total number of enzymes identified in metagenomes from an ecosystem category or subtype by the sum total of the sequence data screened from metagenomes occurring within a group. Frequencies in the MAGs for different phyla were calculated by dividing the total number of enzymes identified from a phylum by the sum total of the sequence data screened from MAGs of that phylum. Gene frequencies were calculated in this manner to normalize based on clade size.
                      - generic [ref=e284]:
                        - heading "Taxonomic affiliation of PHA depolymerases" [level=3] [ref=e285]
                        - paragraph [ref=e286]:
                          - text: Phylogenetic affiliations of PHA depolymerases were predicted for the unbinned PHA depolymerase-encoding scaffolds with a minimum length of 2000 bps (7260 scaffolds) using a diamond-blast search (Buchfink et al.,
                          - link "2014" [ref=e288] [cursor=pointer]:
                            - /url: "#emi15409-bib-0011"
                          - text: ) against NCBI's non-redundant database and subsequently conducting a lowest common ancestor analysis (LCA) with MEGAN6 v6.19.5 (Huson et al.,
                          - link "2016" [ref=e290] [cursor=pointer]:
                            - /url: "#emi15409-bib-0029"
                          - text: ) using GTDB taxonomy (Chaumeil et al.,
                          - link "2019" [ref=e292] [cursor=pointer]:
                            - /url: "#emi15409-bib-0013"
                          - text: ). For MAGs, 143 MAGs encoding predicted PHA depolymerases were assessed using CheckM v1.0.13 (Parks et al.,
                          - link "2015" [ref=e294] [cursor=pointer]:
                            - /url: "#emi15409-bib-0046"
                          - text: ), with MAGs kept for on-going analyses if they scored >50% complete and <10% contaminated (Supp.
                          - link "Data 3" [ref=e295] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). MAGs were subsequently dereplicated using dRep v. 2.5.3 (Olm et al.,
                          - link "2017" [ref=e297] [cursor=pointer]:
                            - /url: "#emi15409-bib-0044"
                          - text: ). GTDB-tk (Chaumeil et al.,
                          - link "2019" [ref=e299] [cursor=pointer]:
                            - /url: "#emi15409-bib-0013"
                          - text: ), as implemented on Kbase (Arkin et al.,
                          - link "2018" [ref=e301] [cursor=pointer]:
                            - /url: "#emi15409-bib-0007"
                          - text: ), was used to taxonomically identify dereplicated MAGs. Finally, a concatenated ribosomal protein (rp) tree was constructed to phylogenetically place the dereplicated MAGs that were >50% complete and <10% redundant (Supp.
                          - link "Data 3" [ref=e302] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). A dataset of 16 rps (rpL2, L3, L4, L5, L6, L14, L15, L16, L18, L22, L24, S3, S8, S10, S17 and S19) were gathered from MAGs and independently aligned. Alignments were masked to remove columns comprised of 95% + gaps. MAGs with <50% of expected ungapped residues over the concatenated alignment were excluded. Phyla containing predicted PHA depolymerase-encoding MAGs were selected from a bacterial reference set (Hug et al.,
                          - link "2016a" [ref=e304] [cursor=pointer]:
                            - /url: "#emi15409-bib-0027"
                          - text: ) and included in the final concatenated alignment. The final alignment was composed of 2789 positions, 886 reference taxa and 98 MAGs. The final concatenated rp tree was inferred using FastTree (Price et al.,
                          - link "2010" [ref=e306] [cursor=pointer]:
                            - /url: "#emi15409-bib-0050"
                          - text: ) as implemented in Geneious v.10.2.6. (
                          - link "https://www.geneious.com" [ref=e307] [cursor=pointer]:
                            - /url: https://www.geneious.com
                          - text: ) and the tree was visualized using iTOL (
                          - link "https://itol.embl.de/" [ref=e308] [cursor=pointer]:
                            - /url: https://itol.embl.de/
                          - text: ) (Letunic and Bork,
                          - link "2016" [ref=e310] [cursor=pointer]:
                            - /url: "#emi15409-bib-0035"
                          - text: ).
                    - generic [ref=e311]:
                      - heading "Results" [level=2] [ref=e312]
                      - generic [ref=e313]:
                        - heading "Environmental distribution of predicted PHA depolymerases" [level=3] [ref=e314]
                        - paragraph [ref=e315]:
                          - text: All IMG/M metagenomes included in this study had a minimum of 0.5 Mb of assembled sequence data and had available GOLD environmental metadata (Supp.
                          - link "Data 2" [ref=e316] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). The 3078 metagenomes were classified into 104 specific ecosystems from the GOLD hierarchy level 3 (Supp.
                          - link "Data 2" [ref=e317] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: "). Metagenomes were treated at the level of ecosystem category (level 1: aquatic, terrestrial, solid waste or wastewater) and ecosystem type (level 2: 14 subcategories). We focus on specific ecosystems or metagenomes only for select notable cases; however, all data including raw number of predicted PHA depolymerases, presence/absence and frequency of predicted enzymes identified from each metagenome and each specific ecosystem type can be found in Supp."
                          - link "Data 2" [ref=e318] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: .
                        - paragraph [ref=e319]:
                          - text: A total of 13 869 PHA depolymerases (13 377 unique) were predicted in 1295 metagenomes from aquatic (417/1492 = 27.9%), solid waste (23/34 = 67.6%), terrestrial (764/1323 = 57.7%) and wastewater (91/229 = 39.7%) environments (Fig. 1).Of these, 43% (5949/13,869) had predicted signal peptides. Most metagenomes had a low frequency of predicted PHA depolymerases (0.3–10 hits/Gb) (Supp. Fig.
                          - link "1" [ref=e320] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ", Supp."
                          - link "Data 2" [ref=e321] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). Looking broadly at different ecosystem categories, the highest frequency of predicted PHA depolymerases occurred in wastewater systems (10.73 hits/Gb) and terrestrial environments (8.22 hits/Gb), whereas solid waste and aquatic systems had averages of 5.53 and 4.09 hits/Gb respectively (Table
                          - link "1" [ref=e322] [cursor=pointer]:
                            - /url: "#emi15409-tbl-0001"
                          - text: ", Supp."
                          - link "Data 2" [ref=e323] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ).
