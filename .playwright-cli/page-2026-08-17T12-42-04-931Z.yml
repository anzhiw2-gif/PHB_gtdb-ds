        - generic [ref=e127]:
          - region [ref=e128]:
            - generic [ref=e129]:
              - heading "Abstract" [level=2] [ref=e130]
              - paragraph [ref=e132]: Microbial polyhydroxyalkanoates (PHAs), one of the largest groups of thermoplastic polyesters are receiving much attention as biodegradable substitutes for non-degradable plastics. Poly(d-3-hydroxybutyrate) (PHB) is the most ubiquitous and most intensively studied PHA. Microorganisms degrading these polyesters are widely distributed in various environments. Although various PHB-degrading microorganisms and PHB depolymerases have been studied and characterized, there are still many groups of microorganisms and enzymes with varying properties awaiting various applications. Distributions of PHB-degrading microorganisms, factors affecting the biodegrada- bility of PHB, and microbial and enzymatic degradation of PHB are discussed in this review. We also propose an application of a new isolated, thermophilic PHB-degrading microorganism, Streptomyces strain MG, for producing pure monomers of PHA and useful chemicals, including d-3-hydroxycarboxylic acids such as d-3-hydroxybutyric acid, by enzymatic degradation of PHB.
