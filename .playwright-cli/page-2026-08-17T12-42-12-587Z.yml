              - heading "Abstract" [level=2] [ref=e138]
              - paragraph [ref=e140]:
                - text: The United States discards approximately 25 million tons of plastic household waste every year; most ends up in landfills, where it may remain undegraded for decades (
                - link "Reference Palmisano and Pettigrew 1992" [ref=e141] [cursor=pointer]:
                  - /url: "#ref-CR22"
                  - text: Palmisano and Pettigrew 1992
                - text: ). Because plastics account for 20% b volume of solid municipal waste (
                - link "Reference Stein 1995" [ref=e142] [cursor=pointer]:
                  - /url: "#ref-CR28"
                  - text: Stein 1995
                - text: ), there is increasing motivation for society to find alternate disposal methods for them.
