                      - paragraph [ref=f1e346]: Figure 1. The PHAome Can Have Different Levels of Diversity, Including Macro-Diversity and Micro-Diversity. Macro-diversity comprises various monomer arrangements such as homo-, random, block polymers, functional, and graft polymers, as well as their various combinations that are represented as average monomer ratios, as can be determined extracellularly using physical instruments. By contrast, micro-diversity reflects the intracellular diversity of PHAs in terms of polymer chain lengths and monomer ratios that dynamically change over microbial growth periods.
                  - generic [ref=f1e347]: However, the applications of PHA are developing too slowly compared with the rapid development of PHA diversity.
                - generic [ref=f1e348]:
                  - heading "MGI and the PHAome" [level=2] [ref=f1e349]
                  - generic [ref=f1e350]:
                    - text: The MGI was launched in 2011. The MGI aims to establish an infrastructure to promote discovery and deployment of advanced materials in the USA
                    - link "[13]" [ref=f1e351] [cursor=pointer]:
                      - /url: "#bib0260"
                    - text: ", it will better manage existing investments through the use of computational capabilities, data management, and an integrated approach to materials science and engineering. MGI provides a unique opportunity to discover, develop, manufacture, and deploy advanced materials at least twice as fast as is possible today with low cost"
                    - link "[13]" [ref=f1e353] [cursor=pointer]:
                      - /url: "#bib0260"
                    - text: .
                  - generic [ref=f1e355]:
                    - text: The deployment of new classes of materials into applications takes a long time, ranging from 10 to 20 years from initial research to first use. The MGI will develop new integrated computational, experimental, and data informatics tools as an open platform to improve predictive capabilities and to follow newly created standards for quick integration of digital information across the materials innovation infrastructure. This will allow close integration of existing product–design frameworks, thus enabling rapid and holistic engineering design
                    - link "[13]" [ref=f1e356] [cursor=pointer]:
                      - /url: "#bib0260"
                    - text: .
                  - generic [ref=f1e358]:
                    - text: The PHAome consists of a vast number of new materials that do not exist in nature
                    - link "[6]" [ref=f1e359] [cursor=pointer]:
                      - /url: "#bib0230"
                    - text: . Very few PHAs have been so far been exploited as biodegradable and biocompatible thermoplastic materials for packaging or medical implant applications, and with limited success
                    - link "[9]" [ref=f1e361] [cursor=pointer]:
                      - /url: "#bib0245"
                    - text: . The number of new PHAs in the PHAome will certainly keep increasing, but research into their applications is constrained by the limited materials available to the physical, chemical, and material communities.
                  - generic [ref=f1e363]: The research approach proposed in the MGI can help to move the PHAome faster to the market place. For example, many new PHAs have been discovered by the microbiological communities without sufficient materials knowledge. An MGI-type infrastructure created by PHA research communities will enable scientists and engineers to design any number of new advanced materials, some of which may help in solving foundational science and engineering problems and address issues of pressing importance.
                - generic [ref=f1e364]:
                  - heading "The PHAome and Conventional PHA Diversity" [level=2] [ref=f1e365]
                  - generic [ref=f1e366]: The genome, transcriptome, and proteome address the entire cellular DNA and its diverse genetic information, and the complete set of RNAs or proteins expressed at a given time in one cell or a population of cells. Similarly, the PHAome should be defined as investigations of PHAs that contain diverse arrangements of various monomers produced by ‘one’ bacterium. However, conventional PHA diversity, as reflected in monomers, homopolymers, random copolymers, block copolymers, functional polymers, graft polymers, as well as ranges of molecular weights and combinations of the above, is usually achieved by several different bacterial species having different PHA synthases, different substrate preferences, and possibly also different metabolic pathways.
                  - generic [ref=f1e367]:
                    - text: It has become increasing possible to obtain the conventional PHA diversity in a single bacterial species – the PHAome concept. For example,
                    - emphasis [ref=f1e368]: Pseudomonas putida
                    - text: can be engineered to produce PHA homopolymers of various kinds
                    - link "8" [ref=f1e369] [cursor=pointer]:
                      - /url: "#bib0240"
                    - text: ","
                    - link "14" [ref=f1e371] [cursor=pointer]:
                      - /url: "#bib0265"
                    - text: ","
                    - link "15" [ref=f1e373] [cursor=pointer]:
                      - /url: "#bib0270"
                    - text: ", short chain-length (scl) and mcl PHA random copolymer of various types"
                    - link "16" [ref=f1e375] [cursor=pointer]:
                      - /url: "#bib0275"
                    - text: ","
                    - link "17" [ref=f1e377] [cursor=pointer]:
                      - /url: "#bib0280"
                    - text: ", mcl PHA random copolymers containing adjustable monomer ratios"
                    - link "18" [ref=f1e379] [cursor=pointer]:
                      - /url: "#bib0285"
                    - text: ","
                    - link "19" [ref=f1e381] [cursor=pointer]:
                      - /url: "#bib0290"
                    - text: ","
                    - link "20" [ref=f1e383] [cursor=pointer]:
                      - /url: "#bib0410"
                    - text: ","
                    - link "21" [ref=f1e385] [cursor=pointer]:
                      - /url: "#bib0295"
                    - text: ", PHA block copolymers"
                    - link "17" [ref=f1e387] [cursor=pointer]:
                      - /url: "#bib0280"
                    - text: ","
                    - link "22" [ref=f1e389] [cursor=pointer]:
                      - /url: "#bib0300"
                    - text: ","
                    - link "23" [ref=f1e391] [cursor=pointer]:
                      - /url: "#bib0305"
                    - text: ","
