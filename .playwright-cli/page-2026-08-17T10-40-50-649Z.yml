                  - text: We replaced the three amino acid residues with alanine to verify whether these putative active sites were indeed important for the hydrolysis activity of PhaZh1. Three PhaZh1 mutants (G16A, S47A, and D195A) were constructed as described in Materials and Methods. All three PhaZh1 mutants (
