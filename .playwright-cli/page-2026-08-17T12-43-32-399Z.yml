              - generic [ref=f1e757]:
                - heading "2. Diverse applications of PHA" [level=2] [ref=f1e758]
                - generic [ref=f1e759]:
                  - heading "2.1. PHA as environmentally friendly packaging materials" [level=3] [ref=f1e760]
                  - generic [ref=f1e761]:
                    - heading "2.1.1. Films, foams, paper coating, straws" [level=4] [ref=f1e762]
                    - generic [ref=f1e763]:
                      - text: PHA is a proven replacement for conventional plastics, especially in packaging (
                      - link "Vicente et al., 2023" [ref=f1e764] [cursor=pointer]:
                        - /url: "#bb0715"
                      - text: ). In 2020, 40% of the 1.6 million tonnes bioplastic market was in packaging products (
                      - link "Sehgal and Gupta, 2020" [ref=f1e766] [cursor=pointer]:
                        - /url: "#bb0615"
                      - text: ). As early as the 1980s, companies like Chemie Linz AG began production of PHB. Wella AG in Germany introduced one of the earliest commercialized PHA products in the 1990s, including everyday items like shampoo bottles and packaging materials (
                      - link "Weiner, 1997" [ref=f1e768] [cursor=pointer]:
                        - /url: "#bb0755"
                      - text: ;
                      - link "Chen, 2009" [ref=f1e770] [cursor=pointer]:
                        - /url: "#bb0095"
                      - text: ). The supplying company, Imperial Chemical Industry Biological (ICI) in London UK, also initiated P(3HB-
                      - emphasis [ref=f1e772]: co
                      - text: "-3 HV) razors and other basic goods production in the 1990s. Indeed, PHA is most appropriate for short-term applications and items that will encounter a compost-like setting, such as food utensils ("
                      - link "Fig. 2" [ref=f1e773] [cursor=pointer]:
                        - /url: "#f0010"
                      - text: e), films (
                      - link "Fig. 1" [ref=f1e775] [cursor=pointer]:
                        - /url: "#f0005"
                      - text: b) and electronic devices (
                      - link "Weiner, 1997" [ref=f1e777] [cursor=pointer]:
                        - /url: "#bb0755"
                      - text: ;
                      - link "Chen, 2009" [ref=f1e779] [cursor=pointer]:
                        - /url: "#bb0095"
                      - text: ).
                    - generic [ref=f1e781]:
                      - text: Since the 1990s, PHA applications in the packaging industry has widened to include packaging films, containers such as shopping bags, lids and tubs (
                      - link "Fig. 1" [ref=f1e782] [cursor=pointer]:
                        - /url: "#f0005"
                      - text: b,
                      - link "2" [ref=f1e784] [cursor=pointer]:
                        - /url: "#f0010"
                      - text: b). PHA can also be utilized to line paper cups, thereby rendering currently PE-lined cups to be recyclable (
                      - link "Fig. 1" [ref=f1e786] [cursor=pointer]:
                        - /url: "#f0005"
                      - text: i) (
                      - link "Rosenboom et al., 2022" [ref=f1e788] [cursor=pointer]:
                        - /url: "#bb0590"
                      - text: ). Certain PHA polymer materials have excelled gas barrier capabilities which make them suitable for food or beverage packaging, such as utensils and cups (
                      - link "Fig. 2" [ref=f1e790] [cursor=pointer]:
                        - /url: "#f0010"
                      - text: d, e). PHA has been found to have several applications in the food industry, including coatings and for films in dairy products (
                      - link "Philip et al., 2007" [ref=f1e792] [cursor=pointer]:
                        - /url: "#bb0525"
                      - text: ;
                      - link "Smith, 2005" [ref=f1e794] [cursor=pointer]:
                        - /url: "#bb0640"
                      - text: ). Additionally, short-chain-PHA in food service is also commercialized for coffee and tea packaging and other dry food packaging (
                      - link "Loh et al., 2009" [ref=f1e796] [cursor=pointer]:
                        - /url: "#bb0370"
                      - text: ","
                      - link "Loh et al., 2010" [ref=f1e798] [cursor=pointer]:
                        - /url: "#bb0375"
                      - text: ","
                      - link "Loh et al., 2011" [ref=f1e800] [cursor=pointer]:
                        - /url: "#bb0380"
                      - text: ;
                      - link "Loh et al., 2012" [ref=f1e802] [cursor=pointer]:
                        - /url: "#bb0385"
                      - text: ). The reported antibacterial properties of the polymers have led to growing interest in their use for sanitary products, including diapers, feminine hygiene products, and cosmetic containers (
                      - link "Fig. 2" [ref=f1e804] [cursor=pointer]:
                        - /url: "#f0010"
                      - text: b) (
                      - link "Philip et al., 2007" [ref=f1e806] [cursor=pointer]:
                        - /url: "#bb0525"
                      - text: ;
                      - link "Smith, 2005" [ref=f1e808] [cursor=pointer]:
                        - /url: "#bb0640"
                      - text: ). Furthermore, PHA is also suitable for latex-like applications, heat-sensitive adhesives, and smart gels such as in the beauty industry (
                      - link "Fig. 1" [ref=f1e810] [cursor=pointer]:
                        - /url: "#f0005"
                      - text: f, g). For example, nonwoven PHA matrices can be used to remove facial oils (
                      - link "Weiner, 1997" [ref=f1e812] [cursor=pointer]:
                        - /url: "#bb0755"
                      - text: ;
                      - link "Chen, 2009" [ref=f1e814] [cursor=pointer]:
                        - /url: "#bb0095"
                      - text: ). Importantly, these materials must be tested to maintain their biodegradable properties after testing. To this end, Dagnon et al. used compression molding to create kraft paper coated with PHA, and found the paper was degraded in soil-burial testing (
                      - link "Dagnon et al., 2010" [ref=f1e816] [cursor=pointer]:
                        - /url: "#bb0125"
                      - text: ).
                    - generic [ref=f1e818]:
                      - text: The introduction of other monomers into the PHB molecular chain can greatly improve its physical properties, for example introduction of 3 HV units forms the copolymer PHBV. Compared to PHB, PHBV has lower crystallinity, and lower melting and glass transition temperatures, allowing it to be used for films in food packaging and other applications (
                      - link "Sudesh et al., 2000" [ref=f1e819] [cursor=pointer]:
                        - /url: "#bb0650"
                      - text: ). PHBV also has an oxygen and water vapor barrier suitable for food packaging, increasing the food shelf-life of consumable products (
                      - link "Cunha et al., 2016" [ref=f1e821] [cursor=pointer]:
                        - /url: "#bb0120"
                      - text: ;
                      - link "Boufarguine et al., 2013" [ref=f1e823] [cursor=pointer]:
                        - /url: "#bb0080"
                      - text: ). The oxygen barrier of PHBV has been measured to be 0.217 cm
                      - superscript [ref=f1e825]: "3"
                      - text: ", suitable for food packaging ("
                      - link "Dasan et al., 2017" [ref=f1e826] [cursor=pointer]:
                        - /url: "#bb0130"
                      - text: ). PHBV films have been shown to be stable even in contact with liquid food stimulants such as water and oil. Moreover, the material properties (tensile strength, Young's modulus, and the elongation at break) of the films were shown suitable even after extended use (
                      - link "Chea et al., 2016" [ref=f1e828] [cursor=pointer]:
                        - /url: "#bb0090"
                      - text: ). PHBV can also be combined with new functional additives to enhance its properties, for example Ferri et al. reported recently an innovative blend of PHBV and tannins that not only matched but improved the shelf-life stability of food products (
                      - link "Ferri et al., 2023" [ref=f1e830] [cursor=pointer]:
                        - /url: "#bb0180"
                      - text: ). PHB straws made using blow molding are shown in
                      - link "Fig. 2" [ref=f1e832] [cursor=pointer]:
                        - /url: "#f0010"
                      - text: a, while a credit card made using compression molding is shown in
                      - link "Fig. 2" [ref=f1e834] [cursor=pointer]:
                        - /url: "#f0010"
                      - text: h.
                    - generic [ref=f1e836]:
                      - text: Among the early companies producing PHA packaging materials are P&G, Biomers, and Metabolix (
                      - link "Philip et al., 2007" [ref=f1e837] [cursor=pointer]:
                        - /url: "#bb0525"
                      - text: ;
                      - link "Smith, 2005" [ref=f1e839] [cursor=pointer]:
                        - /url: "#bb0640"
                      - text: ). In 2006, Metabolix and Archer Daniels Midland (ADM) formed a joint venture (Telles) to produce P34HB products for thermoforming and injection molding (MirelTM 3000 series) and for paper coating (MirelTM 4000 series) (
                      - link "Koller and Mukherjee, 2022" [ref=f1e841] [cursor=pointer]:
                        - /url: "#bb0290"
                      - text: ). The company also reported commercialization of compostable shopping bags, rigid food containers, drinking straws, coffee capsules, mulching films, and paper coatings. The Food and Drug Administration (FDA) has approved certain copolymers of PHA for packaging materials and food additives (
                      - link "Muneer et al., 2020" [ref=f1e843] [cursor=pointer]:
                        - /url: "#bb0470"
                      - text: ). For example, PHBV and poly((
                      - emphasis [ref=f1e845]: R
                      - text: )-3-hydroxybutyrate-
                      - emphasis [ref=f1e846]: co
                      - text: "-("
                      - emphasis [ref=f1e847]: R
                      - text: )-3-hydroxyhexanoate) (PHBHHx) are approved for food applications.
                    - generic [ref=f1e848]:
                      - text: Since these early pioneers, many new startup-ventures as well as developed companies have entered the PHA market, either to produce and sell PHA material or sell products as a finished product (
                      - link "Koller and Mukherjee, 2022" [ref=f1e849] [cursor=pointer]:
                        - /url: "#bb0290"
                      - text: ;
                      - link "Pellicer et al., 2017" [ref=f1e851] [cursor=pointer]:
                        - /url: "#bb0510"
                      - text: ). Some are listed here but comprehensive reviews are also readily available. Danimer Scientific (USA) has partnered with the beverage company Bacardi© to replace its poly(ethylene terephthalate) (PET) bottles with poly(3-hydroxypropionate) (P3HP), which would eliminate 80 million PET bottles per year (
                      - link "Koller and Mukherjee, 2022" [ref=f1e853] [cursor=pointer]:
                        - /url: "#bb0290"
                      - text: ). Danimer Scientific also has publicly announced the production of PHA-based straws in the venture Wincup©. The company PhaBuilder (China) produces PHB, P34HB and several other PHA copolymers that are readily degraded in both seawater and soil within 3–6 months. The final product is currently sold as pellets, with suitable applications in injection molding, water restoration (aquaculture), textiles, and polymer films. In 2019, the company Kaneka (Japan) launched PHBH™ drinking straws in many stores in Japan for iced beverages. Kaneka has also partnered with the consumer company Shiseido Co. Ltd. for the production of PHBH™ straws, bags, utensils, cosmetic and packaging materials. Finally the company Newlight Technologies LLC (USA) currently sells utensils, straws and cutlery, claiming its products are durable and dishwasher safe. Newlight has branded clothing items, including its ‘Covalent’ brand using PHB for eyewear, leather-like cases and smartphone covers (
                      - link "Koller and Mukherjee, 2022" [ref=f1e855] [cursor=pointer]:
                        - /url: "#bb0290"
                      - text: ).
                - generic [ref=f1e857]:
                  - heading "2.2. PHA as textiles" [level=3] [ref=f1e858]
                  - generic [ref=f1e859]:
                    - text: PHA can be spun into fibers just like nylon (
                    - link "Fig. 1" [ref=f1e860] [cursor=pointer]:
                      - /url: "#f0005"
                    - text: c). Currently, blending PHA with other molecules such as PLA is necessary to realise the full potential of the material in the textile industry, both in terms of reducing cost and improving physical properties (
                    - link "Weiner, 1997" [ref=f1e862] [cursor=pointer]:
                      - /url: "#bb0755"
                    - text: ;
                    - link "Chen, 2009" [ref=f1e864] [cursor=pointer]:
                      - /url: "#bb0095"
                    - text: ). Indeed, PLA alone is not suitable for many textile applications because it is brittle and slow to crystallize and benefits from blending with PHA before processing (
                    - link "Rosenboom et al., 2022" [ref=f1e866] [cursor=pointer]:
                      - /url: "#bb0590"
                    - text: ). A PLA/PHA blend can reduce the aging and secondary crystallization of both polymers. For example, yarns composed of PLA/PHBV were used to make knitted jerseys, and researchers found that the fiber product had thermomechanical properties suitable for dying, softness, durability, crease resistance, and other processing steps required by the apparel industry (
                    - link "Huang et al., 2017" [ref=f1e868] [cursor=pointer]:
                      - /url: "#bb0240"
                    - text: ). An image of PHA yarn is shown in
                    - link "Fig. 2" [ref=f1e870] [cursor=pointer]:
                      - /url: "#f0010"
                    - text: c., and PHBV/PLA textile is shown in
                    - link "Fig. 2" [ref=f1e872] [cursor=pointer]:
                      - /url: "#f0010"
                    - text: f.
                  - generic [ref=f1e874]:
                    - text: PHBV/PLA fibers produced by a melt spinning and hot drawing process were also reported to be ideal textiles in terms of strength, heat resistance and softness (
                    - link "Li et al., 2015" [ref=f1e875] [cursor=pointer]:
                      - /url: "#bb0360"
                    - text: ). In another work, melt spinning and drawing of PHBV in a controlled strict orientation was able to achieve high strength (>1 GPa) (
                    - link "Tanaka et al., 2006" [ref=f1e877] [cursor=pointer]:
                      - /url: "#bb0675"
                    - text: ). The same group found that the tensile strength was increased for low molecular weight drawn fibers at long isothermal crystallization times, although the maximum draw ratio must also be considered (
                    - link "Tanaka et al., 2007" [ref=f1e879] [cursor=pointer]:
                      - /url: "#bb0680"
                    - text: ). Meanwhile, dual core spinning processing is also possible for PHBV/PLA for a durable final fiber (
                    - link "Hufenus et al., 2015" [ref=f1e881] [cursor=pointer]:
                      - /url: "#bb0245"
                    - text: ). Finally, in an attempt to improve the crystallization of PHB in melt-spinning processes, reactive extrusion with peroxide was successfully used to inhibit secondary fiber crystallization, overcoming the natural brittleness of PHA and producing very strong fibers (
                    - link "Vogel et al., 2007" [ref=f1e883] [cursor=pointer]:
                      - /url: "#bb0720"
                    - text: ).
                  - generic [ref=f1e885]:
                    - text: Pioneering companies such as P&G, Biomers and Metabolix have fabricated medical surgical garments, upholstery, and carpets (
                    - link "Philip et al., 2007" [ref=f1e886] [cursor=pointer]:
                      - /url: "#bb0525"
                    - text: ;
                    - link "Smith, 2005" [ref=f1e888] [cursor=pointer]:
                      - /url: "#bb0640"
                    - text: ). Since then, PHA has been studied in past years as a melt-spun, gel-spun, or electrospun short-chain fiber to improve the sustainability of the clothing industry (
                    - link "Loh et al., 2008" [ref=f1e890] [cursor=pointer]:
                      - /url: "#bb0365"
                    - text: ). The company China Oil & Foodstuffs Corporation Ltd. (COFCO) (Beijing) produces PLA polymers (PLAneoTM technology) blended with PHA supplied by the start-up company PhaBuilder and Medpha in China for uses in textiles production, among other applications (
                    - link "Koller and Mukherjee, 2022" [ref=f1e892] [cursor=pointer]:
                      - /url: "#bb0290"
                    - text: ).
                - generic [ref=f1e894]:
                  - heading "2.3. PHA used in 3D printed materials" [level=3] [ref=f1e895]
                  - generic [ref=f1e896]:
                    - text: 3D printing creates three-dimensional physical objects that match pre-designed models, often using virtual models with computer-aided design (CAD) software (
                    - link "Fig. 2" [ref=f1e897] [cursor=pointer]:
                      - /url: "#f0010"
                    - text: i). Typically, an object is built in layers of either liquid, molten powder, or molten filament until a final structure is created. 3D models are useful for many industries, including education, jewellry and in household goods, in aerospace and automotive parts, and in dental and pharmaceutical applications (
                    - link "Kovalcik, 2021" [ref=f1e899] [cursor=pointer]:
                      - /url: "#bb0320"
                    - text: ). Although useful in all of these industries, perhaps the most interesting is in tissue engineering and regenerative medicine, due to the biodegradation of PHA and its compatibility with human tissue (
                    - link "Yang et al., 2018a" [ref=f1e901] [cursor=pointer]:
                      - /url: "#bb0790"
                    - text: ","
                    - link "Yang et al., 2018b" [ref=f1e903] [cursor=pointer]:
                      - /url: "#bb0795"
                    - text: ).
                  - generic [ref=f1e905]:
                    - generic [ref=f1e906]:
                      - text: Simple PHB can be a rigid and inflexibile material, with a melting temperature between 170 and 180 °C. PHB is brittle and can crystallize, which is not always ideal for 3D printing applications. Copolymers of PHBV, P(3HB-
                      - emphasis [ref=f1e907]: co
                      - text: "-3HHx), and P(3HB-"
                      - emphasis [ref=f1e908]: co
                      - text: "-4HB) ("
                      - link "Kovalcik, 2021" [ref=f1e909] [cursor=pointer]:
                        - /url: "#bb0320"
                      - text: ) reduce brittleness and increase flexibility, allowing more applications for 3D printing. The most widely tested 3D printing techniques using PHA are selective laser sintering (SLS) and fused deposition modeling (FDM), and PHA has also been piloted using the stereolithography photochemical process (
                      - link "Mehrpouya et al., 2021" [ref=f1e911] [cursor=pointer]:
                        - /url: "#bb0425"
                      - text: ). For example, an SLS process was used with Ca-P/PHBV for medical applications (
                      - link "Fig. 3" [ref=f1e913] [cursor=pointer]:
                        - /url: "#f0015"
                      - text: c).
