              - generic [ref=e259]:
                - heading "Cloning and sequence analysis of A. brasilense Sp7 phaZ" [level=3] [ref=e260]
                - paragraph [ref=e261]: Two degenerate primers were designed based on the phaZ sequences of R. eutropha, R. prowazekii, and R. capsulatus. Using total DNA of A. brasilense Sp7 as the template in PCR, a 200-bp product, with sequence similarity to known phaZ genes, was obtained. Following sequencing, specific oligonucleotide primers were synthesized and used for PCR screening of an E. coli HB101 cosmid library containing partially EcoRI-restricted total DNA of A. brasilense strain Sp7 in pLAFR3. A clone containing a 20-kb A. brasilense DNA fragment including the region encoding PhaZ was isolated. This DNA fragment was subcloned in pUC18, resulting in clone pDpoly-S/S.
                - paragraph [ref=e262]:
                  - text: The above subclone was sequenced by primer walking, and a reliable ORF was detected. The deduced amino acid sequence of this ORF exhibited high similarity with an internal part of the intracellular PhaZ proteins of Agrobacterium tumefaciens (GenBank accession no. AAL41046; 58% identity, 71% similarity), Mesorhizobium loti (GenBank accession no. BAB51181; 56% identity, 71% similarity), Methylobacterium extorquens (GenBank accession no. AF287908; 53% identity, 71% similarity) and R. eutropha (GenBank accession no. BAA33394; 52% identity, 65% similarity). The ORF obtained did not exhibit any sequence similarity to extracellular PhaZ proteins. Multiple alignment of the deduced amino acid sequence of the PhaZ from A. brasilense strain Sp7 with homologous intracellular phaZ genes from other bacteria is shown in Fig.
                  - link "1" [ref=e263] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#Fig1
                  - text: . The A. brasilense ORF was therefore designated phaZ. No other genes considered to be essential for PHB synthesis or degradation were found in the proximity of phaZ.
