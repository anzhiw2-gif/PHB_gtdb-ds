                    - paragraph [ref=e517]:
                      - text: Identification of the P(HO-co-HX) and PHACOS degradation products catalyzed by PhaZ
                      - subscript [ref=e518]: Sex2
                      - text: ". a Pie chart of the P(HO-co-HX) degradation products profile at 30-min reaction. b, c Pie chart of the PHACOS degradation products profile at 30-min (b) and 7-h (c) reactions. HO hydroxyoctanoate monomer, HX-HO dimer of hydroxyhexanoate and hydroxyoctanoate, HO-HO dimer of hydroxyoctanoate, HO-HX-HO trimer of hydroxyhexanoate and hydroxyoctanoate, HO-HO-HO trimer of hydroxyoctanoate, 6-ATH 6-acetylthiohexanoic acid. d, e PHACOS reaction product identification by LC-ESI-MS at 30 min (d) and 7 h (e). Peaks 1 to 5 represent the different separated species. The mass spectrum of peak 1 corresponds to deprotonated monomers of HO (m/z 159). Peak 2: dehydrated monomers of 3OH-6ATH (m/z 187). Peak 3, dimers HO-HO (m/z 301). ESI-MS spectra revealed the presence of 3-hydroxyalkanoates oligomers of high molecular weight in samples shown in b (peaks 4 and 5)"
            - generic [ref=e520]:
              - heading "Discussion" [level=2] [ref=e521]
              - generic [ref=e522]:
                - paragraph [ref=e523]:
                  - text: During the last few decades, Streptomycetes have shown to be a very important and adaptable group of bacteria for the production of commercially interesting bioactive natural products, antibiotics, and numerous extracellular hydrolytic enzymes, such as cellulases, chitinases, ligninases, and PHA depolymerases. In this sense, the interest on PHA hydrolysis by PHA depolymerases lies not only in the enzymatic biodegradation of these bioplastics or biomaterials but also as a promising biocatalytic procedure for obtaining chiral RHAs for fine chemical, pharmaceutical, medical, and biofuel industries (Ren et al.
                  - link "Reference 2010" [ref=e524] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR47
                    - text: "2010"
                  - text: ; Chen
                  - link "Reference 2011" [ref=e525] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR10
                    - text: "2011"
                  - text: ; Gao et al.
                  - link "Reference 2011" [ref=e526] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR19
                    - text: "2011"
                  - text: ). Therefore, there is increasing demand for developing novel methods that allow efficient production of RHAs, and the replacement of conventional processes by sustainable biotechnological procedures is one of the main current trends in white biotechnology and biocatalysis (Ren et al.
                  - link "Reference 2010" [ref=e527] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR47
                    - text: "2010"
                  - text: ).
                - paragraph [ref=e528]:
                  - text: S. exfoliatus was found to be one of the few bacteria able to hydrolyze scl- and mcl-PHAs, indicating the presence of both types of depolymerases (Klingbeil et al.
                  - link "Reference 1996" [ref=e529] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR32
                    - text: "1996"
                  - text: ; Elbanna et al.
                  - link "Reference 2004" [ref=e530] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR15
                    - text: "2004"
                  - text: ; Papaneophytou et al.
                  - link "Reference 2011" [ref=e531] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR43
                    - text: "2011"
                  - text: ; Martínez et al.
                  - link "Reference 2012" [ref=e532] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR39
                    - text: "2012"
                  - text: ; Santos et al.
                  - link "Reference 2013" [ref=e533] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR49
                    - text: "2013"
                  - text: ). Previously, scl-PHA depolymerase from S. exfoliatus DSMZ 41693 has been cloned and well characterized by our group (García-Hidalgo et al.
                  - link "Reference 2012" [ref=e534] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR20
                    - text: "2012"
                  - text: ). In this work, we have established that the putative phaZ
                  - subscript [ref=e535]: sex2
                  - text: gene identified by in silico analysis of the recently published genome sequence of S. exfoliatus DSMZ 41693 (Martínez et al.
                  - link "Reference 2014" [ref=e536] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR40
                    - text: "2014"
                  - text: ) actually encodes a novel mcl-PHA depolymerase (PhaZ
                  - subscript [ref=e537]: Sex2
                  - text: ), which displays several characteristics that render its biotechnological exploitation attractive for the production of added value RHAs. In this sense, PhaZ
                  - subscript [ref=e538]: Sex2
                  - text: releases (R)-3-hydroxyoctanoic acid monomers as the main reaction products when mcl-PHA is used as substrate. Remarkably, PhaZ
                  - subscript [ref=e539]: Sex2
                  - text: is also capable to hydrolyze functionalized biopolymers such as PHACOS, releasing functional thioester-based monomers.
                - paragraph [ref=e540]:
                  - text: Alignment of the deduced amino acid sequence of PhaZ
                  - subscript [ref=e541]: Sex2
                  - text: with biochemically characterized extracellular mcl-PHA depolymerases shows very high sequence similarity with mcl-PHA depolymerases from S. omiyaensis SO2 (88 %), S venezuelae SO1 (88 %), and S. roseolus SL3 (85 %), revealing that it could belong to the recently identified Actinobacteria subgroup of mcl-PHA depolymerases (Gangoiti et al.
                  - link "Reference 2012" [ref=e542] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR18
                    - text: "2012"
                  - text: ; Santos et al.
                  - link "Reference 2013" [ref=e543] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR49
                    - text: "2013"
                  - text: ). Furthermore, the typical signal peptide domain of extracellular PHA depolymerases (García-Hidalgo et al.
                  - link "Reference 2012" [ref=e544] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR20
                    - text: "2012"
                  - text: ","
                  - link "Reference 2013" [ref=e545] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR21
                    - text: "2013"
                  - text: ) was found at the N-terminus of the deduced amino acid sequence of PhaZ
                  - subscript [ref=e546]: Sex2
                  - text: (Fig.
                  - link "S1" [ref=e547] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#MOESM1
                  - text: ). Besides, the catalytic triad with essential residues for depolymerase activity (Ser, Asp, His) and the lipase consensus pentapeptide (Gly-X1-Ser-X2-Gly) found in almost all known serine hydrolases, were also identified. 3D modeling of the enzyme structure from its amino acid sequence revealed the spatial arrangement of the catalytic amino acids in the active center as well as the proximity of Gln
                  - superscript [ref=e548]: "174"
                  - text: ", the putative oxyanion hole amino acid that stabilizes the tetrahedral transition state (Fig."
                  - link "6" [ref=e549] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Fig6
                  - text: ).
                - figure "Fig. 6" [ref=e551]:
                  - generic [ref=e554]:
                    - generic [ref=e555]:
                      - generic:
                        - img "Fig. 6"
                      - link "Full size image figure 6" [ref=e557] [cursor=pointer]:
                        - /url: /article/10.1007/s00253-015-6780-1/figures/6
                        - text: Full size image
                    - paragraph [ref=e561]:
                      - text: Three-dimensional structure model of PhaZ
                      - subscript [ref=e562]: Sex2
                      - text: . The structure was modeled by the Phyre2 server (Protein Homology/analogY Recognition Engine V 2.0) (Kelley and Sternberg
                      - link "Reference 2009" [ref=e563] [cursor=pointer]:
                        - /url: /article/10.1007/s00253-015-6780-1#ref-CR30
                        - text: "2009"
                      - text: ) available at
                      - link "www.sbg.bio.ic.ac.uk/phyre2" [ref=e564] [cursor=pointer]:
                        - /url: http://www.sbg.bio.ic.ac.uk/phyre2
                      - text: ", which combines homology and an initio modeling algorithms. The active site catalytic amino acids (Ser"
                      - superscript [ref=e565]: "123"
                      - text: "-Asp"
                      - superscript [ref=e566]: "167"
                      - text: "-His"
                      - superscript [ref=e567]: "197"
                      - text: ) are highlighted in cyan, red, and green, respectively.
                - paragraph [ref=e568]:
                  - text: Using Rhodococcus as a heterologous expression system, the active form of PhaZ
                  - subscript [ref=e569]: Sex2
                  - text: could be extracellularly produced, demonstrating the presence of the signal peptide identified in silico. Once again, Rhodococcus was able to recognize and process a Streptomyces signal peptide which facilitated further protein purification and characterization.
                - paragraph [ref=e570]:
                  - text: MALDI-TOF analysis of the purified protein revealed a monomer of 27.6 kDa, and secondary structure analysis as well as 3D modeling (Fig.
                  - link "6" [ref=e571] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Fig6
                  - text: ) supported an α/β hydrolase fold, present in many hydrolytic enzymes such as lipases. However, sedimentation velocity analysis showed that PhaZ
                  - subscript [ref=e572]: Sex2
                  - text: could form active dimers at high protein concentrations, which is probably due to its hydrophobic nature that may end up in aggregates formation.
                - paragraph [ref=e573]:
                  - text: Regarding the optimum reaction conditions, PhaZ
                  - subscript [ref=e574]: Sex2
                  - text: displayed highest activity at 30 °C and pH 10. This temperature is not usual among PHA depolymerases from Actinobacteria, which show higher optimal temperatures (Santos et al.
                  - link "Reference 2013" [ref=e575] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR49
                    - text: "2013"
                  - text: ). PhaZ
                  - subscript [ref=e576]: Sex2
                  - text: exhibited a low thermostability when incubated at 30 °C. However, stability is improved in presence of 10 % glycerol (75 % activity is maintained), which allows longer incubation periods. Remarkably, a significant enhancement in the presence of low concentrations of nonionic and anionic detergents was observed in PhaZ
                  - subscript [ref=e577]: Sex2
                  - text: . Similarly to lipases, detergents can improve the availability of the substrate by promoting emulsification or triggering protein conformational changes, which will improve the accessibility of the active site (Delorme et al.
                  - link "Reference 2011" [ref=e578] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR12
                    - text: "2011"
                  - text: ). Higher detergent concentrations markedly decreased the enzyme activity. Similar behavior was reported in the P. fluorescens GK13 and S. venezuelae SO1 enzymes (Gangoiti et al.
                  - link "Reference 2010" [ref=e579] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR17
                    - text: "2010"
                  - text: ; Santos et al.
                  - link "Reference 2013" [ref=e580] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR49
                    - text: "2013"
                  - text: ). Interestingly, depolymerase activity was clearly inhibited by divalent cations as CaCl
                  - subscript [ref=e581]: "2"
                  - text: and MgCl
                  - subscript [ref=e582]: "2"
                  - text: .
                - paragraph [ref=e583]:
                  - text: Concerning enzyme activity on mcl-PHA, purified PhaZ
                  - subscript [ref=e584]: Sex2
                  - text: showed a higher specific activity compared to previously reported mcl-PHA depolymerases from Actinobacteria, (Santos et al.
                  - link "Reference 2013" [ref=e585] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR49
                    - text: "2013"
                  - text: ; Gangoiti et al.
                  - link "Reference 2012" [ref=e586] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR18
                    - text: "2012"
                  - text: ). In this sense, PhaZ
                  - subscript [ref=e587]: Sex2
                  - text: depolymerase specifically degrades mcl-PHA and is inactive towards scl-PHA and it behaves as an endo-exo-hydrolase that cleaves both large and small PHA molecules, producing (R)-3-hydroxyoctanoic acid monomers as the main reaction product of the mcl-PHA hydrolysis. It is worth mentioning that this is the first extracellular mcl-PHA depolymerase producing hydroxyoctanoate monomers as the main products in only 30-min reaction time whereas other mcl-PHA depolymerases from Actinobacteria required higher enzyme concentration (25-fold) and longer reaction time (72 h of incubation) to obtain 57–80 % monomers (Santos et al.
                  - link "Reference 2013" [ref=e588] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR49
                    - text: "2013"
                  - text: ; Gangoiti et al.
                  - link "Reference 2012" [ref=e589] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR18
                    - text: "2012"
                  - text: ). Moreover, the prototype of extracellular mcl-PHA depolymerases PhaZ
                  - subscript [ref=e590]: GK13
                  - text: (Schirmer and Jendrossek
                  - link "Reference 1994" [ref=e591] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR50
                    - text: "1994"
                  - text: ; Gangoiti et al.
                  - link "Reference 2010" [ref=e592] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR17
                    - text: "2010"
                  - text: ) or that from the predator bacterium B. bacteriovorus HD100 (Martínez et al.
                  - link "Reference 2012" [ref=e593] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR39
                    - text: "2012"
                  - text: ) releases dimers as the main reaction products. Therefore, PhaZ
                  - subscript [ref=e594]: Sex2
                  - text: is herein targeted as the most promising biocatalyst in biotechnological processes for the efficient degradation of natural mcl-PHA for the production of RHAs. Remarkably, the ability of PhaZ
                  - subscript [ref=e595]: Sex2
                  - text: to degrade functionalized polymers as PHACOS producing functional thioester-based monomers, highlights the potential use of this novel depolymerase for the production of added value RHAs.
                - paragraph [ref=e596]:
                  - text: Finally, analysis of the draft genome sequence from S. exfoliatus DSMZ 41693 (Martínez et al.
                  - link "Reference 2014" [ref=e597] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR40
                    - text: "2014"
                  - text: ) showed the presence of numerous genes of PHA metabolism, which comprise the gene coding and the mcl-PHA depolymerase characterized in this work as well as 48 genes of scl-PHA metabolism including scl-PHA depolymerase previously described (García-Hidalgo et al.
                  - link "Reference 2012" [ref=e598] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR20
                    - text: "2012"
                  - text: ). Further analysis of the assembled genome sequence revealed additional genes involved in degradation of scl-PHA, such as a putative 3-hydroxybutyrate oligomer hydrolase (3HBOH) coding gene (nt 28,268 to 29,713 in Contig61), which is located 973 bp upstream scl-PHA depolymerase gene. Likewise, genome also contains genes which encode for other degrading enzymes such as cellulases, amylases, chitinases, proteases, and lipases (Martínez et al.
                  - link "Reference 2014" [ref=e599] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#ref-CR40
                    - text: "2014"
                  - text: ).
                - paragraph [ref=e600]: Summing up, our findings have contributed to consider S. exfoliatus DSMZ 41693 as promising strain for biomass conversion and environmental bioremediation as well as a microbial source for obtaining novel enzymes with important biotechnological applications.
