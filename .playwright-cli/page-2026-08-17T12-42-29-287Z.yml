                      - generic [ref=e492]:
                        - heading [level=3] [ref=e493]:
                          - text: PhaZ
                          - subscript [ref=e494]: KT
                          - text: depolymerase as unique functional PHA-mobilizing enzyme
                        - paragraph [ref=e495]:
                          - text: The role of a PhaZ
                          - subscript [ref=e496]: KT
                          - text: "-like enzyme in the mobilization of accumulated PHA has been documented previously in P. putida GPo1 when cells were incubated in alkaline conditions ("
                          - link "Ren et al., 2005" [ref=e497] [cursor=pointer]:
                            - /url: "#b17"
                          - text: ;
                          - link "Wang et al., 2007" [ref=e498] [cursor=pointer]:
                            - /url: "#b18"
                          - text: ). The experiments shown in
                          - link "Fig. 3" [ref=e499] [cursor=pointer]:
                            - /url: "#f3"
                          - text: suggest that PhaZ
                          - subscript [ref=e500]: KT
                          - text: is the sole depolymerase of P. putida KT2442, because an external addition of ammonium sulfate did not increase the number of viable cells of KT42Z mutant. However, the existence of PhaZ
                          - subscript [ref=e501]: KT
                          - text: cross immunoreactive proteins induced at PHA mobilization conditions have been also demonstrated (
                          - link "de Eugenio et al., 2007" [ref=e502] [cursor=pointer]:
                            - /url: "#b7"
                          - text: ). To exclude the implication of other hydrolases in the PHA mobilization triggered by pH conditions, we have compared in a resting cell system the PHA degradation in the wild-type strain versus the KT42Z mutant by using an extremely sensitive radioactive method previously established for the detection of PHA depolymerase activity (
                          - link "Fig. 4" [ref=e503] [cursor=pointer]:
                            - /url: "#f4"
                          - text: ). This method is based on the use of
                          - superscript [ref=e504]: "14"
                          - text: C-labelled PHA as depolymerase substrate and the subsequent detection of the released radioactive soluble products (
                          - link "de Eugenio et al., 2007" [ref=e505] [cursor=pointer]:
                            - /url: "#b7"
                          - text: ). To generate the labelled polyester, the wild-type strain and its KT42Z mutant were cultured for 24 h under PHA production conditions in the presence of
                          - superscript [ref=e506]: "14"
                          - text: C-octanoic acid as PHA precursor. After centrifugation, the cells were shifted to water (pH 5.5) and different buffered solutions at pH ranging from 4 to 10.6, incubated at 30°C, and the secretion of radioactive-labelled products was monitored over the time (
                          - link "Fig. 4A" [ref=e507] [cursor=pointer]:
                            - /url: "#f4"
                          - text: ). The highest radioactivity value was observed at alkaline conditions (50 mM glycine-NaOH buffer pH 10.6) for the wild-type strain but none radioactive metabolites was detected in the supernatant of KT42Z mutant (
                          - link "Fig. 4B" [ref=e508] [cursor=pointer]:
                            - /url: "#f4"
                          - text: ). The absence of HAs in the supernatant of KT42Z strain was confirmed by liquid chromatography-mass spectrometry (LC-MS) analyses. These results agree with the behaviour of P. putida GPo1 (
                          - link "Ren et al., 2005" [ref=e509] [cursor=pointer]:
                            - /url: "#b17"
                          - text: ), and definitively demonstrate that no PHA mobilization can be achieved in KT42Z strain, suggesting that this function can be only ascribed to PhaZ
                          - subscript [ref=e510]: KT
                          - text: in P. putida KT2442. A film illustrating the mobilization of PHA triggered by alkaline conditions in P. putida KT2442 is provided as Movie S1 in Supplementary Material. About 70% of previously accumulated PHA in the wild-type strain was mobilized to the supernatant as HAs monomers and dimers. In cells containing 1.01 g l
                          - superscript [ref=e511]: −1
                          - text: PHA, the HA productivity reached a maximum of 0.72 g l
                          - superscript [ref=e512]: −1
                          - text: . When composition of released products was analysed by LC-MS, three major peaks could be distinguished (
                          - link "Fig. 4C and D" [ref=e513] [cursor=pointer]:
                            - /url: "#f4"
                          - text: ). Peak 1 was identified as main single charged ion m/z 131, corresponding to the molecular mass of the deprotonated 3-hydroxyhexanoic acid, whereas peak 2 corresponded to 3-hydroxyoctanoic acid (m/z 159). The deprotonated 3-hydroxyoctanoic dimer and the dimer adduct of 3-hydroxyoctanoic diester were found in peak 3 (m/z 301 and m/z 603 respectively). The three major peaks identified in wild type were absent in KT42Z supernatant.
                        - figure [ref=e515]:
                          - link [ref=e516] [cursor=pointer]:
                            - /url: /cms/asset/f0384925-6a07-4c65-88f1-90de34642aba/emi_2061_f4.gif
                            - img "Details are in the caption following the image" [ref=e518]
                          - generic [ref=e519]:
                            - generic [ref=e520]:
                              - strong [ref=e521]: Figure 4
                              - generic [ref=e522]:
