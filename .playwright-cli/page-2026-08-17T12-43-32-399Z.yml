              - generic [ref=f1e306]:
                - heading "1. Introduction" [level=2] [ref=f1e307]
                - generic [ref=f1e308]: Amid growing environmental concerns, the exploration of applications for bioplastics as alternatives to fossil fuel-derived counterparts becomes crucial, motivated by the need to mitigate challenges associated with resource depletion, pollution, and climate change.
                - generic [ref=f1e309]:
                  - text: Bioplastics include plastics originating from plant-based materials, agricultural byproducts, and other renewable biomass sources as well as those capable of natural degradation over time through microorganism activity (
                  - link "Bhagwat et al., 2020" [ref=f1e310] [cursor=pointer]:
                    - /url: "#bb0055"
                  - text: ). Unlike traditional plastics derived from fossil fuels like petroleum, bioplastics are deemed environmentally friendly as they are sourced from renewable resources. Biodegradable bioplastics address issues related to plastic pollution thereby decreasing environmental impact (
                  - link "Ross et al., 2017" [ref=f1e312] [cursor=pointer]:
                    - /url: "#bb0595"
                  - text: ). As of 2022, the annual worldwide production of bio-based plastics reached approximately 2 million tonnes, with fully biodegradable plastics constituting the majority (
                  - link "Rosenboom et al., 2022" [ref=f1e314] [cursor=pointer]:
                    - /url: "#bb0590"
                  - text: ). Polyhydroxyalkanoates (PHAs) stand at the forefront of sustainable bioplastics, derived from microbial synthesis and exhibiting versatility in application areas. With a diverse array of molecular structures, PHAs promise eco-friendly solutions across industries, ranging from packaging to medicine, marking a pivotal stride toward a more sustainable and adaptable future (
                  - link "Raza et al., 2018" [ref=f1e316] [cursor=pointer]:
                    - /url: "#bb0565"
                  - text: ).
                - generic [ref=f1e318]:
                  - heading "1.1. Polyhydroxyalkanoates (PHA) benefits and limitations as a biopolymer" [level=3] [ref=f1e319]
                  - generic [ref=f1e320]:
                    - generic [ref=f1e321]:
                      - text: Within the context of bioplastics, PHA have gained renown for their use as biodegradable, biocompostable plastics, on a trajectory to replace petrochemical-based plastics alongside the well-known polylactic acid (PLA) (
                      - link "Sabapathy et al., 2020" [ref=f1e322] [cursor=pointer]:
                        - /url: "#bb0600"
                      - text: ). PHA are polyesters naturally produced and stored as granules in many Gram-positive and Gram-negative bacteria (shown in
                      - link "Fig. 1" [ref=f1e324] [cursor=pointer]:
                        - /url: "#f0005"
                      - text: a) (
                      - link "Meng et al., 2014" [ref=f1e326] [cursor=pointer]:
                        - /url: "#bb0440"
                      - text: ). In addition to their biodegradability in various environments, PHA can be considered a plastic created from renewable ingredients, because they can be synthesized through the fermentation of renewable feedstocks like sugars or plant oils (
                      - link "Raza et al., 2018" [ref=f1e328] [cursor=pointer]:
                        - /url: "#bb0565"
                      - text: ). Different PHA polymers and copolymers can emulate the functionality of petroleum-derived plastics, presenting a biodegradable, non-toxic, and eco-friendly alternative. There are now a diversity of PHA monomers able to replace some fossil-fuel derived plastics from consumer goods to packaging (
                      - link "Chen and Hajnal, 2015" [ref=f1e330] [cursor=pointer]:
                        - /url: "#bb0100"
                      - text: ). They can be engineered to have different levels of flexibility, strength, and transparency, making them versatile for use in various industries, including packaging, agriculture, and medicine (
                      - link "Sabapathy et al., 2020" [ref=f1e332] [cursor=pointer]:
                        - /url: "#bb0600"
                      - text: ). PHA's biocompatibility, non-toxicity, and antibacterial properties expands its application areas to the medical field (
                      - link "Pandey et al., 2022" [ref=f1e334] [cursor=pointer]:
                        - /url: "#bb0505"
                      - text: ;
                      - link "Wang et al., 2005" [ref=f1e336] [cursor=pointer]:
                        - /url: "#bb0730"
                      - text: ). Due to its ability to break down harmlessly in the body, PHA has been exploited in medical applications including drug delivery systems and tissue engineering (
                      - link "Zhang et al., 2018" [ref=f1e338] [cursor=pointer]:
                        - /url: "#bb0805"
                      - text: ). PHA also naturally sequesters nitrogen, has been shown to be beneficial to plant growth and be a healthy substitute in animal feed, lending it to many applications in the agricultural industry (
                      - link "Asiri and Chu, 2022" [ref=f1e340] [cursor=pointer]:
                        - /url: "#bb0045"
                      - text: ;
                      - link "Khurram, 2015" [ref=f1e342] [cursor=pointer]:
                        - /url: "#bb0270"
                      - text: ;
                      - link "Venkata Mohan et al., 2010" [ref=f1e344] [cursor=pointer]:
                        - /url: "#bb0705"
                      - text: ). (See
                      - link "Table 1" [ref=f1e346] [cursor=pointer]:
                        - /url: "#t0005"
                      - text: .)
