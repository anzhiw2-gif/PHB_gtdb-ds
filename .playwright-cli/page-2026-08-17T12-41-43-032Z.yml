        - generic [ref=e122]:
          - generic [ref=e123]:
            - generic:
              - heading [level=1]
            - generic [ref=e124]:
              - generic [ref=e125]: ▪ Abstract
              - paragraph [ref=e129]: Polyesters such as poly(3-hydroxybutyrate) (PHB) or other polyhydroxyalkanoates (PHA) have attracted commercial and academic interest as new biodegradable materials. The ability to degrade PHA is widely distributed among bacteria and fungi and depends on the secretion of specific extracellular PHA depolymerases (e-PHA depolymerases), which are carboxyesterases (EC 3.1.1.75 and EC 3.1.1.76), and on the physical state of the polymer (amorphous or crystalline). This contribution provides a summary of the biochemical and molecular biological characteristics of e-PHA depolymerases and focuses on the intracellular mobilization of storage PHA by intracellular PHA depolymerases (i-PHA depolymerases) of PHA-accumulating bacteria. The importance of different assay systems for PHA depolymerase activity is also discussed.
              - text: Key Words
              - list [ref=e130]:
                - listitem [ref=e131]:
                  - link "polyhydroxybutyrate" [ref=e132] [cursor=pointer]:
                    - /url: /search?option1=pub_keyword&value1="polyhydroxybutyrate"
                  - text: ","
                - listitem [ref=e133]:
                  - link "intracellular PHB depolymerase" [ref=e134] [cursor=pointer]:
                    - /url: /search?option1=pub_keyword&value1="intracellular PHB depolymerase"
                  - text: ","
                - listitem [ref=e135]:
                  - link "extracellular PHB depolymerase" [ref=e136] [cursor=pointer]:
                    - /url: /search?option1=pub_keyword&value1="extracellular PHB depolymerase"
                  - text: ","
                - listitem [ref=e137]:
                  - link "Paucimonas lemoignei" [ref=e138] [cursor=pointer]:
                    - /url: /search?option1=pub_keyword&value1="%0A                Paucimonas lemoignei %0A            "
            - generic [ref=e139]:
              - generic [ref=e140]: INTRODUCTION
              - paragraph [ref=e143]:
                - text: Poly(R)-hydroxyalkanoic acids (PHA) are a group of storage compounds of carbon and energy that are accumulated during unbalanced growth by many bacteria, i.e., in the presence of an excess of a carbon source and if growth is limited by another nutrient (e.g., nitrogen). PHA are deposited intracellularly in the form of inclusion bodies (“granules,” visible as brilliant globules, 100–500 nm) in the phase contrast microscope and may account for up to 90% of the cellular dry weight [for reviews on PHA see (
                - link "3" [ref=e145] [cursor=pointer]:
                  - /url: "#right-ref-b3"
                - text: ","
                - link "13" [ref=e147] [cursor=pointer]:
                  - /url: "#right-ref-b15"
                - text: ","
                - link "63" [ref=e149] [cursor=pointer]:
                  - /url: "#right-ref-b65"
                - text: ","
                - link "72" [ref=e151] [cursor=pointer]:
                  - /url: "#right-ref-b74"
                - text: ","
                - link "89" [ref=e153] [cursor=pointer]:
                  - /url: "#right-ref-b91"
                - text: )]. Poly(R)-3-hydroxybutyric acid (PHB) is the most abundant polyester in bacteria. It consists of only one type of monomer, 3-hydroxybutyrate (3HB). However, about 150 hydroxyalkanoic acids (HA) other than 3HB have been identified as constituents of microbial polyesters (
                - link "100" [ref=e155] [cursor=pointer]:
                  - /url: "#right-ref-b102"
                - text: ","
                - link "102" [ref=e157] [cursor=pointer]:
                  - /url: "#right-ref-b104"
                - text: ). Depending on the number of carbon atoms of the monomers, PHA are classified as short-chain-length PHA (PHASCL; 3 to 5 C-atoms) and medium-chain-length PHA (PHAMCL; 6 or more C-atoms). In many bacteria PHA is composed of more than one type of monomer (copolyesters). The high number of monomers and the variable monomeric composition of PHA results in an enormous variation of the physical and chemical characteristics of different PHA. Despite the high numbers of different PHA, only PHB and copolymers of 3HB and 3-hydroxyvaleric acid (3HV) have been commercialized (e.g., Biopol®). PHA differ from chemosynthetically produced polymers such as polyethylene or polypropylene by their synthesis from renewable resources and by their easy biodegradability to water and carbon dioxide. In this contribution the key enzymes of PHA degradation, the PHA depolymerases, are reviewed.
            - generic [ref=e158]:
              - generic [ref=e159]: DEFINITIONS
              - paragraph [ref=e162]:
                - text: Any research on the biodegradation of PHA should clearly distinguish between intracellular PHA degradation and extracellular PHA degradation. Intracellular degradation is the active degradation (mobilization) of an endogeneous storage reservoir by the accumulating bacterium itself. Enzymes catalyzing the intracellular degradation of PHA are intracellular PHA depolymerases (i-PHA depolymerases). Conversely, extracellular degradation is the utilization of an exogeneous polymer by a not-necessarily accumulating microorganism that secretes extracellular PHA depolymerases (e-PHA depolymerases). The source of extracellular polymer is PHA released by accumulating cells after death and cell lysis. It is necessary to differentiate between extracellular and intracellular degradation because PHA in vivo and outside of the bacteria is present in two different biophysical states. In intracellullar PHA (so-called native PHA granules) the polyesters exist in the amorphous state and the molecules are mobile (
                - link "2" [ref=e164] [cursor=pointer]:
                  - /url: "#right-ref-b2"
                - text: ). Native PHA granules have a particular surface layer consisting of proteins and phospholipids that is sensitive to physical or chemical stress. The polymers of damaged granules crystallize and adopt an ordered helical structure (
                - link "11A" [ref=e166] [cursor=pointer]:
                  - /url: "#right-ref-b12"
                - text: ) (
                - link "Figure 1" [ref=e168] [cursor=pointer]:
                  - /url: "#f1"
                - text: ). Extracellular PHB is a partially crystalline polymer (typical degree of crystallinity is 50%–60%) with an amorphous fraction characterized by the glass-to-rubber transition temperature (Tg ∼ 0–2°C) and by a crystalline fraction that melts in the range 170–180°C. In this contribution PHA in the native (amorphous) state (i.e., intracellular granules with intact surface layer) are indicated as nPHA, whereas the same polymers in the partially crystalline form are denoted as denatured, dPHA. The same notation is used to differentiate PHA depolymerases according to their ability to hydrolyze nPHA (nPHA depolymerases) or dPHA (dPHA depolymerases).
              - paragraph
              - generic [ref=e169]:
                - generic [ref=e170]:
                  - generic [ref=e171]: Figure 1
                  - generic [ref=e174]:
                    - text: "Physical state of PHA. Top: Electron micrograph of a PHB-accumulating bacterium. Bottom left: Schematic view of a cross-section through a native PHB granule; structural and functional proteins and phospholipids constituing the surface layer are indicated. Middle: Schematic view of isolated, denatured, partially crystalline PHB. Bottom right: Schematic view of a cross-section through an artificial PHB granule with surfactant molecules at the surface [modified from ("
                    - link "42" [ref=e176] [cursor=pointer]:
                      - /url: "#right-ref-b44"
                    - text: )].
                - link [ref=e178] [cursor=pointer]:
                  - /url: /docserver/fulltext/micro/56/1/mi56_0403_1.gif
                  - img "Figure 1" [ref=e179]
                  - paragraph [ref=e180]: Click to view
              - paragraph
            - generic [ref=e181]:
              - generic [ref=e182]: EXTRACELLULAR DEGRADATION OF PHA
              - generic [ref=e185]:
                - text: General Aspects on the Isolation of dPHA-Degrading Microorganisms
                - paragraph [ref=e186]:
                  - text: Microorganisms that utilize extracellular dPHA as a sole source of carbon and energy can be enriched by inoculation of mineral salts solutions containing the desired polyester as the sole source of carbon and energy, with material from the environment (e.g., soil, sludge). This procedure generally results in the enrichment of those microbial species that have the shortest doubling times under the chosen laboratory conditions. However, these organisms might not necessarily represent the most efficient PHA-degrading strains in nature. A more suitable method for the assessment of the distribution of microbial PHA degraders is to plate dilutions of material from the ecosystem of interest on solid agar media that contain the polymer as a sole source of carbon in an opaque overlay prepared from dPHA. dPHA-degrading microorganisms secrete dPHA depolymerases, which hydrolyze the polymer extracellularly to water-soluble products and can be recognized by the appearance of transparent clearing zones around the colonies. This clear zone technique can be performed aerobically, anaerobically, or in agar shake tubes for the selection of aerobic, anaerobic, or microaerophilic microorganisms. The first study on PHA degradation was performed in 1963 in H.G. Schlegel's department by A.A. Chowdhury (
                  - link "11" [ref=e188] [cursor=pointer]:
                    - /url: "#right-ref-b11"
                  - text: ).
                - paragraph [ref=e189]:
                  - text: Unfortunately, only a few short-chain-length dPHA (dPHASCL), e.g., PHB, can be prepared as a milky suspension of denatured granules. Many other PHA, e.g., all medium-chain-length PHA (PHAMCL), form rubber-like aggregations and cannot be used for the clear zone technique directly. Mineral agar plates containing solution-cast films of PHAMCL have been successfully applied for the isolation of PHAMCL-degrading bacteria (
                  - link "92" [ref=e191] [cursor=pointer]:
                    - /url: "#right-ref-b94"
                  - text: ). A significant improvement was achieved by the development of PHA emulsions (lattices) (
                  - link "64" [ref=e193] [cursor=pointer]:
                    - /url: "#right-ref-b66"
                  - text: ","
                  - link "82" [ref=e195] [cursor=pointer]:
                    - /url: "#right-ref-b84"
                  - text: ), which have a milky appearance and can be used for the more sensitive clear zone technique. Growth of bacteria expressing poly(3-hydroxyoctanoate) (PHO) depolymerase activity on a PHO latex emulsified in the agar is shown in
                  - link "Figure 2" [ref=e197] [cursor=pointer]:
                    - /url: "#f2"
                  - text: . The different diameters of the clearing zones and the different degree of opaqueness are due to mutations of the PHO-depolymerase gene (see below) and indicate the sensitivity of the method. Other methods for latex preparation were developed by Horowitz and coworkers (
                  - link "35" [ref=e199] [cursor=pointer]:
                    - /url: "#right-ref-b37"
                  - text: ","
                  - link "36" [ref=e201] [cursor=pointer]:
                    - /url: "#right-ref-b38"
                  - text: "): They prepared emulsions of PHA by dissolving the polymer in chloroform, adding a surfactant, and emulsifying with water by sonication. The solvent was removed by dialysis or evaporation, and an opaque, stable suspension of granules coated by the surfactant was obtained (artificial PHA granules) ("
                  - link "Figure 1" [ref=e203] [cursor=pointer]:
                    - /url: "#f1"
                  - text: ", bottom right)."
                - paragraph
                - generic [ref=e204]:
                  - generic [ref=e205]:
                    - generic [ref=e206]: Figure 2
                    - generic [ref=e209]:
                      - text: Growth of recombinant E. coli harboring the PHO depolymerase gene of P. fluorescens on solid medium with opaque latex of PHO. Note large diameter of clearing zones and complete clearing of wild-type colonies (top) and different diameters and variable degree of clearing zone formation in strains harboring mutations in the PHO depolymerase gene (right, bottom, left); for details see text (from
                      - link "42" [ref=e211] [cursor=pointer]:
                        - /url: "#right-ref-b44"
                      - text: ).
                  - link [ref=e213] [cursor=pointer]:
                    - /url: /docserver/fulltext/micro/56/1/mi56_0403_2.gif
                    - img "Figure 2" [ref=e214]
                    - paragraph [ref=e215]: Click to view
                - paragraph
              - generic [ref=e216]:
                - text: Characterization of Extracellular dPHA-Degrading Microorganisms
                - paragraph [ref=e217]:
                  - text: "The ability to degrade extracellular PHA is widely distributed among bacteria and fungi: Aerobic and anaerobic PHA-degrading microorganisms have been isolated from various ecosystems such as soil, compost, aerobic and anaerobic sewage sludge, fresh and marine water (including deep sea), estuarine sediment, and air. An overview on PHA-degrading microorganisms is given in"
                  - link "Table 1" [ref=e219] [cursor=pointer]:
                    - /url: "#t1"
                  - text: of (
                  - link "42" [ref=e221] [cursor=pointer]:
                    - /url: "#right-ref-b44"
                  - text: ","
                  - link "43" [ref=e223] [cursor=pointer]:
                    - /url: "#right-ref-b45"
                  - text: ). Apparently, PHA-degrading microorganisms, in particular dPHB-degrading microorganisms, are widespread in the environment. For a survey of ecological and/or taxonomical studies on the abundance and diversity of PHA-degrading bacteria see (
                  - link "8" [ref=e225] [cursor=pointer]:
                    - /url: "#right-ref-b8"
                  - text: ","
