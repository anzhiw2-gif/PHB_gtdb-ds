                - heading "Growth and carbon metabolism" [level=3] [ref=e310]
                - paragraph [ref=e311]: A difference in generation time in LB media was measured between A. brasilense 7030 and the phaZ mutant strain. A. brasilense 7030 had a generation time of 8.45 h whereas that of the phaZ mutant was 12.02 h. No growth was observed in either A. brasilense 7030 or in the phaZ mutant when grown on high C:N media supplemented with PHB from Ralstonia (Alcaligenes) species (Sigma) as a sole carbon source. No apparent differences in the utilization of an array of carbon sources on BIOLOG GN plates by A. brasilense 7030 and by a phaZ-deficient mutant strain were detected. However, the formation of a more intense color was observed in the wells of the plates inoculated with A. brasilense 7030, indicating more efficient utilization of the carbon source (not shown). Dextrin, glycogen, inulin, d-arabitol, 3-methyl glucose, α-methyl d-glucoside, β-methyl d-glucoside, d-psicose, stachyose, d-trehalose, turanose, d-xylose, acetic acid, β-hydroxybutyric acid, α-ketovaleric acid, lactamide, d-lactic-acid methylester, d-malic-acid, l-malic-acid, methyl pyruvate, mono-methyl pyruvate, propionic acid, pytuvic acid, succinamic acid, l-alanine, glycyl-l-glutamic acid, glycerol, and fructose-6-phosphate were utilized by both strains.
