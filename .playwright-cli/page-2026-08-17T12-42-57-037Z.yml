                - paragraph [ref=e476]:
                  - text: In addition, the effect of several ions and other compounds was also studied (Table
                  - link "3" [ref=e477] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Tab3
                  - text: ). Interestingly, 2 mM MgCl
                  - subscript [ref=e478]: "2"
                  - text: and CaCl
                  - subscript [ref=e479]: "2"
                  - text: caused a complete inactivation of the dialyzed PhaZ
                  - subscript [ref=e480]: Sex2
                  - text: enzyme (Table
                  - link "3" [ref=e481] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Tab3
                  - text: ). The activity of PhaZ
                  - subscript [ref=e482]: Sex2
                  - text: was also assayed in the presence of some detergents, being considerably enhanced with low concentrations of nonionic detergents, such as 0.01 % (w/v) Tween 20 or 0.005 % (w/v) Triton X-100, as well as in the presence of 0.01 % (w/v) of the anionic detergent SDS (Table
                  - link "3" [ref=e483] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Tab3
                  - text: ). However, higher concentration of detergents showed a significant inhibitory effect.
