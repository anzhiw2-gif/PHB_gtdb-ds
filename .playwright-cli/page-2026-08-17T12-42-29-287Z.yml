                                  - generic [ref=e525]: 
                                  - text: PowerPoint
                            - paragraph [ref=e527]:
                              - text: pH influence on PHA mobilization in P. putida KT2442 and KT42Z cultures.A and B.
                              - superscript [ref=e528]: "14"
                              - text: C-HAs release monitored by radioactivity counting from (A) KT2442 cells suspended in various pH buffers and solutions. PHA production conditions mean incubation in M63 0.1 N plus 15 mM sodium octanoate. (B) HAs release comparison between KT2442 and KT42Z strains incubated in a buffered solution at pH 10.6.C and D. LC-ESI-MS analysis of KT2442 (C) and KT42Z (D) supernatants incubated at Glycine-NaOH buffer 50 mM, pH 10.6.
                      - generic [ref=e529]:
                        - heading [level=3] [ref=e530]:
                          - text: PHA turnover directed by a functional PhaZ
                          - subscript [ref=e531]: KT
                          - text: depolymerase
                        - paragraph [ref=e532]:
                          - text: The current model for the PHB metabolism proposes the existence of continuously active PHA machinery able to accumulate or to mobilize carbon as a response to nutrient requirements and reduction power (
                          - link "Doi et al., 1990" [ref=e533] [cursor=pointer]:
                            - /url: "#b19"
                          - text: ;
                          - link "Uchino et al., 2007" [ref=e534] [cursor=pointer]:
                            - /url: "#b14"
                          - text: ). The assumption of a similar model in P. putida KT2442 for PHA metabolism requires the coexistence of an active depolymerase enzyme during PHA accumulation. In fact, we have demonstrated the presence of PhaZ
                          - subscript [ref=e535]: KT
                          - text: in the PHA granules when cells are producing PHA (
                          - link "de Eugenio et al., 2007" [ref=e536] [cursor=pointer]:
                            - /url: "#b7"
                          - text: ). To support this hypothesis, the PHA accumulation/mobilization ability was tested in KT2442 and KT42Z cells exposed to starvation and excess of carbon source (
                          - link "Fig. 5" [ref=e537] [cursor=pointer]:
                            - /url: "#f5"
                          - text: ). When cells were grown for 24 h (
                          - link "Fig. 5" [ref=e538] [cursor=pointer]:
                            - /url: "#f5"
                          - text: ", cultures 1 and 4) or 48 h ("
                          - link "Fig. 5" [ref=e539] [cursor=pointer]:
                            - /url: "#f5"
                          - text: ", cultures 2 and 5), under PHA production conditions with octanoic acid, maximum PHA accumulation was found after 24 h of growth in both strains, with very low differences in PHA content. In agreement with the model, only 4% of HAs related to the cell dry weight (CDW) was detected in the KT2442 strain supernatant in PHA production medium ("
                          - link "Table 2" [ref=e540] [cursor=pointer]:
                            - /url: "#t2"
                          - text: ), confirming that the metabolism is directed to PHA accumulation and not to PHA mobilization. The PHA content in KT42Z mutant increased 3.5% compared with that of wild type and HAs were not detected in the supernatant (
                          - link "Table 2" [ref=e541] [cursor=pointer]:
                            - /url: "#t2"
                          - text: ). These results might suggest that, under these growth conditions, PhaZ
                          - subscript [ref=e542]: KT
                          - text: is inactive or very low active, and that no other depolymerase or hydrolase is able to degrade the polymer in the wild-type strain. Alternatively, it could be envisaged that PHA synthase is more active than the PHA depolymerase resulting in PHA accumulation. To discriminate between both possibilities, nonanoic acid (10 mM) was added to an existing 24 h octanoic culture [containing 60–70% poly(hydroxyoctanoate-cohydroxyhexanoate) (P(HO-co-HX))] and incubated during 24 additional hours. The results shown in
                          - link "Fig. 5" [ref=e543] [cursor=pointer]:
                            - /url: "#f5"
                          - text: demonstrate not only that PhaZ
                          - subscript [ref=e544]: KT
                          - text: is active, but also that both PHA synthesis and hydrolysis are carried out simultaneously (
                          - link "Fig. 5" [ref=e545] [cursor=pointer]:
                            - /url: "#f5"
                          - text: ", cultures 3 and 6). The pre-existing polymer could be distinguished from the PHA synthesized de novo by their monomer content/ratio, since the new one contains odd monomers like hydroxynonanoic and heptanonanoic acids ("
                          - link "Fig. 5" [ref=e546] [cursor=pointer]:
                            - /url: "#f5"
                          - text: ). The PHA polymer content and monomer composition of KT42Z mutant (
                          - link "Fig. 5" [ref=e547] [cursor=pointer]:
                            - /url: "#f5"
                          - text: ) confirmed that PhaZ
                          - subscript [ref=e548]: KT
                          - text: plays a crucial role in this process (
                          - link "Fig. 5" [ref=e549] [cursor=pointer]:
                            - /url: "#f5"
                          - text: ", cultures 3 and 6). Thus, the lack of PHA depolymerase completely avoids the hydrolysis of PHA that increases from 72% of CDW at 24 h to 76% after the addition of the extra carbon source. Furthermore, the presence of odd monomers in the sediment is very low (1% of the total PHA content) indicating a reduced activity of the synthase. Biomass parameters do not change significantly after 24 h of growth, most probably due to the exhaustion of nitrogen or other inorganic nutrient in the media. Taken together, all these results definitively demonstrate the existence of PHA metabolic turnover in P. putida KT2442 and the crucial role played by PhaZ"
                          - subscript [ref=e550]: KT
                          - text: .
