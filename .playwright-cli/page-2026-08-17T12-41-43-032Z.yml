                - paragraph
                - generic [ref=e738]:
                  - generic [ref=e739]:
                    - generic [ref=e740]: Figure 3
                    - generic [ref=e742]: Alignment of PHA depolymerase catalytic active amino acids (top, left) and of substrate binding domains (top, right). Amino acids of the catalytic triad and the conserved histidine residue of the putative oxyanion are shown in bold and big letters. Amino acids conserved in all or more than 13 depolymerases are indicated by capital or lowercase letters in the consensus sequence, respectively. Asterisks (*) indicate amino acids with hydrophobic side chain. The lipase boxes are indicated by bold letters. A domain model of PHASCL depolymerases is shown below the alignment. Depending on the microbial origin the depolymerase consists of (a) a signal peptide (SP), (b) one of two possible types (type 1 or 2) of catalytic domains, (c) one of three possible types of linking domains (Fn3, Thr, or Cad), and (d) one or two of two types of substrate-binding domains (SBD 1 or 2).
                  - link [ref=e745] [cursor=pointer]:
                    - /url: /docserver/fulltext/micro/56/1/mi56_0403_3.gif
                    - img "Figure 3" [ref=e746]
                    - paragraph [ref=e747]: Click to view
                - paragraph
                - paragraph [ref=e748]:
                  - text: Two types of SBD can be differentiated (types 1 and 2,
                  - link "Figure 3" [ref=e750] [cursor=pointer]:
                    - /url: "#f3"
                  - text: ). However, several amino acids including positively charged amino acids such as histidine (His−49), arginine (Arg−44), and a cysteine residue (Cys−2) are conserved in both types of binding domains. In type 1 a second cysteine at position −57 or −59 is present. It is not known whether the conserved amino acids are necessary to constitute a particular three-dimensional structure or whether these amino acids are directly involved in binding to the polymer chain, e.g., by hydrophobic, hydrophilic, and/or electrostatic interaction [see also (
                  - link "113" [ref=e752] [cursor=pointer]:
                    - /url: "#right-ref-b115"
                  - text: )]. Computer analysis of the putative secondary structures of SBD predicted the absence of any α-helices and the presence of mainly coiled structures with one or two β-sheets. The sensitivity of dPHB depolymerases to DTT suggests that at least some of the cysteine residues participate in a disulfide bridge(s).
              - generic [ref=e753]:
                - generic [ref=e754]: "PhaZ7: A New Type of Thermoalkalophilic Hydrolase of P. lemoignei with Specificity for Amorphous PHASCL"
                - paragraph [ref=e755]:
                  - text: All dPHA depolymerases hydrolyze crystalline dPHA, but many of them are inactive with intact amorphous nPHA granules. However, dPHB depolymerases are able to hydrolyze nPHB granules if the surface layer of the nPHB granules has been damaged or partially removed (e.g., by protease treatment). Once the surface layer is damaged, the hydrolysis of nPHA granules by dPHA depolymerases is three- to fourfold higher compared to that of crystalline dPHA. Some dPHASCL depolymerases are even able to hydrolyze intact nPHB granules [e.g., recombinant PHB depolymerase B (PhaZ2) of P. lemoignei; R. Handrick & D. Jendrossek, unpublished observation]. Recently, the hydrolysis of atactic PHB, which is a synthetic copolyester of (S)-3HB and (R)-3HB, was analyzed (
                  - link "29" [ref=e757] [cursor=pointer]:
                    - /url: "#right-ref-b31"
                  - text: ). Due to the presence of both enantiomers being randomly distributed along the polymer, crystallization of atactic PHB is impossible and the polymer is completely amorphous. Conventional dPHB depolymerases such as PHB depolymerase A or B (PhaZ5, PhaZ2) of P. lemoignei have no or only little activity on atactic PHB. However, unexpected high levels of a novel extracellular enzymatic activity of P. lemoignei that hydrolyzed atactic PHB were detected (
                  - link "29" [ref=e759] [cursor=pointer]:
                    - /url: "#right-ref-b31"
                  - text: "): The respective depolymerase was purified and characterized. The new depolymerase (PhaZ7) was specific for amorphous PHB, such as nPHB granules with an intact surface layer or atactic PHB, but was inactive with dPHA. Therefore, the depolymerase is the first described extracellular nPHASCL depolymerase. The purified enzyme is active and stable at high temperatures (59°C) and at alkaline pH (pH 9–12). The depolymerase PhaZ7 is highly active on nPHB granules (9000 μmol cleaved ester bonds × min"
                  - superscript [ref=e760]: −1
                  - text: × mg
                  - superscript [ref=e761]: −1
                  - text: ) but has no detectable lipase, cutinase, amidase/nitrilase, protease, DNAse, nor any significant RNAse activity. Only low activity was found with soluble p-nitrophenylacylesters (≤0.38 U/mg). Therefore, PhaZ7 is not a conventional esterase or lipase (
                  - link "29" [ref=e763] [cursor=pointer]:
                    - /url: "#right-ref-b31"
                  - text: ). A summary of the biochemical properties of selected PHASCL depolymerases is given in
                  - link "Table 2" [ref=e765] [cursor=pointer]:
                    - /url: "#t2"
                  - text: .
