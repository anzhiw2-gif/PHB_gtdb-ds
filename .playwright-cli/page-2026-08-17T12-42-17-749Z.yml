                          - text: ).
                    - generic [ref=f1e586]:
                      - generic [ref=f1e587]:
                        - text: A crevice is formed on the surface of the enzyme, surrounded by structural elements between β2 and α2, β3 and α3, β5 and β6, and β11 and α9 (
                        - link "Figure 1" [ref=f1e588] [cursor=pointer]:
                          - /url: "#fig1"
                        - text: ). The catalytic residues Ser39, Asp121, and His155 are located in the crevice. The inside of the crevice serves as a substrate-binding site, which is of sufficient length (∼15 Å) and width (∼6 Å) to permit the incorporation of a single chain of the polymer (see
                        - link "Figure 7" [ref=f1e590] [cursor=pointer]:
                          - /url: "#fig7"
                        - text: ). A number of hydrophobic residues (Leu38, Tyr43, Tyr76, Thr123, Val124, Leu251, Tyr176, Leu298, Pro301, Trp307, Val308, and Trp310) as well as a cystine (Cys250–Cys304) are located inside the crevice, providing a hydrophobic environment favorable for the binding of polymer chains (
                        - link "Figure 5" [ref=f1e592] [cursor=pointer]:
                          - /url: "#fig5"
                        - text: ). These residues except for Leu251 are highly conserved in both type II and type I depolymerases (
                        - link "Figures 3" [ref=f1e594] [cursor=pointer]:
                          - /url: "#fig3"
                        - text: ), indicating that they are essential for interaction with PHB chains, and that they define the substrate specificity of the enzyme toward small side-chains of PHB.
                      - figure [ref=f1e596]:
                        - list [ref=f1e598]:
                          - listitem [ref=f1e599]:
                            - 'link "Download: Download full-size image" [ref=f1e600] [cursor=pointer]':
                              - /url: https://ars.els-cdn.com/content/image/1-s2.0-S0022283605015901-gr5.jpg
                        - paragraph [ref=f1e605]:
                          - text: Figure 5. A close-up stereoview of the active site (the S39A–H(R3HB)
                          - subscript [ref=f1e606]: "3"
                          - text: M complex). Side-chains of catalytic residues and residues forming the substrate-binding site in the crevice are represented as ball-and-stick models. The amide nitrogen atoms of Ser40, Cys250, and Asn302 are also shown. A model of the R3HB trimer (designated as (R3HB)
                          - subscript [ref=f1e607]: "3"
                          - text: ) is also shown as a black ball-and-stick model. A hydrogen bond between N
                          - superscript [ref=f1e608]: δ1
                          - text: atom of Trp307 and the carbonyl oxygen of an ester linkage adjacent to a scissile linkage, and one between His155 and Asp121 are indicated as green lines. The side-chain of Ser39 of the wild-type protein (shown in red) is superimposed on Ala39 of the mutant model, and a hydrogen bond between the O
                          - superscript [ref=f1e609]: γ
                          - text: atom of Ser39 and the amide group of Ser40 is tentatively indicated with a green broken line.
                    - generic [ref=f1e610]:
                      - text: The structure of the S39A–H(R3HB)
                      - subscript [ref=f1e611]: "3"
                      - text: M complex reveals three subsites for binding each monomer unit of the polymer substrate. Two methyl groups (side-chains) of units 1 and 2 of H(R3HB)
                      - subscript [ref=f1e612]: "3"
                      - text: M interact with hydrophobic pockets of the substrate-binding site formed by Tyr43, Val124, and Trp307 (subsite 1), and Trp307, Tyr76, Val308, and Trp310 (subsite 2) (
                      - link "Figure 5" [ref=f1e613] [cursor=pointer]:
                        - /url: "#fig5"
                      - text: ). The size and shape of the two hydrophobic pockets are such that they may be unable to accommodate side-chains larger than an ethyl group, consistent with the observed substrate specificity of this enzyme toward poly(3-hydroxyvalerate).
                      - link [ref=f1e615] [cursor=pointer]:
                        - /url: "#bib19"
                        - superscript [ref=f1e618]: "19"
                      - text: The carbonyl oxygen of unit 2 is hydrogen bonded to the N
                      - superscript [ref=f1e619]: ε1
                      - text: of Trp307, which is the only hydrophilic interaction between H(R3HB)
                      - subscript [ref=f1e620]: "3"
                      - text: M and the protein. On the other hand, the carbonyl oxygen of unit 3 is hydrogen bonded to a water molecule, which is further hydrogen bonded to O
                      - superscript [ref=f1e621]: δ1
                      - text: of Asn300 and the main chain amide group of Asn302. These interactions define the substrate specificity of the enzyme toward polyesters with monomer units of three carbon atoms as a main chain.
                    - generic [ref=f1e622]:
                      - text: The binding site for unit 3 of H(R3HB)
                      - subscript [ref=f1e623]: "3"
                      - text: M is situated at the surface of the protein, and is not clearly shaped compared to those for units 1 and 2. Unit 3 is surrounded by hydrophobic residues Tyr76, Leu298, Pro301, and Trp310, in addition to hydrophilic residues Ser299 and Asn302. However, the methyl group of unit 3 is exposed to bulk solvent, and is no longer embedded in the protein, unlike those of units 1 and 2. Thus it appears that the affinity of this subsite for a monomer unit is weaker than in the case of the other subsites. It should be noted that unit 3 is further surrounded by Asn314, Gly319, and Val321 of a neighboring protein molecule in the crystal lattice. As a result, the affinity of this site for unit 3 may be increased, which may be the reason for why electron densities for unit 3 are clearly observed in our X-ray data.
                    - generic [ref=f1e624]:
                      - text: On the other hand, there should be a subsite (−1) to which a monomer unit linked with unit 1
                      - emphasis [ref=f1e625]: via
                      - text: the scissile bond should be bound. Unfortunately, the disordered methyl group of H(R3HB)
                      - subscript [ref=f1e626]: "3"
                      - text: M esterified with unit 1 does not provide sufficient information for subsite −1. Inspection of the structure indicates that hydrophobic residues Tyr176, Cys250, and Leu251 could serve as subsite −1.
                  - generic [ref=f1e627]:
                    - heading "Implication for the catalytic mechanism" [level=3] [ref=f1e628]
                    - generic [ref=f1e629]:
                      - generic [ref=f1e630]:
                        - text: The spatial arrangement of the catalytic residues indicates that the mechanism of the depolymerase reaction may be similar to that of a lipase/serine esterase.
                        - link [ref=f1e631] [cursor=pointer]:
                          - /url: "#bib25"
                          - superscript [ref=f1e634]: "25"
                        - text: Thus it is possible that transient tetrahedral coordination of the carbonyl carbon atom could occur during the course of the catalytic reaction, and it could be stabilized by positively charged groups that make up an oxyanion hole. Inspection of the active site architecture indicates that the main chain amide group of Ser40 is part of the oxyanion hole. Another group that could potentially contribute to the oxyanion hole is the main chain amide group of Cys250. The catalytic reaction may thus proceed as follows (
                        - link "Figure 6" [ref=f1e635] [cursor=pointer]:
                          - /url: "#fig6"
                        - text: "): Ser39 plays a central role in the catalytic reaction, participating in a nucleophilic attack on the carbonyl carbon atom of a bound PHB chain. The His155–Asp121 hydrogen bonding system may enhance the nucleophilicity of the hydroxyl group of Ser39. Ser39 does not hydrogen bond to His155 in the ligand-free state, and it is likely that Ser39 changes its conformation upon binding of a substrate, forming a hydrogen bond with His155, and raising its nucleophilicity. A PHB chain is bound to the active site, with its four contiguous monomer units occupying the four subsites (−1 to 3) of the substrate-binding site. A carbonyl group next to the scissile ester linkage is hydrogen bonded to Trp307, which enables the carbonyl carbon of the scissile linkage to be located at a position that would permit it to be attacked by the hydroxyl group of Ser39. A tetrahedral coordination at the carbonyl carbon atom is transiently formed, which is stabilized by the oxyanion hole formed by the amide groups of Ser40 and Cys250. After a rearrangement of the bond formation, a covalent enzyme–substrate intermediate is subsequently formed, releasing a first product, with a hydroxyl group at the end of the chain. The intermediate is then hydrolyzed by the nucleophilic attack of a water molecule activated by the His–Asp system. The transiently formed tetrahedral coordination is again stabilized by the oxyanion hole. After bond rearrangement, the hydroxyl group of Ser39 is regenerated and a second product, with a carboxyl group at the end of the chain, is released, thus completing one cycle of the catalytic reaction."
                      - figure [ref=f1e637]:
                        - list [ref=f1e639]:
                          - listitem [ref=f1e640]:
                            - 'link "Download: Download full-size image" [ref=f1e641] [cursor=pointer]':
                              - /url: https://ars.els-cdn.com/content/image/1-s2.0-S0022283605015901-gr6.gif
                        - paragraph [ref=f1e646]:
                          - text: Figure 6. A proposed mechanism for the action of the PHB depolymerase from
                          - emphasis [ref=f1e647]: P. funiculosum
                          - text: . Upon binding of a PHB chain to the substrate-binding site, Ser39 may change its conformation to form a hydrogen bond with His155. Four contiguous monomer units (−1 to 3) are bound to the subsites, making predominantly hydrophobic interactions with the enzyme, with concomitant hydrophilic interactions. The carbonyl oxygen of unit 2 is hydrogen bonded to N
                          - superscript [ref=f1e648]: ε1
                          - text: of Trp307, and that of unit 3 is hydrogen bonded to O
                          - superscript [ref=f1e649]: δ1
                          - text: of Asn300 and the main chain nitrogen of Asn302
                          - emphasis [ref=f1e650]: via
                          - text: a water molecule. The methyl groups of units 1 and 2 are specifically bound to the hydrophobic pockets of the enzyme (see the text). The scissile bond is located between units −1 and 1. Nucleophilic attack on the carbonyl carbon involved in the scissile bond by Ser39 results in a formation of a covalent acyl-enzyme intermediate
                          - emphasis [ref=f1e651]: via
                          - text: a tetrahedral transition state, which is stabilized by two main chain amide groups of Ser40 and Cys250. The acyl-enzyme intermediate is subsequently hydrolyzed by a water molecule activated by His135
                          - emphasis [ref=f1e652]: via
                          - text: formation of a similar tetrahedral transition state. After regeneration of Ser39, or liberation of the remaining product, a conformational change of Ser39 may occur, which disrupts a hydrogen bond with His155 and forms one with the amide group of Ser40.
                    - generic [ref=f1e653]:
                      - text: Note that His248, which is generally believed to form part of the oxyanion hole based on sequence conservation and the mechanistic analogy of the depolymerase to lipase,
                      - link [ref=f1e654] [cursor=pointer]:
                        - /url: "#bib6"
                        - superscript [ref=f1e657]: "6"
                      - text: is located at the C-terminal end of strand β9, and neighbors the active site, hydrogen bonding to the main chain carbonyl oxygen of Gly249 and the amide group of Ala283. Its side-chain does not point to the active site, and, therefore, it is unlikely that it would participate in catalysis.
                  - generic [ref=f1e658]:
                    - heading "Solvent-exposed hydrophobic residues form a polymer-adsorption site" [level=3] [ref=f1e659]
                    - generic [ref=f1e660]:
                      - generic [ref=f1e661]:
                        - text: To efficiently hydrolyze a water-insoluble substrate, it may be essential for the enzyme to reside on the surface for a period of time. In the case of a multi-domain depolymerase, the enzyme can reside on the surface of PHB
                        - emphasis [ref=f1e662]: via
                        - text: the substrate-binding domain.
                        - link "10" [ref=f1e663] [cursor=pointer]:
                          - /url: "#bib10"
                        - text: ","
                        - link "12" [ref=f1e665] [cursor=pointer]:
                          - /url: "#bib12"
                        - text: ","
                        - link "15" [ref=f1e667] [cursor=pointer]:
                          - /url: "#bib15"
                        - text: ","
                        - link "16" [ref=f1e669] [cursor=pointer]:
                          - /url: "#bib16"
                        - text: ","
                        - link "17" [ref=f1e671] [cursor=pointer]:
                          - /url: "#bib17"
                        - text: The single domain depolymerase from
                        - emphasis [ref=f1e673]: P. funiculosum
                        - text: lacks such a functionally distinct domain, but retains the ability to reversibly bind to polymers.
                        - link [ref=f1e674] [cursor=pointer]:
                          - /url: "#bib19"
                          - superscript [ref=f1e677]: "19"
                        - text: Therefore it must have a region on its molecular surface for binding to the hydrophobic surface of a polymer. An inspection of the depolymerase structure revealed that a number of hydrophobic residues including threonine residues (Tyr75, Thr77, Tyr81, Tyr84, Thr122, Leu171, Thr173, Leu251, Tyr287, Ile289, Val297, Leu298, and Pro301) are aligned around the mouth of the crevice, and are exposed to the bulk solvent (it is assumed that threonine residues may play a dual role in hydrophobic and hydrophilic interactions with PHB) (
                        - link "Figure 7" [ref=f1e678] [cursor=pointer]:
                          - /url: "#fig7"
                        - text: ). It is likely that these residues contribute to adsorption to the surface of a PHB
                        - emphasis [ref=f1e680]: via
                        - text: hydrophobic interactions. Interestingly, these residues (except for Tyr84) are aligned in a plane (
                        - link "Figure 7" [ref=f1e681] [cursor=pointer]:
                          - /url: "#fig7"
                        - text: ). A sequence alignment of type II depolymerases with a high homology (about 50%) reveals differences between single and multi-domain depolymerases with respect to these solvent-exposed residues (
                        - link "Figure 3" [ref=f1e683] [cursor=pointer]:
                          - /url: "#fig3"
                        - text: (a)). Of these residues, Thr77, Tyr81, Thr122, Leu298, and Pro301 are highly conserved, or are replaced by other hydrophobic residues, whereas residues Tyr75, Leu171, Thr173, Leu251, Tyr287, and Ile289 are replaced by hydrophilic residues in several homologs with a multi-domain structure. It is possible that, in the case of the
                        - emphasis [ref=f1e685]: P. funiculosum
                        - text: enzyme, these residues collectively contribute to the increased ability of the catalytic domain to bind to the hydrophobic surface of the PHB, while for other homologs, the lower population of solvent-exposed hydrophobic residues results in an inability to adsorb to the surface of PHB.
                        - link "8" [ref=f1e686] [cursor=pointer]:
                          - /url: "#bib8"
                        - text: ","
                        - link "26" [ref=f1e688] [cursor=pointer]:
                          - /url: "#bib26"
                        - text: It is noteworthy that the hydrophilic residues that are located around the mouth of the crevice are Ser78, Asn82, Ser120, Ser168, Ser170, Ser174, and Asn302, and that they are highly conserved (Asn82, Ser174, and Asn302) or replaced by asparagine, threonine, glycine, or alanine residues, but not by hydrophobic residues in homologs. In the
                        - emphasis [ref=f1e690]: P. funiculosum
                        - text: enzyme, they may contribute to the weak affinity of this enzyme for PHB.
                        - link [ref=f1e691] [cursor=pointer]:
                          - /url: "#bib19"
                          - superscript [ref=f1e694]: "19"
                      - figure [ref=f1e695]:
                        - list [ref=f1e697]:
                          - listitem [ref=f1e698]:
                            - 'link "Download: Download full-size image" [ref=f1e699] [cursor=pointer]':
                              - /url: https://ars.els-cdn.com/content/image/1-s2.0-S0022283605015901-gr7.jpg
                        - paragraph [ref=f1e704]:
                          - text: Figure 7. A molecular surface representation of the
                          - emphasis [ref=f1e705]: P. funiculosum
                          - text: depolymerase centering on the mouth of the crevice. Positions of solvent-exposed hydrophobic residues (purple), as well as polar (green) and catalytic triad (cyan) residues, are indicated. Residues Leu251, Leu298, Ser299, Pro301, and Asn302 also contribute to the substrate-binding site. A model of the R3HB trimer bound in the crevice is shown as a yellow stick model.
                    - generic [ref=f1e706]:
                      - text: The issue of whether the adsorption site contributes to the destabilization of ordered regions of PHB chains is an interesting topic. Studies of the degradation of PHB by multi-domain depolymerases
                      - link "10" [ref=f1e707] [cursor=pointer]:
                        - /url: "#bib10"
                      - text: ","
                      - link "12" [ref=f1e709] [cursor=pointer]:
                        - /url: "#bib12"
                      - text: ","
                      - link "15" [ref=f1e711] [cursor=pointer]:
                        - /url: "#bib15"
                      - text: ","
                      - link "16" [ref=f1e713] [cursor=pointer]:
                        - /url: "#bib16"
                      - text: ","
                      - link "17" [ref=f1e715] [cursor=pointer]:
                        - /url: "#bib17"
                      - text: indicate that the substrate-binding domain may play a critical role in introducing mechanical damage to ordered regions of the polymer upon binding to that region, as well as providing the catalytic domain a toehold to facilitate the hydrolysis. The introduction of mechanical damage may be the result of strong hydrophobic interactions between the substrate-binding domain and PHB chains, which destabilize the hydrophobic intra-chain and inter-chain interactions of the PHB chains. Atomic force microscopy observations of the degradation of lamellar crystals of PHB by the
                      - emphasis [ref=f1e717]: P. funiculosum
                      - text: enzyme showed that hollows occur at specific regions in a lamellar crystal of PHB, followed by fragmentation of the crystal (K. K.
                      - emphasis [ref=f1e718]: et al
                      - text: ., unpublished data), which is a degradation process similar to that observed in the case of multi-domain enzymes. Thus it is likely that, although the effect may be smaller than the substrate-binding domain of multi-domain enzymes, as indicated by the weakness of the affinity for PHB, the adsorption site of the single-domain enzyme should introduce mechanical damage to ordered regions of PHB chains
                      - emphasis [ref=f1e719]: via
                      - text: hydrophobic interactions, thus elevating the mobility of PHB chains and creating a susceptible site for hydrolysis by the catalytic site of the enzyme, resulting in the efficient degradation of PHB.
                    - generic [ref=f1e720]:
                      - text: It appears that the cooperation of the non-hydrolytic action of the substrate-binding domain and the hydrolytic action of the catalytic domain is crucial for degradation of crystalline substrates. This mechanistic model was originally proposed by Reese
                      - emphasis [ref=f1e721]: et al.
                      - link [ref=f1e722] [cursor=pointer]:
                        - /url: "#bib27"
                        - superscript [ref=f1e725]: "27"
                      - text: concerning degradation of cellulose, and revised by Din
                      - emphasis [ref=f1e726]: et al
                      - text: .
                      - link [ref=f1e727] [cursor=pointer]:
                        - /url: "#bib28"
                        - superscript [ref=f1e730]: "28"
                      - text: It is interesting to note that there are similarities between PHB depolymerases and cellulolytic enzymes of the uncomplexed system
                      - link [ref=f1e731] [cursor=pointer]:
                        - /url: "#bib29"
                        - superscript [ref=f1e734]: "29"
                      - text: in the modular structure and the process of degradation of insoluble polymer substrates with a high degree of crystallinity (typical ranges are 40–90% for cellulose,
                      - link [ref=f1e735] [cursor=pointer]:
                        - /url: "#bib30"
                        - superscript [ref=f1e738]: "30"
                      - text: and 55 to 80% for PHB
                      - link [ref=f1e739] [cursor=pointer]:
                        - /url: "#bib31"
                        - superscript [ref=f1e742]: "31"
                      - text: ). However, the single-domain PHB depolymerase is different from cellulolytic enzymes that lack cellulose-binding modules (e.g., endoglucanase III of
                      - emphasis [ref=f1e743]: Trichoderma reesei
                      - link [ref=f1e744] [cursor=pointer]:
                        - /url: "#bib32"
                        - superscript [ref=f1e747]: "32"
                      - text: and
                      - emphasis [ref=f1e748]: Humicola insolens
                      - link [ref=f1e749] [cursor=pointer]:
                        - /url: "#bib33"
                        - superscript [ref=f1e752]: "33"
                      - text: ), in that these cellulolytic enzymes alone are not able to degrade crystalline cellulose completely.
                      - link "32" [ref=f1e753] [cursor=pointer]:
                        - /url: "#bib32"
                      - text: ","
                      - link "33" [ref=f1e755] [cursor=pointer]:
                        - /url: "#bib33"
                      - text: These single-domain cellulases may not need a cellulose-adsorption site on their molecular surface, probably because they usually work synergistically with other cellulolytic enzymes. On the other hand, the single-domain PHB depolymerase can degrade PHB completely, which can be attributed to its ability to interact with PHB
                      - emphasis [ref=f1e757]: via
                      - text: the PHB-adsorption site.
                    - generic [ref=f1e758]:
                      - text: In conclusion, the crystal structure of PHB depolymerase from
                      - emphasis [ref=f1e759]: P. funiculosum
                      - text: represents a novel member of the α/β hydrolase fold enzymes, with a circularly permuted polypeptide linkage. The data show that the enzyme is comprised of a single domain. Catalytic residues Ser39, Asp121, and His155 are located at topologically conserved positions. Amide groups of Ser40 and Cys250 may serve as an oxyanion hole. The substrate-binding site probably contains four subsites. Subsites 1 and 2 provide hydrophobic pockets for binding side-chains of substrates, and define specificity toward short-chain-length PHA. Trp307 serves as a recognition site for an ester group next to the scissile bond. The structure also reveals the PHB-adsorption site, formed by a number of solvent-exposed hydrophobic residues aligned around the cavity. The PHB-adsorption site contributes to the efficient binding affinity of the enzyme to PHB granules, which aids in the degradation of insoluble PHB granules without a substrate-binding domain. This is the first crystal structure of an enzyme that catalyzes the hydrolysis of microbial biopolyesters, and the information herein will facilitate further the development of biopolyester engineering based on enzyme–polymer interactions, toward the design of high-performance polymers with the simultaneous achievement of biodegradability and superior mechanical properties.
