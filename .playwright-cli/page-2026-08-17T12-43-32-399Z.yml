                  - generic [ref=f1e951]:
                    - text: SLS uses powder bed fusion sintering layers with a CO
                    - subscript [ref=f1e952]: "2"
                    - text: laser in order to create the final 3D structure (
                    - link "Deckard, 1989" [ref=f1e953] [cursor=pointer]:
                      - /url: "#bb0140"
                    - text: ). SLS has been used in applications such as tissue engineering, where scaffold is fabricated from inorganic materials such as PHA and porosity is pre-designed to match tissue specification (
                    - link "Leong et al., 2003" [ref=f1e955] [cursor=pointer]:
                      - /url: "#bb0355"
                    - text: ). Previously, PHBV and calcium phosphate (Ca
                    - img "single bond" [ref=f1e957]
                    - text: P) microspheres have been used for the SLS technique, successfully producing 3D scaffolds with a porous structure that is appropriate for the human body and was also controllable (
                    - link "Duan et al., 2011" [ref=f1e958] [cursor=pointer]:
                      - /url: "#bb0150"
                    - text: ). The same research group also used SLS layered Ca-P/P3HBV scaffolds to create protective carriers for biomolecules and drugs for slow-release delivery systems (
                    - link "Duan and Wang, 2010" [ref=f1e960] [cursor=pointer]:
                      - /url: "#bb0145"
                    - text: ). Despite its relatively low thermal stability in a 3D melt phase, PHA is stable during the SLS process (
                    - link "Kovalcik, 2021" [ref=f1e962] [cursor=pointer]:
                      - /url: "#bb0320"
                    - text: ). In addition, it has been reported that the thermal properties and chemical composition of PHA do not change during SLS, leaving a better final product and the possibility for reuse of the starting material (
                    - link "Pereira et al., 2012" [ref=f1e964] [cursor=pointer]:
                      - /url: "#bb0515"
                    - text: ).
                  - generic [ref=f1e966]:
                    - text: FDM uses melt extrusion in a layerwise fashion of thermoplastic filament materials in order to create the final 3D structure (
                    - link "Mwema and Akinlabi, 2020" [ref=f1e967] [cursor=pointer]:
                      - /url: "#bb0475"
                    - text: ). FDM is a 3D printing technique in which raw polymers are processed from digitized models. The polymer is heated above its glass transition temperature and passed as a raw polymeric filament through a nozzle, forming a 3D object of layers. In FDM, PHB can be degraded significantly, which will decrease its molecular weight and increase brittleness (
                    - link "Carrasco et al., 2006" [ref=f1e969] [cursor=pointer]:
                      - /url: "#bb0085"
                    - text: ). In order to use FDM successfully, additional copolymerizations are required such as 3 HV (PHBV), which forms a more thermally stable polymer (
                    - link "Kovalcik et al., 2020" [ref=f1e971] [cursor=pointer]:
                      - /url: "#bb0325"
                    - text: ).
                    - link "Fig. 2" [ref=f1e973] [cursor=pointer]:
                      - /url: "#f0010"
                    - text: i. shows an example of a commercialized PHBV toy made using FDM techniques. In previous work, FDM has been successful with esterified PHBV filaments when mixed with a filler substrate such as carbon nanotubes, palm fiber, and silicone sponge (
                    - link "Wu and Liao, 2017" [ref=f1e975] [cursor=pointer]:
                      - /url: "#bb0770"
                    - text: ;
                    - link "Wu, 2018" [ref=f1e977] [cursor=pointer]:
                      - /url: "#bb0765"
                    - text: ). Meanwhile, a wood-based filament made of PLA/PHA matrix reinforced by wood particles was found to be printable in a wide range of temperatures up to 250 °C (
                    - link "Guessasma et al., 2019" [ref=f1e979] [cursor=pointer]:
                      - /url: "#bb0210"
                    - text: ). Blending of PLA with up to 20% PHA also has been shown to greatly improve the final ductility of the PLA filament, as the PHA is uniformly distributed in the PLA matrix (
                    - link "Menčík et al., 2018" [ref=f1e981] [cursor=pointer]:
                      - /url: "#bb0435"
                    - text: ;
                    - link "Kontárová et al., 2020" [ref=f1e983] [cursor=pointer]:
                      - /url: "#bb0295"
                    - text: ).
                  - generic [ref=f1e985]:
                    - text: A final technique that can be considered for 3D modeling with PHA is stereolithography, provided that the molecular weight and functional end groups of the PHA are adjusted properly tuned for photopolymerization (
                    - link "Kovalcik, 2021" [ref=f1e986] [cursor=pointer]:
                      - /url: "#bb0320"
                    - text: ). In stereolithography, a liquid polymer is cured using photopolymerization, for example using UV radiation. Since PHA do not naturally contain functional groups facilitating the curing reaction, PHA-oligomers with UV curable end groups are required for successful stereolithography applications. For example, PHA-curable resins have recently been prepared in a two-step solvent-free process. First, PHA is transesterified with 1,4-butanediol, then the PHB-diol reacts with 2-isocyanatoethyl methacrylate to produce PHB oligomers with methacrylate functionality (
                    - link "Foli et al., 2020" [ref=f1e988] [cursor=pointer]:
                      - /url: "#bb0185"
                    - text: ). The resulting PHB oligomers were soluble at 90 °C and photopolymerizable under UV light within 10 min (
                    - link "Foli et al., 2020" [ref=f1e990] [cursor=pointer]:
                      - /url: "#bb0185"
                    - text: ). Importantly, the biodegradability for these UV-curable molecules and other new oligomers need to be verified.
                - generic [ref=f1e992]:
                  - heading "2.4. PHA as a cosmetic product and antibacterial material" [level=3] [ref=f1e993]
                  - generic [ref=f1e994]:
                    - text: Good biocompatibility and biodegradable plastic-like properties make PHA useful in cosmetics and skin care industries, and PHA has been developed by several ventures for use in cosmetics. In the cosmetic field, PHA has been developed in various products, including beauty masks and sanitary pads as well as cast films (
                    - link "Coltelli et al., 2020" [ref=f1e995] [cursor=pointer]:
                      - /url: "#bib816"
                    - text: ). Sudesh et al. reported that PHA can function well as an oil-blotting film, due to its ability to rapidly absorb and retain oil, and its porous and smooth surface (
                    - link "Sudesh et al., 2007" [ref=f1e997] [cursor=pointer]:
                      - /url: "#bb0655"
                    - text: ). PHA and PHA blends with other bio-based materials have been used in cosmetic products, for example in the EU launched polybioskin product (
                    - link "Coltelli et al., 2020" [ref=f1e999] [cursor=pointer]:
                      - /url: "#bib816"
                    - text: ). PHA materials containing alpha-hydroxy-acid (AHA) are able to bind large amounts of water and act as potent antioxidants through matrix metalloproteinase inhibition and strong chelating properties. These excellent antioxidant and moisturising properties are beneficial for both dermatological and cosmetic purposes (
                    - link "Algiert-Zielińska et al., 2019" [ref=f1e1001] [cursor=pointer]:
                      - /url: "#bb0020"
                    - text: ). The commercialized products for a cosmetic toner and facial pads, both using PHA in their formulation, are shown in
                    - link "Fig. 3" [ref=f1e1003] [cursor=pointer]:
                      - /url: "#f0015"
                    - text: d and f, respectively.
                  - generic [ref=f1e1005]:
                    - text: The use of PHA in cosmetics has the advantage of being biodegradable, thereby preventing the leakage of microplastics into the environment. Microplastics utilized in cosmetics, toothpastes and facial cleansers enter rivers and the ocean, and research has shown that they can enter the human body through the consumption of seafood (
                    - link "Coltelli et al., 2020" [ref=f1e1006] [cursor=pointer]:
                      - /url: "#bib816"
                    - text: ). Multiple PHA microplastic-free technologies are under development or already commercialized (
                    - link "Mukherjee and Koller, 2023" [ref=f1e1008] [cursor=pointer]:
                      - /url: "#bb0465"
                    - text: "). For example, the global company Unilever has developed sunscreen products containing PHA micropowder (brand name: MyKAI). These ingredients are reportedly derived from renewable biomass and are fully biogradable and are one of the first examples of PHA use in cosmetics."
                  - generic [ref=f1e1010]:
                    - text: Materials produced from PHAs exhibit antibacterial effects, the extent of which will vary depending on the final material composition, structure, and surface properties. Incorporation of bioactive compounds such as essential oils or antimicrobial agents into PHA matrices leads to antibacterial effects. For example, a PHA-chitosan matrix that encapsulated MoS
                    - subscript [ref=f1e1011]: "2"
                    - text: nanoparticles was constructed that showed antibacterial activity against multi-drug-resistant
                    - emphasis [ref=f1e1012]: Escherichia coli
                    - text: K1 (
                    - link "Mukheem et al., 2020" [ref=f1e1013] [cursor=pointer]:
                      - /url: "#bb0460"
                    - text: ). Indeed, the nanoarchitecture of PHA can be manufactured during material processing to contain small concentrations of ZnO and Ag, and the final materials exhibited excellent antibacterial and material properties against
                    - emphasis [ref=f1e1015]: Escherichia coli
                    - text: and food pathogen
                    - emphasis [ref=f1e1016]: Salmonella
                    - text: ", respectively ("
                    - link "Tarrahi et al., 2020" [ref=f1e1017] [cursor=pointer]:
                      - /url: "#bb0685"
                    - text: ).
                  - generic [ref=f1e1019]:
                    - text: PHA-based materials can be designed to have surfaces that inhibit bacterial growth through the prevention of bacterial attachment and biofilm formation.
                    - emphasis [ref=f1e1020]: In vitro
                    - text: testing of a PHA-hydroxyapatite composite containing selenium and strontium showed bacterial cells cultured on the material surface was greatly reduced (
                    - link "Marcello et al., 2021" [ref=f1e1021] [cursor=pointer]:
                      - /url: "#bb0405"
                    - text: ). The PHA films released ions showing antimicrobial activity against
                    - emphasis [ref=f1e1023]: Staphylococcus
                    - text: and
                    - emphasis [ref=f1e1024]: Escherichia coli
                    - text: ", and were demonstrated effective for bone healing applications. Similarly, PHBV inset with graphene oxide/MXene nanosheets created material with superior hydrophilicity, improving antibacterial activity along with platelet adsorption, blood coagulation, and tensile strength of the material ("
                    - link "Wu et al., 2021" [ref=f1e1025] [cursor=pointer]:
                      - /url: "#bb0785"
                    - text: ). These materials demonstrate application for wound healing. This research demonstrated PHA nanocomposites are effective carriers for antibacterial materials in both cosmetic and drug development. Notably, the antibacterial properties of PHA due to surface design are not universal and vary depending on the material processing of the raw materials. Therefore, research is required in the material processing stage to enhance the antibacterial mechanisms associated with PHA-based materials.
                - generic [ref=f1e1027]:
                  - heading "2.5. PHA uses in medical applications" [level=3] [ref=f1e1028]
                  - generic [ref=f1e1029]:
                    - heading "2.5.1. PHA as tissue engineering implant materials" [level=4] [ref=f1e1030]
                    - generic [ref=f1e1031]:
                      - text: Due to their biodegradability and biocompatibility, PHA have gained prominence in medical implant materials (
                      - link "Wang et al., 2005" [ref=f1e1032] [cursor=pointer]:
                        - /url: "#bb0730"
                      - text: ). PHA including PHB, PHBV, P3HB4HB, P4HB, P3HO (poly-R-3-hydroxyoctanoate) and PHBHHx-based nanocomposites have been explored in tissue engineering, including in the creation of porous nanocomposites that can replace bones. PHA has already been used in a wide range of medical implants from screws, staples, and surgical mesh to bone plates, nerve guides, skin substitutes, and adhesion barriers (
                      - link "Sehgal and Gupta, 2020" [ref=f1e1034] [cursor=pointer]:
                        - /url: "#bb0615"
                      - text: ). PHA can also be used in wound dressings, slings, bone graft substitutes, and ocular cell implants (
                      - link "Pandey et al., 2022" [ref=f1e1036] [cursor=pointer]:
                        - /url: "#bb0505"
                      - text: ).
                    - generic [ref=f1e1038]:
                      - text: Decreasing platelet adhesion for materials in contact with blood is a desirable feature of PHB and PHBV films, as they have suitable hemolysis reactivity (
                      - link "Kaniuk and Stachewicz, 2021" [ref=f1e1039] [cursor=pointer]:
                        - /url: "#bb0265"
                      - text: ). In recent work, a PHB organically modified montmorillonite (OMMT) nano-clay nanocomposite outperformed PHB in terms of thermal stability and porosity. The final material can be used for 3D organ printing and bone tissue engineering, as well as for scaffold engineering (lab-on-a-chip) (
                      - link "Mohan et al., 2021" [ref=f1e1041] [cursor=pointer]:
                        - /url: "#bb0445"
                      - text: ). A 3D printed prototype for use in medical applications is shown in
                      - link "Fig. 3" [ref=f1e1043] [cursor=pointer]:
                        - /url: "#f0015"
                      - text: c. PHB/ZrO2/Herafill® (30%) composite implants were created in a work to test bone-interface adhesion performance. The composites were found to have not significant
                      - emphasis [ref=f1e1045]: in vivo
                      - text: degradation after nine months and maintained high osseointegration values (
                      - link "Meischel et al., 2016" [ref=f1e1046] [cursor=pointer]:
                        - /url: "#bb0430"
                      - text: ). P(3HHx-
                      - emphasis [ref=f1e1048]: co
                      - text: "-3HO) (PHHxHO) is a promising candidate for tissue engineering ("
                      - link "Marois et al., 1999" [ref=f1e1049] [cursor=pointer]:
                        - /url: "#bb0410"
                      - text: ). PHHxHO was found to be a successful vascular graft in a lamb model as early as 1999, and the mechanical properties mimicked naturally built vessels (
                      - link "Shum-Tim et al., 1999" [ref=f1e1051] [cursor=pointer]:
                        - /url: "#bb0635"
                      - text: ).
                    - generic [ref=f1e1053]:
                      - text: 3D PHBV tubes were created by rolling and heat sealing an electrospun fiber mat to mimic a sciatic nerve conduit (
                      - link "Biazar and Heidari Keshel, 2013" [ref=f1e1054] [cursor=pointer]:
                        - /url: "#bb0070"
                      - text: ). The synthetic nerve was infused with Schwann cells then implanted into a resected sciatic nerve (
                      - link "Biazar and Heidari Keshel, 2013" [ref=f1e1056] [cursor=pointer]:
                        - /url: "#bb0070"
                      - text: ). It was found that the conduit supported the regeneration of the resected sciatic nerve cells and maintained its mechanical properties after four months. Indeed, regeneration of the nerve trunk cells was observed as myelin sheath after binding to the 3D PHBV scaffold (
                      - link "Biazar and Heidari Keshel, 2013" [ref=f1e1058] [cursor=pointer]:
                        - /url: "#bb0070"
                      - text: ). In another work, electrospun PHB/PHBV scaffolds were also found to support myelin sheath regeneration. The aligned PHB/PHBV/collagen fibers aligned properly facilitating the growth of Schwann cells. Notably, nerve growth factor (NGF) secretion and glia derived neurotrophic factor (GDNF) gene expression were seen after one week (
                      - link "Masaeli et al., 2013" [ref=f1e1060] [cursor=pointer]:
                        - /url: "#bb0420"
                      - text: ). Similarly, aligned PHBV/collagen nanofibers were shown to be promising and suggested to be useful for therapeutic neural tissue engineering (
                      - link "Prabhakaran et al., 2013" [ref=f1e1062] [cursor=pointer]:
                        - /url: "#bb0545"
                      - text: ). PLLA/P4HB stents showed decreased stenosis compared to stainless steel stents under the same conditions (
                      - link "Fig. 3" [ref=f1e1064] [cursor=pointer]:
                        - /url: "#f0015"
                      - text: a).
                    - generic [ref=f1e1066]:
                      - text: In order to reach FDA approval, a medical implant must be below 20 US Pharmacopeia endotoxin units (EU) (
                      - link "Martin and Williams, 2003" [ref=f1e1067] [cursor=pointer]:
                        - /url: "#bb0415"
                      - text: ;
                      - link "Williams et al., 1999" [ref=f1e1069] [cursor=pointer]:
                        - /url: "#bb0760"
                      - text: ). Shishatskaya et al. found that PHB/PHBV sutures did not induce an acute vascular reaction at the site of implantation
                      - emphasis [ref=f1e1071]: in vivo
                      - text: (
                      - link "Shishatskaya et al., 2006" [ref=f1e1072] [cursor=pointer]:
                        - /url: "#bb0630"
                      - text: ). Similar phenomena have been observed with PHBHHx, where there were no adverse events for more than one year (
                      - link "Qu et al., 2006" [ref=f1e1074] [cursor=pointer]:
                        - /url: "#bb0555"
                      - text: ). P4HB has been approved by the FDA for suture application with a trade name TephaFLEX marketed by Tepha Inc., of Cambridge, Mass., USA (
                      - link "Pandey et al., 2022" [ref=f1e1076] [cursor=pointer]:
                        - /url: "#bb0505"
                      - text: ). The company Tepha (USA) manufactures P4HB for many medical applications including implants and tablets, artery augments, cardiological stents, vascular grafts, and heart valves (
                      - link "Martin and Williams, 2003" [ref=f1e1078] [cursor=pointer]:
                        - /url: "#bb0415"
                      - text: ;
                      - link "Philip et al., 2007" [ref=f1e1080] [cursor=pointer]:
                        - /url: "#bb0525"
                      - text: ).
                  - generic [ref=f1e1082]:
                    - heading "2.5.2. PHA as cell growth supporting matrix" [level=4] [ref=f1e1083]
                    - generic [ref=f1e1084]:
                      - text: PHB as an implant biomaterial is characterized by its non-toxicity, and degraded PHB monomers do not stimulate the immune system (
                      - link "Cheng et al., 2005" [ref=f1e1085] [cursor=pointer]:
                        - /url: "#bb0115"
                      - text: ;
                      - link "Sun et al., 2007" [ref=f1e1087] [cursor=pointer]:
                        - /url: "#bb0660"
                      - text: ). PHB conduits are a strong candidate for long-gap nerve injury restoration (
                      - link "Marois et al., 1999" [ref=f1e1089] [cursor=pointer]:
                        - /url: "#bb0410"
                      - text: ). Indeed, PHB monomers have been shown to stimulate the Ca
                      - superscript [ref=f1e1091]: 2+
                      - text: channel activation and promote regeneration of damaged tissue. As early as 1997, researchers found that new bone was formed around PHBV/HA implants in a rabbit model and that osteocyte cells were found to cover the interface area between the implant and bone (
                      - link "Luklinska and Bonfield, 1997" [ref=f1e1092] [cursor=pointer]:
                        - /url: "#bb0395"
                      - text: ).
                      - emphasis [ref=f1e1094]: In vitro
                      - text: ", a PHBV scaffold and foam were used to repair tissue of bone marrow stromal cells ("
                      - link "Köse et al., 2003" [ref=f1e1095] [cursor=pointer]:
                        - /url: "#bb0305"
                      - text: ).
                    - generic [ref=f1e1097]:
                      - text: PHBHHx has been shown to stimulate bone growth (
                      - link "Wang et al., 2008" [ref=f1e1098] [cursor=pointer]:
                        - /url: "#bb0735"
                      - text: ) and effectively repair damaged nerves (
                      - link "Bian et al., 2009" [ref=f1e1100] [cursor=pointer]:
                        - /url: "#bb0065"
                      - text: ) lending it to be a successful osteosynthetic material. Meanwhile, porous wet-spun fibers with optimal specific surface area, porosity, and diameter for wound healing applications have been created after mixing the fibers with antibacterial plant extracts (
                      - link "Kundrat et al., 2019" [ref=f1e1102] [cursor=pointer]:
                        - /url: "#bb0340"
                      - text: ). Meanwhile, PHBV electrospun fibers coated with olive leaf extract were developed for wound care (
                      - link "De la Ossa et al., 2022" [ref=f1e1104] [cursor=pointer]:
                        - /url: "#bb0135"
                      - text: ). The OLE phenols in the PHBV/OLE electrospun fibers were released after one week and showed cytocompatibility toward HFFF2 fibroblasts and HaCaT keratinocytes
                      - emphasis [ref=f1e1106]: in vivo
                      - text: ", indicating ulcers and wound care are possible using PHBV fibers ("
                      - link "De la Ossa et al., 2022" [ref=f1e1107] [cursor=pointer]:
                        - /url: "#bb0135"
                      - text: ).
                    - generic [ref=f1e1109]:
                      - text: PHA has some success in cardiovascular tissue engineering (
                      - link "Chen and Wu, 2005" [ref=f1e1110] [cursor=pointer]:
                        - /url: "#bb0105"
                      - text: ). Researchers observed the formation of layered tissue similar to aorta in mechanical properties using P(3HHx-
                      - emphasis [ref=f1e1112]: co
                      - text: "-3HO) implants ("
                      - link "Opitz et al., 2004" [ref=f1e1113] [cursor=pointer]:
                        - /url: "#bb0495"
                      - text: ). In nerve injury restoration, autologous nerve grafts are usually used. PHB conduits implanted in a rat sciatic nerve showed excellent regeneration capacity and biocompatibility (
                      - link "Hazari et al., 1999" [ref=f1e1115] [cursor=pointer]:
                        - /url: "#bb0230"
                      - text: ). PHB conduits together with nerve growth factors and Schwann cells form a supportive extracellular matrix for grafts (
                      - link "Namgung, 2014" [ref=f1e1117] [cursor=pointer]:
                        - /url: "#bb0480"
                      - text: ;
                      - link "Armstrong et al., 2007" [ref=f1e1119] [cursor=pointer]:
                        - /url: "#bb0040"
                      - text: ). Schwann cells were found to promote nerve regeneration even within PHB conduits (
                      - link "Namgung, 2014" [ref=f1e1121] [cursor=pointer]:
                        - /url: "#bb0480"
                      - text: ;
                      - link "Armstrong et al., 2007" [ref=f1e1123] [cursor=pointer]:
                        - /url: "#bb0040"
                      - text: ). PHBHHx has also been established as a biocompatible material for nerve cell restoration (Yang et al., 2018). A prototype for a heart valve scaffold is shown in
                      - link "Fig. 3" [ref=f1e1125] [cursor=pointer]:
                        - /url: "#f0015"
                      - text: e.
                  - generic [ref=f1e1127]:
                    - heading "2.5.3. PHA drug delivery carriers" [level=4] [ref=f1e1128]
                    - generic [ref=f1e1129]:
                      - text: It is possible to use PHA as a matrix for the controlled release of drugs (
                      - link "Weiner, 1997" [ref=f1e1130] [cursor=pointer]:
                        - /url: "#bb0755"
                      - text: ;
                      - link "Chen, 2009" [ref=f1e1132] [cursor=pointer]:
                        - /url: "#bb0095"
                      - text: ), which is quite advantageous due to its chemical composition and steady degradation (
                      - link "Pouton and Akhtar, 1996" [ref=f1e1134] [cursor=pointer]:
                        - /url: "#bb0540"
                      - text: ). PHA can be produced to form microcapsules, films, nanoparticles, and microspheres as porous matrices (
                      - link "Wu et al., 2009" [ref=f1e1136] [cursor=pointer]:
                        - /url: "#bb0780"
                      - text: ). PHA homopolymers and PHA copolymers can be used to microencapsulate medicines. In the early 1990s, PHA was first considered as a drug carrier due to its steady degradation by surface erosion and ease of manufacture compared to alternative slow-release products (
                      - link "Gould et al., 1987" [ref=f1e1138] [cursor=pointer]:
                        - /url: "#bb0205"
                      - text: ). PHB outperformed PLA microspheres as a drug carrier for the anticancer drug lomustine in terms of release rate
                      - emphasis [ref=f1e1140]: in vitro
                      - text: and
                      - emphasis [ref=f1e1141]: in vivo
                      - text: (
                      - link "Volova, 2004" [ref=f1e1142] [cursor=pointer]:
                        - /url: "#bb0725"
                      - text: ). In the microcapsule structures, multiple layers of PHA can be made with magnetic substance added (
                      - link "Sehgal and Gupta, 2020" [ref=f1e1144] [cursor=pointer]:
                        - /url: "#bb0615"
                      - text: ). A commercialized PHA application for drug delivery is shown in
                      - link "Fig. 3" [ref=f1e1146] [cursor=pointer]:
                        - /url: "#f0015"
                      - text: b.
                    - generic [ref=f1e1148]:
                      - text: Mcl-PHA copolymers are considered promising candidates for drug delivery due to their low melting points and reduced crystallinity (
                      - link "Pouton, 2001" [ref=f1e1149] [cursor=pointer]:
                        - /url: "#bb0535"
                      - text: ). PHA/PEG polymeric nanospheres were created to accelerate blood circulation phases in their study (
                      - link "Ueda and Tabata, 2003" [ref=f1e1151] [cursor=pointer]:
                        - /url: "#bb0695"
                      - text: ). PHB/chitosan (CTS) microspheres for drug release were produced in another study using single and dual emulsion methods (
                      - link "Shih et al., 2007" [ref=f1e1153] [cursor=pointer]:
                        - /url: "#bb0625"
                      - text: ). PHB composites have also been explored in other drug delivery and surgical applications (
                      - link "Raza et al., 2023" [ref=f1e1155] [cursor=pointer]:
                        - /url: "#bb0570"
                      - text: ;
                      - link "Fedorov et al., 2008" [ref=f1e1157] [cursor=pointer]:
                        - /url: "#bb0170"
                      - text: ;
                      - link "Salahuddin et al., 2022" [ref=f1e1159] [cursor=pointer]:
                        - /url: "#bb0605"
                      - text: ;
                      - link "Kang and Yun, 2022" [ref=f1e1161] [cursor=pointer]:
                        - /url: "#bb0260"
                      - text: ).
                - generic [ref=f1e1163]:
                  - heading "2.6. PHA as a carbon source for denitrification in wastewater treatment" [level=3] [ref=f1e1164]
                  - generic [ref=f1e1165]:
                    - generic [ref=f1e1166]:
                      - text: PHA and PHA producers naturally act to remove nitrogen from the earth's ecosystem and can act as a barrier to nitrogen leaving agricultural fields through rivers and streams (
                      - link "Acharjee et al., 2022" [ref=f1e1167] [cursor=pointer]:
                        - /url: "#bb0005"
                      - text: ;
                      - link "Hawkins et al., 2021" [ref=f1e1169] [cursor=pointer]:
                        - /url: "#bb0225"
                      - text: ). The denitrification process converts nitrate to nitrogen gas, while filters remove suspended solids (
                      - link "Amelia et al., 2019" [ref=f1e1171] [cursor=pointer]:
                        - /url: "#bb0025"
                      - text: ;
                      - link "Wang et al., 2018" [ref=f1e1173] [cursor=pointer]:
                        - /url: "#bb0745"
                      - text: ). PHA polymer granules act as a solid substrate and biofilm carrier, either within or separate from the microbes, eliminating the need for costly and toxic organic substrates (
                      - link "Poirier, 2002" [ref=f1e1175] [cursor=pointer]:
                        - /url: "#bb0530"
                      - text: ). In aquaculture, PHA can act as both solid substrate and a biofilm carrier that can remove the nitrogen from water. The use of PHA in an aquaculture system is ideal because clean water, wastewater production, and energy are reduced, creating a more efficient recirculating aquaculture system (
                      - link "Gutierrez-Wing et al., 2014" [ref=f1e1177] [cursor=pointer]:
                        - /url: "#bb0220"
                      - text: ;
                      - link "Hawkins et al., 2021" [ref=f1e1179] [cursor=pointer]:
                        - /url: "#bb0225"
                      - text: ;
                      - link "Pesante et al., 2022" [ref=f1e1181] [cursor=pointer]:
                        - /url: "#bb0520"
                      - text: ). A self-regulating PHA denitrification system for a marine aquaculture environment is shown in
                      - link "Fig. 4" [ref=f1e1183] [cursor=pointer]:
                        - /url: "#f0020"
                      - text: c.
                    - figure [ref=f1e1185]:
                      - generic [ref=f1e1186]:
                        - img "Fig. 4"
