name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Compile Python sources
        run: python -m compileall -q pipeline/scripts pipeline/tests

      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(pipeline/scripts/*.sh pipeline/tests/*.sh)
          ((${#files[@]} > 0))
          for file in "${files[@]}"; do
            bash -n "$file"
          done

      - name: Run governance baseline tests
        # The audit/figure suites track the uncommitted research snapshot and
        # are enabled when that snapshot is published as a separate commit.
        run: python -m unittest pipeline.tests.test_run_context pipeline.tests.test_run_isolation -v

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
