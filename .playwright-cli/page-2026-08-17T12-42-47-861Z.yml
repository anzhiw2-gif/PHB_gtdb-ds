                - heading "Survival in soil carriers" [level=3] [ref=e371]
                - paragraph [ref=e372]: No significant difference in cell viability was detected between the two strains 7 days after inoculation and incubation under sub-optimal conditions in various soil carriers. Cell viability in both A. brasilense 7030 and the mutant strains was considerably reduced to less than 1% of the initial number of inoculated cells.
            - generic [ref=e374]:
              - heading "Discussion" [level=2] [ref=e375]
              - generic [ref=e376]:
                - paragraph [ref=e377]: In this study, the PHB depolymerase gene (phaZ) from A. brasilense was isolated and sequenced. In addition, a phaZ mutant strain of A. brasilense unable to degrade PHB was constructed and characterized. Experiments were conducted in which A. brasilense 7030 and its phaZ mutant were evaluated for their metabolic versatility and their ability to endure various environmental stress conditions. These studies are part of an ongoing study of the anabolism and catabolism of PHB in the plant-growth-promoting bacterium A. brasilense.
                - paragraph [ref=e378]:
                  - text: The phaZ gene of A. brasilense was identified by PCR using two degenerate primers designed on the basis of the PhaZ sequences of other bacteria. Analysis of the deduced amino acid sequence of A. brasilense phaZ showed a high degree of similarity with other intracellular PHB depolymerase genes. However, no sequence similarity to extracellular PhaZ proteins was observed. Gas chromatography of extracted PHB and observation of intracellular content by electron microscopy clearly show that phaZ disruption suppressed the degradation of PHB. These findings, and the inability of A. brasilense to grow on extracellular PHB as a sole carbon source due to the absence of extracellular PHB depolymerases leads us to assume that the depolymerase isolated is most likely an intracellular PHB depolymerase. PHA-degrading bacteria are known to synthesize one or several PHA depolymerases, as reported for Alcaligenes faecalis (Nojiri and Saito
                  - link "Reference 1997" [ref=e379] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR30
                    - text: "1997"
                  - text: ), and R. eutropha and Pseudomonas lemoignei (Saegusa et al.
                  - link "Reference 2001" [ref=e380] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR38
                    - text: "2001"
                  - text: ; Braaz et al.
                  - link "Reference 2002" [ref=e381] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR3
                    - text: "2002"
                  - text: ; Jendrossek and Handrick
                  - link "Reference 2002" [ref=e382] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR20
                    - text: "2002"
                  - text: ), respectively. Southern blot hybridization suggests that at least one phaZ gene similar to that of A. brasilense is common in A. irakense and A. amazonense and that A. brasilense contains only one copy of the phaZ gene. The absence of hybridization signals in A. lipoferum, A. halopraeferens, and A. doebereinerae probably indicates that these species of Azospirillum contain a phaZ gene or genes that differ from phaZ of A. brasilense.
                - paragraph [ref=e383]:
                  - text: Starvation experiments showed a clear decrease in the ability of the phaZ mutant to survive this type of stress, as compared to A. brasilense strain 7030. Kadouri et al (
                  - link "Reference 2002" [ref=e384] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR22
                    - text: "2002"
                  - text: ) have previously shown that A. brasilense strain Sp7 wild-type could endure starvation conditions much better than a PHB synthase (phbC) mutant strain unable to accumulate PHB. The inability of the A. brasilense phaZ mutant to degrade and therefore use the PHB polymer as an intracellular energy and carbon storage compound under starvation conditions demonstrates the importance of PhaZ in mobilization (degradation) of previously accumulated PHB in the absence of an exogenous carbon source, and the use of the degradation products for growth and survival when resources are scarce.
                - paragraph [ref=e385]:
                  - text: Azospirilla are known for their capacity to aggregate and flocculate under diverse stress conditions. Previous studies revealed the involvement of EPS in cell aggregation, and a correlation between the quantities of EPS and capsular polysaccharide (CPS) produced and the extent of aggregation (Burdman et al.
                  - link "Reference 1998" [ref=e386] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR5
                    - text: "1998"
                  - text: ","
                  - link "Reference 2000" [ref=e387] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR7
                    - text: "2000"
                  - text: ). Also, a PHB-synthase-negative mutant (phbC), which was unable to accumulate PHB and produced increased quantities of EPS and CPS, exhibited higher aggregation than the wild-type strain (Kadouri et al.
                  - link "Reference 2002" [ref=e388] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR22
                    - text: "2002"
                  - text: ","
                  - link "Reference 2003" [ref=e389] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR23
                    - text: "2003"
                  - text: ). In this work, the introduction of a mutation in phaZ led to a decrease in the capacity of the mutant strain to produce EPS and to aggregate as compared to the parent strain. In addition, the results on the catabolism of PHB are coherent with those obtained from studies of PHB anabolism, which clearly pointed to a direct effect of the accumulation and degradation of PHB on EPS production, attributable to the mobilization of carbon sources within the cell. While a three-fold increase in motility was found in a phbC mutant strain (Kadouri et al.
                  - link "Reference 2002" [ref=e390] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR22
                    - text: "2002"
                  - text: ","
                  - link "Reference 2003" [ref=e391] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR23
                    - text: "2003"
                  - text: ), A. brasilense 7030 and the phaZ mutant strain exhibited similar motility after 48 h of growth. This was probably due to the inability of the mutant to generate excess reducing power, as may have been the case in the phbC mutant when PHB polymerization was disrupted.
                - paragraph [ref=e392]:
                  - text: Although there was no apparent difference in the versatility of carbon sources used by A. brasilense 7030 and the phaZ mutant strain, the parent strain utilized carbon sources faster and to a greater extent than the mutant, as reflected by the formation of a more intense color in strain 7030 on BIOLOG GN plates, and by this strain's shorter generation time in LB medium. Declines in carbon utilization efficiency and growth in PHB-defective bacteria have been found in Rhizobium etli (Cevallos et al.
                  - link "Reference 1996" [ref=e393] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR8
                    - text: "1996"
                  - text: ) and A. brasilense Sp7 (Kadouri et al.
                  - link "Reference 2002" [ref=e394] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR22
                    - text: "2002"
                  - text: ","
                  - link "Reference 2003" [ref=e395] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR23
                    - text: "2003"
                  - text: ). Bacterial growth rate is considered to be an important factor influencing rhizosphere competence (Simons et al.
                  - link "Reference 1996" [ref=e396] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR41
                    - text: "1996"
                  - text: ). Thus, an elevated growth rate supported by the accumulation and utilization of PHB may bring an advantage to A. brasilense in the environment, enhancing the establishment, proliferation, and competitiveness of the bacterium.
                - paragraph [ref=e397]:
                  - text: The role of a functioning PHB cycle in stress endurance is supported by our results showing a reduced ability of the A. brasilense phaZ mutant to tolerate most stresses examined. While previous studies had shown that PHB formation is important for stress survival (Tal and Okon,
                  - link "Reference 1985" [ref=e398] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR43
                    - text: "1985"
                  - text: ; James et al.
                  - link "Reference 1999" [ref=e399] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR19
                    - text: "1999"
                  - text: ; Lopez et al.
                  - link "Reference 1995" [ref=e400] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR25
                    - text: "1995"
                  - text: ; Pettinari et al.
                  - link "Reference 2001" [ref=e401] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR34
                    - text: "2001"
                  - text: ; Kadouri et al.
                  - link "Reference 2003" [ref=e402] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR23
                    - text: "2003"
                  - text: ), we show that disruption of the catabolic pathway also leads to reduced survival, as was noted in P. oleovorans and R. eutropha (Ruiz et al.
                  - link "Reference 2001" [ref=e403] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR37
                    - text: "2001"
                  - text: ; Handrick et al.
                  - link "Reference 2000" [ref=e404] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR16
                    - text: "2000"
                  - text: ). The mechanisms by which PHAs favors bacterial survival are not yet fully understood. Early work on R. eutropha suggested an association of PHA utilization with respiration and oxidative phosphorylation (Hippe
                  - link "Reference 1967" [ref=e405] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR17
                    - text: "1967"
                  - text: ). In a recent study by Ruiz et al. (
                  - link "Reference 2001" [ref=e406] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR37
                    - text: "2001"
                  - text: ), a rise in guanosine tetraphosphate (ppGpp) levels appeared to be concomitant with PHA degradation, inducing expression of the rpoS gene and leading to the expression of genes involved in protection against damaging agents (Gentry et al.
                  - link "Reference 1993" [ref=e407] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR15
                    - text: "1993"
                  - text: ; Ramos-Gonzalez et al.
                  - link "Reference 1998" [ref=e408] [cursor=pointer]:
                    - /url: /article/10.1007/s00203-003-0590-z#ref-CR35
                    - text: "1998"
                  - text: ). It may well be that the same cascade of events is involved in stress-exposed A. brasilense PHB-utilizing cells. However, the capability of the phaZ mutant to endure desiccation and sonication to the same extent as the wild-type 7030 strain shows that the polyester in itself may be needed for protection against various stresses. The significant decline in cell viability of both A. brasilense 7030 and the mutant strain incubated under sub-optimal conditions in soil carriers may result from low tolerance of the parent strain to desiccation, blurring the influence that could be attributed to PHB utilization.
