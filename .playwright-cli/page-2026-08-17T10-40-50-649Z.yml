                - paragraph [ref=e537]: All of these facts indicated that HFX_6464 may act as a PHA depolymerase in H. mediterranei. HFX_6464 was previously annotated as RssA, and we here designated it PhaZh1, the potential haloarchaeal PHA depolymerase.
              - generic [ref=e538]:
                - heading "Effect of PhaZh1 on PHA degradation in H. mediterranei." [level=3] [ref=e539]
                - paragraph [ref=e540]:
                  - text: To determine the function of PhaZh1 in nPHA granule degradation, we knocked out the phaZh1 gene from H. mediterranei EPS (
                  - link "Table 1" [ref=e541] [cursor=pointer]:
                    - /url: "#T1"
                  - text: ). The nPHA granules isolated from the strain H. mediterranei EPS harboring pWL502 (an empty plasmid) were gradually degraded in vitro (
                  - link "Fig. 3A" [ref=e542] [cursor=pointer]:
                    - /url: "#F3"
                  - text: ). After 5 h, the turbidity of granule suspension at 650 nm was decreased from 0.96 to 0.24. However, for the nPHA granules isolated from the phaZh1 mutant strain H. mediterranei EPSΔphaZh1 harboring the pWL502 plasmid, the granule degradation was not detectable in vitro (
                  - link "Fig. 3A" [ref=e543] [cursor=pointer]:
                    - /url: "#F3"
                  - text: ). In contrast, the nPHA granules isolated from the phaZh1 complementation strain H. mediterranei EPSΔphaZh1(pWLZh1) recovered the ability of autodegradation (
                  - link "Fig. 3A" [ref=e544] [cursor=pointer]:
                    - /url: "#F3"
                  - text: ), which was similar to that of the wild-type strain. This result indicated that PhaZh1 is involved in the nPHA granule hydrolysis in vitro.
                - generic [ref=e545]:
                  - generic [ref=e546]:
                    - generic [ref=e547]: FIG 3
                    - button "Open FIG 3 in Viewer" [ref=e549] [cursor=pointer]:
