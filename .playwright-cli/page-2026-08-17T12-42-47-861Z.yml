                - heading "Construction and characterization of phaZ::Km mutant" [level=3] [ref=e293]
                - paragraph [ref=e294]: An A. brasilense phaZ mutant was isolated following cloning of a Tn5-derived Km resistance cassette into the unique NaeΙ restriction site of pDpoly-E/P, and homologous recombination into the A. brasilense 7030 phaZ locus. This strain was selected for its high frequency of recombination in Azospirillum after numerous unfruitful attempts to knock out phaZ in strain Sp7.
                - heading "PHB accumulation and degradation" [level=3] [ref=e295]
                - paragraph [ref=e296]:
                  - text: "After 48 h of growth in high C:N medium, the amount of PHB accumulated by the phaZ mutant was considerably higher than the amount accumulated by A. brasilense 7030 (90±5% and 40±8% PHB of total dry weight respectively) as revealed by gas chromatography evaluation. Following a 24-h starvation period in phosphate buffer, the amount of accumulated PHB in A. brasilense 7030 was reduced to 20% of total dry weight of the cells, and no PHB was detected after 48 h of starvation. A totally different behavior was observed with the phaZ mutant: No decline in PHB cell content was measured, even after 72 h of starvation. These results indicate that the phaZ locus is required for the degradation of PHB. This was confirmed by transmission electron microscopy, which showed large PHB granules in the phaZ mutant, but none in A. brasilense 7030, following a 72-h starvation period (Fig."
                  - link "3" [ref=e297] [cursor=pointer]:
