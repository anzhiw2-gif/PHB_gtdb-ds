            - generic [ref=e677]:
              - heading "DISCUSSION" [level=2] [ref=e678]
              - paragraph [ref=e679]:
                - text: Although many intracellular PHA depolymerases have been found in bacteria, such proteins were not clearly recognized by homology searches in the genome of H. mediterranei. Using the two-dimensional electrophoresis (2-DE) method, five PGAPs (HFX_5217 to HFX_5221; MaoC, PhaR, PhaP, PhaE, and PhaC) have been isolated from the nPHA granules accumulated in H. mediterranei cells at the stationary phase of growth (
                - link "21" [ref=e680] [cursor=pointer]:
                  - /url: "#core-collateral-B21"
                - text: ","
                - link "22" [ref=e681] [cursor=pointer]:
                  - /url: "#core-collateral-B22"
                - text: ). Interestingly, these five PGAPs are encoded by a gene cluster (pha cluster; HFX_5217 to _5221) in the genome. The functions of these PGAPs (except MaoC) in PHA biosynthesis or granule formation have been characterized recently (
                - link "18" [ref=e682] [cursor=pointer]:
                  - /url: "#core-collateral-B18"
                - text: ","
                - link "21" [ref=e683] [cursor=pointer]:
                  - /url: "#core-collateral-B21"
                - text: ","
                - link "22" [ref=e684] [cursor=pointer]:
                  - /url: "#core-collateral-B22"
                - text: ). However, no putative PHA depolymerase was found in this PHA granule proteome. In this study, when we transferred the PHA-rich cells of H. mediterranei into a fresh medium without a carbon resource, a novel PGAP was observed at the nPHA granules and was identified as the intracellular PHA depolymerase PhaZh1(
                - link "Fig. 1D" [ref=e685] [cursor=pointer]:
                  - /url: "#F1"
                - text: ). This indicated that PhaZh1 might be induced under the condition of carbon starvation.
              - paragraph [ref=e686]:
                - text: Through BLASTP analysis (
                - link "34" [ref=e687] [cursor=pointer]:
                  - /url: "#core-collateral-B34"
                - text: ","
                - link "35" [ref=e688] [cursor=pointer]:
                  - /url: "#core-collateral-B35"
                - text: ), PhaZh1 was found to be a patatin-like protein (
                - link "36" [ref=e689] [cursor=pointer]:
                  - /url: "#core-collateral-B36"
                - text: ), and proteins with a patatin catalytic domain are widely found in the three domains of life (
                - link "44" [ref=e690] [cursor=pointer]:
                  - /url: "#core-collateral-B44"
                - link "–" [ref=e691] [cursor=pointer]:
                  - /url: "#core-collateral-B45"
                - link "46" [ref=e692] [cursor=pointer]:
                  - /url: "#core-collateral-B46"
                - text: ). Modification of putative conserved residues of serine, aspartate, and histidine of patatin B2 demonstrated that Ser
                - superscript [ref=e693]: "54"
                - text: and Asp
                - superscript [ref=e694]: "192"
                - text: constitute the active site (
                - link "43" [ref=e695] [cursor=pointer]:
                  - /url: "#core-collateral-B43"
                - text: ), which was further revealed by the crystal structure of a patatin isozyme, Pat17 (
                - link "36" [ref=e696] [cursor=pointer]:
                  - /url: "#core-collateral-B36"
                - text: ). Patatin is a serine hydrolase with a Ser-Asp catalytic dyad (
                - link "43" [ref=e697] [cursor=pointer]:
                  - /url: "#core-collateral-B43"
                - text: ), which contains a nucleophile serine that is embedded in the lipase box (G-X-S-X-G) and an aspartate that is often found in an Asp-Gly-Gly motif (
                - link "36" [ref=e698] [cursor=pointer]:
                  - /url: "#core-collateral-B36"
                - text: ). An anion-binding element, Gly-Gly-X-Arg, is also important for the enzyme activity of patatin (
                - link "36" [ref=e699] [cursor=pointer]:
                  - /url: "#core-collateral-B36"
                - text: ). The patatin-related phospholipase A found in plants (pPLA) and animals (cPLA
                - subscript [ref=e700]: "2"
                - text: ) cleaves phospholipids at the sn1 or sn2 position of glycerophospholipids to yield free fatty acids (
                - link "47" [ref=e701] [cursor=pointer]:
                  - /url: "#core-collateral-B47"
                - text: ). However, a patatin-like protein that hydrolyzes the PHA granules has not yet been reported. Based on a partial sequence around the conserved residue alignment of PhaZh1 with Pat17 (
                - link "36" [ref=e702] [cursor=pointer]:
                  - /url: "#core-collateral-B36"
                - text: ), we proposed that Gly
                - superscript [ref=e703]: "16"
                - text: ", Ser"
                - superscript [ref=e704]: "47"
                - text: ", and Asp"
                - superscript [ref=e705]: "195"
                - text: of PhaZh1 may be the essential residues (
                - link "Fig. 2B" [ref=e706] [cursor=pointer]:
                  - /url: "#F2"
                - text: ). The site-directed mutagenesis of PhaZh1 indicated that Gly
                - superscript [ref=e707]: "16"
                - text: ", Ser"
                - superscript [ref=e708]: "47"
                - text: ", and Asp"
                - superscript [ref=e709]: "195"
                - text: are indeed essential for nPHA granule hydrolysis. The putative catalytic dyad of PhaZh1 is Ser
                - superscript [ref=e710]: "47"
                - text: "-Asp"
                - superscript [ref=e711]: "195"
                - text: ", and that is different from the case for all known bacterial PHA depolymerases, which have the putative catalytic triad Ser-Asp-His ("
                - link "7" [ref=e712] [cursor=pointer]:
                  - /url: "#core-collateral-B7"
                - text: ","
                - link "42" [ref=e713] [cursor=pointer]:
                  - /url: "#core-collateral-B42"
                - text: ). The difference in catalytic domain between PhaZh1 and its bacterial counterparts may explain why the products of nPHA hydrolysis by PhaZh1 are hydroxyalkanoate monomers, which are different from that obtained by bacterial depolymerase PhaZd1 or PhaZd2 (
                - link "6" [ref=e714] [cursor=pointer]:
                  - /url: "#core-collateral-B6"
                - text: ). The latter is a mixture of hydroxyalkanoate monomer and dimer. Interestingly, a patatin-like phospholipase protein (H16_A0225) was recently identified as a new PGAP in R. eutropha (
                - link "48" [ref=e715] [cursor=pointer]:
                  - /url: "#core-collateral-B48"
                - text: ). Because of their same locations on the PHA granules and their conserved patatin-like catalytic domains between PhaZh1 and H16_A0225, we speculate that H16_A0225 may be also involved in PHA degradation in R. eutropha.
              - paragraph [ref=e716]:
                - text: PhaZh1 catalyzed the hydrolysis of nPHA granules purified from the haloarchaeon H. mediterranei and even nPHB granules purified from the bacterium R. eutropha H16 in vitro (
                - link "Fig. 4" [ref=e717] [cursor=pointer]:
                  - /url: "#F4"
                - text: ). The nPHB granule isolated from R. eutropha H16 degraded without depolymerase addition in 50 mM potassium phosphate buffer (
                - link "8" [ref=e718] [cursor=pointer]:
                  - /url: "#core-collateral-B8"
                - text: ) but showed no significant degradation in 2 M KCl buffer (
                - link "Fig. 4D" [ref=e719] [cursor=pointer]:
                  - /url: "#F4"
                - text: ), which indicated that depolymerase PhaZa1 located on the nPHB granule did not work in hypersaline buffer. Thus, PhaZh1 was the key enzyme for nPHB granule hydrolysis in hypersaline buffer (
                - link "Fig. 4D" [ref=e720] [cursor=pointer]:
                  - /url: "#F4"
                - text: ). BdhA (a putative 3HB dehydrogenase) catalyzed the redox reaction (
                - link "40" [ref=e721] [cursor=pointer]:
                  - /url: "#core-collateral-B40"
                - text: ) in the presence of NAD
                - superscript [ref=e722]: +
                - text: in the solution of nPHA granule hydrolysis by PhaZh1, which indicated that BdhA is a 3HB dehydrogenase in haloarchaea. PhaZh1 with BdhA degraded the nPHA granule to acetoacetate in vitro, indicating that they may constitute the first part of a PHA degradation pathway in vivo. The main product of nPHA granule hydrolysis by PhaZh1 was found to be the 3HB monomer (
                - link "Fig. 5A" [ref=e723] [cursor=pointer]:
                  - /url: "#F5"
                - text: ). It is known that the monomers of PHA degradation by PhaZ are typically in the R configuration (
                - link "49" [ref=e724] [cursor=pointer]:
                  - /url: "#core-collateral-B49"
                - text: ), and the ΔbktB mutant of H. mediterranei accumulated a considerable amount of PHB instead of PHBV in the cells (
                - link "20" [ref=e725] [cursor=pointer]:
                  - /url: "#core-collateral-B20"
                - text: ). Thus, PhaZh1 has the potential to produce the chiral compound (R)-3HB, which is a high-value-added product with industrial and medical applications (
                - link "49" [ref=e726] [cursor=pointer]:
                  - /url: "#core-collateral-B49"
                - text: ).
              - paragraph [ref=e727]:
                - text: Although PhaZh1 was the key enzyme of nPHA granule hydrolysis in vitro, deletion of the phaZh1 gene had no significant effect on PHA mobilization in vivo in H. mediterranei (
                - link "Fig. 3B" [ref=e728] [cursor=pointer]:
                  - /url: "#F3"
                - text: and
                - link "C" [ref=e729] [cursor=pointer]:
                  - /url: "#F3"
                - text: ). Similarly to the PHB depolymerase redundancy in the bacterium R. eutropha H16 (
                - link "6" [ref=e730] [cursor=pointer]:
                  - /url: "#core-collateral-B6"
                - text: ","
                - link "7" [ref=e731] [cursor=pointer]:
                  - /url: "#core-collateral-B7"
                - text: ","
                - link "15" [ref=e732] [cursor=pointer]:
                  - /url: "#core-collateral-B15"
                - text: ), other PHA depolymerases should exist and have significant effects on the in vivo PHA degradation in H. mediterranei. These candidates for PHA depolymerase may include several predicted hydrolases, as well as the PhaCs that may contribute to both PHA synthesis and mobilization. Interestingly, among the nine intracellular PHB depolymerases or PHB oligomer hydrolases in R. eutropha H16, PhaZa1 is the only PHB depolymerase located on the PHB granules (
                - link "8" [ref=e733] [cursor=pointer]:
                  - /url: "#core-collateral-B8"
                - text: ","
                - link "48" [ref=e734] [cursor=pointer]:
                  - /url: "#core-collateral-B48"
                - text: ). The other PHA depolymerases that may exist in H. mediterranei may not be located on the PHA granules (similarly to PhaZh1) or not function in vitro. Therefore, PhaZh1 may not play a significant role in PHA mobilization within the cell, but it is the key enzyme for nPHA degradation in vitro (
                - link "Fig. 4" [ref=e735] [cursor=pointer]:
                  - /url: "#F4"
                - text: ).
              - paragraph [ref=e736]: Taking the results together, the patatin-like protein PhaZh1, which is located on the PHA granules in H. mediterranei, was identified as a novel PHA depolymerase. PhaZh1 is distinct from its bacterial counterparts in terms of its catalytic domain and hydrolysis product. Notably, hydroxyalkanoate monomers were the product of nPHA granule hydrolysis by PhaZh1. These specific features may provide a new strategy for producing the high-value-added chiral compound (R)-3HB. In addition, this study implies that other PHA degradation pathways may also exist in H. mediterranei. Identification of these pathways may provide more insights into PhaZh1 function in vivo, as well as the mechanisms of PHA mobilization in haloarchaea.
