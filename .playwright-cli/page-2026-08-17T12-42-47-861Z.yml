                - paragraph [ref=e276]: To establish whether phaZ is located on the chromosome or on one of the A. brasilense megaplasmids (either the 115-MDa or the 90-MDa plasmid), total DNA was extracted from A. brasilense Sp7, A. brasilense 7030 (a strain lacking the 115-MDa megaplasmid), and from a pooled Sp7-p90 cosmid library. PCRs were done using a specific oligonucleotide for phaZ. Positive reactions were observed only with DNA from A. brasilense Sp7 and A. brasilense 7030, suggesting that phaZ is located on the chromosome and not on one of the megaplasmids. Recently the Sp7-p90 megaplasmid was fully sequenced. This confirmed that phaZ was not located on the plasmid (Vanderleyden J., KUL, Belgium, personal communication).
