              - generic [ref=e425]:
                - heading "PHA analysis and isolation of nPHA granules." [level=3] [ref=e426]
                - paragraph [ref=e427]:
                  - text: The PHA content and concentration in the cells were analyzed via gas chromatography (GC) (GC-6820; Agilent, USA) as described previously (
                  - link "28" [ref=e428] [cursor=pointer]:
                    - /url: "#core-collateral-B28"
                  - text: ). Native PHA granules were isolated by sucrose density gradient (1.0 M, 1.3 M, 1.6 M, and 2.0 M sucrose in 100 mM Tris-HCl buffer, pH 7.15) centrifugation (210,000 × g at 4°C for 2 h) as previously described (
                  - link "21" [ref=e429] [cursor=pointer]:
                    - /url: "#core-collateral-B21"
                  - text: ).
                - paragraph [ref=e430]:
                  - text: The molecular weight distribution of PHA was analyzed via gel permeation chromatography (GPC) (1260; Agilent, USA). Lyophilized cells with 15 mg of PHA were treated with chloroform for 2 to 3 days at room temperature. After centrifugation (3,000 × g for 30 min) to remove debris, the sample was filtered through a disassembled syringe filter. The PHA dissolved in chloroform was then purified by ethanol precipitation (
                  - link "29" [ref=e431] [cursor=pointer]:
                    - /url: "#core-collateral-B29"
                  - text: ). The samples used for GPC analysis were dissolved in chloroform at a concentration of 6 mg ml
                  - superscript [ref=e432]: −1
                  - text: "and filtered through a 0.45-μm syringe filter. The conditions for the GPC analysis were as follows: two PLgel 5-μm 10E5A columns (300 mm by 7.5 mm, Agilent Technologies); column and refractive index detector temperature, 35°C; mobile phase, chloroform; flow rate, 1 ml min"
                  - superscript [ref=e433]: −1
                  - text: ; and injection volume, 50 μl. Polymer polystyrene (Agilent polymer standard kit) was used as a standard.
              - generic [ref=e434]:
                - heading "SDS-PAGE and MALDI-TOF/TOF MS analysis." [level=3] [ref=e435]
                - paragraph [ref=e436]:
                  - text: The isolated nPHA granules were resuspended in SDS-PAGE loading buffer (50 mM Tris-HCl, 2% SDS, 0.1% bromophenol blue, and 10% glycerol, pH 6.8). Coomassie brilliant blue R-250 was used for protein staining. The protein of interest was identified via matrix-assisted laser desorption ionization–tandem time of flight mass spectrometry (MALDI-TOF/TOF MS) as described by Shevchenko et al. (
                  - link "30" [ref=e437] [cursor=pointer]:
                    - /url: "#core-collateral-B30"
                  - text: ).
              - generic [ref=e438]:
                - heading "Gene deletion, complementation, and mutation." [level=3] [ref=e439]
                - paragraph [ref=e440]:
                  - text: For construction of the phaZh1-knockout plasmid, a 497-bp DNA fragment located immediately upstream and a 644-bp DNA fragment located immediately downstream of the phaZh1 open reading frame (ORF) were amplified with the primer pairs phaZh1-DF1/DR1 and phaZh1-DF2/DR2, respectively. These two DNA fragments were used as templates for overlapping extension PCR with the primer pair phaZh1-DF1/DR2. The overlapping PCR product was digested with BamHI plus KpnI and then inserted into the pyrF-based integration plasmid pHFX (
                  - link "17" [ref=e441] [cursor=pointer]:
                    - /url: "#core-collateral-B17"
                  - text: ), which resulted in pDZh1. After pDZh1 was introduced into H. mediterranei EPS, the ΔphaZh1 mutant strain was screened and identified as previously described (
                  - link "17" [ref=e442] [cursor=pointer]:
                    - /url: "#core-collateral-B17"
                  - text: ).
                - paragraph [ref=e443]:
                  - text: For construction of the phaZh1 complementation plasmid, the ORF of phaZh1 with its promoter region (i.e., the intergenic region between bdhA and phaZh1) was amplified with the primer pair phaZh1-WL-F/R. The PCR product was digested with NcoI plus XbaI and then inserted into the pWL502 plasmid (
                  - link "21" [ref=e444] [cursor=pointer]:
                    - /url: "#core-collateral-B21"
                  - text: ) to yield pWLZh1.
                - paragraph [ref=e445]:
                  - text: Through overlapping extension PCR, phaZh1 mutations were amplified with the primer pairs listed in
                  - link "Table 2" [ref=e446] [cursor=pointer]:
                    - /url: "#T2"
                  - text: . The PCR products were digested with EcoRI plus KpnI and then inserted into the plasmid pTA03, resulting in derivatives of pTA03 with mutated phaZh1.
              - generic [ref=e447]:
                - heading "Expression and purification of His-tagged proteins in H. volcanii." [level=3] [ref=e448]
                - paragraph [ref=e449]:
                  - text: The plasmids and primers used in this study are listed in
                  - link "Tables 1" [ref=e450] [cursor=pointer]:
                    - /url: "#T1"
                  - text: and
                  - link "2" [ref=e451] [cursor=pointer]:
                    - /url: "#T2"
                  - text: . For gene cloning and protein expression in H. volcanii H1424, several new expression vectors were developed, at first based on the plasmid pTA1228 (
                  - link "27" [ref=e452] [cursor=pointer]:
                    - /url: "#core-collateral-B27"
                  - text: ), in which the tryptophanase promoter P.tnaA was replaced by the strong promoter P.phaR (
                  - link "22" [ref=e453] [cursor=pointer]:
                    - /url: "#core-collateral-B22"
                  - text: ). Briefly, the P.phaR promoter was amplified with the primer pair P.phaR-F/R and was then digested with BamHI plus KpnI and inserted into pTA1228 to yield pTA01. After digestion with KpnI, the 3′ overhang of the linear pTA01 was removed with T4 DNA polymerase and then self-ligated to generate pTA02. After digestion with EcoRI plus BamHI, pTA02 was ligated with the fragment of the annealing primer pair TA03-F/R or TA05-F/R, resulting in pTA03 or pTA05, respectively.
                - paragraph [ref=e454]:
                  - text: For construction of the PhaZh1- or BdhA-expressing plasmid, the ORF of phaZh1 or bdhA was amplified with the primer pair phaZh1-TA-F/R or bdhA-TA-F/R, respectively. These PCR products were digested with EcoRI plus KpnI or KpnI plus BamHI and then inserted into the plasmids pTA03 and pTA05, resulting in pTA03-phaZh1 and pTA05-bdhA, respectively. The H. volcanii H1424 transformant harboring the expressing plasmid was cultivated in 2-liter flasks with 500 ml (1:100 [vol/vol] inoculation) of Hv-YPC medium at 45°C for 36 h. After the collected cells were ultrasonicated at 4°C (the following operations were all at the same temperature), the crude extracts were separated from the debris by centrifugation (10,000 × g for 15 min). His-tagged protein was purified with Ni-agarose columns. Briefly, the column was activated with 10 ml of binding buffer (2 M NaCl and 20 mM Tris-HCl, pH 8.0). The crude extracts were then loaded onto the column, and the proteins with nonspecific adsorption were eluted with 50 ml of wash buffer (2 M NaCl, 20 mM Tris-HCl, and 20 mM imidazole, pH 8.0). Afterwards, the His-tagged proteins were eluted with 10 ml of elution buffer (2 M NaCl, 20 mM Tris-HCl, and 500 mM imidazole, pH 8.0). Finally, the imidazole in the solution was diluted with binding buffer, and the protein was concentrated via ultrafiltration. Using the bicinchoninic acid method (
                  - link "31" [ref=e455] [cursor=pointer]:
                    - /url: "#core-collateral-B31"
                  - text: ), the concentration of purified protein was measured spectrophotometrically (DU800; Beckman Coulter, USA) at 562 nm.
              - generic [ref=e456]:
                - heading "Enzyme assay." [level=3] [ref=e457]
                - paragraph [ref=e458]:
                  - text: The nPHA depolymerase activity was analyzed by measuring the decrease in nPHA granule turbidity at 650 nm (
                  - link "32" [ref=e459] [cursor=pointer]:
                    - /url: "#core-collateral-B32"
                  - text: ). Briefly, the assay mixture contained 2 M KCl, 100 mM Tris-HCl (pH 7.5), 5 mM MgCl
                  - subscript [ref=e460]: "2"
                  - text: ", and the purified nPHA granules (initial optical density at 650 nm [OD"
                  - subscript [ref=e461]: "650"
                  - text: "], ∼1). The reaction was started by adding the purified PhaZh1 (100 μg ml"
                  - superscript [ref=e462]: −1
                  - text: ) at 45°C.
                - paragraph [ref=e463]:
                  - text: The 3HB dehydrogenase activity assay was performed at room temperature in buffer (500 μl) containing 2 M KCl, 100 mM Tris-HCl (pH 7.5), 5 mM MgCl
                  - subscript [ref=e464]: "2"
                  - text: ", 4 mM sodium 3-hydroxybutyrate (Sigma), 5 mM NAD"
                  - superscript [ref=e465]: +
                  - text: ", and 25 μg of purified BdhA. After the protein was added, the NADH produced in the solution was monitored spectrophotometrically (DU800; Beckman Coulter, USA) at 340 nm (the extinction coefficient of NADH [ε"
                  - subscript [ref=e466]: NADH
                  - text: "] at 340 nm is 6.22 × 10"
                  - superscript [ref=e467]: "3"
                  - text: liters mol
                  - superscript [ref=e468]: −1
                  - text: cm
                  - superscript [ref=e469]: −1
                  - text: ). Sodium 3-hydroxybutyrate can be replaced with the nPHA granule degradation solution with the pH adjusted to 7.0.
              - generic [ref=e470]:
                - heading "PHA degradation product and glucose concentration analysis." [level=3] [ref=e471]
                - paragraph [ref=e472]:
                  - text: The nPHA granule degradation product was identified via high-pressure liquid chromatography (HPLC) (HPLC-1220; Agilent, USA) as described previously (
                  - link "33" [ref=e473] [cursor=pointer]:
                    - /url: "#core-collateral-B33"
                  - text: ) using sodium 3-hydroxybutyrate (Sigma) as the standard.
                - paragraph [ref=e474]:
                  - text: The glucose concentration in the medium was measured with the SBA-40D sensor (Institute of Biology, Shandong Academy of Sciences, China). After centrifugation (10,000 × g for 5 min), the supernatant was diluted with double-distilled water (ddH
                  - subscript [ref=e475]: "2"
                  - text: O) (1:20, vol/vol), and 25 μl of the dilution was subjected to the glucose concentration assay, with 1 g liter
                  - superscript [ref=e476]: −1
                  - text: glucose as the standard.
