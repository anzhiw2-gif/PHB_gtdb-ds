                    - link "Supplementary Figure 8 Comparison of GTDB and SILVA." [ref=f30e657] [cursor=pointer]:
                      - /url: /articles/nbt.4229/figures/13
                  - paragraph [ref=f30e659]:
                    - text: Comparison of GTDB and SILVA taxonomic assignments across 10,779 bacterial genomes from RefSeq/GenBank release 80. These genomes are part of the 21,943 dereplicated genomes for which a 16S rRNA gene could be reliably matched by sequence similarity to a 16S rRNA gene in SILVA release 128. For each rank, a taxon was classified as being unchanged if its name was identical in both taxonomies, passively changed if the GTDB taxonomy provided name information absent in the SILVA taxonomy, or actively changed if the name was different between the two taxonomies after adjusting the SILVA taxonomy for colloquial designations indicating of missing taxonomic information (see
                    - link "Methods" [ref=f30e660] [cursor=pointer]:
                      - /url: /articles/nbt.4229#Sec12
                    - text: ). Changes between the GTDB and SILVA taxonomies are given in
                    - link "Supp. Table 9" [ref=f30e661] [cursor=pointer]:
                      - /url: /articles/nbt.4229#MOESM107
                    - text: .
