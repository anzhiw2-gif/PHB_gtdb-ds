            - generic [ref=f1e291]: Full text access
            - generic [ref=f1e298]:
              - text: Polyhydroxybutyrate is a microbial polyester that can be produced from renewable resources, and is degraded by the enzyme polyhydroxybutyrate depolymerase. The crystal structures of polyhydroxybutyrate depolymerase from
              - emphasis [ref=f1e299]: Penicillium funiculosum
              - text: and its S39A mutant complexed with the methyl ester of a trimer substrate of (
              - emphasis [ref=f1e300]: R
              - text: )-3-hydroxybutyrate have been determined at resolutions of 1.71 Å and 1.66 Å, respectively. The enzyme is comprised of a single domain, which represents a circularly permuted variant of the α/β hydrolase fold. The catalytic residues Ser39, Asp121, and His155 are located at topologically conserved positions. The main chain amide groups of Ser40 and Cys250 form an oxyanion hole. A crevice is formed on the surface of the enzyme, to which a single polymer chain can be bound by predominantly hydrophobic interactions with several hydrophobic residues. The structure of the S39A mutant–trimeric substrate complex reveals that Trp307 is responsible for the recognition of the ester group adjacent to the scissile group. It is also revealed that the substrate-binding site includes at least three, and possibly four, subsites for binding monomer units of polyester substrates. Thirteen hydrophobic residues, which are exposed to solvent, are aligned around the mouth of the crevice, forming a putative adsorption site for the polymer surface. These residues may contribute to the sufficient binding affinity of the enzyme for PHB granules without a distinct substrate-binding domain.
