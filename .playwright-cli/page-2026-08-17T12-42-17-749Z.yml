                  - generic [ref=f1e529]:
                    - heading "The catalytic site" [level=3] [ref=f1e530]
                    - generic [ref=f1e531]:
                      - text: It has been proposed that both type I and type II depolymerases contain lipase-like catalytic triads (serine, histidine, and aspartic acid residues).
                      - link [ref=f1e532] [cursor=pointer]:
                        - /url: "#bib6"
                        - superscript [ref=f1e535]: "6"
                      - text: The catalytic residues of
                      - emphasis [ref=f1e536]: P. funiculosum
                      - text: depolymerase, Ser39, Asp121, and His155, are located after the first (β1), third (β3), and fourth (β4) β-strands, which are referred to as the nucleophilic elbow, the acidic turn, and the histidine loop for the canonical α/β hydrolase fold, respectively (
                      - link "Figure 1" [ref=f1e537] [cursor=pointer]:
                        - /url: "#fig1"
                      - text: ","
                      - link "Figure 2" [ref=f1e539] [cursor=pointer]:
                        - /url: "#fig2"
                      - text: (a)). The main chain conformation of Ser39 with (ϕ,ψ) values of (56.6°, −128.3°) exhibits characteristics typical for a nucleophilic residue of all of α/β hydrolase fold enzymes. These residues are entirely conserved (
                      - link "Figure 3" [ref=f1e541] [cursor=pointer]:
                        - /url: "#fig3"
                      - text: (a)), indicating that they are essential for catalysis, and the functional importance of Ser39 was confirmed in mutagenesis experiments. In spite of the circularly permuted fold, the spatial arrangement of the catalytic triad is very similar to that of lipases and other α/β hydrolase fold enzymes. The N
                      - superscript [ref=f1e543]: δ1
                      - text: atom of His155 and the carboxyl group of Asp121 are within hydrogen bonding distance (about 2.8 Å), whereas the O
                      - superscript [ref=f1e544]: δ
                      - text: atom of Ser39 and the N
                      - superscript [ref=f1e545]: ε2
                      - text: atom of His155 are not hydrogen bonded in the current model (about 3.9 Å). On the other hand, the O
                      - superscript [ref=f1e546]: δ
                      - text: atom of Ser39 is hydrogen bonded to the main chain amide group of Ser40, and a water molecule. This water molecule is also hydrogen bonded to the N
                      - superscript [ref=f1e547]: ε2
                      - text: atom of His155.
                  - generic [ref=f1e548]:
                    - heading "The substrate-binding site" [level=3] [ref=f1e549]
                    - generic [ref=f1e550]:
                      - generic [ref=f1e551]:
                        - text: To understand the mechanism of substrate recognition by the enzyme as well as the catalytic mechanism on the basis of protein structure, we prepared a mutant protein S39A, and determined the structure of the S39A–H(R3HB)
                        - subscript [ref=f1e552]: "3"
                        - text: M complex at a resolution of 1.66 Å with crystallographic
                        - emphasis [ref=f1e553]: R
                        - text: and free-
                        - emphasis [ref=f1e554]: R
                        - text: values of 17.9% and 20.7%, respectively. The structures of the wild-type protein and the S39A mutant complexed with H(R3HB)
                        - subscript [ref=f1e555]: "3"
                        - text: M are essentially the same with an r.m.s. deviation of about 0.4 Å for C
                        - superscript [ref=f1e556]: α
                        - text: atoms. No significant global structural change upon binding of H(R3HB)
                        - subscript [ref=f1e557]: "3"
                        - text: M was observed. However, local conformational changes are observed for regions of the crystal contacts that are different between crystals of the wild-type and the mutant proteins due to crystallization in different space groups. In fact, the structure of the S39A protein complexed with H(R3HB)
                        - subscript [ref=f1e558]: "3"
                        - text: M is almost identical to that in the uncomplexed form (data not shown). Therefore, these conformational differences are artifacts, produced during crystallization. Accordingly, although a slight difference of the conformation of Ser39 is observed, with a deviation of about 0.54 Å for the C
                        - superscript [ref=f1e559]: α
                        - text: position, this may be an artifact due to different environments in terms of crystal contacts around the active site. Well-defined electron densities for H(R3HB)
                        - subscript [ref=f1e560]: "3"
                        - text: M were obtained for the mutant–substrate complex data (
                        - link "Figure 4" [ref=f1e561] [cursor=pointer]:
                          - /url: "#fig4"
                        - text: ), which permitted us to build a reliable model of the bound substrate, and to investigate a substrate-binding site and the binding mode of the substrate. We designate the monomer units of H(R3HB)
                        - subscript [ref=f1e563]: "3"
                        - text: M as units 1–3 from its carboxyl end, and the corresponding sites (subsites) to which these monomer units are bound as subsites 1–3, respectively. It should be noted that electron densities for the carboxy-terminal methyl group of H(R3HB)
                        - subscript [ref=f1e564]: "3"
                        - text: M were not visible, probably due to disorder.
