                  - figure "FIG 3 Effect of phaZh1 deletion or complementation on PHA degradation in the haloarchaeon H. mediterranei. (A) Degradation of nPHA granules isolated from the H. mediterranei EPS strain with the pWL502 plasmid, the H. mediterranei EPSΔphaZh1 strain with the pWL502 plasmid, and the H. mediterranei EPSΔphaZh1 strain with the pWLZh1 plasmid. The nPHA granules were isolated from cells in the PHA mobilization phase. The turbidity of the granules was monitored (DU800; Beckman Coulter) at 650 nm. (B) Effect of phaZh1 deletion on intracellular PHA degradation in H. mediterranei EPS. EPS, wild-type strain; EPSΔphaZh1, ΔphaZh1 mutant strain. (C) Effect of phaZh1 complementation on intracellular PHA degradation in H. mediterranei EPSΔphaZh1. pWL502, empty plasmid; pWLZh1, expression plasmid for PhaZh1 with its promoter region." [ref=e551]:
                    - img "FIG 3 Effect of phaZh1 deletion or complementation on PHA degradation in the haloarchaeon H. mediterranei. (A) Degradation of nPHA granules isolated from the H. mediterranei EPS strain with the pWL502 plasmid, the H. mediterranei EPSΔphaZh1 strain with the pWL502 plasmid, and the H. mediterranei EPSΔphaZh1 strain with the pWLZh1 plasmid. The nPHA granules were isolated from cells in the PHA mobilization phase. The turbidity of the granules was monitored (DU800; Beckman Coulter) at 650 nm. (B) Effect of phaZh1 deletion on intracellular PHA degradation in H. mediterranei EPS. EPS, wild-type strain; EPSΔphaZh1, ΔphaZh1 mutant strain. (C) Effect of phaZh1 complementation on intracellular PHA degradation in H. mediterranei EPSΔphaZh1. pWL502, empty plasmid; pWLZh1, expression plasmid for PhaZh1 with its promoter region." [ref=e552] [cursor=pointer]
                - paragraph [ref=e554]:
                  - text: To determine the in vivo function of PhaZh1 in H. mediterranei, the effect of phaZh1 deletion on intracellular PHA degradation in H. mediterranei was investigated. The PHA concentrations in the H. mediterranei EPSΔphaZh1 and H. mediterranei EPS strains were determined via GC assay (
                  - link "Fig. 3B" [ref=e555] [cursor=pointer]:
                    - /url: "#F3"
                  - text: ). The H. mediterranei EPSΔphaZh1 strain accumulated slightly more PHA (2.40 ± 0.15 g liter
                  - superscript [ref=e556]: −1
                  - text: ) than the H. mediterranei EPS strain (2.12 ± 0.04 g liter
                  - superscript [ref=e557]: −1
                  - text: ) on day 0. After 5 days, however, the PHA concentration in the H. mediterranei EPSΔphaZh1 strain gradually decreased to 1.69 ± 0.06 g liter
                  - superscript [ref=e558]: −1
                  - text: ", which was equal to that found in the H. mediterranei EPS strain (1.63 ± 0.03 g liter"
                  - superscript [ref=e559]: −1
                  - text: ). Hence, PhaZh1 mutation (ΔphaZh1) had a slight effect on PHA accumulation but had no significant effect on intracellular PHA mobilization in H. mediterranei EPS.
                - paragraph [ref=e560]:
                  - text: The effect of phaZh1 complementation on PHA degradation in the ΔphaZh1 mutant strain was investigated. The expression of PhaZh1 (with plasmid pWLZh1) in the mutant strain H. mediterranei EPSΔphaZh1 resulted in less PHA accumulation (2.73 ± 0.06 g liter
                  - superscript [ref=e561]: −1
                  - text: ) than that found in the control strain (with empty plasmid pWL502) (2.92 ± 0.06 g liter
                  - superscript [ref=e562]: −1
                  - text: ) on day 0 in another parallel experimental assay (
                  - link "Fig. 3C" [ref=e563] [cursor=pointer]:
                    - /url: "#F3"
                  - text: ). However, the PHA concentration in the complementation strain was also decreased to a level equal to that observed in the control strain over a period of 5 days. These results indicated that although PhaZh1 showed efficient activity and was most likely the key enzyme in nPHA granule hydrolysis in vitro (
                  - link "Fig. 3A" [ref=e564] [cursor=pointer]:
                    - /url: "#F3"
                  - text: ), either deletion or complementation of the phaZh1 gene had no significant effect on PHA mobilization in vivo (
                  - link "Fig. 3B" [ref=e565] [cursor=pointer]:
                    - /url: "#F3"
                  - text: and
                  - link "C" [ref=e566] [cursor=pointer]:
                    - /url: "#F3"
                  - text: ).
