        - generic [ref=e217]:
          - generic [ref=e220]:
            - heading "ABSTRACT" [level=2] [ref=e221]
            - paragraph [ref=e222]:
              - text: The key enzymes and pathways involved in polyhydroxyalkanoate (PHA) biosynthesis in haloarchaea have been identified in recent years, but the haloarchaeal enzymes for PHA degradation remain unknown. In this study, a patatin-like PHA depolymerase, PhaZh1, was determined to be located on the PHA granules in the haloarchaeon Haloferax mediterranei. PhaZh1 hydrolyzed the native PHA (nPHA) [including native polyhydroxybutyrate (nPHB) and native poly(3-hydroxybutyrate-co-3-hydroxyvalerate) (nPHBV) in this study] granules in vitro with 3-hydroxybutyrate (3HB) monomer as the primary product. The site-directed mutagenesis of PhaZh1 indicated that Gly
              - superscript [ref=e223]: "16"
              - text: ", Ser"
              - superscript [ref=e224]: "47"
              - text: (in a classical lipase box, G-X-S
              - subscript [ref=e225]: "47"
              - text: "-X-G), and Asp"
              - superscript [ref=e226]: "195"
              - text: of this depolymerase were essential for its activity in nPHA granule hydrolysis. Notably, phaZh1 and bdhA (encoding putative 3HB dehydrogenase) form a gene cluster (HFX_6463 to _6464) in H. mediterranei. The 3HB monomer generated from nPHA degradation by PhaZh1 could be further converted into acetoacetate by BdhA, indicating that PhaZh1-BdhA may constitute the first part of a PHA degradation pathway in vivo. Interestingly, although PhaZh1 showed efficient activity and was most likely the key enzyme in nPHA granule hydrolysis in vitro, the knockout of phaZh1 had no significant effect on the intracellular PHA mobilization, implying the existence of an alternative PHA mobilization pathway(s) that functions effectively within the cells of H. mediterranei. Therefore, identification of this patatin-like depolymerase of haloarchaea may provide a new strategy for producing the high-value-added chiral compound (R)-3HB and may also shed light on the PHA mobilization in haloarchaea.
          - generic [ref=e228]:
            - generic [ref=e229]:
              - heading "INTRODUCTION" [level=2] [ref=e230]
              - paragraph [ref=e231]:
                - text: Polyhydroxyalkanoate (PHA) is accumulated in the form of granules and serves as storage compound of carbon and energy in bacteria (
                - link "1" [ref=e232] [cursor=pointer]:
                  - /url: "#core-collateral-B1"
                - text: ) and archaea (
                - link "2" [ref=e233] [cursor=pointer]:
                  - /url: "#core-collateral-B2"
                - text: ) during growth in the presence of excess carbon sources. Several proteins, which are known as PHA granule-associated proteins (PGAPs), are embedded on or attached to the PHA granules. These include PHA synthases, phasins, regulatory proteins, and depolymerases (
                - link "3" [ref=e234] [cursor=pointer]:
                  - /url: "#core-collateral-B3"
                - text: ). A PHA-accumulating host may utilize the accumulated PHA for growth and survival under conditions of carbon starvation (
                - link "4" [ref=e235] [cursor=pointer]:
                  - /url: "#core-collateral-B4"
                - text: ). PHA depolymerase (PhaZ) is the key enzyme that functions in PHA mobilization.
              - paragraph [ref=e236]:
                - text: "In bacteria, PHA depolymerases are grouped into two classes: intracellular (catalyzing the degradation of endogenous PHA) (iPhaZ) and extracellular (catalyzing the degradation of exogenous PHA) (ePhaZ) PHA depolymerases ("
                - link "5" [ref=e237] [cursor=pointer]:
                  - /url: "#core-collateral-B5"
                - text: ). The extracellular PHA depolymerase degradation process is well known, but the mechanism underlying the metabolic pathway and regulation of PHA degradation in vivo remains poorly understood (
                - link "5" [ref=e238] [cursor=pointer]:
                  - /url: "#core-collateral-B5"
                - text: ). Native polyhydroxybutyrate (nPHB) is degraded by iPhaZs in vitro to 3-hydroxybutyrate (3HB) (
                - link "6" [ref=e239] [cursor=pointer]:
                  - /url: "#core-collateral-B6"
                - text: ","
                - link "7" [ref=e240] [cursor=pointer]:
                  - /url: "#core-collateral-B7"
                - text: ) or 3-hydroxybutyryl-coenzyme A (3HB-CoA) in the presence of CoA (
                - link "8" [ref=e241] [cursor=pointer]:
                  - /url: "#core-collateral-B8"
                - text: ","
                - link "9" [ref=e242] [cursor=pointer]:
                  - /url: "#core-collateral-B9"
                - text: ). The PHB degradation product, 3HB-CoA, is the precursor of PHB synthesis; hence, the simultaneous synthesis and mobilization of PHB (
                - link "10" [ref=e243] [cursor=pointer]:
                  - /url: "#core-collateral-B10"
                - text: ","
                - link "11" [ref=e244] [cursor=pointer]:
                  - /url: "#core-collateral-B11"
                - text: ) have been observed, which may be controlled by the [acetyl-CoA]/[CoA] and [NADH]/[NAD
                - superscript [ref=e245]: +
                - text: "] ratios ("
                - link "8" [ref=e246] [cursor=pointer]:
                  - /url: "#core-collateral-B8"
                - text: ). Notably, the PHA degradation process is not simply along the reverse pathway of PHA synthesis. Crotonyl-CoA and (S)-3HB-CoA (one stereoisomer of 3HB-CoA) were recently found to be involved in nPHB degradation, which indicated that PHB degradation is separate from PHB synthesis and is connected to the β-oxidation cycle in Ralstonia eutropha (
                - link "9" [ref=e247] [cursor=pointer]:
                  - /url: "#core-collateral-B9"
                - text: ).
              - paragraph [ref=e248]:
                - text: As far as we know, nine intracellular PHB depolymerases or PHB oligomer hydrolases have been detected in the bacterium R. eutropha H16 (
                - link "6" [ref=e249] [cursor=pointer]:
                  - /url: "#core-collateral-B6"
                - text: ), and these are classified as PhaZa, PhaZb, PhaZc, and PhaZd based on their degradation substrates, active sites, and molecular masses. PhaZa1 degrades nPHB to 3HB-CoA in the presence of CoA (
                - link "8" [ref=e250] [cursor=pointer]:
                  - /url: "#core-collateral-B8"
                - text: ","
                - link "9" [ref=e251] [cursor=pointer]:
                  - /url: "#core-collateral-B9"
                - text: ), whereas PhaZb and PhaZc mainly hydrolyze 3HB oligomer to 3HB (
                - link "12" [ref=e252] [cursor=pointer]:
                  - /url: "#core-collateral-B12"
                - text: ","
                - link "13" [ref=e253] [cursor=pointer]:
                  - /url: "#core-collateral-B13"
                - text: ). PhaZd degrades artificial PHB (aPHB) and nPHB granules and releases mainly 3HB oligomer with only a small amount of 3HB monomer (
                - link "6" [ref=e254] [cursor=pointer]:
                  - /url: "#core-collateral-B6"
                - text: ","
                - link "7" [ref=e255] [cursor=pointer]:
                  - /url: "#core-collateral-B7"
                - text: ). A genetic analysis showed the PHB depolymerase redundancy in R. eutropha H16. PhaZa1 is particularly important for PHB degradation (
                - link "14" [ref=e256] [cursor=pointer]:
                  - /url: "#core-collateral-B14"
                - text: ), while the deletion of phaZa2, phaZa3, phaZb, phaZc, phaZd1, or phaZd2 alone has no significant effect on PHB mobilization (
                - link "6" [ref=e257] [cursor=pointer]:
                  - /url: "#core-collateral-B6"
                - text: ","
                - link "7" [ref=e258] [cursor=pointer]:
                  - /url: "#core-collateral-B7"
                - text: ","
                - link "12" [ref=e259] [cursor=pointer]:
                  - /url: "#core-collateral-B12"
                - text: ","
                - link "13" [ref=e260] [cursor=pointer]:
                  - /url: "#core-collateral-B13"
                - text: ","
                - link "15" [ref=e261] [cursor=pointer]:
                  - /url: "#core-collateral-B15"
                - text: ).
              - paragraph [ref=e262]:
                - text: Due to its clear genetic background (
                - link "16" [ref=e263] [cursor=pointer]:
                  - /url: "#core-collateral-B16"
                - text: ) and the well-established genetic manipulation tools (
                - link "17" [ref=e264] [cursor=pointer]:
                  - /url: "#core-collateral-B17"
                - text: ), Haloferax mediterranei has been developed as an excellent model system for investigation of the PHA metabolism in haloarchaea. During growth in medium supplemented with glucose as the carbon source, H. mediterranei accumulates a considerable amount of poly(3-hydroxybutyrate-co-3-hydroxyvalerate) (PHBV) containing a high ratio (∼10 mol%) of 3-hydroxyvalerate (3HV) monomer (
                - link "18" [ref=e265] [cursor=pointer]:
                  - /url: "#core-collateral-B18"
                - text: ). The PHA synthase (PhaEC) (
                - link "18" [ref=e266] [cursor=pointer]:
                  - /url: "#core-collateral-B18"
                - text: ), acetoacetyl-CoA reductases (PhaB1 and PhaB2) (
                - link "19" [ref=e267] [cursor=pointer]:
                  - /url: "#core-collateral-B19"
                - text: ), and haloarchaeal-type β-ketothiolases (PhaA and BktB) (
                - link "20" [ref=e268] [cursor=pointer]:
                  - /url: "#core-collateral-B20"
                - text: ), which are indispensable for PHBV biosynthesis in H. mediterranei, have been identified. The PHA granule-associated phasin protein (PhaP) (
                - link "21" [ref=e269] [cursor=pointer]:
                  - /url: "#core-collateral-B21"
                - text: ) and regulatory protein (PhaR) (
                - link "22" [ref=e270] [cursor=pointer]:
                  - /url: "#core-collateral-B22"
                - text: ), which are important for PHA accumulation and granule formation, have also been characterized. However, the key enzymes of PHA degradation have not been identified yet for any haloarchaeal species.
              - paragraph [ref=e271]: In this study, we identified a novel PHA depolymerase (PhaZh1, a patatin-like protein) on the PHA granules in H. mediterranei. PhaZh1 (HFX_6464) had no similarity or identity to any known PHA depolymerase of bacteria. The function and enzyme activity of PhaZh1 were investigated through gene knockout and complementation, protein activity assays, and site-directed mutagenesis. We showed that the primary product of the native PHBV (nPHBV) granule hydrolysis by PhaZh1 was the 3HB monomer, which could be further converted into acetoacetate by BdhA (HFX_6463), a putative 3HB dehydrogenase in H. mediterranei. As PhaZh1 showed efficient activity in nPHA hydrolysis in vitro and the main products are hydroxyalkanoate monomers, it may provide a novel strategy for producing the chiral compound (R)-3HB from PHB accumulated by haloarchaea.
