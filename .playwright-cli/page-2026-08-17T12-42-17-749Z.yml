                        - text: (calculated with 10% of the total reflections) factors were converged to 19.0 and 22.1%, respectively, against data up to a 1.71 Å resolution. The current model consists of 318 residues (Thr21–Gln338), a bifurcated oligosaccharide chain (GlcNAc
