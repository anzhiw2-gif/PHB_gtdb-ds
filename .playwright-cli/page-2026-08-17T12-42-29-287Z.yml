                              - text: "3 was loaded. Lanes: 1, E. coli MPO12 before induction; 2, E. coli MPO12 (pPAZ6) before induction; 3, E. coli MPO12 after induction with 2 mM salicylate; 4, E. coli MPO12 (pPAZ6) after induction. Standard molecular weight markers, in kDa, are marked at the left."
                      - generic [ref=e634]:
                        - heading "Analysis of HAs released to the culture media" [level=3] [ref=e635]
                        - paragraph [ref=e636]:
                          - text: The chemical configuration of the HAs monomers released to the culture medium by P. putida KTZ1 was examined by chiral GC (
                          - link "Fig. 7" [ref=e637] [cursor=pointer]:
                            - /url: "#f7"
                          - text: ). Whereas the racemic standard (R,S)-3-hydroxyoctanoate methyl ester showed two chromatographic peaks (with the retention times of 23.8 and 24.2) corresponding to the two enantiomers (
                          - link "Fig. 7" [ref=e638] [cursor=pointer]:
                            - /url: "#f7"
                          - text: ), only one peak was detected for the samples of 3-hydroxyoctanoate methyl ester extracted from all culture media tested, indicating a high enantiomeric purity of these samples. In addition, by mixing the produced 3-hydroxyoctanoate methyl ester with the racemic standard, the area of the latter peak increased (data not shown), confirming the absolute (R)-configuration of all these samples. Therefore, the HAs produced in this work in a resting cell system or under PHA production conditions (
                          - link "Table 2" [ref=e639] [cursor=pointer]:
                            - /url: "#t2"
                          - text: ) have the same configuration.
                        - figure [ref=e641]:
                          - link [ref=e642] [cursor=pointer]:
                            - /url: /cms/asset/715cb0ae-1382-431a-9ff7-2dab6c505ccd/emi_2061_f7.gif
                            - img "Details are in the caption following the image" [ref=e644]
                          - generic [ref=e645]:
                            - generic [ref=e646]:
                              - strong [ref=e647]: Figure 7
                              - generic [ref=e648]:
                                - link "Open in figure viewer" [ref=e649] [cursor=pointer]:
                                  - /url: "#"
                                - link "PowerPoint" [ref=e650] [cursor=pointer]:
                                  - /url: /action/downloadFigures?id=f7&partId=&doi=10.1111%2Fj.1462-2920.2009.02061.x
                                  - generic [ref=e651]: 
                                  - text: PowerPoint
                            - paragraph [ref=e653]: Chirality of products released by PHA enzymatic hydrolysis. Chiral GC analysis of methyl esters of racemic mixtures of (A) (R,S)-3-OH octanoic acid and (B) (R)-3-OH octanoic acid identified in the P. putida KTZ1 supernatant after 24 h induction with benzoate 5 mM.
                        - paragraph [ref=e654]: The chemical composition of the released products by P. putida KTZ1 cultured under PHA production conditions was also examined by LC-MS to determine the presence of dimers, trimers or higher polymers of HAs in the medium. The chromatograms revealed the presence of three major peaks (Fig. S3), where peak 1 (m/z 131) corresponded to the molecular mass of the deprotonated 3-hydroxyhexanoic acid and peak 2 (m/z 159) to 3-hydroxyoctanoic acid. Ions corresponding to m/z 301 and m/z 603 found in peak 3 highlighted the presence of the deprotonated 3-hydroxyoctanoic dimer and the dimer adduct of 3-hydroxyoctanoic diester respectively. Dimers containing 3-hydroxyhexanoic acid and polymers with higher molecular weight were not found.
                    - generic [ref=e655]:
                      - heading "Discussion" [level=2] [ref=e656]
                      - paragraph [ref=e657]:
                        - text: Polyhydroxyalkanoate acts as sinks for carbon and reducing equivalents when other nutrient supplies are limited (
                        - link "Prieto et al., 2007" [ref=e658] [cursor=pointer]:
                          - /url: "#b3"
                        - text: ) and consequently, PHA degradation under stress conditions has been proposed as a mechanism that favours the establishment of PHA-producing bacteria in competitive environments, such as soil and rhizosphere (
                        - link "Madison and Huisman, 1999" [ref=e659] [cursor=pointer]:
                          - /url: "#b1"
                        - text: ;
                        - link "Ruiz et al., 2001" [ref=e660] [cursor=pointer]:
                          - /url: "#b25"
                        - text: ;
                        - link "Kadouri et al., 2005" [ref=e661] [cursor=pointer]:
                          - /url: "#b26"
                        - text: ). Under certain circumstances, free-living bacterial cells with a higher content of PHA may survive longer than those with a lower PHA content, either because they are less susceptible to adverse factors, or because they can utilize this reserve material longer and more efficiently (
                        - link "Dawes and Senior, 1973" [ref=e662] [cursor=pointer]:
                          - /url: "#b27"
                        - text: ;
                        - link "Matin et al., 1979" [ref=e663] [cursor=pointer]:
                          - /url: "#b28"
                        - text: ). In this work, we have analysed the impact of PHA metabolism on cell viability under laboratory conditions in terms of carbon source utilization in the mcl-PHA model producer P. putida KT2442 strain. We have demonstrated that the ability of metabolizing PHA appears to endow the producing cells with increased endurance under carbon starvation conditions that results in an increased viable cells number. In addition, the fundamental and exclusive role of PhaZ depolymerase in PHA mobilization has been definitively demonstrated, since a mutant strain lacking the phaZ gene was not able to degrade the intracellular polymer.
                      - paragraph [ref=e664]:
                        - text: Increased survival and respiration under starvation conditions were previously detected in PHB producer strains such as Azospirillum brasilense (
                        - link "Tal and Okon, 1985" [ref=e665] [cursor=pointer]:
                          - /url: "#b29"
                        - text: ). Furthermore, A. brasilense mutants defective in their capability to produce PHA (phaC
                        - superscript [ref=e666]: "-"
                        - text: mutant) (
                        - link "Kadouri et al., 2002" [ref=e667] [cursor=pointer]:
                          - /url: "#b30"
                        - text: ) or to degrade PHA (phaZ
                        - superscript [ref=e668]: "-"
                        - text: mutant) (
                        - link "Kadouri et al., 2003" [ref=e669] [cursor=pointer]:
                          - /url: "#b31"
                        - text: ) survived shorter than the wild-type strain. Pseudomonas putida GPo1 containing PHA survived starvation better than its cognate PHA depolymerase mutant when cells were incubated under starvation conditions in natural environments, or under conditions mimicking natural settings (
                        - link "Ruiz et al., 2001" [ref=e670] [cursor=pointer]:
                          - /url: "#b25"
                        - text: ). Nevertheless, the mechanisms by which the PHA metabolism favours stress alleviation in P. putida GPo1 are not yet fully understood, but enhanced cross-tolerance to different stress agents during PHA depolymerization has also been correlated to an increase in the concentration of RpoS, suggesting a link between PHA depolymerization and the stress tolerance (
                        - link "Ruiz et al., 2004" [ref=e671] [cursor=pointer]:
                          - /url: "#b32"
                        - text: ). Our results demonstrated that P. putida can support cell multiplication in the absence of an exogenous carbon source by mobilizing PHA, as previously demonstrated in the PHB producer R. eutropha H16 (
                        - link "Handrick et al., 2000" [ref=e672] [cursor=pointer]:
                          - /url: "#b33"
                        - text: ), and that this ability is strictly dependent on the existence of an active PhaZ depolymerase. However, under laboratory conditions growing in defined media, we have not detected survival differences among the P. putida KT2442 wild-type strain and PHA-metabolic defective mutants. Generally speaking, it could be presumed that bacteria control the number of community members as function of carbon/inorganic nutrient ratio. Since the lack of a fully functional PHA metabolic system avoids the ability to adapt the number of viable cells to extra source of inorganic nutrients like nitrogen (
                        - link "Fig. 3" [ref=e673] [cursor=pointer]:
                          - /url: "#f3"
                        - text: ), this work demonstrates that the presence of the PHA synthase/depolymerase system allows P. putida KT2442 to adapt the carbon flux of HAs to cellular demand. In this sense, the PHA-free biomasses of P. putida KT2442 and KT42C1 strains were similar [22.1% and 25.7% (g biomass per g octanoate) respectively], but the rate of conversion of octanoate to biomass differed considerably when PHA contents were considered [22.2% and 74.0% (g biomass per g octanoate), for P. putida KT42C1 and KT2442 strains respectively]. Consequently, the increased production of metabolic intermediates in the PhaC1 mutant strain needs further investigations.
                      - paragraph [ref=e674]:
                        - text: "A simple view of PHA metabolism has been frequently resumed: bacteria facing carbon excess and nutrient limitation store the extra carbon substrate as PHA via PHA polymerase (PhaC). Under carbon starvation conditions, PHA depolymerase (PhaZ) degrades PHA and releases 3-hydroxycarboxylic acid monomers, which after activation to HA-CoAs, can be oxidized by the β-oxidation pathway ("
                        - link "Fig. 1" [ref=e675] [cursor=pointer]:
                          - /url: "#f1"
                        - text: ). However, a simultaneous cyclic mechanism for the biosynthesis and degradation of PHA in bacteria were early proposed in the PHB producers Azotobacter beijerinckii (
                        - link "Senior and Dawes, 1973" [ref=e676] [cursor=pointer]:
                          - /url: "#b34"
                        - text: ) and R. eutropha (
                        - link "Doi et al., 1990" [ref=e677] [cursor=pointer]:
                          - /url: "#b19"
                        - text: ;
                        - link "Taidi et al., 1995" [ref=e678] [cursor=pointer]:
                          - /url: "#b35"
                        - text: ). In the latter strain 3-hydroxybutyryl-CoAs are released by PhaZa1 depolymerase (
                        - link "Kobayashi and Saito, 2003" [ref=e679] [cursor=pointer]:
                          - /url: "#b36"
                        - text: ;
                        - link "Uchino et al., 2007" [ref=e680] [cursor=pointer]:
                          - /url: "#b14"
                        - text: ) in contrast with the HAs released by PhaZ
                        - subscript [ref=e681]: KT
                        - text: enzyme (
                        - link "de Eugenio et al., 2007" [ref=e682] [cursor=pointer]:
                          - /url: "#b7"
                        - text: ). In these strains, the turnover can be explained by considering the PHA metabolism as a buffer of carbon and reducing power.
                      - paragraph [ref=e683]:
                        - text: In this work we have finally demonstrated that PHA metabolism in P. putida KT2442 is an ongoing cycle where synthesis and degradation of the polyesters are simultaneously active to facilitate the turnover of the polymer, and the crucial role played by PhaZ
                        - subscript [ref=e684]: KT
                        - text: depolymerase (
                        - link "Fig. 5" [ref=e685] [cursor=pointer]:
                          - /url: "#f5"
                        - text: ). Taking into account the recent finding of an acyl-CoA synthetase (ACS1) associated with the PHA granules (
                        - link "Ruth et al., 2008" [ref=e686] [cursor=pointer]:
                          - /url: "#b11"
                        - text: ), the current model for the PHA metabolism in P. putida supports a coordinated activity of polymerase, depolymerase and acyl-CoA synthetase. Cells facing carbon excess and nutrient limitation directed the PHA metabolism to store the extra carbon in the form of insoluble polyesters by PHA synthase. Under carbon starvation, PHA metabolism is unbalanced to the hydrolysis pathway, and R-HAs monomers are excised from the polymer by the action of the PhaZ depolymerase. The released monomers are then activated to HA-CoAs by a granule associated acyl-CoA synthetase via an ATP-dependent reaction (
                        - link "Ruth et al., 2008" [ref=e687] [cursor=pointer]:
                          - /url: "#b11"
                        - text: ). These metabolites are substrates for both PHA synthase and fatty acid β-oxidation cycle and thus, depending on the metabolic state of the cell, the HA-CoAs will be either incorporated into nascent PHA polymer chains by the PHA synthase, or oxidized by the β-oxidation pathway to generate energy (
                        - link "Fig. 1" [ref=e688] [cursor=pointer]:
                          - /url: "#f1"
                        - text: ). These results were in agreement with our previous findings, which demonstrated that the PhaZ
                        - subscript [ref=e689]: KT
                        - text: depolymerase was produced under both PHA production and PHA mobilization growth conditions (
                        - link "de Eugenio et al., 2007" [ref=e690] [cursor=pointer]:
                          - /url: "#b7"
                        - text: ).
                      - paragraph [ref=e691]:
                        - text: On the other hand, PHA has been proposed as potential source of R-HAs (
                        - link "Ren et al., 2005" [ref=e692] [cursor=pointer]:
                          - /url: "#b17"
                        - text: ;
                        - link "Ruth et al., 2007" [ref=e693] [cursor=pointer]:
                          - /url: "#b37"
                        - text: ). Actually, HA monomers as well as oligomers are important building blocks for biotechnological applications (
                        - link "Ren et al., 2005" [ref=e694] [cursor=pointer]:
                          - /url: "#b17"
                        - text: ;
                        - link "Sandoval et al., 2005" [ref=e695] [cursor=pointer]:
                          - /url: "#b38"
                        - text: ;
                        - link "Schreck and Hillmyer, 2007" [ref=e696] [cursor=pointer]:
                          - /url: "#b39"
                        - text: ). The first enzymatic-based strategy developed for the production of R-HA monomers from mcl-PHA was described in P. putida GPo1 (
                        - link "Ren et al., 2005" [ref=e697] [cursor=pointer]:
                          - /url: "#b17"
                        - text: ;
                        - link "Ruth et al., 2007" [ref=e698] [cursor=pointer]:
                          - /url: "#b37"
                        - text: ;
                        - link "Wang et al., 2007" [ref=e699] [cursor=pointer]:
                          - /url: "#b18"
                        - text: ). In this approach, cells were first grown under double (carbon and nitrogen) nutrient limitation conditions in order to induce a high PHA accumulation in a continuous culture and, afterwards, re-suspended in phosphate buffer adjusted to basic environments (pH 10) as a resting cells system. These authors obtained a release of 1.05 mg ml
                        - superscript [ref=e700]: −1
                        - text: of HAs, in agreement with the results obtained in this work (
                        - link "Ruth et al., 2007" [ref=e701] [cursor=pointer]:
                          - /url: "#b37"
                        - text: ).
                        - link "Figure 4" [ref=e702] [cursor=pointer]:
                          - /url: "#f4"
                        - text: shows that the unique enzyme responsible for the hydrolysis of the polymer in P. putida KT2442 under alkaline conditions is PhaZ
                        - subscript [ref=e703]: KT
                        - text: ", and demonstrated that, similarly to P. putida GPo1, it secretes HAs monomers to the medium as a consequence of a massive PHA hydrolysis. The yield in the resting cell-production systems will be always conditioned by the PHA accumulation ability of the target strain. However, growing cell strategies for the production of enantiomeric pure HAs imply a massive PHA mobilizing system that hydrolyses PHA simultaneously to its synthesis. In this sense, different growing cell strategies have been proposed in Pseudomonads for the production of HAs ("
                        - link "Sandoval et al., 2005" [ref=e704] [cursor=pointer]:
                          - /url: "#b38"
                        - text: ;
                        - link "Yuan et al., 2008" [ref=e705] [cursor=pointer]:
                          - /url: "#b40"
                        - text: ). It has been demonstrated that overexpression of the phaZ gene in a PHA overproducer mutant of P. putida U allowed the bioconversion of different n-phenylalkanoic acids into a racemic mixture of the corresponding 3-hydroxyderivatives that were secreted into the culture medium with a yield of 1.92 mg ml
                        - superscript [ref=e706]: −1
                        - text: of HAs (
                        - link "Sandoval et al., 2005" [ref=e707] [cursor=pointer]:
                          - /url: "#b38"
                        - text: ). However, the released (R)-enantiomers were immediately epimerized to the (S)-isomers as a consequence of the genetic background of that strain, which is defective for the β-oxidation cycle (
                        - link "Sandoval et al., 2005" [ref=e708] [cursor=pointer]:
                          - /url: "#b38"
                        - text: ). Recently, it has been published that the production of the PhaZ of Pseudomonas stutzeri in P. putida KT2442, together with a putative long-chain fatty acid transport protein of P. putida and an acyl-CoA synthetase of E. coli, improved the release of HAs to 2.32 mg ml
                        - superscript [ref=e709]: −1
                        - text: of HAs when the cells were cultured in shake flasks (
                        - link "Yuan et al., 2008" [ref=e710] [cursor=pointer]:
                          - /url: "#b40"
                        - text: ). In this case, the chirality of the released HAs was also not determined. Therefore, our results constitute the first example of a biotechnology system able to produce pure R-mcl-HAs monomer by using growing cells. To direct the PHA balance to PHA hydrolysis, we have applied a tight inducible system cascade control circuit integrated into the chromosome which allows culturing the recombinant cells in the absence of antibiotics (
                        - link "de Lorenzo et al., 1993" [ref=e711] [cursor=pointer]:
                          - /url: "#b20"
                        - text: ;
                        - link "Cebolla et al., 2001" [ref=e712] [cursor=pointer]:
                          - /url: "#b22"
                        - text: ). Taking into account the great advantages of our novel in vivo strategy, we believe that it will pave the way for implementing a large-scale bioproduction of R-mcl-HAs monomers.
