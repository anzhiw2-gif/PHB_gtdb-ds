        - generic [ref=e117]:
          - region [ref=e118]:
            - generic [ref=e119]:
              - heading "Abstract" [level=2] [ref=e120]
              - paragraph [ref=e122]: Like many other prokaryotes, rhizobacteria of the genus Azospirillum produce high levels of poly-β-hydroxybutyrate (PHB) under sub-optimal growth conditions. Utilization of PHB by bacteria under stress has been proposed as a mechanism that favors their compatible establishment in competitive environments. PHB depolymerase (PhaZ) is an essential enzyme in PHB degradation. The phaZ gene was identified in Azospirillum brasilense, cloned, sequenced, and shown to be located on the chromosome. Insertion of a kanamycin-resistant cassette within phaZ of A. brasilense resulted in a phaZ mutant that was unable to degrade PHB; however, carbon source utilization was similar in both the wild-type and the mutant strain. The ability of the wild-type to endure starvation conditions, ultraviolet irradiation, heat, and osmotic shock, and to grow in the presence of hydrogen peroxide was higher than that of the mutant strain. By contrast, the ability of the phaZ mutant strain to endure desiccation was higher than that of the wild-type strain. No differences between the strains were seen in their ability to endure sonication, or to survive in carrier materials used for soil inoculants. In addition, motility was the same between the two strains, whereas cell aggregation and exopolysaccharide production were higher in the wild-type than in the phaZ mutant strain.
