              - generic [ref=f1e353]:
                - heading "3. Degradation of bioplastics" [level=2] [ref=f1e354]
                - generic [ref=f1e355]:
                  - heading "3.1. Biodegradable plastics" [level=3] [ref=f1e356]
                  - generic [ref=f1e357]:
                    - text: Different polymer degradation pathways, such as photodegradation, thermo-oxidative degradation and biodegradation, are well discussed in the literature (
                    - link "Amass et al., 1998" [ref=f1e358] [cursor=pointer]:
                      - /url: "#b0020"
                    - text: ","
                    - link "Hawkins, 1984" [ref=f1e360] [cursor=pointer]:
                      - /url: "#b0080"
                    - text: ","
                    - link "Shah et al., 2008" [ref=f1e362] [cursor=pointer]:
                      - /url: "#b0220"
                    - text: ). During biodegradation, the organic substances are broken down by means of microorganisms. Several biodegradability tests exist. The so called “screening tests” are performed in enzymatic or aquatic conditions, and the latter can be anaerobic or aerobic. The “real-life tests” distinguish composting, soil burial and field testing (
                    - link "Itävaara and Vikman, 1996" [ref=f1e364] [cursor=pointer]:
                      - /url: "#b0105"
                    - text: ","
                    - link "Lucas et al., 2008" [ref=f1e366] [cursor=pointer]:
                      - /url: "#b0140"
                    - text: ). However, in many cases, the biodegradability of a bioplastic is highly dependent on the properties of the plastic (
                    - link "Tokiwa et al., 2009" [ref=f1e368] [cursor=pointer]:
                      - /url: "#b0295"
                    - text: ) because both the chemical and physical properties of plastics affect biodegradation. These properties are the surface characteristics (hydrophobic or hydrophilic, surface area), the first-order structures (molecular weight, molecular weight distribution, chemical structure) and the higher order structures (crystallinity, crystal structure, modulus of elasticity, glass transition temperature, melting temperature) of polymers. (
                    - link "Tokiwa et al., 2009" [ref=f1e370] [cursor=pointer]:
                      - /url: "#b0295"
                    - text: ).
                  - generic [ref=f1e372]:
                    - generic [ref=f1e373]:
                      - text: Biopolymers are long-chain molecules, and in order to mineralize the biopolymers (converting organic matter to minerals or plant available compounds), an important, often abiotic chain scission has to occur prior to biodegradation (
                      - link "Fig. 2" [ref=f1e374] [cursor=pointer]:
                        - /url: "#f0010"
                      - text: ). During that process, the long polymeric chains are broken down due to the effects of temperature, water and sunlight (i.e., photodegradation) to shorter oligomers, dimers or monomers. These shorter units are small enough to pass through the cell walls of microorganisms and be used as substrates for their biochemical processes and thus can be degraded (
                      - link "Shah et al., 2008" [ref=f1e376] [cursor=pointer]:
                        - /url: "#b0220"
                      - text: ) by microbial enzymes (
                      - link "Fig. 2" [ref=f1e378] [cursor=pointer]:
                        - /url: "#f0010"
                      - text: "). Two main types of enzymes are involved in microbial depolymerization processes: extracellular and intracellular depolymerases ("
                      - link "Shah et al., 2008" [ref=f1e380] [cursor=pointer]:
                        - /url: "#b0220"
                      - text: ). As the term suggests, extracellular enzymes act outside the cells in order to break the longer units down into shorter molecules, preparing them for further degradation by intracellular enzymes. As biodegradation can occur in two ways, aerobically and anaerobically, it offers two types of biological waste treatment. While the aerobic degradation of biopolymers has been studied in detail with extended reviews written (
                      - link "Briassoulis et al., 2010" [ref=f1e382] [cursor=pointer]:
                        - /url: "#b0035"
                      - text: ","
                      - link "Calmon-Decriaud et al., 1998" [ref=f1e384] [cursor=pointer]:
                        - /url: "#b0045"
                      - text: ","
                      - link "Grima et al., 2000" [ref=f1e386] [cursor=pointer]:
                        - /url: "#b0070"
                      - text: ","
                      - link "Kale et al., 2007" [ref=f1e388] [cursor=pointer]:
                        - /url: "#b0110"
                      - text: ","
                      - link "Meeks et al., 2015" [ref=f1e390] [cursor=pointer]:
                        - /url: "#b0160"
                      - text: ), the research on anaerobic degradation of biopolymers is still in its infancy. This review, therefore, aims to survey the anaerobic digestion of bioplastics. According to the ISO 17088:2012 standards, a plastic can be considered biodegradable if a significant change in the chemical structure, i.e., degradation, occurs in the exposed material resulting in carbon dioxide, water, inorganic compounds, and biomass (new microbial cell constituents) but no visible or toxic residues (
                      - link "Standardization, 2012" [ref=f1e392] [cursor=pointer]:
                        - /url: "#b0270"
                      - text: ) under composting conditions. The CEN standard, EN 13432:2000 (
                      - link "Standardization, 2000" [ref=f1e394] [cursor=pointer]:
                        - /url: "#b0265"
                      - text: ), for biodegradable polymeric materials also requires that a substance is 90% converted to carbon dioxide within six months as a condition for composting in the presence of oxygen. For anaerobic degradation, it specifies a minimum of 50% conversion of the substance to biogas based on the theoretical value in a maximum of two months’ time (
                      - link "Standardization, 2000" [ref=f1e396] [cursor=pointer]:
                        - /url: "#b0265"
                      - text: ).
