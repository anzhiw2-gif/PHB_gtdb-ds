                    - /url: "#core-collateral-B33"
                  - text: ) using sodium 3-hydroxybutyrate (Sigma) as the standard. We found that the 3HB monomer (the typical retention time was 13.7 min) but not a mixture of the 3HB monomer and dimer (
                  - link "6" [ref=e597] [cursor=pointer]:
