                    - text: ","
                    - link "30" [ref=f1e405] [cursor=pointer]:
                      - /url: "#bib0340"
                    - text: ", and PHA monomers"
                    - link "31" [ref=f1e407] [cursor=pointer]:
                      - /url: "#bib0345"
                    - text: ","
                    - link "32" [ref=f1e409] [cursor=pointer]:
                      - /url: "#bib0350"
                    - text: ","
                    - link "33" [ref=f1e411] [cursor=pointer]:
                      - /url: "#bib0355"
                    - text: ","
                    - link "34" [ref=f1e413] [cursor=pointer]:
                      - /url: "#bib0360"
                    - text: . PHA accumulation levels can also be adjusted in
                    - emphasis [ref=f1e415]: P. putida
                    - link "[35]" [ref=f1e416] [cursor=pointer]:
                      - /url: "#bib0365"
                    - text: . Engineered
                    - emphasis [ref=f1e418]: P. putida
                    - text: is also capable of producing PHAs containing 5-hydroxyhexanoic acid, 4-hydroxyheptanoic acid, and 4-hydroxyoctanoic acid as PHA constituents
                    - link "[36]" [ref=f1e419] [cursor=pointer]:
                      - /url: "#bib0370"
                    - text: . If PHA molecular weight diversity is needed, there are several ways to achieve this, including methanol-induced PHA chain termination
                    - link "[37]" [ref=f1e421] [cursor=pointer]:
                      - /url: "#bib0375"
                    - text: ", mutations in the N-terminus of PHA synthase"
                    - link "[38]" [ref=f1e423] [cursor=pointer]:
                      - /url: "#bib0380"
                    - text: ", or the addition of polyethylene glycol (PEG) to microbial cultures"
                    - link "39" [ref=f1e425] [cursor=pointer]:
                      - /url: "#bib0385"
                    - text: ","
                    - link "40" [ref=f1e427] [cursor=pointer]:
                      - /url: "#bib0390"
                    - text: ", among others."
                  - generic [ref=f1e429]:
                    - text: In addition, a single PHA-accumulating bacterial cell synthesizes PHAs with a large range of molecular weights at any given time, whereas standard methods only determine the average molecular weight
                    - link "[38]" [ref=f1e430] [cursor=pointer]:
                      - /url: "#bib0380"
                    - text: . This diversity might also be called a molecular weight ‘-ome’. Furthermore, if the cell produces a random copolymer, such as PHBV consisting of 3-hydroxybutyrate (HB) or 3-hydroxyvalerate (HV), it is indeed a ‘PHBVome’ containing various ratios of HB/HV at a particular timepoint, which can also change dynamically during growth in the same way a cellular transcriptome can. These phenomena are thus indeed similar to the definitions of genome, transcriptome, or proteome.
                  - generic [ref=f1e432]: With the above concept, we can further define PHAomics as the study of diverse PHAs in a single bacterium. The difference between the PHAome and the genome, transcriptome, or proteome is that PHAome is not produced by the single bacterium (cell) at one particular growth timepoint; instead, PHAomes containing diverse PHAs can be formed by the bacterium under diverse growth conditions, even though diverse PHA molecular weights or monomer ratios can be formed in a single bacterium (cell) at a defined timepoint under the same conditions.
                - generic [ref=f1e433]:
                  - heading "The PHAome and Its Possible Uses" [level=2] [ref=f1e434]
                  - generic [ref=f1e435]: The concept of the PHAome considers PHAs as an important class of biopolymers, similar to DNA, RNA, and proteins, that consist of diverse monomers arranged in various combinations. As stated above and similar to other ‘-omes’, at a specific timepoint, PHAs are a mixture consisting of polymers with various molecular weights, various ratios of two or more monomers, and various block lengths if the PHAs are block copolymers. This helps to explain why there are always PHA property variations even if the two PHAs have the same monomer ratios, compositions, and molecular weights.
                  - generic [ref=f1e436]:
                    - text: PHAome can have different levels of diversity including macro-diversity and micro-diversity. Macro-diversity consists of various monomer arrangements such as homo-, random, block polymers, functional polymers, and graft polymers, as well as their various combinations that are represented as average monomer ratios, as can be determined extracellularly using physical instruments (
                    - link "Figure 1" [ref=f1e437] [cursor=pointer]:
                      - /url: "#fig0005"
                    - text: ). On the other hand, micro-diversity reflects the intracellular diversity of PHAs in terms of polymer chain lengths and monomer ratios that dynamically change during different microbial growth periods (
                    - link "Figure 1" [ref=f1e439] [cursor=pointer]:
                      - /url: "#fig0005"
                    - text: ). Understanding the PHAome could help in developing technology to obtain PHAs with more constant molecular structures and molecular weights, thus maintaining the consistency of the PHA properties. This is very important for industrial developments.
                  - generic [ref=f1e441]:
                    - text: It is desirable to develop a platform bacterium that is able to produce defined PHA structures and constant molecular weights from the PHAome. This can begin with a diverse substrate utilizer such as
                    - emphasis [ref=f1e442]: Pseudomonas
                    - text: spp.
                    - link "[6]" [ref=f1e443] [cursor=pointer]:
                      - /url: "#bib0230"
                    - text: . The
                    - emphasis [ref=f1e445]: Pseudomonas
                    - text: strain can be engineered to synthesize scl and mcl PHA copolymers by replacing its native mcl PHA synthase with a low-specificity PHA synthase (such as PhaC
                    - subscript [ref=f1e446]: "1317"
                    - text: from
                    - emphasis [ref=f1e447]: Pseudomonas stutzeri
                    - text: 1317 reported previously)
                    - link "15" [ref=f1e448] [cursor=pointer]:
                      - /url: "#bib0270"
                    - text: ","
                    - link "38" [ref=f1e450] [cursor=pointer]:
                      - /url: "#bib0380"
                    - text: . The PHA synthase can be mutated at its N-terminus to synthesize polymers with more or less polydispersity
                    - link "[38]" [ref=f1e452] [cursor=pointer]:
                      - /url: "#bib0380"
                    - text: . The weakening of β-oxidation in the strain allows precise control over PHA structure
                    - link "[8]" [ref=f1e454] [cursor=pointer]:
                      - /url: "#bib0240"
                    - text: . Ultimately, an ideal PHA production strain should be able to produce all possible PHAs (the PHAome) that are less polydisperse and have constant molecular weights under conditions for the formation of the target PHAs
                    - link "[6]" [ref=f1e456] [cursor=pointer]:
                      - /url: "#bib0230"
                    - text: .
                  - generic [ref=f1e458]: The advantage of thinking of PHAs as a ‘PHAome’ is to better understand that PHAs are a mixture of various polymers, with diverse molecular weights and diverse monomer arrangements and ratios, while the current thinking of PHAs tends to ignore that a given PHA is a mixture (-ome). The PHAome concept will help to solve the bottleneck of property inconsistency through the various engineering approaches mentioned above.
                - generic [ref=f1e459]:
                  - heading "Concluding Remarks and Future Perspectives" [level=2] [ref=f1e460]
                  - generic [ref=f1e461]:
                    - text: Unlike DNA and RNA, that contain only four monomers, PHAs were already reported to have at least 90 different monomers more than 20 years ago
                    - link "3" [ref=f1e462] [cursor=pointer]:
                      - /url: "#bib0215"
                    - text: ","
                    - link "5" [ref=f1e464] [cursor=pointer]:
                      - /url: "#bib0225"
                    - text: . This is also a significantly greater number than for protein monomers that are generally the 20 amino acids. This indicates that the PHAome could have a wider monomer diversity than the genome, transcriptome, or proteome.
                  - generic [ref=f1e466]: This vast diversity constituting the ‘PHAome’ is awaiting exploitation. Except for very few PHAs that are commercially available for application developments, such as PHB, PHBV, P3HB4HB, and PHBHHx, all other PHAs have been produced by individual laboratories across the world in very small amounts out of academic curiosity. Similar to the concerns voiced by the MGI, moving advanced materials such as PHAs from the laboratory to the marketplace to address crucial challenges in environment, energy, transportation, healthcare, and other areas of application takes far too long, and at too high a cost. How to accelerate the pace of discovery and deployment of advanced PHA materials has been a central question for all researchers and stakeholders in this field. All these depend on the availability of the diverse PHAs in sufficient quantities and with consistent properties for studying their thermal and mechanical properties as well as to develop their potential in other applications.
                  - generic [ref=f1e467]: It should be a global effort to establish platforms to supply diverse PHAs based on PHAome information in sufficient quantities and property consistency for their exploitation in diverse applications. The PHAome concept should allow us to construct a suitable bacterial platform that is able to provide consistent PHA molecular structures with less molecular weight variability to ensure constant material properties. This is very important for commercial developments
                  - generic [ref=f1e468]:
                    - text: It is believed that, 5 or 10 years from now, more PHA materials based on designs will be available from the PHAome, and these materials will best be produced by a single bacterial platform such as engineered
                    - emphasis [ref=f1e469]: Pseudomonas
                    - text: or
                    - emphasis [ref=f1e470]: Halomonas
                    - text: that can utilize diverse substrates. The platform bacterium should be constructed for more uniform monomer ratios with less molecular weight polydispersity to simplify and make predictable the ‘PHAome’, similar to the efforts made to produce a minimal bacterial chassis genome, allowing applications to be developed based on consistent PHA properties (see Outstanding Questions).
                    - region [ref=f1e472]:
                      - text: Outstanding Questions
                      - list [ref=f1e475]:
                        - listitem [ref=f1e476]:
                          - generic [ref=f1e477]: (i)
                          - generic [ref=f1e478]:
                            - generic [ref=f1e479]: How to construct a platform microorganism able to produce diverse PHAs, as described in PHAome, with desirable structures?
                            - generic [ref=f1e480]: At present, PHA diversity is produced by various bacteria under diverse conditions including supplementation with structure-related precursors, metabolic engineering, synthetic pathways, and modified growth conditions. It is now time to select a platform microorganism capable of producing the diverse PHAs in the PHAome using a simple substrate such as glucose under similar and induced conditions. This is both an opportunity and a challenge.
                            - generic [ref=f1e481]: The selection of a low-cost platform microorganism capable of producing the PHAome at low cost – is this possible?
                        - listitem [ref=f1e482]:
                          - generic [ref=f1e483]: (ii)
                          - generic [ref=f1e485]:
                            - text: PHAs with unnatural structures are usually produced in low yields and very low contents, predominantly in
                            - emphasis [ref=f1e486]: Pseudomonas
                            - text: spp. However,
                            - emphasis [ref=f1e487]: Pseudomonas
                            - text: spp. are difficult to grow to high cell density with high PHA content, leading to high cost of PHA. It is thus important to have a PHA production platform that is not only able to synthesize diverse PHA but can also grow to high cell density with high PHA content per cell dry weight. The ideal platform would be
                            - emphasis [ref=f1e488]: Halomonas
                            - text: spp. able to grow under open and continuous conditions to high cell density. This would significantly reduce the cost of PHA production. The major challenge for the
                            - emphasis [ref=f1e489]: Halomonas
                            - text: platform is the development of diverse and reliable molecular engineering tools for various engineering manipulations of the bacteria.
                        - listitem [ref=f1e490]:
                          - generic [ref=f1e491]: (iii)
                          - generic [ref=f1e492]:
                            - generic [ref=f1e493]: The supply of large amounts of low-cost PHAome materials for application development – an engineering challenge!
                            - generic [ref=f1e494]: Upon obtaining a platform microorganism able to grow to high cell density with high PHA content per cell dry weight. It is time to scale up laboratory-scale processes to the semi-industrial level so that sufficient PHA materials will be available for application development. This will requires trial and errors experiments lasting months to years until a reproducible high cell density process is successfully developed for the production of PHAome materials.
