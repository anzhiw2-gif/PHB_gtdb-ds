                                  - /url: /action/downloadFigures?id=emi15409-fig-0003&partId=&doi=10.1111%2F1462-2920.15409
                                  - generic [ref=e742]: 
                                  - text: PowerPoint
                            - generic [ref=e743]:
                              - text: The predicted phylogenetic distribution of MAGs encoding predicted PHA depolymerases. A concatenated rp tree inferred using FastTree shows the placement of 98 high-quality, dereplicated MAGs encoding predicted PHA depolymerases placed among reference sequences selected from the bacterial domain. Tree has been rooted between the Proteobacteria and the other phyla to enhance readability. Tree scale bar indicates number of substitutions per site. The coloured ring labelled ‘PHA-encoding MAGs’ is coloured to indicate the phylum-level classification for each MAG as predicted by GTDB-tk. Above this, the ‘References’ coloured ring indicates the phylum-level classification of the bacterial reference sequences. The outer ring bar plot shows the number of PHA depolymerases predicted in each MAG. The type(s) of predicted PHA depolymerase(s) (mcl, sclT1, or sclT2) found in that MAG are indicated with coloured squares on the innermost rings. [Color figure can be viewed at
                              - link "wileyonlinelibrary.com" [ref=e744] [cursor=pointer]:
                                - /url: http://wileyonlinelibrary.com
                              - text: "]"
                        - paragraph [ref=e745]: "(i) Proteobacteria: The vast majority of PHA depolymerases were predicted in dereplicated MAGs classified as Alphaproteobacteria (14/110) and Gammaproteobacteria (63/110). From the Alphaproteobacteria we identified MAGs from 10 families including the Hyphomicrobiaceae (three MAGs) and the Sphingomonadaceae (four MAGs). From the Gammaproteobacteria we identified MAGs from 15 families with most from the Burkholderiaceae (31 MAGs), the Rhodocyclaceae (10 MAGs) and the Alteromonadaceae (five MAGs).Within the Proteobacteria, all three ePHA depolymerase types were detected (mcl = 4; sclT1 = 83; sclT2 = 45)."
                        - paragraph [ref=e746]: "(ii) Bacteroidota: Beyond the Proteobacteria, 11 MAGs from the Bacteroidota encoded one (nine MAGs) or two (two MAGs) predicted ePHAsclT1 depolymerases from seven families. A 2-12-FULL-35-15 and a GWF2-33-38 MAG each encoded two predicted ePHAsclT1 enzymes that shared high sequence similarity. Bacteroidota with one predicted PHAsclT1 depolymerase included members of the b-17BO (1), GWA2-32-17 (1), GWF2-33-38 (3), GWF2-35-48 (2), Saprospiraceae (1) and UBA2798 (1)."
                        - paragraph [ref=e747]: "(iii) Myxococcota: Seven Myxococcota (formally the deltaproteobacteria) encoded predicted PHA depolymerases. Three PHAmcl depolymerases were predicted from two SG8-38 MAGs and a Polyangiaceae. A PHAsclT1 depolymerase was predicted from a Haliangiaceae, Nannocystaceae, SG8-38 and three from a Polyangiaceae MAG."
                        - paragraph [ref=e748]: "(iv) Actinobacteriota: Five Actinobacteriota MAGs from the Cellulomonadaceae, Pseudonocardiaceae and QHCA01 were predicted to encode ePHAsclT1 depolymerase(s). Three were Pseudonocardiaceae, two of which were predicted to encode two ePHAsclT1 depolymerase."
                        - paragraph [ref=e749]: "(v) Firmicutes: Two Clostridia (Firmicutes A) both from the Ruminococcaceae family sequenced from an anaerobic bioreactor were predicted to have a PHAmcl depolymerase. One UBA5603 (Firmicutes) was predicted to encode a PHAsclT1 depolymerase."
                        - paragraph [ref=e750]:
                          - text: "(vi) Others: Three Bacteriovoracales from the Bdellovibrionota encoded one (one MAG) or two (two MAGs) predicted PHAsclT1 depolymerases. A Spirochaetota from freshwater encoded three predicted PHAsclT1 depolymerases, a Desulfobacterota, a Planctomycetota and a Methylomirabilota (formally the Candidate phylum Rokubacteria) all encoded one. For a detailed overview of the PHA depolymerase complement predicted for each MAG and taxonomic affiliations, see Supp."
                          - link "Data 3" [ref=e751] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: .
                        - generic [ref=e752]:
                          - heading "MAGs encoding multiple predicted PHA depolymerases" [level=4] [ref=e753]
                          - paragraph [ref=e754]:
                            - text: Of the 110 dereplicated MAGs with predicted PHA depolymerases, 68 were predicted to encode one PHA depolymerase, 25 were predicted to encode two, 16 were predicted to encode three and one, a Herminiimonas species (98.48% complete, 4.69% redundant) from the Burkholderiaceae family, was predicted to encode nine PHA depolymerases (Supp.
                            - link "Data 3" [ref=e755] [cursor=pointer]:
                              - /url: "#support-information-section"
                            - text: ). The Herminiimonas MAG was predicted to have two closely related ePHAsclT1, four ePHAsclT2 and three closely related ePHAmcl depolymerases. MAGs from the Burkholderiaceae (6), Rhodocyclaceae (6) and Halomonadaceae (1) from the Proteobacteria all encoded three predicted PHAscl enzymes each encoding both T1 and T2 enzyme(s). One unclassified Proteobacteria that clustered closely with a Bradyrhizobiaceae reference sequence in the rp tree encoded three closely related PHAsclT1 enzymes. MAGs from the Polyangiaceae of the Myxococcota (1) and GWB1-36-13 of the Spirochaetota (1) each encoded three predicted PHAscl T1 depolymerases. Twelve of the Proteobacteria with three predicted depolymerases were from the Burkholderiales and one from the Pseudomonadales, each encoding both T1 and T2 enzyme(s).
                      - generic [ref=e756]:
                        - heading "Phylogenetic distribution of MAG-encoded PHA depolymerase subtypes" [level=3] [ref=e757]
                        - paragraph [ref=e758]:
                          - text: "(i) ePHAmcl depolymerases: We predicted eight unique ePHAmcl depolymerase genes from six dereplicated MAGs (Fig."
                          - link "4A" [ref=e759] [cursor=pointer]:
                            - /url: "#emi15409-fig-0004"
                          - text: ). All PHAmcl depolymerases occurred as singletons with the exception of the three predicted in the Herminiimonas-related MAG, which co-occurred with six PHAscl depolymerases. Three PHAmcl depolymerases were predicted in members of the Myxococcota and two were predicted in Firmicutes. Based on ML analyses, the predicted Firmicutes ePHAmcl depolymerases were more closely related to the biochemically validated Streptomyces ePHAmcl depolymerases, whereas the other predicted PHAmcl enzymes were more closely related to those reference ePHA depolymerases isolated from Pseudomonas and Bdellovibrio (Fig.
                          - link "4A" [ref=e760] [cursor=pointer]:
                            - /url: "#emi15409-fig-0004"
                          - text: ).
