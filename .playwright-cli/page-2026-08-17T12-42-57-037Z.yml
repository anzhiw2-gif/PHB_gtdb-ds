                - heading [level=3] [ref=e493]:
                  - text: Identification of the hydrolysis products of P(HO-co-HH) and PHACOS catalyzed by PhaZ
                  - subscript [ref=e494]: Sex2
                - paragraph [ref=e495]:
                  - text: Enzymatic hydrolysis of P(HO-co-HH) latex and PHACOS latex catalyzed by PhaZ
                  - subscript [ref=e496]: Sex2
                  - text: depolymerase was examined by HPLC, and the identities of the resulting peaks were determined by ESI-MS (see “
                  - link "Materials and methods" [ref=e497] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Sec2
                  - text: ” for details). Figure
                  - link "5a" [ref=e498] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Fig5
                  - text: shows the hydrolysis products of P(HO-co-HH) catalyzed by PhaZ
                  - subscript [ref=e499]: Sex2
                  - text: after 30 min of incubation at 30 °C. The monomer of (R)-3-hydroxyoctanoate (3-HO) was detected as the main hydrolysis product, representing 70 % of the total degradation products. Additionally, dimers of HO-HO and HO-HX as well as trimers of HO-HO-HO and HO-HO-HX were detected as minor products (Fig.
                  - link "5a" [ref=e500] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Fig5
                  - text: ). Similarly, the hydrolysis products of functionalized thioester-based PHACOS after 30 min of hydrolysis catalyzed by PhaZ
                  - subscript [ref=e501]: Sex2
                  - text: showed that the amounts of released oligomers (67 % of total hydrolyzed products) were higher than those of PHACOS monomers (6ATH) and HO monomers (21 and 11 %, respectively) (Fig.
                  - link "5b, d" [ref=e502] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Fig5
                  - text: ). Remarkably, after 7 h of incubation with PhaZ
                  - subscript [ref=e503]: Sex2
                  - text: ", 6ATH and HO monomers were detected as the main degradation products (57 and 34 %, respectively), with dimers of HO-HO as minor products (9 %) (Fig."
                  - link "5c, e" [ref=e504] [cursor=pointer]:
                    - /url: /article/10.1007/s00253-015-6780-1#Fig5
                  - text: ). When mcl-PHA or PHACOS were incubated in absence of enzyme, no degradation occurred (data not shown). These results indicated that PhaZ
                  - subscript [ref=e505]: Sex2
                  - text: depolymerase behaves as endo- and exo-hydrolases being able to hydrolyze both large and small polyester molecules to accomplish the total degradation of PHA.
                - figure "Fig. 5" [ref=e507]:
