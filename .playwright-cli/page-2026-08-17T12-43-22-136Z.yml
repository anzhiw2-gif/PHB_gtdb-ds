                          - list [ref=e650]:
                            - listitem [ref=e651]: Number of metagenomes screened, percent of metagenomes with at least one or more predicted PHA depolymerase, the number of predicted PHA depolymerases identified and the frequency of predicted PHA depolymerases (hits/Gb) per ecosystem type are included.
                        - paragraph [ref=e652]:
                          - text: "(i) Aquatic: across all aquatic ecosystem types, around 30% (±5%) of metagenomes had predicted PHA depolymerases, with the exception of thermal spring metagenomes (7/121 = 5.8%) (Table"
                          - link "1" [ref=e653] [cursor=pointer]:
                            - /url: "#emi15409-tbl-0001"
                          - text: ). Despite this finding, marine ecosystem metagenomes had the lowest frequency of predicted enzymes within aquatic environments (1.88 hits/Gb). Notably, no metagenomes from marine samples or thermal springs contained any predicted PHAmcl enzymes. The highest frequency of predicted PHA depolymerases in this category occurred in aquatic sediments (6.05 hits/Gb). (Table
                          - link "1" [ref=e654] [cursor=pointer]:
                            - /url: "#emi15409-tbl-0001"
                          - text: ).
                        - paragraph [ref=e655]:
                          - text: "(ii) Solid waste: 66.7% (20/30) of compost metagenomes and 75.0% (3/4) of landfill metagenomes had predicted PHAscl depolymerases at a frequency of 9.37 hits/Gb and 3.04 hits/Gb respectively (Table"
                          - link "1" [ref=e656] [cursor=pointer]:
                            - /url: "#emi15409-tbl-0001"
                          - text: ).
                        - paragraph [ref=e657]:
                          - text: "(iii) Terrestrial: Soil microbial communities have been extremely well-sampled relative to other environments. From our screen, 61.1% (740/1211) of soil metagenomes had predicted PHA depolymerases at a frequency of 8.22 hits/Gb. Other terrestrial environments with predicted depolymerases were deep subsurface environments (21/104 = 20.2%, 7.97 hits/Gb) and rock-dwelling communities (3/3 = 100.0%, 10.81 hits/Gb) (Table"
                          - link "1" [ref=e658] [cursor=pointer]:
                            - /url: "#emi15409-tbl-0001"
                          - text: ).
                        - paragraph [ref=e659]:
                          - text: "(iv) Wastewater: Within wastewater environments, the majority of anaerobic digesters (51/54 = 94.4%) and nutrient removal communities (27/35 = 77.1%) had predicted PHA depolymerases, whereas only a small fraction of activated sludge communities had any (13/140 = 9.3%). Despite this, activated sludge communities had a high frequency of predicted PHA depolymerases (13.82 hits/Gb), second to nutrient removal systems (16.34 hits/Gb), while anaerobic digesters were more similar to sediments and deep subsurface environments with 7.50 hits/Gb (Table"
                          - link "1" [ref=e660] [cursor=pointer]:
                            - /url: "#emi15409-tbl-0001"
                          - text: ; Supp.
                          - link "Data 2" [ref=e661] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ).
                      - generic [ref=e662]:
                        - heading "The environmental distribution of PHA depolymerase subtypes" [level=3] [ref=e663]
                        - paragraph [ref=e664]:
                          - text: "(i) PHAmcl depolymerases: PHAmcl depolymerases were sparsely predicted across environments, with only 222 PHAmcl depolymerases identified from 153 metagenomes (Supp. Fig."
                          - link "2" [ref=e665] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: a) from aquatic (41/1492 = 2.7%, 0.11 hits/Gb), terrestrial (94/1323 = 7.1%, 0.10 hits/Gb) and wastewater (18/229 = 7.9%, 0.49 hits/Gb) environments (Table
                          - link "1" [ref=e666] [cursor=pointer]:
                            - /url: "#emi15409-tbl-0001"
                          - text: ). The highest frequency of PHAmcl depolymerases was detected in nutrient removal (1.15 hits/Gb) and activated sludge (0.70 hits/Gb) wastewater systems. Solid waste systems had no predicted PHAmcl depolymerases (Table
                          - link "1" [ref=e667] [cursor=pointer]:
                            - /url: "#emi15409-tbl-0001"
                          - text: ). Of the 222 PHAmcl depolymerases predicted in this study, 208 placed in maximum-likelihood trees with reference enzymes isolated from species of Bdellovibrio (Martínez et al.,
                          - link "2012" [ref=e669] [cursor=pointer]:
                            - /url: "#emi15409-bib-0038"
                          - text: ) and Pseudomonas (Schirmer and Jendrossek,
                          - link "1994" [ref=e671] [cursor=pointer]:
                            - /url: "#emi15409-bib-0051"
                          - text: ; Kim et al.,
                          - link "2005" [ref=e673] [cursor=pointer]:
                            - /url: "#emi15409-bib-0031"
                          - text: ). Another 14 predicted PHAmcl depolymerases formed a second clade with enzymes recently isolated from Streptomyces species, which share limited sequence homology with other ePHAmcl biomarker enzymes (Gangoiti et al.,
                          - link "2012" [ref=e675] [cursor=pointer]:
                            - /url: "#emi15409-bib-0022"
                          - text: ; Martínez et al.,
                          - link "2015" [ref=e677] [cursor=pointer]:
                            - /url: "#emi15409-bib-0039"
                          - text: ) (Supp. Fig.
                          - link "2" [ref=e678] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: a).
                        - paragraph [ref=e679]:
                          - text: "(ii) PHAscl depolymerases: Predicted PHAscl depolymerases were more prevalent across environments. A total of 10 245 PHAsclT1 depolymerases were predicted from 1136 metagenomes (Supp. Fig."
                          - link "2" [ref=e680] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: b), from aquatic (338/1492 = 22.7%, 2.81 hits/Gb), solid waste (13/34 = 38.2%, 3.03 hits/Gb), terrestrial (713 /1323 = 53.9%, 6.33 hits/Gb) and wastewater (72/229 = 31.4%, 5.15 hits/Gb) environments (Table
                          - link "1" [ref=e681] [cursor=pointer]:
                            - /url: "#emi15409-tbl-0001"
                          - text: ). A large number of T1 depolymerases were predicted in soil metagenomes (8331 enzymes), but when scaled for dataset size this normalized to a frequency of 6.32 hits/Gb. All three metagenomes sequenced from rock-dwelling microbial communities encoded T1 enzymes and collectively had the highest frequency across ecosystem types with 9.17 hits/Gb. Activated sludge wastewater systems also had a higher frequency of predicted T1 enzymes with 8.47 hits/Gb.
                        - paragraph [ref=e682]:
                          - text: For PHAsclT2 depolymerases, 3402 were predicted from 908 metagenomes (Supp. Fig.
                          - link "2" [ref=e683] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: c) from aquatic (264/1492 = 17.7%, 1.16 hits/Gb), solid waste (22/34 = 64.7%, 2.50 hits/Gb), terrestrial (540/1323 = 40.8%, 1.80 hits/Gb) and wastewater (82/229 = 35.8%, 5.10 hits/Gb) environments (Table
                          - link "1" [ref=e684] [cursor=pointer]:
                            - /url: "#emi15409-tbl-0001"
                          - text: ). Here too, a large number of hits (2374) came from soil metagenomes, but soil did not have a particularly high frequency of enzymes (1.80 hits/Gb) compared with other ecosystem types. In fact, the frequency of predicted T2 enzymes was low (<2.5 hits/Gb) across most ecosystems with the exceptions of compost (4.85 hits/Gb) and wastewater systems (5.10 hits/Gb).
                        - paragraph [ref=e685]:
                          - text: Tree files, MSAs and fasta files for all predicted PHA depolymerases and information linking hits to associated metagenome information including environmental metadata, size, scaffold read depth, etc., can be found in Supp.
                          - link "Data 2" [ref=e686] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: and
                          - link "https://github.com/vrviljak/-The-phylogenetic-and-global-distribution-of-polyhydroxyalkanoate-bioplastic-degrading-genes.git" [ref=e687] [cursor=pointer]:
                            - /url: https://github.com/vrviljak/-The-phylogenetic-and-global-distribution-of-polyhydroxyalkanoate-bioplastic-degrading-genes.git
                          - text: .
                      - generic [ref=e688]:
                        - heading "Taxonomic affiliation of unbinned PHA depolymerase-encoding scaffolds" [level=3] [ref=e689]
                        - paragraph [ref=e690]:
                          - text: Only a few biochemically characterized ePHA depolymerases exist, which originate from the Proteobacteria, Actinobacteriota, Firmicutes, Bdellovibrionota and Ascomycetes (Supp.
                          - link "Data 1" [ref=e691] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). To assess the taxonomic distribution of unbinned PHA depolymerase-encoding scaffolds >2000 bp in length (7250 scaffolds), taxonomic affiliations were inferred using MEGAN (Huson et al.,
                          - link "2016" [ref=e693] [cursor=pointer]:
                            - /url: "#emi15409-bib-0029"
                          - text: ) with GTDB-tk (Chaumeil et al.,
                          - link "2019" [ref=e695] [cursor=pointer]:
                            - /url: "#emi15409-bib-0013"
                          - text: ) taxonomy (Supp.
                          - link "Data 2" [ref=e696] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). Most sequences were assigned to the Proteobacteria, Actinobacteriota, Chloroflexota, Methylmirabilota, Bacteroidota and Myxococcota (Supp. Fig.
                          - link "3" [ref=e697] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). Predicted PHAmcl depolymerase-encoding scaffolds were mainly affiliated with the Myxococcota (26.0%), Proteobacteria (17.8% Gammaproteobacteria and 1.4% Alphaproteobacteria), Actinobacteriota (16.4%) and Bdellovibrionota (4.1%). Scaffolds encoding predicted PHAmcl depolymerases also originated from the Deinococcota (1), Dormibacterota (1) and Thermoplasmatota (1) (Supp.
                          - link "Data 2" [ref=e698] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). 27.4% were unclassified.
                        - paragraph [ref=e699]:
                          - text: The majority of predicted PHAsclT1 enzymes were on scaffolds affiliated with the Proteobacteria (64.1%), with some representation from the Actinobacteriota (5.0%), Chloroflexota (4.7%), Methylomirabilota (3.4%), Bacteroidota (2.3%), Myxococcota (1.4%) and Acidobacteriota (1.0%) (Supp. Fig.
                          - link "3" [ref=e700] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). Unclassified scaffolds represented a further 14.6%, and 17 other phyla were represented at <1% of sequences (Supp.
                          - link "Data 2" [ref=e701] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). PHAsclT2 enzymes were mostly predicted to be from the Proteobacteria (80.4%), with some in the Actinobacteriota (2.3%) (Supp. Fig.
                          - link "3" [ref=e702] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). T2 enzymes were predicted at <1% in 12 phyla, with 13.3% unclassified at the phylum level (Supp.
                          - link "Data 2" [ref=e703] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). Six PHA depolymerase scaffolds were assigned to archaeal phyla including the Halobacteriota (5), encoding predicted PHAsclT1 depolymerases, and one Thermoplasmatota scaffold encoding a predicted PHAmcl depolymerase. 5122 predicted PHA depolymerase encoding scaffolds were classified down to the family level (2138 or 29.5% of the phylum-level classified scaffolds were unclassified at the family-level). Family classified scaffolds were affiliated with 184 different families, including the Xanthobacteraceae (16.0%), Burkholderiaceae (13.1%), Beijerinckiaceae (4.7%), Rhodocyclaceae (3.0%), Alteromonadaceae (1.7%), Methyloligellaceae (1.6%) of the Proteobacteria, the Ktedonobacteraceae (3.09%) of the Chloroflexota and the GWA2-73-35 (2.4%) of the Methylomirabilota. A complete family-level overview of predicted PHA depolymerases can be found in Supp.
                          - link "Data 2" [ref=e704] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: .
                        - paragraph [ref=e705]:
                          - text: Across ecosystem types, the Proteobacteria (Alpha and Gamma) were the most abundant predicted PHA depolymerase hosts (Fig.
                          - link "2" [ref=e706] [cursor=pointer]:
                            - /url: "#emi15409-fig-0002"
                          - text: ). Soil environments harboured the highest diversity of predicted PHA depolymerase hosts with 24 phyla predicted. Notably, several phyla were found only in soil (at <1% abundance) - the Desulfobacterota, Dormibacterota, Elusimicrobiota, Nitrospirota, Patescibacteria, Poribacteria and Thermoplasmatota (Supp.
                          - link "Data 2" [ref=e707] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). The Myxococcota-encoded PHA depolymerases appeared in relatively high levels in thermal springs (19.1% of taxonomically assigned PHA depolymerase-encoding scaffolds) and lower levels in some other ecosystem types (1.9% in freshwater, 1.2% in sediment, 1.5% in marine, 7.5% in nutrient removal, 5.4% in activated sludge and 1.8% in anaerobic digesters). Chloroflexota-associated PHA depolymerases were also relatively abundant in thermal springs (9.5%) and only otherwise found in soil (4.5%). Five phyla were detected in all wastewater ecosystem types - the Proteobacteria, Bacteroidota, Gemmatimonadota, Myxococcota and Spirochaetota.
                        - figure [ref=e709]:
                          - link [ref=e710] [cursor=pointer]:
                            - /url: /cms/asset/05da00af-3227-4e51-a3f5-460553039f30/emi15409-fig-0002-m.jpg
                            - img "Details are in the caption following the image" [ref=e712]
                          - generic [ref=e713]:
                            - generic [ref=e714]:
                              - strong [ref=e715]: Fig 2
                              - generic [ref=e716]:
                                - link "Open in figure viewer" [ref=e717] [cursor=pointer]:
                                  - /url: "#"
                                - link "PowerPoint" [ref=e718] [cursor=pointer]:
                                  - /url: /action/downloadFigures?id=emi15409-fig-0002&partId=&doi=10.1111%2F1462-2920.15409
                                  - generic [ref=e719]: 
                                  - text: PowerPoint
                            - generic [ref=e720]:
                              - text: Phylogenetic affiliation of scaffolds >2000 bps in length encoding at least one predicted PHA depolymerase across different ecosystems, presented as relative abundances. ‘Unassigned’ proteins could not be classified at the phylum-level. Phyla that contributed <1% of proteins (per ecosystem type) were combined into the ‘other’ category. Number of PHA depolymerase-encoding scaffolds for each environmental category is listed (n). [Color figure can be viewed at
                              - link "wileyonlinelibrary.com" [ref=e721] [cursor=pointer]:
                                - /url: http://wileyonlinelibrary.com
                              - text: "]"
                        - paragraph [ref=e722]: Predicted PHA depolymerases co-occurred in pairs on the same assembled scaffold 39 times (1.1%), including 28 pairs of predicted PHAsclT1 depolymerases predicted to be from the Proteobacteria, Gemmatimonadota, Chloroflexota, Actinobacteriota, Myxococcota and Bacteroidota, six pairs of predicted PHAsclT2 depolymerases from the Proteobacteria and Eremiobacterota, and one pair of predicted PHAmcl depolymerases from Sandaracinus amylolyticus of the Myxococcota. Predicted PHAsclT1 and PHAsclT2 depolymerases co-occurred in four cases, with three predicted as from the Gammaproteobacteria.
                      - generic [ref=e723]:
                        - heading "Phylogenetic distribution of predicted PHA depolymerase-encoding MAGs" [level=3] [ref=e724]
                        - paragraph [ref=e725]:
                          - text: To further describe the phylogenetic distribution of PHA depolymerases, we separately screened 5290 MAGs available on IMG/M for PHA depolymerases. A total of 4927 bacterial and 363 archaeal MAGs across over 70 phyla were included in our screen, which were reconstructed from metagenomes originating from engineered (443), environmental (4659), host-associated (186) and unclassified (2) systems (Supp.
                          - link "Data 3" [ref=e726] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). We identified a total of 143 MAGs (2.7%) encoding a total of 231 predicted PHA depolymerases in MAGs from 10 different bacterial phylum-level lineages. Of these, 71% (163/231) had predicted signal peptides. In our screen, the highest frequency of predicted PHA depolymerases (hits/Gb) was identified in the Proteobacteria (90.6 hits/Gb), followed by the Bdellovibrionota (52.5 hits/Gb), Myxococcota (47.17 hits/Gb), Methylomirabilota (28.1 hits/Gb), Actinobacteriota (20.9 hits/Gb), Bacteroidota (16.5 hits/Gb), Spirochaetota (16.1 hits/Gb), Firmicutes (12.8 hits/Gb), Desulfobacterota (5.8 hits/Gb) and Planctomycetota (3.4 hits/Gb). The remaining phyla represented in the MAG dataset had no predicted hits (Supp.
                          - link "Data 3" [ref=e727] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ). 110 dereplicated PHA depolymerase-encoding MAGs were >50% complete and <10% redundant, and 98/110 encoded sufficient marker genes for inclusion in an rp-based phylogenetic tree (Fig.
                          - link "3" [ref=e728] [cursor=pointer]:
                            - /url: "#emi15409-fig-0003"
                          - text: ). GTDB-tk successfully classified all but 5/110 MAGs (Supp.
                          - link "Data 3" [ref=e729] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ), with those five placing among the Proteobacteria in the concatenated rp tree (Fig.
                          - link "3" [ref=e730] [cursor=pointer]:
                            - /url: "#emi15409-fig-0003"
                          - text: ). Notably, we did not detect any MAGs with predicted PHA depolymerases from MAGs associated with the Candidate Phyla Radiation/Patescibacteria.
                        - figure [ref=e732]:
                          - link [ref=e733] [cursor=pointer]:
                            - /url: /cms/asset/92f66448-20b0-4457-a813-743d404a0ff9/emi15409-fig-0003-m.jpg
                            - img "Details are in the caption following the image" [ref=e735]
                          - generic [ref=e736]:
                            - generic [ref=e737]:
                              - strong [ref=e738]: Fig 3
